name: Audit French B1 Generation Integrity
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/audit_french_b1_generation_integrity.py'
      - '.github/workflows/audit-french-b1-generation-integrity.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Run fail-closed B1 generation-integrity audit
        run: python reading/tools/audit_french_b1_generation_integrity.py
      - name: Independent artifact assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('reading/audit/french_b1_generation_integrity.json').read_text())
          assert a['status']=='PASS'
          assert a['canonical_blob']=='4a2cd9ff30c3cea58caf20fca2822b06200622ca'
          assert (a['passages'],a['questions'],a['answers'],a['new_targets'])==(60,600,600,150)
          assert a['unique_new_target_ids']==150 and a['unique_new_target_forms']==150
          assert a['a1_a2_cross_level_target_id_collisions']==0 and a['a1_a2_cross_level_target_form_collisions']==0
          assert not a['schema_failures'] and not a['word_band_failures'] and not a['stored_word_count_failures']
          assert not a['linkage_failures'] and not a['source_or_exposure_failures'] and not a['invisible_exact_reviews'] and not a['failures']
          assert all(a['units'][str(i)]['passages']==6 and a['units'][str(i)]['new_targets']==15 and a['units'][str(i)]['checkpoint_zero_new'] for i in range(1,11))
          print({'status':'PASS','artifact':'reading/audit/french_b1_generation_integrity.json'})
          PY
      - name: Commit B1 integrity artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_b1_generation_integrity.json
          git diff --cached --quiet && exit 0
          git commit -m 'Audit French B1 generation integrity [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
