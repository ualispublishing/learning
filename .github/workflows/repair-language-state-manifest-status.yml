name: Repair language state manifest for STATUS drift

on:
  push:
    paths:
      - '.github/workflows/repair-language-state-manifest-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm drift is STATUS manifest bookkeeping only
        shell: bash
        run: |
          set +e
          output="$(python reading/tools/validate_continuation_state.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo 'Manifest already valid; no repair needed.'
            exit 0
          fi
          python - "$output" <<'PY'
          import sys
          output = sys.argv[1]
          errors = [line[2:] for line in output.splitlines() if line.startswith('- ')]
          allowed = (
              'STATE_MANIFEST blob drift: reading/STATUS.json:',
              'STATE_MANIFEST byte-size drift: reading/STATUS.json:',
              'STATE_MANIFEST state_file_bytes mismatch',
              'STATE_MANIFEST aggregate_sha256 mismatch',
          )
          unexpected = [e for e in errors if not any(e.startswith(prefix) for prefix in allowed)]
          if not errors or unexpected:
              raise SystemExit(f'Unexpected continuation-state drift; refusing STATUS manifest repair: {unexpected or errors}')
          if not any(e.startswith('STATE_MANIFEST blob drift: reading/STATUS.json:') for e in errors):
              raise SystemExit('Expected STATUS.json blob drift was not present; refusing repair')
          print('Confirmed: validator reports only STATUS.json manifest-entry drift plus aggregate metadata.')
          PY

      - name: Refresh only state manifest and validate
        run: |
          python reading/tools/refresh_state_manifest.py
          changed="$(git diff --name-only)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = 'reading/STATE_MANIFEST.json'
          python reading/tools/validate_continuation_state.py

      - name: Commit repaired manifest
        run: |
          if git diff --quiet; then
            echo 'No manifest changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/STATE_MANIFEST.json
          git commit -m 'Refresh language state manifest after status update'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
