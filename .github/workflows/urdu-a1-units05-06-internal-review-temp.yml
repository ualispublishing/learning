name: TEMP Urdu A1 Units 05-06 internal review

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/urdu-a1-units05-06-internal-review-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-urdu-a1-units05-06-internal-review
  cancel-in-progress: false

jobs:
  review:
    if: github.event.pull_request.head.ref == 'audit/urdu-a1-final-deterministic-2026-08-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/urdu-a1-final-deterministic-2026-08-22
      - name: Apply bounded Units 05-06 semantic and naturalness repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,datetime

          corpus=Path('reading/urdu/a1/passages.jsonl')
          before='18bce53a0aac274b59cf77e5aaa41dec294b41c50cf458e75a64b1e4df39396c'
          got=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if got!=before: raise SystemExit(f'FAIL CLOSED corpus drift {got}')
          rows=[json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]
          byid={r['id']:r for r in rows}
          evidence=[]

          prose_repairs=[
            ('ur-a1-u05-p01','ایک نیا شخص کلاس کے دروازے پر آتا ہے اور استاد سے اپنا نام بتاتا ہے۔','ایک نیا شخص کلاس کے دروازے پر آتا ہے اور استاد کو اپنا نام بتاتا ہے۔','Correct the recipient case marker: one tells a name to someone (کو), not “from” someone (سے).'),
            ('ur-a1-u05-p02','استاد کہتے ہیں کہ اگلے دن یہی کہانی دوبارہ یاد کریں گے۔','استاد کہتے ہیں کہ اگلے دن اسی کہانی کی اہم باتیں یاد کریں گے۔','Replace stiff repetition wording with natural recall phrasing while preserving یاد.'),
            ('ur-a1-u05-p04','وہ سوال دوبارہ پڑھتی ہے اور سوچتی ہے کہ اسے چھوٹے حصوں میں حل کرنا ممکن ہے۔','وہ سوال دوبارہ پڑھتی ہے اور سوچتی ہے کہ اسے چھوٹے حصوں میں بانٹ کر حل کرنا ممکن ہے۔','Make the problem-solving action explicit and idiomatic: divide into smaller parts, then solve.'),
            ('ur-a1-u05-p06','عائشہ اب اسکول کے دن کو آسان ترتیب میں سمجھتی ہے۔','عائشہ اب اسکول کے دن کے کاموں کی ترتیب اچھی طرح سمجھتی ہے۔','Replace an unnatural “understands the day in an easy order” construction with ordinary Urdu.'),
            ('ur-a1-u06-p02','یہ اس سال اس کا پہلا بس کا سفر ہے۔','یہ اس سال بس میں اس کا پہلا سفر ہے۔','Use natural Urdu word order for “her first trip by bus”.'),
            ('ur-a1-u06-p04','مریم فون ہاتھ میں رکھتی ہے اور ہر قدم سنتی جاتی ہے۔','مریم فون ہاتھ میں رکھتی ہے اور ہر ہدایت سنتی جاتی ہے۔','Directions are listened to as instructions, not literally as steps.'),
          ]
          for pid,old,new,reason in prose_repairs:
            r=byid[pid]
            if r['text'].count(old)!=1: raise SystemExit(f'FAIL CLOSED prose mismatch {pid}: {r["text"].count(old)}')
            r['text']=r['text'].replace(old,new); r['word_count']=len(r['text'].split())
            evidence.append({'passage_id':pid,'field':'text','before':old,'after':new,'reason':reason})

          qa_repairs=[
            ('ur-a1-u05-p04','q2','answer','وہ سوال کو چھوٹے حصوں میں حل کرنے کا سوچتی ہے۔','وہ سوال کو چھوٹے حصوں میں بانٹ کر حل کرنے کا سوچتی ہے۔','Align the answer with the clarified problem-solving action.'),
            ('ur-a1-u05-p06','q1','answer','عائشہ کلاس کے کام، پڑھنے، جگہوں اور دن کے اختتام کو منظم طریقے سے سمجھتی ہے۔','عائشہ کلاس کے کام، پڑھنے، جگہوں اور دن کے اختتام کی ترتیب سمجھتی ہے۔','Replace machine-like gist wording with a direct, supported summary.'),
            ('ur-a1-u06-p02','q10','prompt','خالی جگہ پُر کریں: یہ میرا _____ بس کا سفر ہے۔','خالی جگہ پُر کریں: بس میں یہ میرا _____ سفر ہے۔','Use natural Urdu word order while preserving the پہلا and سفر targets.'),
            ('ur-a1-u06-p06','q2','prompt','گھر سے نکلتے وقت عائشہ راہ اور آگے کی سمت کے ساتھ کیا کرتی ہے؟','گھر سے نکلتے وقت عائشہ راہ کیسے چنتی ہے اور پھر کیا کرتی ہے؟','Replace awkward “with the route and forward direction” wording with direct A1 comprehension.'),
            ('ur-a1-u06-p06','q3','prompt','صبح اور شام عائشہ کی واپسی کی ترتیب کیا ہے؟','صبح اور شام عائشہ کے آنے جانے کی ترتیب کیا ہے؟','Correct the semantic mismatch: morning is departure and evening is return, not two returns.'),
            ('ur-a1-u06-p06','q4','prompt','نئی جگہ کے پہلے سفر میں عائشہ کس کے ساتھ جانا بہتر سمجھتی ہے؟','نئی جگہ کا پہلا سفر کس کے ساتھ کرنا عائشہ کو آسان لگتا ہے؟','Remove unsupported normative “better” wording and ask exactly what the passage states.'),
          ]
          for pid,qid,field,old,new,reason in qa_repairs:
            r=byid[pid]; q=next(q for q in r['questions'] if q['id']==qid); a=next(a for a in r['answer_key'] if a['id']==q['answer_id'])
            obj=q if field=='prompt' else a
            key='prompt' if field=='prompt' else 'answer'
            if obj.get(key)!=old: raise SystemExit(f'FAIL CLOSED QA drift {pid} {qid} {field}: {obj.get(key)!r}')
            targets_before=list(q.get('target_ids',[])); obj[key]=new
            if list(q.get('target_ids',[]))!=targets_before: raise SystemExit('FAIL target linkage changed')
            evidence.append({'passage_id':pid,'question_id':qid,'field':field,'before':old,'after':new,'reason':reason,'target_ids':targets_before})

          corpus.write_text('\n'.join(json.dumps(r,ensure_ascii=False,separators=(',',':')) for r in rows)+'\n',encoding='utf-8')
          after=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if after==before: raise SystemExit('FAIL CLOSED no corpus change')

          roman=[]; leakage=[]; formal=[]
          for r in rows:
            if len(r['questions'])!=10 or len(r['answer_key'])!=10: raise SystemExit(f'FAIL cardinality {r["id"]}')
            if r['word_count']!=len(r['text'].split()): raise SystemExit(f'FAIL word count {r["id"]}')
            ans={a['id']:a for a in r['answer_key']}
            declared={t['id'] for k in ('new_lexical_targets','review_lexical_targets','grammar_targets','discourse_targets') for t in r.get(k,[])}
            prompts=[]
            for q in r['questions']:
              if q.get('answer_id') not in ans or ans[q['answer_id']].get('question_id')!=q['id']: raise SystemExit(f'FAIL Q/A linkage {r["id"]} {q["id"]}')
              if any(t not in declared for t in q.get('target_ids',[])): raise SystemExit(f'FAIL target locality {r["id"]} {q["id"]}')
              prompts.append(q['prompt'])
              if q.get('type') in {'grammar_category','grammar_function'}: formal.append((r['id'],q['id']))
            if len(prompts)!=len(set(prompts)): raise SystemExit(f'FAIL duplicate prompts {r["id"]}')
            for t in r.get('review_lexical_targets',[]):
              if t.get('representation')=='running_text' and t.get('form') not in r['text']: raise SystemExit(f'FAIL review visibility {r["id"]} {t.get("form")}')
            fields=[r.get('title',''),r.get('text','')]+[q.get('prompt','') for q in r['questions']]+[a.get('answer','') for a in r['answer_key']]+[a.get('explanation','') for a in r['answer_key']]
            for text in fields:
              if re.search(r'[A-Za-z]',str(text or '')): roman.append((r['id'],text))
            for a in r['answer_key']:
              exp=str(a.get('explanation') or '')
              if re.search(r'یہ\s+سوال|سوال\s+.*جانچ|نحو|نحوی|گرامر|لسانی\s+اصطلاح|جانچتا\s+ہے|جانچتی\s+ہے|\b(?:audit|review|target|schema|generated|generation)\b',exp,re.I): leakage.append((r['id'],a['id'],exp))
          if roman or leakage or formal: raise SystemExit(f'FAIL hygiene roman={roman[:3]} leakage={leakage[:3]} formal={formal[:3]}')

          review={
            'schema_version':1,'date':'2026-08-23','language':'ur','level':'A1','units':[5,6],
            'review_kind':'internal_semantic_naturalness_answer_pedagogy_review_and_bounded_repair',
            'before_sha256':before,'after_sha256':after,'records_reviewed':12,'questions_reviewed':120,'answers_reviewed':120,
            'confirmed_repairs':len(evidence),'repairs':evidence,
            'retained_after_review':{'note':'All other Unit05-06 passage prose, prompts, answers, and explanations were retained after internal contextual review; this is not native-speaker or independent approval.'},
            'verification':{'qa_linkage_valid':True,'question_target_locality_valid':True,'review_target_visibility_preserved':True,'word_count_metadata_current':True,'duplicate_prompts_zero':True,'formal_task_types_zero':True,'learner_facing_roman_script_zero':True,'internal_review_explanation_leakage_zero':True},
            'limitations':['Internal model review only; native Urdu naturalness and orthography remain pending.','Independent model-family and educator/CEFR A1 review remain pending.','Blind post-repair review remains pending.'],
            'independent_review':{'native_urdu_naturalness_orthography':'PENDING','independent_model_family':'PENDING','educator_cefr_a1':'PENDING','blind_postrepair':'PENDING'},
            'status':'PASS_INTERNAL_UNITS05_06_BOUNDED_REPAIR_NEEDS_INDEPENDENT_REVIEW','release_effect':'NONE_AUTOMATIC: Urdu A1 remains non-release-ready.'
          }
          Path('reading/audit/urdu_a1_units05_06_internal_review_2026-08-23.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          fp=Path('reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json'); final=json.loads(fp.read_text(encoding='utf-8'))
          final['generated_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat(); final['status']='PASS_DETERMINISTIC_POST_UNITS05_06_INTERNAL_REPAIR_NEEDS_INDEPENDENT_REVIEW'
          final['scope']='Fresh deterministic audit after Urdu A1 Units05-06 internal semantic/naturalness/answer/pedagogy review and bounded repairs; no native-speaker, independent-model, educator, or release approval.'
          final['source']={'path':'reading/urdu/a1/passages.jsonl','actual_sha256':after,'hash_bound':True,'prior_sha256':before,'latest_repair_evidence':'reading/audit/urdu_a1_units05_06_internal_review_2026-08-23.json'}
          final['counts'].update({'passages':60,'questions':600,'answers':600,'formal_task_types':0,'learner_facing_roman_script_findings':0,'learner_explanation_internal_review_leakage_findings':0,'violations':0}); final['violations']=[]
          final['review_frontier']={'internal_units01_02_semantic_qa_pedagogy':'COMPLETE_INTERNAL_WITH_EXPLANATION_HYGIENE_REPAIR','internal_units03_04_semantic_naturalness_answer_pedagogy':'COMPLETE_INTERNAL','internal_units05_06_semantic_naturalness_answer_pedagogy':'COMPLETE_INTERNAL','metalinguistic_class_corpus_wide':'ADJUDICATED_INTERNAL','abstract_task_candidate_class_through_unit04':'ADJUDICATED_INTERNAL','units07_10_full_semantic_naturalness_answer_pedagogy':'PENDING_INTERNAL','native_urdu_naturalness_orthography':'PENDING','independent_model_family':'PENDING','educator_cefr':'PENDING','blind_postrepair':'PENDING'}
          fp.write_text(json.dumps(final,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'after_sha256':after,'repairs':len(evidence),'status':final['status']},ensure_ascii=False))
          PY
      - name: Commit internal review evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/audit/urdu_a1_units05_06_internal_review_2026-08-23.json reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json
          git rm -f .github/workflows/urdu-a1-units05-06-internal-review-temp.yml
          git commit -m 'Review and polish Urdu A1 Units 05-06 [skip ci]'
          git push origin HEAD:audit/urdu-a1-final-deterministic-2026-08-22
