name: SecX runtime-byte-equivalent browser validation

on:
  push:
    branches:
      - secx-smoke-validation-20260903
    paths:
      - '.github/workflows/cissp-pages.yml'
      - 'subjects/cissp/2024-outline/secx-prototype/**'
      - 'subjects/cissp/2024-outline/study-site/**'

permissions:
  contents: read

concurrency:
  group: secx-runtime-equivalent-validation
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validation head
        uses: actions/checkout@v6

      - name: Report validation head and browser
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)

      - name: CISSP deterministic release audit
        shell: bash
        run: python subjects/cissp/2024-outline/study-site/audit.py

      - name: Production CISSP browser smoke
        shell: bash
        working-directory: subjects/cissp/2024-outline/study-site
        run: bash browser-smoke.sh 8766

      - name: Expanded SecX browser smoke
        shell: bash
        working-directory: subjects/cissp/2024-outline/secx-prototype
        run: bash browser-smoke.sh 8776
