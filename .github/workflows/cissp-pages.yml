name: Deploy CISSP Atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'subjects/cissp/2024-outline/study-site/**'
      - '.github/workflows/cissp-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cissp-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run released-corpus audit before deploy
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          python audit.py
          python question-bank/quality_gate.py --released-only
      - name: Validate browser runtime before deploy
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          for f in data-meta.js data-d{1..8}.js data-ai.js data-precision.js coverage-detail.js data-question-calibration.js legacy-rationales.js keyboard-shortcuts.js bootstrap.js app.js enhancements.js state-ui-bridge.js product-polish.js; do node --check "$f"; done
          for f in index.html 404.html styles.css mobile-fix.css enhancements.css product-polish.css workflow-clarity.css browser-smoke.sh question-bank/RELEASED_BATCHES.json question-bank/candidates/batch-001-a.jsonl question-bank/candidates/batch-001-b.jsonl question-bank/candidates/batch-001-c.jsonl question-bank/candidates/batch-001-d.jsonl; do test -s "$f"; done
      - name: Execute browser startup smoke test
        working-directory: subjects/cissp/2024-outline/study-site
        run: bash browser-smoke.sh 8766
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload CISSP site
        uses: actions/upload-pages-artifact@v4
        with:
          path: subjects/cissp/2024-outline/study-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
