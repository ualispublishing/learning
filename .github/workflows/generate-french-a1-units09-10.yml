name: Generate French A1 Units 09-10
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_french_a1_units09_10.py'
      - 'reading/tools/generate_french_a1_units09_10_retry.py'
      - '.github/workflows/generate-french-a1-units09-10.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet jsonschema
      - name: Append and validate Units 09-10
        run: python reading/tools/generate_french_a1_units09_10_retry.py
      - name: Independent French A1 completion checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/french/a1/passages.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==60
          assert [r['sequence'] for r in rows]==list(range(1,61))
          assert len({r['id'] for r in rows})==60
          assert all(len(r['questions'])==10 and len(r['answer_key'])==10 for r in rows)
          assert sum(len(r['questions']) for r in rows)==600
          assert sum(len(r['answer_key']) for r in rows)==600
          assert all(90<=r['word_count']<=140 for r in rows)
          for unit in range(1,11):
              six=[r for r in rows if r['unit']==unit]
              assert len(six)==6
              p6=next(r for r in six if r['id'].endswith('-p06'))
              assert p6['new_lexical_targets']==[]
          for r in rows:
              amap={a['question_id']:a['id'] for a in r['answer_key']}
              assert len(amap)==10
              local={t['id'] for f in ('new_lexical_targets','review_lexical_targets') for t in r.get(f,[]) if isinstance(t,dict) and t.get('id')}
              for q in r['questions']:
                  assert amap.get(q['id'])==q['answer_id']
                  assert all(tid in local for tid in q.get('target_ids',[]))
          u9=rows[48:54]; u10=rows[54:60]
          assert sum(len(r['new_lexical_targets']) for r in u9[:5])==10 and u9[-1]['new_lexical_targets']==[]
          assert sum(len(r['new_lexical_targets']) for r in u10[:5])==10 and u10[-1]['new_lexical_targets']==[]
          print({'status':'PASS','french_a1_passages':60,'questions':600,'answers':600,'unit09_new_targets':10,'unit10_new_targets':10,'all_p06_zero_new':True})
          PY
      - name: Commit completed French A1 canonical corpus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a1/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete French A1 Units 09-10 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
