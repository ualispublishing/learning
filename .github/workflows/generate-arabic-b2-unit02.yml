name: Generate Arabic B2 Unit 02
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_arabic_b2_unit02.py'
      - '.github/workflows/generate-arabic-b2-unit02.yml'
permissions:
  contents: write
concurrency:
  group: arabic-b2-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/generate_arabic_b2_unit02.py
      - name: Commit generated B2 passages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/b2/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate Arabic B2 Unit 02 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
