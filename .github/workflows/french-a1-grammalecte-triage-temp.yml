name: TEMP French A1 Grammalecte triage

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/french-a1-grammalecte-triage-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-french-a1-grammalecte-triage
  cancel-in-progress: false

jobs:
  triage:
    if: github.event.pull_request.head.ref == 'repair/french-a1-review-integrity-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
      - name: Build conservative contextual triage inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib,json,re

          corpus=Path('reading/french/a1/passages.jsonl')
          expected='7dbdb48ffc6efd00106490ca9b10ad25643bf7e89967e8fbd2977a04641d6ea3'
          got=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if got!=expected: raise SystemExit(f'FAIL CLOSED corpus drift {got}')
          scanp=Path('reading/audit/french_a1_grammalecte_fullscan_2026-08-22.json')
          scan=json.loads(scanp.read_text(encoding='utf-8'))
          if scan.get('bound_sha256')!=expected or scan.get('raw_finding_count')!=len(scan.get('findings',[])) or scan.get('raw_finding_count')!=421:
              raise SystemExit('FAIL CLOSED Grammalecte raw evidence mismatch')
          rows={r['id']:r for r in [json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]}
          known_names={'Camille','Sami'}
          counts=Counter();items=[];residual=[]

          def qobj(f):
              if f.get('field')!='question_prompt' or not f.get('item_id'): return None
              return next((q for q in rows[f['passage_id']]['questions'] if q.get('id')==f['item_id']),None)

          for idx,f in enumerate(scan['findings'],1):
              cls='CONTEXT_REVIEW_REQUIRED';reason='No conservative mechanical disposition.'
              matched=str(f.get('matched_text') or f.get('word') or '')
              word=str(f.get('word') or '')
              rule=str(f.get('rule'))
              typ=str(f.get('type'))
              src=str(f.get('source_text') or '')
              q=qobj(f)

              token=(word or matched).strip('«»“”"\'.,;:!?()[]{}—–- ')
              if rule=='_' and token in known_names:
                  cls='MECHANICAL_FALSE_POSITIVE_KNOWN_CHARACTER_NAME'
                  reason='Exact corpus character name is outside the spellchecker lexicon.'
              elif q and q.get('type')=='grammar_choice':
                  start=f.get('start')
                  # Most grammar-choice records present correct form first and incorrect alternative after " ou ".
                  # Only classify mechanically when the detector begins inside that second alternative.
                  delim=src.find(' ou ')
                  if isinstance(start,int) and delim>=0 and start>delim+3:
                      cls='LIKELY_INTENTIONAL_GRAMMAR_DISTRACTOR_NEEDS_CONFIRMATION'
                      reason='Detector span is inside the explicitly contrasted second alternative of a grammar_choice item; confirm before dismissal.'
              if cls=='CONTEXT_REVIEW_REQUIRED' and rule=='_' and token and token[:1].isupper() and token in {'A1'}:
                  cls='MECHANICAL_FALSE_POSITIVE_LEVEL_LABEL'
                  reason='CEFR level label A1 is not a French lexical spelling error.'

              item={
                'finding_index':idx,'passage_id':f.get('passage_id'),'field':f.get('field'),'item_id':f.get('item_id'),
                'message_class':f.get('message_class'),'matched_text':f.get('matched_text'),'word':f.get('word'),
                'message':f.get('message'),'suggestions':f.get('suggestions'),'rule':f.get('rule'),'type':f.get('type'),
                'start':f.get('start'),'end':f.get('end'),'source_text':src,'classification':cls,'rationale':reason
              }
              items.append(item);counts[cls]+=1
              if cls!='MECHANICAL_FALSE_POSITIVE_KNOWN_CHARACTER_NAME' and cls!='MECHANICAL_FALSE_POSITIVE_LEVEL_LABEL': residual.append(item)

          payload={
            'schema_version':1,'date':'2026-08-22','language':'fr','level':'A1',
            'audit':'grammalecte_conservative_triage_inventory','bound_sha256':expected,
            'source_scan':'reading/audit/french_a1_grammalecte_fullscan_2026-08-22.json',
            'raw_finding_count':len(items),'classification_counts':dict(counts),
            'status':'CONSERVATIVE_MECHANICAL_TRIAGE_COMPLETE_CONTEXTUAL_ADJUDICATION_PENDING',
            'items':items,
            'limitations':'Only exact known character names and CEFR A1 labels are mechanically dismissed. Grammar-choice second-alternative signals remain confirmation-required. Every other signal remains contextual review required.',
            'release_effect':'NONE_AUTOMATIC: no corpus changes and no release approval.'
          }
          Path('reading/audit/french_a1_grammalecte_triage_2026-08-22.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'classification_counts':dict(counts),'residual_count':len(residual)},ensure_ascii=False))
          print('GRAMMALECTE_RESIDUAL_SUMMARY_BEGIN')
          by_rule=Counter((str(x['rule']),str(x['type']),str(x['message_class'])) for x in residual)
          for k,n in by_rule.most_common(): print(json.dumps({'rule':k[0],'type':k[1],'class':k[2],'count':n},ensure_ascii=False))
          print('GRAMMALECTE_RESIDUAL_SUMMARY_END')
          print('GRAMMALECTE_RESIDUAL_SAMPLE_BEGIN')
          for x in residual[:160]:
              print(json.dumps({k:x[k] for k in ('finding_index','passage_id','field','item_id','matched_text','word','message','suggestions','rule','type','start','source_text','classification')},ensure_ascii=False))
          print('GRAMMALECTE_RESIDUAL_SAMPLE_END')
          PY
      - name: Commit triage evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_a1_grammalecte_triage_2026-08-22.json
          git rm -f .github/workflows/french-a1-grammalecte-triage-temp.yml
          git commit -m 'Triage French A1 Grammalecte findings [skip ci]'
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
