name: External fact check Arabic top 1000

on:
  workflow_dispatch:
  push:
    paths:
      - 'arabic_top1000.csv'
      - 'scripts/verify_arabic_top1000_external.py'
      - '.github/workflows/verify-arabic-top1000-external.yml'

concurrency:
  group: verify-arabic-top1000-external-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wordnet tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install wn

      - name: Cross-check all 1,000 Arabic cards
        run: python scripts/verify_arabic_top1000_external.py

      - name: Commit verification evidence
        run: |
          if [ -z "$(git status --porcelain -- audit/arabic_top1000_external_verification.csv audit/arabic_top1000_external_verification_summary.json)" ]; then
            echo 'No verification evidence changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/arabic_top1000_external_verification.csv audit/arabic_top1000_external_verification_summary.json
          git commit -m 'Record external Arabic top1000 fact check [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
