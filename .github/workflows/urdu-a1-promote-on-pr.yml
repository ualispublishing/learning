name: Urdu A1 promote on PR trigger

on:
  pull_request:
    branches: [main]
    paths:
      - 'reading/urdu/a1/promotion-trigger.txt'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run guarded promotion script
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/urdu-a1-promote.yml | sed '1d;$d;s/^          //' > /tmp/urdu_promote.py
          test -s /tmp/urdu_promote.py
          python /tmp/urdu_promote.py

      - name: Commit promoted Urdu corpus
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes produced; failing closed.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/urdu/a1/staging/unit02 reading/audit/urdu_a1_calibration_current_standard_audit.json reading/audit/urdu_a1_unit02_generation_plan.json reading/audit/urdu_a1_unit02_generation_result.json reading/STATUS.json reading/AGENT_HANDOFF.md reading/TASKS.md
          git commit -m 'Promote Urdu A1 unit 02 after calibration repair'
          git push origin HEAD:main
