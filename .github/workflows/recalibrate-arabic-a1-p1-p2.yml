name: Recalibrate Arabic A1 P1-P2

on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/recalibrate_arabic_a1_p1_p2.py'
      - 'reading/tools/audit_arabic_a1_question_schema.py'
      - '.github/workflows/recalibrate-arabic-a1-p1-p2.yml'

permissions:
  contents: write

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/recalibrate_arabic_a1_p1_p2.py
      - run: python reading/tools/audit_arabic_a1_question_schema.py
      - name: Commit recalibrated passages and question audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a1/passages.jsonl reading/audit/arabic_a1_question_schema.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recalibrate Arabic A1 passages 1-2 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
