name: Repair final Arabic pass 06 POS metadata
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_final_arabic_pass06_pos_metadata.py'
      - '.github/workflows/repair-final-arabic-pass06-pos-metadata.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/repair_final_arabic_pass06_pos_metadata.py
      - name: Commit POS metadata repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a2/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Arabic lexical POS metadata [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
