name: Inspect final Arabic pass 06 source mismatch candidates
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/inspect_final_arabic_pass06_source_mismatch_repair_candidates.py'
      - '.github/workflows/inspect-final-arabic-pass06-source-mismatch-candidates.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/inspect_final_arabic_pass06_source_mismatch_repair_candidates.py
      - name: Commit diagnostic artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_pass06_source_mismatch_candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Resolve Pass 06 source mismatch candidates [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
