name: External verify top 1000 decks

on:
  push:
    paths:
      - 'scripts/verify_top1000_external.py'
      - 'scripts/rebuild_arabic_top1000_learner_safe_v4.py'
      - 'scripts/refine_french_urdu_candidate_meanings_v2.py'
      - 'arabic_top1000.csv'
      - 'french_top1000.csv'
      - 'urdu_top1000.csv'
      - 'audit/run_final_external_top1000.request'
      - '.github/workflows/external-verify-top1000.yml'
  workflow_dispatch:

concurrency:
  group: external-verify-top1000-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install corpus attestation dependency
        run: python -m pip install wordfreq

      - name: Download independent lexical resources
        run: |
          curl -L --fail --retry 5 --retry-all-errors \
            'https://github.com/Salah-Sal/arabic-wordnet-v4/releases/download/v4.0.0/awn4.xml.gz' \
            -o /tmp/awn4.xml.gz
          curl -L --fail --retry 5 --retry-all-errors \
            'https://kaikki.org/dictionary/Arabic/kaikki.org-dictionary-Arabic.jsonl' \
            -o /tmp/kaikki-arabic.jsonl
          curl -L --fail --retry 5 --retry-all-errors \
            'https://kaikki.org/dictionary/French/kaikki.org-dictionary-French.jsonl' \
            -o /tmp/kaikki-french.jsonl
          curl -L --fail --retry 5 --retry-all-errors \
            'https://kaikki.org/dictionary/Urdu/kaikki.org-dictionary-Urdu.jsonl' \
            -o /tmp/kaikki-urdu.jsonl
          curl -k -L --fail --retry 5 --retry-all-errors \
            'https://www.lexique.org/databases/Lexique400/Lexique400.tsv' \
            -o /tmp/Lexique400.tsv
          git clone --depth 1 \
            'https://github.com/UniversalDependencies/UD_Urdu-UDTB.git' \
            /tmp/ud_urdu

      - name: Verify Arabic 1000 externally
        run: |
          python scripts/verify_top1000_external.py \
            --language arabic \
            --input arabic_top1000.csv \
            --kaikki-jsonl /tmp/kaikki-arabic.jsonl \
            --arabic-wordnet /tmp/awn4.xml.gz

      - name: Verify French 1000 externally
        run: |
          python scripts/verify_top1000_external.py \
            --language french \
            --input french_top1000.csv \
            --kaikki-jsonl /tmp/kaikki-french.jsonl \
            --lexique-tsv /tmp/Lexique400.tsv

      - name: Verify Urdu 1000 externally
        run: |
          python scripts/verify_top1000_external.py \
            --language urdu \
            --input urdu_top1000.csv \
            --kaikki-jsonl /tmp/kaikki-urdu.jsonl \
            --urdu-ud-dir /tmp/ud_urdu

      - name: Commit verification evidence
        run: |
          if [ -z "$(git status --porcelain -- audit/)" ]; then
            echo 'No verification changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/
          git commit -m 'Record final external top1000 verification evidence [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
