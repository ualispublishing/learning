name: One-shot Urdu A2 Unit 1 quality pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-urdu-a2-u01-quality-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-urdu-a2-u01-quality-pass
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated Unit 1 branch
        uses: actions/checkout@v4
        with:
          ref: lang-a1c2-urdu-a2-unit01
          fetch-depth: 0

      - name: Verify exact source branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin lang-a1c2-urdu-a2-unit01
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/lang-a1c2-urdu-a2-unit01)"

      - name: Apply exact hash-guarded remediation
        run: python reading/tools/apply_urdu_a2_u01_quality_pass.py

      - name: Refresh state-bundle manifest after state/canonical work
        run: python reading/tools/refresh_state_manifest.py

      - name: Validate continuation, state bundle, and canonical counts
        run: python reading/tools/validate_continuation_state.py

      - name: Commit only audited outputs back to Unit 1 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reading/urdu/a2/passages.jsonl \
            reading/audit/urdu_a2_u01_quality_pass_2026-08-23.json \
            reading/STATE_MANIFEST.json
          if git diff --cached --quiet; then
            echo "No remediation output; refusing to manufacture a success commit." >&2
            exit 1
          fi
          unexpected="$(git status --porcelain | grep -vE '^(M |A |\?\?) (reading/urdu/a2/passages.jsonl|reading/audit/urdu_a2_u01_quality_pass_2026-08-23.json|reading/STATE_MANIFEST.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected working-tree changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git commit -m "Polish Urdu A2 Unit 1 after quality pass [skip ci]"
          git push origin HEAD:lang-a1c2-urdu-a2-unit01
