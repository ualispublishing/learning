name: Audit public readiness

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_public_readiness.py'
      - '.github/workflows/audit-public-readiness.yml'
      - 'audit/run_public_readiness.request'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run publication-readiness triage
        run: python scripts/audit_public_readiness.py
      - name: Commit audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/public_readiness_audit.json audit/public_readiness_review_queue.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit publication readiness [skip ci]'
          for n in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*3))
          done
          exit 1
