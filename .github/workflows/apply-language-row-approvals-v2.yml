name: Apply language row approvals v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-language-row-approvals-v2.yml'
      - 'curation/language-workbooks/v1.0/approvals/**'
      - 'scripts/apply_sentence_row_approvals_v1.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: language-row-approvals-v1
  cancel-in-progress: false

jobs:
  apply-row-approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply approvals to audited row decisions
        run: python scripts/apply_sentence_row_approvals_v1.py

      - name: Commit resolved row-decision artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add curation/language-workbooks/v1.0/*_sentence_row_decisions.json
          git add curation/language-workbooks/v1.0/sentence_row_decision_summary.json
          if git diff --cached --quiet; then
            echo 'No row-decision changes to commit.'
          else
            git commit -m 'Apply audited sentence row approvals'
            git push
          fi
