name: TEMP French A1 Gate A structural diagnostic

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/french-a1-gate-a-structural-diagnostic-temp.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'repair/french-a1-review-integrity-2026-08-20'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet jsonschema
      - name: Print every non-review Gate A finding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib,json,re,subprocess,unicodedata
          from jsonschema import Draft202012Validator
          R=Path('.'); C=R/'reading/french/a1/passages.jsonl'; want='005354922bb7a88adce0c0e60f63d5b52099565c557d0a90914ff4f0d7447b80'
          sha=hashlib.sha256(C.read_bytes()).hexdigest()
          if sha!=want: raise SystemExit(f'FAIL CLOSED: corpus drift {sha} != {want}')
          rows=[json.loads(x) for x in C.read_text(encoding='utf-8').splitlines() if x.strip()]
          out={}
          schema=json.loads((R/'reading/schema/passage.schema.json').read_text(encoding='utf-8')); v=Draft202012Validator(schema); errs=[]
          for row in rows:
              for e in v.iter_errors(row): errs.append({'passage_id':row.get('id'),'path':list(e.path),'message':e.message})
          out['schema_errors']=errs
          ids=[r.get('id') for r in rows]; expids=[f'fr-a1-u{u:02d}-p{p:02d}' for u in range(1,11) for p in range(1,7)]
          out['grid']={'ok':len(rows)==60 and ids==expids and [r.get('sequence') for r in rows]==list(range(1,61)) and len(set(ids))==60 and Counter(r.get('unit') for r in rows)==Counter({u:6 for u in range(1,11)}) and all(r.get('language')=='fr' and r.get('cefr')=='A1' for r in rows)}
          qa=[];dups=[];bands=[];local=[];checkpoints=[];unicode_issues=[];hygiene=[]
          banned=('pipeline','frontier lock','generation batch','generated by','todo','placeholder','lorem ipsum','c2 unit'); iid=re.compile(r'fr-(?:rank|a1|a2|b1|b2|c1|c2)-',re.I); ar=re.compile(r'[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff]')
          for row in rows:
              qs=row.get('questions',[]); ans=row.get('answer_key',[]); qmap={q.get('id'):q for q in qs}; amap={a.get('id'):a for a in ans}
              if len(qs)!=10 or len(ans)!=10 or len(qmap)!=10 or len(amap)!=10: qa.append({'passage_id':row['id'],'kind':'cardinality_or_duplicate_id'})
              for q in qs:
                  a=amap.get(q.get('answer_id'))
                  if not a or a.get('question_id')!=q.get('id'): qa.append({'passage_id':row['id'],'question_id':q.get('id'),'kind':'forward_link'})
              for a in ans:
                  q=qmap.get(a.get('question_id'))
                  if not q or q.get('answer_id')!=a.get('id'): qa.append({'passage_id':row['id'],'answer_id':a.get('id'),'kind':'back_link'})
              ps=[unicodedata.normalize('NFC',q.get('prompt','')).strip().casefold() for q in qs]
              dups += [{'passage_id':row['id'],'prompt':p} for p,c in Counter(ps).items() if p and c>1]
              wc=len(row.get('text','').split())
              if row.get('word_count')!=wc or not 90<=wc<=140: bands.append({'passage_id':row['id'],'stored':row.get('word_count'),'actual':wc})
              declared={x.get('id') for f in ('new_lexical_targets','review_lexical_targets','grammar_targets','discourse_targets') for x in row.get(f,[]) if isinstance(x,dict)}
              for q in qs:
                  for tid in q.get('target_ids',[]):
                      if tid not in declared: local.append({'passage_id':row['id'],'question_id':q['id'],'target_id':tid})
              if row['id'].endswith('-p06') and row.get('new_lexical_targets'): checkpoints.append(row['id'])
              learner=[row.get('title',''),row.get('text','')]+[q.get('prompt','') for q in qs]+[a.get('answer','') for a in ans]+[a.get('explanation','') for a in ans]
              for s in learner:
                  if s!=unicodedata.normalize('NFC',s): unicode_issues.append({'passage_id':row['id'],'kind':'non_nfc','sample':s[:120]})
                  if any(ord(ch)<32 and ch not in '\n\t\r' for ch in s): unicode_issues.append({'passage_id':row['id'],'kind':'control_character','sample':s[:120]})
                  if s.count('«')!=s.count('»'): unicode_issues.append({'passage_id':row['id'],'kind':'unbalanced_guillemets','sample':s[:120]})
                  if s.count('(')!=s.count(')'): unicode_issues.append({'passage_id':row['id'],'kind':'unbalanced_parentheses','sample':s[:120]})
                  low=unicodedata.normalize('NFKC',s).casefold()
                  if any(x in low for x in banned): hygiene.append({'passage_id':row['id'],'kind':'workflow_or_placeholder_language','sample':s[:120]})
                  if iid.search(s): hygiene.append({'passage_id':row['id'],'kind':'internal_id','sample':s[:120]})
                  if ar.search(s): hygiene.append({'passage_id':row['id'],'kind':'unintended_non_french_script','sample':s[:120]})
          out.update({'qa':qa,'duplicate_prompts':dups,'word_bands':bands,'local_target':local,'checkpoint_zero_new':checkpoints,'unicode':unicode_issues,'hygiene':hygiene})
          srcs=['french_top1000.csv','french_top3000.csv','reading/lexicons/french.jsonl','reading/lexicons/french_a1_support.json']
          out['source_lexicons_changed']=subprocess.run(['git','diff','--name-only','origin/main...HEAD','--',*srcs],text=True,capture_output=True,check=True).stdout.strip().splitlines()
          print(json.dumps({'bound_sha256':sha,**out},ensure_ascii=False,indent=2))
          PY
