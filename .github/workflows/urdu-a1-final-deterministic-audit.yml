name: Urdu A1 Final Deterministic Audit Scope Correction

on:
  push:
    branches:
      - audit/urdu-a1-final-deterministic-2026-08-22
  pull_request:
    branches:
      - main
    types: [opened]

permissions:
  contents: write

concurrency:
  group: urdu-a1-final-deterministic-audit
  cancel-in-progress: false

jobs:
  audit-scope-correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/urdu-a1-final-deterministic-2026-08-22
          fetch-depth: 0

      - name: Re-evaluate future-target exposure with repository promotion semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import unicodedata
          from datetime import datetime, timezone
          from pathlib import Path

          corpus_path = Path('reading/urdu/a1/passages.jsonl')
          evidence_path = Path('reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json')
          expected_sha = '3673ec71bf52d6d01ae11e8fd864eebc7f5fe1c3acac2ae19e4e2229ee14b728'

          raw = corpus_path.read_bytes()
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'FAIL source drift: {actual_sha} != {expected_sha}')
          records = [json.loads(line) for line in raw.decode('utf-8').splitlines() if line.strip()]
          if len(records) != 60 or [r.get('sequence') for r in records] != list(range(1, 61)):
              raise SystemExit('FAIL source frontier is not exact 1..60')

          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          if evidence.get('source', {}).get('actual_sha256') != expected_sha:
              raise SystemExit('FAIL prior audit evidence is not bound to the exact corpus')
          other_checks = {k: v for k, v in evidence.get('checks', {}).items() if k != 'premature_future_target_exposure_zero_exact_token'}
          if not other_checks or not all(other_checks.values()):
              raise SystemExit('FAIL prior deterministic checks contain a non-exposure failure')

          def norm(s):
              return unicodedata.normalize('NFC', str(s or ''))

          def tokens(s):
              return re.findall(r'[^\W_]+', norm(s), flags=re.UNICODE)

          def has_surface(text, form):
              ft = tokens(form)
              tt = tokens(text)
              if not ft:
                  return False
              n = len(ft)
              return any(tt[i:i+n] == ft for i in range(len(tt)-n+1))

          def sentence_excerpt(text, form):
              for sentence in re.split(r'(?<=[۔؟!?])\s+', norm(text)):
                  if has_surface(sentence, form):
                      return sentence[:300]
              return norm(text)[:300]

          by_unit = {}
          for rec in records:
              by_unit.setdefault(rec['unit'], []).append(rec)

          premature = []
          for unit in range(1, 11):
              urs = sorted(by_unit.get(unit, []), key=lambda r: r['sequence'])
              intro = []
              for rec in urs:
                  for target in rec.get('new_lexical_targets') or []:
                      form = target.get('form')
                      tid = target.get('id')
                      if form and tid:
                          intro.append((rec['sequence'], tid, form))
              for rec in urs:
                  for intro_seq, tid, form in intro:
                      if intro_seq > rec['sequence'] and has_surface(rec.get('text', ''), form):
                          premature.append({
                              'unit': unit,
                              'target_id': tid,
                              'form': form,
                              'introduced_sequence': intro_seq,
                              'earlier_sequence': rec['sequence'],
                              'earlier_record_id': rec.get('id'),
                              'sentence_excerpt': sentence_excerpt(rec.get('text', ''), form),
                          })

          evidence['generated_at_utc'] = datetime.now(timezone.utc).isoformat()
          evidence['checks']['premature_future_target_exposure_zero_exact_token'] = not premature
          evidence['violations'] = ([{
              'code': 'premature_future_target_exposure_zero_exact_token',
              'detail': premature,
          }] if premature else [])
          evidence['counts']['violations'] = len(evidence['violations'])
          evidence['status'] = ('PASS_DETERMINISTIC_FINAL_AUDIT_NEEDS_INDEPENDENT_REVIEW'
                                if not premature else 'FAIL_DETERMINISTIC_FINAL_AUDIT')
          evidence['audit_correction'] = {
              'reason': 'The first full-corpus run incorrectly treated any appearance before formal target introduction anywhere in the 60-passage history as a violation.',
              'correct_scope': 'Match the repository promotion runner: reject exact-token exposure only in an earlier passage of the same unit before that unit target is formally introduced.',
              'reference': 'reading/tools/promote_staged_urdu_a1_finish.py at commit c51286c79e38b0dbaad5d7411324691f2b8c4678',
              'content_changed': False,
              'matching_method': 'exact Unicode token sequence; no substring matching'
          }
          evidence['notes'] = [n for n in evidence.get('notes', []) if 'premature' not in n.lower()] + [
              'Future-target exposure uses the same-unit prospective scope used by the verified Urdu promotion runner; incidental use in an earlier unit is not reclassified retroactively as a target-introduction defect.'
          ]
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(evidence['status'])
          print(json.dumps(premature, ensure_ascii=False, indent=2))
          PY

          AUDIT_STATUS="$(python - <<'PY'
          import json
          print(json.load(open('reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json', encoding='utf-8'))['status'])
          PY
          )"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/urdu-a1-final-deterministic-audit.yml
          git add reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json
          git commit -m "Correct Urdu A1 final audit exposure scope [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          if [[ "$AUDIT_STATUS" != "PASS_DETERMINISTIC_FINAL_AUDIT_NEEDS_INDEPENDENT_REVIEW" ]]; then
            echo "Corrected deterministic audit still has content findings; evidence checkpointed." >&2
            exit 1
          fi
