name: Urdu A1 Final Deterministic Audit

on:
  push:
    branches:
      - audit/urdu-a1-final-deterministic-2026-08-22

permissions:
  contents: write

concurrency:
  group: urdu-a1-final-deterministic-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/urdu-a1-final-deterministic-2026-08-22
          fetch-depth: 0

      - name: Audit exact canonical corpus and checkpoint evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/audit_urdu_a1.py <<'PY'
          import hashlib
          import json
          import re
          import unicodedata
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          CORPUS = Path("reading/urdu/a1/passages.jsonl")
          EVIDENCE = Path("reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json")
          EXPECTED_SHA256 = "3673ec71bf52d6d01ae11e8fd864eebc7f5fe1c3acac2ae19e4e2229ee14b728"
          EXPECTED_PASSAGES = 60
          EXPECTED_QUESTIONS = 600
          EXPECTED_ANSWERS = 600
          EXPECTED_UNITS = 10

          violations = []
          check_failures = defaultdict(int)

          def fail(code, record_id=None, detail=None):
              item = {"code": code}
              if record_id is not None:
                  item["record_id"] = record_id
              if detail is not None:
                  item["detail"] = detail
              violations.append(item)
              check_failures[code] += 1

          def norm(s):
              return unicodedata.normalize("NFC", str(s or ""))

          def tokens(s):
              return re.findall(r"[^\W_]+", norm(s), flags=re.UNICODE)

          def contains_exact_form(text, form):
              ft = tokens(form)
              tt = tokens(text)
              if not ft:
                  return False
              n = len(ft)
              return any(tt[i:i+n] == ft for i in range(0, len(tt)-n+1))

          raw = CORPUS.read_bytes()
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != EXPECTED_SHA256:
              fail("source_corpus_sha256_exact", detail={"expected": EXPECTED_SHA256, "actual": actual_sha})

          records = []
          for line_no, line in enumerate(raw.decode("utf-8").splitlines(), 1):
              if not line.strip():
                  continue
              try:
                  rec = json.loads(line)
              except Exception as exc:
                  fail("jsonl_parse", detail={"line": line_no, "error": str(exc)})
                  continue
              records.append(rec)

          if len(records) != EXPECTED_PASSAGES:
              fail("passage_count_exact", detail={"expected": EXPECTED_PASSAGES, "actual": len(records)})

          ids = [r.get("id") for r in records]
          seqs = [r.get("sequence") for r in records]
          if len(set(ids)) != len(ids):
              fail("passage_ids_unique")
          if seqs != list(range(1, EXPECTED_PASSAGES + 1)):
              fail("sequences_contiguous_1_60", detail={"actual": seqs})

          unit_records = defaultdict(list)
          global_new_target_ids = []
          introduced = []
          total_questions = 0
          total_answers = 0
          duplicate_prompt_count = 0
          learner_roman_count = 0
          exact_visibility_misses = 0

          for rec in records:
              rid = rec.get("id") or "<missing-id>"
              seq = rec.get("sequence")
              unit = rec.get("unit")
              unit_records[unit].append(rec)

              if rec.get("language") != "ur":
                  fail("language_ur", rid, rec.get("language"))
              if rec.get("cefr") != "A1":
                  fail("cefr_a1", rid, rec.get("cefr"))
              if isinstance(seq, int):
                  expected_unit = ((seq - 1) // 6) + 1
                  expected_p = ((seq - 1) % 6) + 1
                  if unit != expected_unit:
                      fail("unit_sequence_alignment", rid, {"expected": expected_unit, "actual": unit})
                  expected_id = f"ur-a1-u{expected_unit:02d}-p{expected_p:02d}"
                  if rid != expected_id:
                      fail("id_sequence_alignment", rid, {"expected": expected_id})

              wc = rec.get("word_count")
              if not isinstance(wc, int) or not (90 <= wc <= 140):
                  fail("a1_word_band_90_140", rid, wc)
              split_wc = len(norm(rec.get("text")).split())
              if isinstance(wc, int) and split_wc != wc:
                  fail("stored_word_count_matches_whitespace_count", rid, {"stored": wc, "computed": split_wc})

              if not norm(rec.get("text")).strip() or not norm(rec.get("title")).strip():
                  fail("nonempty_title_and_text", rid)
              if not re.search(r"[\u0600-\u06FF]", norm(rec.get("text"))):
                  fail("urdu_script_present_in_text", rid)

              questions = rec.get("questions") or []
              answers = rec.get("answer_key") or []
              total_questions += len(questions)
              total_answers += len(answers)
              if len(questions) != 10:
                  fail("ten_questions_each", rid, len(questions))
              if len(answers) != 10:
                  fail("ten_answers_each", rid, len(answers))

              qids = [q.get("id") for q in questions]
              aids = [a.get("id") for a in answers]
              if qids != [f"q{i}" for i in range(1, 11)]:
                  fail("question_ids_q1_q10", rid, qids)
              if aids != [f"a{i}" for i in range(1, 11)]:
                  fail("answer_ids_a1_a10", rid, aids)
              amap = {a.get("id"): a for a in answers}
              for q in questions:
                  qid = q.get("id")
                  aid = q.get("answer_id")
                  a = amap.get(aid)
                  if not a or a.get("question_id") != qid:
                      fail("answer_linkage", rid, {"question_id": qid, "answer_id": aid})
                  if not norm(q.get("prompt")).strip():
                      fail("nonempty_question_prompt", rid, qid)
                  if re.search(r"[A-Za-z]", norm(q.get("prompt"))):
                      learner_roman_count += 1
                      fail("learner_facing_roman_script_zero", rid, {"question_id": qid, "prompt": q.get("prompt")})
              for a in answers:
                  if not norm(a.get("answer")).strip():
                      fail("nonempty_answer", rid, a.get("id"))
                  if re.search(r"[A-Za-z]", norm(a.get("answer"))):
                      learner_roman_count += 1
                      fail("learner_facing_roman_script_zero", rid, {"answer_id": a.get("id"), "answer": a.get("answer")})
              if re.search(r"[A-Za-z]", norm(rec.get("text"))) or re.search(r"[A-Za-z]", norm(rec.get("title"))):
                  learner_roman_count += 1
                  fail("learner_facing_roman_script_zero", rid, "title_or_text")

              normalized_prompts = [" ".join(norm(q.get("prompt")).split()) for q in questions]
              prompt_counts = Counter(normalized_prompts)
              dupes = [p for p, n in prompt_counts.items() if p and n > 1]
              if dupes:
                  duplicate_prompt_count += sum(prompt_counts[p] - 1 for p in dupes)
                  fail("duplicate_prompts_within_passage_zero", rid, dupes)

              new_targets = rec.get("new_lexical_targets") or []
              review_targets = rec.get("review_lexical_targets") or []
              local_target_ids = {t.get("id") for t in new_targets + review_targets if t.get("id")}
              for q in questions:
                  for tid in q.get("target_ids") or []:
                      if tid not in local_target_ids:
                          fail("question_targets_locally_declared", rid, {"question_id": q.get("id"), "target_id": tid})

              for t in new_targets:
                  tid = t.get("id")
                  form = t.get("form") or t.get("lemma")
                  if not tid or not form:
                      fail("new_target_id_and_form_nonempty", rid, t)
                      continue
                  global_new_target_ids.append(tid)
                  introduced.append((seq, tid, norm(form), rid))
                  if t.get("first_introduced") is not True:
                      fail("new_target_first_introduced_true", rid, tid)
                  if not contains_exact_form(rec.get("text"), form):
                      exact_visibility_misses += 1
                      fail("new_targets_visible_exact_token", rid, {"target_id": tid, "form": form})

              for t in review_targets:
                  tid = t.get("id")
                  form = t.get("form")
                  if not tid or not form:
                      fail("review_target_id_and_form_nonempty", rid, t)
                      continue
                  if not contains_exact_form(rec.get("text"), form):
                      exact_visibility_misses += 1
                      fail("running_text_reviews_visible_exact_token", rid, {"target_id": tid, "form": form})

          if total_questions != EXPECTED_QUESTIONS:
              fail("question_count_exact", detail={"expected": EXPECTED_QUESTIONS, "actual": total_questions})
          if total_answers != EXPECTED_ANSWERS:
              fail("answer_count_exact", detail={"expected": EXPECTED_ANSWERS, "actual": total_answers})
          if len(set(global_new_target_ids)) != len(global_new_target_ids):
              duplicates = sorted(k for k, v in Counter(global_new_target_ids).items() if v > 1)
              fail("new_target_id_collisions_zero", detail=duplicates)

          if set(unit_records) != set(range(1, EXPECTED_UNITS + 1)):
              fail("units_exact_1_10", detail=sorted(str(k) for k in unit_records))

          for unit in range(1, EXPECTED_UNITS + 1):
              urs = sorted(unit_records.get(unit, []), key=lambda r: r.get("sequence", 0))
              if len(urs) != 6:
                  fail("six_passages_per_unit", detail={"unit": unit, "actual": len(urs)})
                  continue
              unit_new = []
              for r in urs[:5]:
                  nts = r.get("new_lexical_targets") or []
                  if len(nts) != 2:
                      fail("two_new_targets_p01_p05", r.get("id"), len(nts))
                  unit_new.extend(t.get("id") for t in nts if t.get("id"))
              p06 = urs[5]
              if p06.get("new_lexical_targets") not in ([], None):
                  fail("p06_zero_new", p06.get("id"), p06.get("new_lexical_targets"))
              p06_review = [t.get("id") for t in (p06.get("review_lexical_targets") or []) if t.get("id")]
              if set(p06_review) != set(unit_new) or len(p06_review) != len(unit_new):
                  fail("p06_reviews_all_unit_targets", p06.get("id"), {"unit_new": unit_new, "p06_review": p06_review})
              if p06.get("passage_type") != "fluency":
                  fail("p06_fluency_type", p06.get("id"), p06.get("passage_type"))
              speed = p06.get("speed_training") or {}
              if speed.get("timed") is not True or speed.get("new_word_policy") != "none":
                  fail("p06_speed_training_policy", p06.get("id"), speed)

          # Fail closed on exact-token appearance of a target before its declared introduction.
          seq_to_text = {r.get("sequence"): r.get("text") or "" for r in records if isinstance(r.get("sequence"), int)}
          premature = []
          for intro_seq, tid, form, rid in introduced:
              if not isinstance(intro_seq, int):
                  continue
              for earlier_seq in range(1, intro_seq):
                  if contains_exact_form(seq_to_text.get(earlier_seq, ""), form):
                      premature.append({"target_id": tid, "form": form, "introduced_sequence": intro_seq, "earlier_sequence": earlier_seq})
                      break
          if premature:
              fail("premature_future_target_exposure_zero_exact_token", detail=premature)

          status_path = Path("reading/STATUS.json")
          status_meta = {"present": status_path.exists(), "used_as_release_approval_evidence": False}
          if status_path.exists():
              status_raw = status_path.read_bytes()
              status_meta["sha256"] = hashlib.sha256(status_raw).hexdigest()
              try:
                  status_obj = json.loads(status_raw.decode("utf-8"))
                  status_meta["generated_at_utc"] = status_obj.get("generated_at_utc")
              except Exception as exc:
                  status_meta["parse_error"] = str(exc)
              status_meta["note"] = "STATUS.json predates or may lag the final Urdu generation frontier; this audit does not use it as approval evidence."

          checks = {
              "source_corpus_sha256_exact": check_failures["source_corpus_sha256_exact"] == 0,
              "jsonl_parse": check_failures["jsonl_parse"] == 0,
              "passage_count_exact_60": check_failures["passage_count_exact"] == 0,
              "passage_ids_unique": check_failures["passage_ids_unique"] == 0,
              "sequences_contiguous_1_60": check_failures["sequences_contiguous_1_60"] == 0,
              "units_exact_1_10": check_failures["units_exact_1_10"] == 0,
              "six_passages_per_unit": check_failures["six_passages_per_unit"] == 0,
              "language_ur_and_cefr_a1": check_failures["language_ur"] == 0 and check_failures["cefr_a1"] == 0,
              "unit_and_id_sequence_alignment": check_failures["unit_sequence_alignment"] == 0 and check_failures["id_sequence_alignment"] == 0,
              "a1_word_band_90_140": check_failures["a1_word_band_90_140"] == 0,
              "stored_word_count_matches_whitespace_count": check_failures["stored_word_count_matches_whitespace_count"] == 0,
              "ten_questions_and_answers_each": check_failures["ten_questions_each"] == 0 and check_failures["ten_answers_each"] == 0,
              "question_and_answer_counts_600_each": check_failures["question_count_exact"] == 0 and check_failures["answer_count_exact"] == 0,
              "question_answer_ids_and_linkage": check_failures["question_ids_q1_q10"] == 0 and check_failures["answer_ids_a1_a10"] == 0 and check_failures["answer_linkage"] == 0,
              "nonempty_learner_content": check_failures["nonempty_title_and_text"] == 0 and check_failures["nonempty_question_prompt"] == 0 and check_failures["nonempty_answer"] == 0,
              "urdu_script_present_in_text": check_failures["urdu_script_present_in_text"] == 0,
              "learner_facing_roman_script_zero": check_failures["learner_facing_roman_script_zero"] == 0,
              "duplicate_prompts_within_passage_zero": check_failures["duplicate_prompts_within_passage_zero"] == 0,
              "question_targets_locally_declared": check_failures["question_targets_locally_declared"] == 0,
              "new_target_id_collisions_zero": check_failures["new_target_id_collisions_zero"] == 0,
              "new_targets_visible_exact_token": check_failures["new_targets_visible_exact_token"] == 0,
              "running_text_reviews_visible_exact_token": check_failures["running_text_reviews_visible_exact_token"] == 0,
              "two_new_targets_p01_p05": check_failures["two_new_targets_p01_p05"] == 0,
              "p06_zero_new_and_reviews_all_unit_targets": check_failures["p06_zero_new"] == 0 and check_failures["p06_reviews_all_unit_targets"] == 0,
              "p06_fluency_speed_policy": check_failures["p06_fluency_type"] == 0 and check_failures["p06_speed_training_policy"] == 0,
              "premature_future_target_exposure_zero_exact_token": check_failures["premature_future_target_exposure_zero_exact_token"] == 0,
          }

          passed = not violations
          evidence = {
              "audit": "urdu_a1_final_deterministic_audit",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "status": "PASS_DETERMINISTIC_FINAL_AUDIT_NEEDS_INDEPENDENT_REVIEW" if passed else "FAIL_DETERMINISTIC_FINAL_AUDIT",
              "scope": "deterministic final-audit controls only; no automated semantic, naturalness, pedagogical, native-speaker, educator, or release approval",
              "policy_basis": [
                  "reading/planning/GENERATION_FIRST_FINAL_AUDIT_POLICY.md",
                  "reading/planning/FINAL_REVIEW_EXECUTION_PROTOCOL.md"
              ],
              "source": {
                  "path": str(CORPUS),
                  "expected_sha256": EXPECTED_SHA256,
                  "actual_sha256": actual_sha,
                  "hash_bound": actual_sha == EXPECTED_SHA256
              },
              "counts": {
                  "passages": len(records),
                  "questions": total_questions,
                  "answers": total_answers,
                  "units": len(unit_records),
                  "new_lexical_target_declarations": len(global_new_target_ids),
                  "duplicate_prompts_within_passage": duplicate_prompt_count,
                  "learner_facing_roman_script_findings": learner_roman_count,
                  "exact_target_visibility_misses": exact_visibility_misses,
                  "violations": len(violations)
              },
              "checks": checks,
              "violations": violations,
              "status_json_observation": status_meta,
              "independent_review": {
                  "semantic_accuracy": "PENDING",
                  "urdu_naturalness_and_orthography": "PENDING",
                  "pedagogical_a1_fit": "PENDING",
                  "assessment_quality": "PENDING",
                  "educator_release_review": "PENDING"
              },
              "release_effect": "NONE_AUTOMATIC: Urdu A1 remains non-release-ready until the required independent semantic/naturalness/pedagogical and educator release reviews are completed.",
              "notes": [
                  "Exact Unicode token-sequence matching is used for Urdu lexical visibility and premature-exposure checks; substring matching is intentionally forbidden (for example, ہاں does not match within یہاں).",
                  "Duplicate-prompt rejection is scoped within each passage; cross-passage repetition is not treated as a deterministic defect.",
                  "Legacy quality/review metadata inside generated records is not treated as current independent final-review evidence."
              ]
          }
          EVIDENCE.parent.mkdir(parents=True, exist_ok=True)
          EVIDENCE.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(evidence["status"])
          print(json.dumps(evidence["counts"], ensure_ascii=False))
          if violations:
              print(json.dumps(violations[:20], ensure_ascii=False, indent=2))
          PY

          python /tmp/audit_urdu_a1.py
          AUDIT_STATUS="$(python - <<'PY'
          import json
          print(json.load(open('reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json', encoding='utf-8'))['status'])
          PY
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/urdu-a1-final-deterministic-audit.yml
          git add reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json
          git commit -m "Audit Urdu A1 final deterministic integrity [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          if [[ "$AUDIT_STATUS" != "PASS_DETERMINISTIC_FINAL_AUDIT_NEEDS_INDEPENDENT_REVIEW" ]]; then
            echo "Deterministic final audit failed; durable evidence was checkpointed." >&2
            exit 1
          fi
