name: LANG-WB v1 repair v2 staged gate

on:
  push:
    branches:
      - lang-wb-v1-repair-v2-20260904
    paths:
      - '.github/lang-wb-v2/trigger.txt'

permissions:
  contents: write

concurrency:
  group: lang-wb-v1-repair-v2-staged-gate
  cancel-in-progress: false

jobs:
  stage-c-write:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: lang-wb-v1-repair-v2-20260904
          fetch-depth: 0

      - name: Reconfirm exact pre-write dry-run
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_language_workbook_linguistic_repairs.py > /tmp/prewrite.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/prewrite.json').read_text(encoding='utf-8'))
          baseline=json.loads(Path('audit/language-workbooks/v1.0/vocab_incremental_repair_baselines.json').read_text(encoding='utf-8'))
          if result.get('gate') != 'PASS_DRY_RUN':
              raise SystemExit('pre-write gate is not PASS_DRY_RUN')
          if result.get('coverage') != {'sentence_rows':3000,'vocab_rows':3000,'total_rows':6000,'unresolved_holds':0}:
              raise SystemExit('pre-write coverage mismatch')
          expected_blobs={
              'arabic':'f463d9f981d9d2cf333f113381400c00a0f376ac',
              'french':'c79f8729dd5e089e0647723bfc81822bb89586a1',
              'urdu':'fd25fbec70a732bcced502146796a90bffc9b774',
          }
          for lang in ('arabic','french','urdu'):
              vocab=result['sources']['vocab'][lang]
              expected=set(baseline['vocab'][lang]['allowed_new_repair_ranks'])
              if set(vocab.get('applied', [])) != expected:
                  raise SystemExit(f'vocab/{lang}: pre-write repair rank mismatch')
              if vocab.get('output_git_blob') != expected_blobs[lang]:
                  raise SystemExit(f'vocab/{lang}: pre-write output blob mismatch')
              if result['sources']['sentence'][lang].get('applied'):
                  raise SystemExit(f'sentence/{lang}: unexpected pre-write changes')
          print('PASS_PREWRITE_RECHECK')
          PY
          test -z "$(git status --porcelain)"

      - name: Apply learner-source repairs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_language_workbook_linguistic_repairs.py --write > /tmp/write.json
          cat /tmp/write.json

      - name: Validate exact write and changed paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          result=json.loads(Path('/tmp/write.json').read_text(encoding='utf-8'))
          baseline=json.loads(Path('audit/language-workbooks/v1.0/vocab_incremental_repair_baselines.json').read_text(encoding='utf-8'))
          if result.get('gate') != 'PASS_WRITE':
              raise SystemExit(f"write gate mismatch: {result.get('gate')!r}")
          if result.get('coverage') != {'sentence_rows':3000,'vocab_rows':3000,'total_rows':6000,'unresolved_holds':0}:
              raise SystemExit('write coverage mismatch')
          expected_blobs={
              'arabic':'f463d9f981d9d2cf333f113381400c00a0f376ac',
              'french':'c79f8729dd5e089e0647723bfc81822bb89586a1',
              'urdu':'fd25fbec70a732bcced502146796a90bffc9b774',
          }
          for lang in ('arabic','french','urdu'):
              vocab=result['sources']['vocab'][lang]
              expected=set(baseline['vocab'][lang]['allowed_new_repair_ranks'])
              if set(vocab.get('applied', [])) != expected:
                  raise SystemExit(f'vocab/{lang}: write repair rank mismatch')
              if vocab.get('output_git_blob') != expected_blobs[lang]:
                  raise SystemExit(f'vocab/{lang}: write output blob mismatch')
              if result['sources']['sentence'][lang].get('applied'):
                  raise SystemExit(f'sentence/{lang}: unexpected write changes')
          expected_paths={
              'arabic_top1000.csv',
              'french_top1000.csv',
              'urdu_top1000.csv',
              'audit/language-workbooks/v1.0/ledger_repair_application.json',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if actual != expected_paths:
              print('Missing:', sorted(expected_paths-actual))
              print('Unexpected:', sorted(actual-expected_paths))
              raise SystemExit('write changed-path set mismatch')
          for lang, expected_blob in expected_blobs.items():
              actual_blob=subprocess.check_output(['git','hash-object',f'{lang}_top1000.csv'], text=True).strip()
              if actual_blob != expected_blob:
                  raise SystemExit(f'{lang}: on-disk blob mismatch after write')
          print('PASS_EXACT_STAGE_C_WRITE')
          PY

      - name: Prove post-write idempotence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_language_workbook_linguistic_repairs.py > /tmp/postwrite.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/postwrite.json').read_text(encoding='utf-8'))
          if result.get('gate') != 'PASS_DRY_RUN':
              raise SystemExit('post-write gate is not PASS_DRY_RUN')
          if result.get('coverage') != {'sentence_rows':3000,'vocab_rows':3000,'total_rows':6000,'unresolved_holds':0}:
              raise SystemExit('post-write coverage mismatch')
          for kind in ('sentence','vocab'):
              for lang in ('arabic','french','urdu'):
                  source=result['sources'][kind][lang]
                  if source.get('applied'):
                      raise SystemExit(f'{kind}/{lang}: post-write run is not idempotent: {source.get("applied")}')
                  if source.get('source_state') != 'prior_repaired':
                      raise SystemExit(f'{kind}/{lang}: expected prior_repaired after write, got {source.get("source_state")!r}')
          print('PASS_POSTWRITE_IDEMPOTENT')
          PY

      - name: Commit learner-source repair atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arabic_top1000.csv french_top1000.csv urdu_top1000.csv \
                  audit/language-workbooks/v1.0/ledger_repair_application.json
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected={
              'arabic_top1000.csv',
              'french_top1000.csv',
              'urdu_top1000.csv',
              'audit/language-workbooks/v1.0/ledger_repair_application.json',
          }
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'staged write path mismatch: {sorted(actual)}')
          PY
          git commit -m 'repair: apply LANG-WB v1 linguistic repair v2'
          git push origin HEAD:lang-wb-v1-repair-v2-20260904
