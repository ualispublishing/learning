name: LANG-WB v1 repair v2 stage A

on:
  push:
    branches:
      - lang-wb-v1-repair-v2-20260904
    paths:
      - '.github/lang-wb-v2/trigger.txt'

permissions:
  contents: write

concurrency:
  group: lang-wb-v1-repair-v2-stage-a
  cancel-in-progress: false

jobs:
  stage-a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: lang-wb-v1-repair-v2-20260904
          fetch-depth: 0

      - name: Check live trigger
        id: gate
        shell: bash
        run: |
          if [ -f .github/lang-wb-v2/trigger.txt ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Trigger removed; cleanup push only."
          fi

      - name: Apply exact locked Stage A repair set
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python .github/lang-wb-v2/stage_a.py
          git diff --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          payload=json.loads(Path('.github/lang-wb-v2/payload.json').read_text(encoding='utf-8'))
          expected_tracked={item['path'] for item in payload['patches']}
          expected_tracked.add('scripts/apply_language_workbook_linguistic_repairs.py')
          expected_untracked={'audit/language-workbooks/v1.0/vocab_incremental_repair_baselines.json'}

          actual_tracked=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          actual_untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())

          print('Expected tracked paths:', len(expected_tracked))
          print('Actual tracked paths:', len(actual_tracked))
          print('Expected untracked paths:', sorted(expected_untracked))
          print('Actual untracked paths:', sorted(actual_untracked))

          if actual_tracked != expected_tracked:
              print('Missing tracked:', sorted(expected_tracked-actual_tracked))
              print('Unexpected tracked:', sorted(actual_tracked-expected_tracked))
              raise SystemExit('Stage A tracked-path set mismatch')
          if actual_untracked != expected_untracked:
              print('Missing untracked:', sorted(expected_untracked-actual_untracked))
              print('Unexpected untracked:', sorted(actual_untracked-expected_untracked))
              raise SystemExit('Stage A untracked-path set mismatch')
          PY

      - name: Commit Stage A atomically
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/language-workbooks/v1.0/row_by_row_vocab \
                  audit/language-workbooks/v1.0/vocab_incremental_repair_baselines.json \
                  scripts/apply_language_workbook_linguistic_repairs.py
          git diff --cached --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          payload=json.loads(Path('.github/lang-wb-v2/payload.json').read_text(encoding='utf-8'))
          expected={item['path'] for item in payload['patches']}
          expected |= {
              'audit/language-workbooks/v1.0/vocab_incremental_repair_baselines.json',
              'scripts/apply_language_workbook_linguistic_repairs.py',
          }
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != expected:
              print('Missing staged:', sorted(expected-actual))
              print('Unexpected staged:', sorted(actual-expected))
              raise SystemExit('Stage A staged-path set mismatch')
          PY
          git commit -m 'repair: stage LANG-WB v1 linguistic repair v2'
          git push origin HEAD:lang-wb-v1-repair-v2-20260904
