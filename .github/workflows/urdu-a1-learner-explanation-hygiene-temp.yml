name: TEMP Urdu A1 learner explanation hygiene

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/urdu-a1-learner-explanation-hygiene-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-urdu-a1-learner-explanation-hygiene
  cancel-in-progress: false

jobs:
  scan:
    if: github.event.pull_request.head.ref == 'audit/urdu-a1-final-deterministic-2026-08-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/urdu-a1-final-deterministic-2026-08-22
      - name: Scan learner-facing explanations for internal-review leakage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re

          corpus=Path('reading/urdu/a1/passages.jsonl')
          expected='e4c996dbd9fc9808eed0a29c66aa5d7114543b5bb7ccc34d5bcd1de6b9d5cf8c'
          got=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if got!=expected: raise SystemExit(f'FAIL CLOSED corpus drift {got}')
          rows=[json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]
          if len(rows)!=60: raise SystemExit('FAIL CLOSED expected 60 passages')

          patterns={
            'question_meta':re.compile(r'یہ\s+سوال|سوال\s+.*جانچ'),
            'grammar_meta':re.compile(r'نحو|نحوی|گرامر|صرفی|لسانی\s+اصطلاح|اصطلاح'),
            'assessment_meta':re.compile(r'جانچتا\s+ہے|جانچتی\s+ہے|آزماتا\s+ہے|ٹیسٹ'),
            'production_meta_en':re.compile(r'\b(?:question|answer|target|audit|review|grammar|pedagog|schema|generated|generation)\b',re.I),
          }
          findings=[]
          nonempty=0
          for r in rows:
            for a in r.get('answer_key',[]):
              exp=str(a.get('explanation') or '').strip()
              if not exp: continue
              nonempty+=1
              matched=[name for name,pat in patterns.items() if pat.search(exp)]
              if matched:
                findings.append({
                  'passage_id':r['id'],'answer_id':a['id'],'question_id':a['question_id'],
                  'explanation':exp,'matched_classes':matched
                })
          payload={
            'schema_version':1,'date':'2026-08-23','language':'ur','level':'A1',
            'audit':'learner_facing_answer_explanation_hygiene',
            'bound_sha256':expected,'passages':len(rows),'answers':sum(len(r.get('answer_key',[])) for r in rows),
            'nonempty_explanations':nonempty,'finding_count':len(findings),'findings':findings,
            'status':'FINDINGS_REQUIRE_ADJUDICATION' if findings else 'PASS_NO_INTERNAL_REVIEW_LEAKAGE_PATTERNS',
            'scope':'High-precision scan of learner-facing answer explanations for internal assessment/audit/grammar-review commentary. Findings require contextual adjudication; no automatic content edits.',
            'release_effect':'NONE_AUTOMATIC: diagnostic evidence only; independent Urdu semantic/native/educator review remains pending.'
          }
          out=Path('reading/audit/urdu_a1_learner_explanation_hygiene_2026-08-23.json')
          out.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'nonempty_explanations':nonempty,'finding_count':len(findings),'findings':findings},ensure_ascii=False))
          PY
      - name: Commit diagnostic evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/urdu_a1_learner_explanation_hygiene_2026-08-23.json
          git rm -f .github/workflows/urdu-a1-learner-explanation-hygiene-temp.yml
          git commit -m 'Audit Urdu A1 learner explanation hygiene [skip ci]'
          git push origin HEAD:audit/urdu-a1-final-deterministic-2026-08-22
