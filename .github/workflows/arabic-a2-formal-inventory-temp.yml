name: TEMP Arabic A2 formal inventory
on:
  push:
    branches: [audit/arabic-a2-formal-inventory-2026-08-21]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/arabic-a2-formal-inventory-2026-08-21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/audit_arabic_a2_formal_inventory.py
      - name: Commit inventory evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/arabic_a2_formal_inventory_2026-08-21.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inventory Arabic A2 formal items [skip ci]'
          git push origin HEAD:audit/arabic-a2-formal-inventory-2026-08-21
