name: Recalibrate final Arabic C1 Unit05
on:
  workflow_dispatch:
  push:
    paths:
      - reading/tools/recalibrate_final_arabic_c1_unit05.py
      - .github/workflows/recalibrate-final-arabic-c1-unit05.yml
permissions:
  contents: write
jobs:
  recalibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/recalibrate_final_arabic_c1_unit05.py
      - name: Commit C1 Unit05 recalibration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/c1/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recalibrate Arabic C1 Unit05 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
