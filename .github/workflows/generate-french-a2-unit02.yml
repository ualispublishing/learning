name: Generate French A2 Unit 02
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_french_a2_unit02.py'
      - 'reading/tools/generate_french_a2_unit02_retry.py'
      - 'reading/tools/generate_french_a2_unit02_retry2.py'
      - '.github/workflows/generate-french-a2-unit02.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet jsonschema
      - name: Append and validate French A2 Unit 02
        run: python reading/tools/generate_french_a2_unit02_retry2.py
      - name: Independent Unit 02 checks
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/french/a2/passages.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==12
          assert [r['sequence'] for r in rows]==list(range(1,13))
          assert len({r['id'] for r in rows})==12
          u2=rows[6:]
          assert [r['id'] for r in u2]==[f'fr-a2-u02-p{i:02d}' for i in range(1,7)]
          assert all(140<=r['word_count']<=220 for r in u2)
          assert sum(len(r['new_lexical_targets']) for r in u2[:5])==10
          assert u2[-1]['new_lexical_targets']==[]
          assert sum(len(r['questions']) for r in u2)==60
          assert sum(len(r['answer_key']) for r in u2)==60
          forms=[t['form'] for r in u2[:5] for t in r['new_lexical_targets']]
          assert forms==['raison','résultat','décision','information','important','différent','habitude','expérience','choix','idée']
          for r in u2:
              local={str(t['id']) for f in ('new_lexical_targets','review_lexical_targets') for t in r.get(f,[]) if isinstance(t,dict) and t.get('id')}
              amap={a['question_id']:a['id'] for a in r['answer_key']}; assert len(amap)==10
              for q in r['questions']:
                  assert amap[q['id']]==q['answer_id']
                  assert all(tid in local for tid in q.get('target_ids',[]))
              for t in r['review_lexical_targets']:
                  if t['representation'] in {'running_text','summary'}:
                      assert re.search(rf'(?<!\w){re.escape(t["form"])}(?!\w)',r['text'],re.I)
          print({'status':'PASS','french_a2_passages':12,'unit02_questions':60,'unit02_answers':60,'unit02_new_targets':10,'checkpoint_new_targets':0})
          PY
      - name: Commit French A2 Unit 02
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a2/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate French A2 Unit 02 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
