name: Apply Urdu C1 Unit 7

on:
  push:
    paths:
      - '.github/workflows/apply-urdu-c1-unit07.yml'
      - 'reading/tools/prepare_urdu_c1_unit07.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare guarded Unit 7 canonicalizer
        run: python reading/tools/prepare_urdu_c1_unit07.py
      - name: Validate and canonicalize Unit 7
        run: python reading/tools/apply_urdu_c1_unit07.py
      - name: Commit canonical unit and advanced state
        run: |
          if git diff --quiet; then
            echo 'No changes required; canonical state already matches.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/tools/apply_urdu_c1_unit07.py \
                  reading/urdu/c1/passages.jsonl \
                  reading/CONTINUATION.json \
                  reading/STATUS.json \
                  reading/planning/ACTIVE_GENERATION_PLAN.json \
                  reading/TASKS.md \
                  reading/AGENT_HANDOFF_V2.md \
                  reading/STATE_MANIFEST.json \
                  reading/audit/urdu_c1_u07_generation_qa_2026-08-27.json
          git commit -m 'Canonicalize Urdu C1 Unit 7 and advance frontier'
          git push
