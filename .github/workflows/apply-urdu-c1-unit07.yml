name: Apply Urdu C1 Unit 7

on:
  push:
    paths:
      - '.github/workflows/apply-urdu-c1-unit07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Unit 7 handoff replacement ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('reading/tools/apply_urdu_c1_unit07.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          exact = [i for i,l in enumerate(lines) if '"**Urdu C1 Unit 7 / sequence 37** using' in l]
          generic = [i for i,l in enumerate(lines) if '"Unit 7 / sequence 37":"Unit 8 / sequence 43"' in l]
          if len(exact) != 1 or len(generic) != 1:
              raise SystemExit(f'FAIL CLOSED: replacement rules not uniquely found: exact={exact}, generic={generic}')
          line = lines.pop(exact[0])
          generic = [i for i,l in enumerate(lines) if '"Unit 7 / sequence 37":"Unit 8 / sequence 43"' in l]
          lines.insert(generic[0], line)
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Verify live frontier and canonicalize Unit 7
        run: python reading/tools/apply_urdu_c1_unit07.py
      - name: Commit canonical unit and advanced state
        run: |
          if git diff --quiet; then
            echo 'No changes required; canonical state already matches.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/c1/passages.jsonl \
                  reading/CONTINUATION.json \
                  reading/STATUS.json \
                  reading/planning/ACTIVE_GENERATION_PLAN.json \
                  reading/TASKS.md \
                  reading/AGENT_HANDOFF_V2.md \
                  reading/STATE_MANIFEST.json \
                  reading/audit/urdu_c1_u07_generation_qa_2026-08-27.json
          git commit -m 'Canonicalize Urdu C1 Unit 7 and advance frontier'
          git push
