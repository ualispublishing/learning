name: Apply Urdu C1 Unit 7

on:
  push:
    paths:
      - '.github/workflows/apply-urdu-c1-unit07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Unit 7 handoff replacement ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('reading/tools/apply_urdu_c1_unit07.py')
          s = p.read_text(encoding='utf-8')
          old = '''            "Unit 7 / sequence 37":"Unit 8 / sequence 43",
            "C1 Unit 7 uses the roadmap theme **literature and cultural criticism** with `critical essay`, `review`, and `close-reading style prose` genres.":"C1 Unit 8 uses the roadmap theme **economics, risk, and forecasting** with `analysis`, `briefing`, and `scenario comparison` genres.",
            "**Urdu C1 Unit 7 / sequence 37** using the C1 Unit 7 roadmap theme `literature and cultural criticism`":"**Urdu C1 Unit 8 / sequence 43** using the C1 Unit 8 roadmap theme `economics, risk, and forecasting`"'''
          new = '''            "**Urdu C1 Unit 7 / sequence 37** using the C1 Unit 7 roadmap theme `literature and cultural criticism`":"**Urdu C1 Unit 8 / sequence 43** using the C1 Unit 8 roadmap theme `economics, risk, and forecasting`",
            "Unit 7 / sequence 37":"Unit 8 / sequence 43",
            "C1 Unit 7 uses the roadmap theme **literature and cultural criticism** with `critical essay`, `review`, and `close-reading style prose` genres.":"C1 Unit 8 uses the roadmap theme **economics, risk, and forecasting** with `analysis`, `briefing`, and `scenario comparison` genres."'''
          if old not in s:
              raise SystemExit('FAIL CLOSED: expected Unit 7 replacement block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Verify live frontier and canonicalize Unit 7
        run: python reading/tools/apply_urdu_c1_unit07.py
      - name: Commit canonical unit and advanced state
        run: |
          if git diff --quiet; then
            echo 'No changes required; canonical state already matches.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/c1/passages.jsonl \
                  reading/CONTINUATION.json \
                  reading/STATUS.json \
                  reading/planning/ACTIVE_GENERATION_PLAN.json \
                  reading/TASKS.md \
                  reading/AGENT_HANDOFF_V2.md \
                  reading/STATE_MANIFEST.json \
                  reading/audit/urdu_c1_u07_generation_qa_2026-08-27.json
          git commit -m 'Canonicalize Urdu C1 Unit 7 and advance frontier'
          git push
