name: Check final Arabic pass 06 four candidate IDs
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/check_final_arabic_pass06_four_candidate_ids.py'
      - '.github/workflows/check-final-arabic-pass06-four-candidate-ids.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/check_final_arabic_pass06_four_candidate_ids.py
      - name: Commit usage artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_pass06_four_candidate_id_usage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Check remaining Pass 06 candidate IDs [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
