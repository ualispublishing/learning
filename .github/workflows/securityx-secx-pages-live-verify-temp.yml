name: SecurityX SecX Pages Live Verify TEMP

on:
  push:
    branches:
      - securityx-secx-pages-verify-20260902
    paths:
      - '.github/workflows/securityx-secx-pages-live-verify-temp.yml'

permissions:
  contents: read

jobs:
  verify-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe stable and preview routes
        shell: bash
        run: |
          set -u
          probe() {
            local name="$1" url="$2" marker="$3"
            local body="/tmp/${name}.html"
            code="$(curl -L -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' "$url" || true)"
            marker_present=no
            grep -Fq "$marker" "$body" 2>/dev/null && marker_present=yes
            title="$(grep -o '<title>[^<]*</title>' "$body" 2>/dev/null | head -1 || true)"
            echo "PROBE name=$name status=$code marker_present=$marker_present title=$title url=$url"
            echo "BODY_${name}_BEGIN"
            head -c 500 "$body" 2>/dev/null || true
            echo
            echo "BODY_${name}_END"
          }
          probe stable 'https://ualispublishing.github.io/learning/subjects/securityx/cas-005/study-site/' 'SecurityX CAS-005 Layered Study Site'
          probe preview 'https://ualispublishing.github.io/learning/subjects/securityx/cas-005/secx-grid-prototype/' 'ALTERNATE KEYBOARD SITE'
