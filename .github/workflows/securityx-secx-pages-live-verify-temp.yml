name: SecurityX SecX Pages Live Verify TEMP

on:
  push:
    branches:
      - securityx-secx-pages-verify-20260902
    paths:
      - '.github/workflows/securityx-secx-pages-live-verify-temp.yml'

permissions:
  contents: read

jobs:
  verify-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify stable and preview routes
        shell: bash
        run: |
          set -euo pipefail
          stable='https://ualispublishing.github.io/learning/subjects/securityx/cas-005/study-site/'
          preview='https://ualispublishing.github.io/learning/subjects/securityx/cas-005/secx-grid-prototype/'

          check() {
            local name="$1" url="$2" marker="$3"
            local body="/tmp/${name}.html"
            for attempt in {1..24}; do
              code="$(curl -L -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' "$url" || true)"
              echo "$name attempt=$attempt status=$code url=$url"
              if [[ "$code" == '200' ]] && grep -Fq "$marker" "$body"; then
                title="$(grep -o '<title>[^<]*</title>' "$body" | head -1 || true)"
                echo "PASS $name status=200 marker=$marker title=$title"
                return 0
              fi
              sleep 10
            done
            echo "FAIL $name"
            echo '--- response excerpt ---'
            head -c 800 "$body" || true
            echo
            return 1
          }

          check stable "$stable" 'SecurityX CAS-005 Layered Study Site'
          check preview "$preview" 'ALTERNATE KEYBOARD SITE'
