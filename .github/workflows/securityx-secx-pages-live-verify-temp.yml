name: SecurityX SecX Pages Live Verify TEMP

on:
  push:
    branches:
      - securityx-secx-pages-verify-20260902
    paths:
      - '.github/workflows/securityx-secx-pages-live-verify-temp.yml'

permissions:
  contents: read

jobs:
  verify-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Discover current Pages routes
        shell: bash
        run: |
          set -u
          base='https://ualispublishing.github.io/learning'
          paths=(
            '/'
            '/securityx/'
            '/secx/'
            '/subjects/securityx/'
            '/subjects/securityx/cas-005/'
            '/subjects/securityx/cas-005/study-site/'
            '/subjects/securityx/cas-005/secx-grid-prototype/'
            '/subjects/cissp/2024-outline/study-site/'
            '/cissp/'
            '/cissp-atlas/'
          )
          for path in "${paths[@]}"; do
            body="/tmp/body.html"
            code="$(curl -L -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' "$base$path" || true)"
            title="$(grep -o '<title>[^<]*</title>' "$body" 2>/dev/null | head -1 || true)"
            echo "ROUTE status=$code path=$path title=$title"
          done
          curl -L -sS --connect-timeout 10 --max-time 30 "$base/" -o /tmp/root.html || true
          echo 'ROOT_LINKS_BEGIN'
          grep -oE 'href="[^"]+"' /tmp/root.html | head -80 || true
          echo 'ROOT_LINKS_END'
          curl -L -sS --connect-timeout 10 --max-time 30 "$base/subjects/securityx/cas-005/study-site/" -o /tmp/notfound.html || true
          echo 'NOTFOUND_ROUTE_HINTS_BEGIN'
          grep -oE '(href|location\.href|location\.replace|window\.location)[^<;]+' /tmp/notfound.html | head -80 || true
          echo 'NOTFOUND_ROUTE_HINTS_END'
