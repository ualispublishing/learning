name: TEMP Arabic A1 Units 07-10 formal inventory
on:
  push:
    branches: [audit/arabic-a1-u07-u10-formal-2026-08-20]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/arabic-a1-u07-u10-formal-2026-08-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/audit_arabic_a1_u07_u10_formal.py
      - name: Commit inventory evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/arabic_a1_u07_u10_formal_inventory_2026-08-20.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inventory Arabic A1 Units 07-10 formal items [skip ci]'
          git push origin HEAD:audit/arabic-a1-u07-u10-formal-2026-08-20
