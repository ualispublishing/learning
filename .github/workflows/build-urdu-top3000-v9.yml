name: Build Urdu top3000 continuation v9

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_urdu_top3000_v9.py'
      - '.github/workflows/build-urdu-top3000-v9.yml'
      - 'audit/run_urdu_top3000_v9.request'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install word2word wordfreq
      - name: Download independent Urdu sources
        run: |
          curl -L --fail --retry 5 --retry-all-errors 'https://raw.githubusercontent.com/rohan-c0de/ReadUrdu-Devanagari-English/main/data/dictionary.json' -o /tmp/readurdu-dictionary.json
          curl -L --fail --retry 5 --retry-all-errors 'https://kaikki.org/dictionary/Urdu/kaikki.org-dictionary-Urdu.jsonl' -o /tmp/kaikki-urdu.jsonl
      - name: Build Unicode two-source candidate
        run: |
          python scripts/build_urdu_top3000_v9.py \
            --kaikki /tmp/kaikki-urdu.jsonl \
            --readurdu /tmp/readurdu-dictionary.json
      - name: Commit candidate evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/urdu_top3000_candidate_v9.csv audit/urdu_top3000_continuation_evidence_v9.csv audit/urdu_top3000_rejections_v9.csv audit/urdu_top3000_candidate_v9_summary.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build Unicode two-source Urdu top3000 v9 [skip ci]'
          for n in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*3))
          done
          exit 1
