name: Recalibrate French A1 P1-P2
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/rewrite_french_a1_p1_p2_text.py'
      - '.github/workflows/recalibrate-french-a1-p1-p2.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/rewrite_french_a1_p1_p2_text.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a1/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recalibrate French A1 passages 1-2 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
