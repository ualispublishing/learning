name: Arabic A1+A2 question review linkage repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'reading/tools/repair_arabic_a1_a2_question_review_linkage.py'
      - '.github/workflows/arabic-a1-a2-question-review-linkage.yml'

permissions:
  contents: write

concurrency:
  group: arabic-a1-a2-question-review-linkage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair assessment-review linkage
        run: python reading/tools/repair_arabic_a1_a2_question_review_linkage.py
      - name: Commit linkage repair and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/arabic/a1/passages.jsonl reading/arabic/a2/passages.jsonl reading/audit/arabic_a1_a2_question_review_linkage_repair_2026-08-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair Arabic A1/A2 assessment review linkage [skip ci]"
          git fetch origin audit/arabic-a1-a2-integrated-2026-08-23
          git rebase origin/audit/arabic-a1-a2-integrated-2026-08-23
          git push origin HEAD:audit/arabic-a1-a2-integrated-2026-08-23
