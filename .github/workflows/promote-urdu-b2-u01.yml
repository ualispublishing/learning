name: Promote Urdu B2 Unit 1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/promote-urdu-b2-u01.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Validate, create B2 canonical file, and advance frontier
        shell: bash
        run: |
          set -euo pipefail
          # Exact-form lexical checks use Unicode word boundaries, not substrings.
          python3 reading/tools/promote_urdu_b2_u01.py

      - name: Refresh and validate live state bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 reading/tools/refresh_state_manifest.py
          python3 reading/tools/validate_continuation_state.py

      - name: Commit canonical promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reading/urdu/b2/passages.jsonl \
            reading/audit/urdu_b2_u01_generation_candidate \
            reading/audit/urdu_b2_u01_generation_validation_2026-08-24.json \
            reading/audit/urdu_b2_u01_promotion_2026-08-24.json \
            reading/audit/urdu_b2_u01_lexical_sense_check_2026-08-24.json \
            reading/STATUS.json \
            reading/CONTINUATION.json \
            reading/planning/ACTIVE_GENERATION_PLAN.json \
            reading/TASKS.md \
            reading/AGENT_HANDOFF_V2.md \
            reading/STATE_MANIFEST.json
          if git diff --cached --quiet; then
            echo "No promotion changes to commit"
            exit 0
          fi
          git commit -m "Add Urdu B2 Unit 1 and advance to Unit 2"
          git push origin HEAD:main
