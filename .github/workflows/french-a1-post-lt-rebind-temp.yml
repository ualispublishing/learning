              for q in qs:
                  a=amap.get(q.get('answer_id'))
                  if not a or a.get('question_id')!=q.get('id'): qa.append({'passage_id':row['id'],'question_id':q.get('id'),'kind':'forward_link'})
              for a in ans:
                  q=qmap.get(a.get('question_id'))
                  if not q or q.get('answer_id')!=a.get('id'): qa.append({'passage_id':row['id'],'answer_id':a.get('id'),'kind':'back_link'})
              ps=[unicodedata.normalize('NFC',q.get('prompt','')).strip().casefold() for q in qs]
