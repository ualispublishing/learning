          checks['future_target_leakage_rule']='NOT_APPLICABLE_NO_FRENCH_A1_PROHIBITION_RECORDED'
          evidence={'schema_version':1,'date':'2026-08-22','language':'fr','level':'A1','audit':'formal_protocol_gate_a_current_corpus','protocol':'reading/planning/EDUCATOR_RELEASE_VERIFICATION_PROTOCOL.md §3','status':'PASS_DETERMINISTIC_FORMAL_GATE_A_NEEDS_LATER_RELEASE_GATES' if not blockers else 'FAIL_DETERMINISTIC_FORMAL_GATE_A','bound_sha256':sha,'bound_git_blob':blob,'scope':{'passages':len(rows),'questions':sum(len(r.get('questions',[])) for r in rows),'answers':sum(len(r.get('answer_key',[])) for r in rows),'review_target_checks':nreview},'checks':checks,'blocker_count':len(blockers),'blockers':blockers,'validator_correction':{'issue':'Multiple-choice labels A)/B)/C) are not parentheses.','correction':'Standalone A)-D) option labels are removed before balancing real parentheses.','corpus_change_required':False},'source_lexicon_sha256':source_hashes,'independent_review':{'semantic_accuracy':'PENDING','french_naturalness_orthography':'PENDING','pedagogical_a1_fit':'PENDING','assessment_answer_grounding':'PENDING','independent_machine_tools':'PARTIAL_LANGUAGETOOL_POSTREPAIR_RERUN_PENDING_IN_THIS_JOB','independent_model_family':'PENDING','native_professional':'PENDING','educator_release':'PENDING','blind_review':'PENDING'},'release_effect':'NONE_AUTOMATIC: formal Gate A is deterministic integrity only; French remains REOPEN_REQUIRED.'}
          Path('reading/audit/french_a1_formal_gate_a_2026-08-22.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'gate_a_status':evidence['status'],'bound_sha256':sha,'blockers':len(blockers),'review_target_checks':nreview},ensure_ascii=False))
          if blockers: print(json.dumps(blockers,ensure_ascii=False,indent=2));raise SystemExit(1)
          PY
