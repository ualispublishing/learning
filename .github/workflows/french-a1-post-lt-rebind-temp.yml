          for row in rows:
              doc=nlp(row['text']); toks={(norm(w.text),norm(w.lemma)) for sent in doc.sentences for w in sent.words}
              allfields='\n'.join([row.get('text','')]+[q.get('prompt','') for q in row.get('questions',[])]+[a.get('answer','') for a in row.get('answer_key',[])])
              qtargets={tid for q in row.get('questions',[]) for tid in q.get('target_ids',[])}
              for rv in row.get('review_lexical_targets',[]):
                  nreview+=1;tid=rv.get('id');prev=intro.get(tid)
                  if prev is None or prev['sequence']>=row['sequence']: chrono.append({'passage_id':row['id'],'target_id':tid,'kind':'review_before_introduction'});continue
                  cur=order.get(rv.get('review_stage'),0);prior=high.get(tid,0)
                  if cur<prior: chrono.append({'passage_id':row['id'],'target_id':tid,'kind':'stage_regression','prior':prior,'current':cur})
                  high[tid]=max(prior,cur);keys={norm(rv.get('form')),norm(prev.get('form')),norm(prev.get('lemma'))}-{''}
                  running=any(s in keys or l in keys for s,l in toks); exact=any(re.search(r'(?<!\w)'+re.escape(k)+r'(?!\w)',unicodedata.normalize('NFC',allfields).casefold(),flags=re.UNICODE) for k in keys);linked=tid in qtargets
                  visible=running if rv.get('representation')=='running_text' else (running or exact or linked)
                  if not visible: vis.append({'passage_id':row['id'],'target_id':tid,'form':rv.get('form'),'representation':rv.get('representation'),'keys':sorted(keys)})
              for t in row.get('new_lexical_targets',[]): intro[t.get('id')]={'sequence':row['sequence'],'form':t.get('form'),'lemma':t.get('lemma')}
          checks['review_target_visibility_100_percent']=not vis;checks['review_target_chronology_and_stage_monotonicity']=not chrono
          if vis:add('review_target_visibility',vis[:30])
