name: TEMP French A1 post-LanguageTool rebind

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/french-a1-post-lt-rebind-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-french-a1-post-lt-rebind
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'repair/french-a1-review-integrity-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install audit dependencies
        run: python -m pip install --quiet jsonschema stanza language_tool_python==3.4.0
      - name: Re-run strict generation integrity and formal Gate A
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python reading/tools/audit_french_a1_generation_integrity.py
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib,json,re,subprocess,unicodedata
          import stanza
          from jsonschema import Draft202012Validator

          R=Path('.'); C=R/'reading/french/a1/passages.jsonl'
          want='7dbdb48ffc6efd00106490ca9b10ad25643bf7e89967e8fbd2977a04641d6ea3'
          sha=hashlib.sha256(C.read_bytes()).hexdigest()
          if sha!=want: raise SystemExit(f'FAIL CLOSED: A1 hash drift {sha} != {want}')
          blob=subprocess.check_output(['git','hash-object',str(C)],text=True).strip()
          if blob!='417ee292a73244860ecd40741af521aee5436578': raise SystemExit(f'FAIL CLOSED: blob drift {blob}')
          rows=[json.loads(x) for x in C.read_text(encoding='utf-8').splitlines() if x.strip()]
          gen=json.loads((R/'reading/audit/french_a1_generation_integrity.json').read_text(encoding='utf-8'))
          if gen.get('status')!='PASS' or gen.get('failures') or gen.get('legacy_unit01_exposure_variances'):
              raise SystemExit('FAIL CLOSED: strict generation/source/exposure prerequisite failed')
          blockers=[]; checks={}
          def add(kind,items=None): blockers.append({'kind':kind,'details':items} if items is not None else {'kind':kind})
          schema=json.loads((R/'reading/schema/passage.schema.json').read_text(encoding='utf-8')); v=Draft202012Validator(schema); errs=[]
          for row in rows:
