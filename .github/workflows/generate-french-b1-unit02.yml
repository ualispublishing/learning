name: Generate French B1 Unit 02
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_french_b1_unit02.py'
      - 'reading/tools/generate_french_b1_unit02_retry.py'
      - '.github/workflows/generate-french-b1-unit02.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --quiet jsonschema
      - name: Generate and validate B1 Unit 02
        run: python reading/tools/generate_french_b1_unit02_retry.py
      - name: Independent B1 Unit 02 checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reading/french/b1/passages.jsonl')
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==12 and [r['sequence'] for r in rows]==list(range(1,13))
          u2=rows[6:]
          assert [r['id'] for r in u2]==[f'fr-b1-u02-p{i:02d}' for i in range(1,7)]
          assert all(r['language']=='fr' and r['cefr']=='B1' and r['unit']==2 for r in u2)
          assert all(220<=r['word_count']<=350 and r['word_count']==len(r['text'].split()) for r in u2)
          assert all(len(r['questions'])==10 and len(r['answer_key'])==10 for r in u2)
          assert all(len(r['new_lexical_targets'])==3 for r in u2[:5]) and u2[-1]['new_lexical_targets']==[]
          new=[t for r in u2[:5] for t in r['new_lexical_targets']]
          expected={'apparemment','détail','honnête','ordinateur','installer','remplir','planète','attirer','durer','coûter','respecter','inutile','admettre','mensonge','conversation'}
          assert len(new)==15 and {t['form'] for t in new}==expected and len({t['id'] for t in new})==15
          prior={t['id'] for r in rows[:6] for t in r.get('new_lexical_targets',[])}
          assert not prior.intersection({t['id'] for t in new})
          for r in u2:
              local={str(t['id']) for f in ('new_lexical_targets','review_lexical_targets') for t in r.get(f,[]) if isinstance(t,dict) and t.get('id')}
              amap={a['question_id']:a['id'] for a in r['answer_key']}
              assert len(amap)==10
              for q in r['questions']:
                  assert amap[q['id']]==q['answer_id']
                  assert all(tid in local for tid in q.get('target_ids',[]))
          print({'status':'PASS','b1_passages':12,'unit02_questions':60,'unit02_answers':60,'unit02_new_targets':15,'checkpoint_zero_new':True})
          PY
      - name: Commit canonical French B1 Unit 02
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/b1/passages.jsonl
          if git diff --cached --quiet; then
            echo 'No canonical changes to commit'
            exit 0
          fi
          git commit -m 'Generate French B1 Unit 02 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
