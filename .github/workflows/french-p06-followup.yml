name: French P06 follow-up
on:
  pull_request:
    branches: [main]
    paths: ['reading/audit/french_p06_followup_trigger.txt']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python reading/tools/french_p06_followup_repair.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/c1/passages.jsonl reading/audit/french_c1_u01_p06_followup_repair_2026-08-19.json
          git commit -m 'Polish French C1 P06 educator repair'
          git push origin HEAD:${{ github.head_ref }}
