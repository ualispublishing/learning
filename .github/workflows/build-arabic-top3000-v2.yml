name: Build Arabic top3000 continuation v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_arabic_top3000_v2.py'
      - '.github/workflows/build-arabic-top3000-v2.yml'
      - 'audit/run_arabic_top3000_v2.request'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install camel-tools wordfreq
          ok=0; for n in 1 2 3 4 5; do if camel_data -i morphology-db-msa-r13; then ok=1; break; fi; sleep $((n*4)); done; test "$ok" = 1
      - name: Download sources
        run: |
          curl -L --fail --retry 5 --retry-all-errors 'https://github.com/CAMeL-Lab/Camel_Arabic_Frequency_Lists/releases/download/v1.0/MSA_freq_lists.tsv.zip' -o /tmp/MSA.zip
          curl -L --fail --retry 5 --retry-all-errors 'https://kaikki.org/dictionary/Arabic/kaikki.org-dictionary-Arabic.jsonl' -o /tmp/kaikki-ar.jsonl
      - name: Build broad frequency inventory
        run: python scripts/build_arabic_core_candidates.py --frequency-zip /tmp/MSA.zip --output /tmp/arabic8000.csv --summary /tmp/arabic8000.txt --candidate-count 8000
      - name: Build cross-source continuation
        run: python scripts/build_arabic_top3000_v2.py --broad /tmp/arabic8000.csv --kaikki /tmp/kaikki-ar.jsonl
      - name: Commit candidate evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build cross-source Arabic top3000 v2 [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
