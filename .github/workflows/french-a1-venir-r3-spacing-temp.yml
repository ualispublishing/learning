name: TEMP French A1 venir R3 spacing repair
on:
  push:
    branches: [repair/french-a1-review-integrity-2026-08-20]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/repair_french_a1_venir_r3_spacing.py
      - name: Commit repair and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a1/passages.jsonl reading/audit/french_a1_venir_r3_spacing_repair_2026-08-21.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair French A1 venir R3 spacing [skip ci]'
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
