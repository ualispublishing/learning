name: TEMP French A1 LanguageTool post-NBSP rebind

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/french-a1-languagetool-post-nbsp-rebind-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-french-a1-languagetool-post-nbsp-rebind
  cancel-in-progress: false

jobs:
  rebind:
    if: github.event.pull_request.head.ref == 'repair/french-a1-review-integrity-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
          fetch-depth: 0
      - name: Install pinned LanguageTool wrapper
        run: |
          python -m venv .venv-lt
          .venv-lt/bin/python -m pip install --disable-pip-version-check language-tool-python==3.4.0
      - name: Calibrate old scan, then rerun current hash
        shell: bash
        run: |
          set -euo pipefail
          .venv-lt/bin/python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib,json,subprocess
          import language_tool_python

          current_path=Path('reading/french/a1/passages.jsonl')
          current_sha='8019fe53061a67faca527a50495d2188439da5142dd94a414a43e1a3986cf7f4'
          old_sha='7dbdb48ffc6efd00106490ca9b10ad25643bf7e89967e8fbd2977a04641d6ea3'
          old_commit='14c7d04fcb6c957eceabaaf99bfb422210c1572e'
          got=hashlib.sha256(current_path.read_bytes()).hexdigest()
          if got!=current_sha: raise SystemExit(f'FAIL CLOSED current corpus drift {got}')
          current_rows=[json.loads(x) for x in current_path.read_text(encoding='utf-8').splitlines() if x.strip()]
          old_bytes=subprocess.check_output(['git','show',f'{old_commit}:reading/french/a1/passages.jsonl'])
          if hashlib.sha256(old_bytes).hexdigest()!=old_sha: raise SystemExit('FAIL CLOSED old corpus identity mismatch')
          old_rows=[json.loads(x) for x in old_bytes.decode('utf-8').splitlines() if x.strip()]
          if len(old_rows)!=60 or len(current_rows)!=60: raise SystemExit('FAIL CLOSED passage count')

          persisted_path=Path('reading/audit/french_a1_languagetool_postrepair_fullscan_2026-08-22.json')
          persisted=json.loads(persisted_path.read_text(encoding='utf-8'))
          if persisted.get('bound_sha256')!=old_sha or persisted.get('raw_finding_count')!=230:
              raise SystemExit('FAIL CLOSED persisted LanguageTool source evidence mismatch')

          def clean(s):
              return (s or '').replace('\u00a0',' ').replace('\u202f',' ')
          def core(f):
              return (
                f.get('passage_id'),f.get('field'),f.get('item_id'),f.get('rule_id'),f.get('category'),
                f.get('rule_issue_type'),clean(f.get('message')),tuple(clean(x) for x in (f.get('replacements') or [])),
                f.get('offset_in_field'),f.get('error_length'),clean(f.get('matched_text'))
              )

          def scan(rows, tool):
              findings=[]; field_counts=Counter(); chars=0; boundary_skipped=[]
              for r in rows:
                  fields=[('title',None,r['title']),('text',None,r['text'])]
                  fields += [('question_prompt',q['id'],q['prompt']) for q in r['questions']]
                  fields += [('answer',a['id'],a['answer']) for a in r['answer_key']]
                  field_counts.update(f for f,_,_ in fields); chars+=sum(len(t) for _,_,t in fields)
                  spans=[]; parts=[]; pos=0
                  for i,(field,item,text) in enumerate(fields):
                      if i:
                          parts.append('  '); pos+=2
                      start=pos; parts.append(text); pos+=len(text); spans.append((start,pos,field,item,text))
                  combined=''.join(parts)
                  for m in tool.check(combined):
                      off=int(m.offset); end=off+int(m.error_length)
                      hit=next((s for s in spans if off>=s[0] and end<=s[1]),None)
                      if hit is None:
                          boundary_skipped.append({
                            'passage_id':r['id'],'rule_id':m.rule_id,'offset':off,'end':end,
                            'matched_text':combined[off:end], 'message':m.message
                          })
                          continue
                      start,stop,field,item,text=hit
                      local=off-start
                      findings.append({
                        'passage_id':r['id'],'field':field,'item_id':item,
                        'rule_id':m.rule_id,'category':str(m.category),'rule_issue_type':str(m.rule_issue_type),
                        'message':m.message,'replacements':list(m.replacements),
                        'offset_in_combined':off,'offset_in_field':local,'error_length':int(m.error_length),
                        'matched_text':text[local:local+int(m.error_length)],
                        'excerpt':text[max(0,local-60):min(len(text),local+int(m.error_length)+60)],
                        'sentence':getattr(m,'sentence','') or '',
                        'context':getattr(m,'context','') or ''
                      })
              return findings,field_counts,chars,boundary_skipped

          tool=language_tool_python.LanguageTool('fr')
          old_reconstructed,old_fields,old_chars,old_boundary=scan(old_rows,tool)
          persisted_counter=Counter(core(f) for f in persisted.get('findings',[]))
          reconstructed_counter=Counter(core(f) for f in old_reconstructed)
          if persisted_counter!=reconstructed_counter:
              removed=list((persisted_counter-reconstructed_counter).elements())[:20]
              added=list((reconstructed_counter-persisted_counter).elements())[:20]
              print(json.dumps({
                'phase':'OLD_CALIBRATION_FAIL','persisted_count':sum(persisted_counter.values()),
                'reconstructed_count':sum(reconstructed_counter.values()),'boundary_skipped_count':len(old_boundary),
                'boundary_examples':old_boundary[:10],'missing_from_reconstruction':removed,'unexpected_in_reconstruction':added
              },ensure_ascii=False,default=list))
              raise SystemExit('FAIL CLOSED LanguageTool reconstruction does not reproduce persisted old scan')
          if len(old_reconstructed)!=230:
              raise SystemExit(f'FAIL CLOSED old reconstruction count {len(old_reconstructed)}')

          current_findings,field_counts,chars,current_boundary=scan(current_rows,tool)
          try: tool.close()
          except Exception: pass
          current_counter=Counter(core(f) for f in current_findings)
          if persisted_counter!=current_counter:
              removed=list((persisted_counter-current_counter).elements())[:30]
              added=list((current_counter-persisted_counter).elements())[:30]
              print(json.dumps({
                'phase':'CURRENT_COMPARISON_FAIL','old_count':sum(persisted_counter.values()),
                'current_count':sum(current_counter.values()),'old_boundary_skipped_count':len(old_boundary),
                'current_boundary_skipped_count':len(current_boundary),'removed':removed,'added':added
              },ensure_ascii=False,default=list))
              raise SystemExit('FAIL CLOSED LanguageTool semantic fingerprint changed after NBSP repair')
          if len(current_findings)!=230:
              raise SystemExit(f'FAIL CLOSED expected 230 equivalent current findings, got {len(current_findings)}')

          by_rule=Counter(f['rule_id'] for f in current_findings); by_cat=Counter(f['category'] for f in current_findings)
          blob=subprocess.check_output(['git','hash-object',str(current_path)],text=True).strip()
          out={
            'schema_version':2,'date':'2026-08-22','language':'fr','level':'A1',
            'audit':'independent_machine_detector_languagetool_post_nbsp_fullscan',
            'status':'POST_NBSP_SCAN_COMPLETE_CALIBRATED_SEMANTIC_FINGERPRINT_EQUIVALENT',
            'bound_sha256':got,'bound_git_blob':blob,
            'scope':{'passages':60,'questions':600,'answers':600,'learner_facing_fields_scanned':sum(field_counts.values()),'characters_scanned':chars,'field_counts':dict(field_counts)},
            'tool':{'name':'LanguageTool via language_tool_python local server','language':'fr','language_tool_python_version':'3.4.0','language_tool_distribution':'6.8'},
            'scanner_calibration':{
              'old_corpus_sha256':old_sha,'persisted_old_scan':str(persisted_path),
              'old_reconstruction_exact_semantic_fingerprint_match':True,
              'old_reconstructed_findings':len(old_reconstructed),'old_boundary_only_matches_skipped':len(old_boundary),
              'current_boundary_only_matches_skipped':len(current_boundary),
              'boundary_policy':'Detector matches that do not lie wholly inside one learner-facing field are omitted as concatenation-only artifacts; this policy was accepted only after exact calibration against the persisted 230-finding old scan.'
            },
            'raw_finding_count':len(current_findings),'raw_findings_by_rule':dict(by_rule),'raw_findings_by_category':dict(by_cat),
            'passages_with_findings':len({f['passage_id'] for f in current_findings}),
            'equivalence_to_pre_nbsp_scan':{
              'source_scan':str(persisted_path),'semantic_fingerprint_equivalent':True,'new_signals':0,'missing_signals':0,
              'normalization_for_comparison':'U+00A0/U+202F mapped to ordinary space only; offsets compared within each field.'
            },
            'findings':current_findings
          }
          Path('reading/audit/french_a1_languagetool_post_nbsp_fullscan_2026-08-22.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          adjp=Path('reading/audit/french_a1_languagetool_postrepair_adjudication_2026-08-22.json')
          adj=json.loads(adjp.read_text(encoding='utf-8'))
          if adj.get('bound_sha256')!=old_sha or adj.get('postrepair',{}).get('open_accepted_defects')!=0:
              raise SystemExit('FAIL CLOSED prior LanguageTool adjudication identity/state mismatch')
          adj['bound_sha256']=got; adj['bound_git_blob']=blob
          adj['status']='LANGUAGETOOL_CURRENT_HASH_ALL_SIGNALS_DISPOSITIONED_NO_OPEN_ACCEPTED_DEFECTS'
          adj['rebind_after_nbsp_typography_repair']={
            'current_scan':'reading/audit/french_a1_languagetool_post_nbsp_fullscan_2026-08-22.json',
            'raw_findings':len(current_findings),'semantic_fingerprint_equivalent_to_pre_nbsp_scan':True,
            'new_signals':0,'missing_signals':0,'old_scanner_reconstruction_calibrated_exactly':True,
            'old_boundary_only_matches_skipped':len(old_boundary),'current_boundary_only_matches_skipped':len(current_boundary),
            'basis':'The only canonical content change was the separately proven 1,992 space-to-no-break-space typography substitution set; the calibrated current LanguageTool finding multiset matches the prior adjudicated set after no-break-space normalization.'
          }
          adj['machine_gate_state']='PARTIAL_LANGUAGETOOL_AND_GRAMMALECTE_COMPLETE_ANTIDOTE_DEEPL_PENDING'
          adjp.write_text(json.dumps(adj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          cp=Path('reading/audit/french_a1_post_nbsp_revalidation_2026-08-22.json')
          chk=json.loads(cp.read_text(encoding='utf-8'))
          if chk.get('bound_sha256')!=got: raise SystemExit('FAIL CLOSED revalidation checkpoint hash mismatch')
          chk['languagetool_status']='CURRENT_HASH_ALL_SIGNALS_DISPOSITIONED_NO_OPEN_ACCEPTED_DEFECTS'
          chk['languagetool_raw_findings']=len(current_findings); chk['languagetool_new_signals']=0
          chk['independent_machine_tools']='PARTIAL: LANGUAGETOOL_AND_GRAMMALECTE_CURRENT; ANTIDOTE_AND_DEEPL_WRITE_PENDING'
          cp.write_text(json.dumps(chk,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          gatep=Path('reading/audit/french_a1_formal_gate_a_2026-08-22.json')
          gate=json.loads(gatep.read_text(encoding='utf-8'))
          if gate.get('bound_sha256')!=got or gate.get('blocker_count')!=0: raise SystemExit('FAIL CLOSED formal Gate A state mismatch')
          gate['independent_review']['independent_machine_tools']='PARTIAL: LANGUAGETOOL_AND_GRAMMALECTE_CURRENT; ANTIDOTE/DEEPL_WRITE_PENDING'
          gatep.write_text(json.dumps(gate,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
            'sha256':got,'git_blob':blob,'old_calibration_exact':True,
            'old_boundary_skipped':len(old_boundary),'current_boundary_skipped':len(current_boundary),
            'raw_findings':len(current_findings),'semantic_fingerprint_equivalent':True,'new_signals':0,'open_accepted_defects':0
          },ensure_ascii=False))
          PY
      - name: Commit current-hash LanguageTool evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_a1_languagetool_post_nbsp_fullscan_2026-08-22.json reading/audit/french_a1_languagetool_postrepair_adjudication_2026-08-22.json reading/audit/french_a1_post_nbsp_revalidation_2026-08-22.json reading/audit/french_a1_formal_gate_a_2026-08-22.json
          git rm -f .github/workflows/french-a1-languagetool-post-nbsp-rebind-temp.yml
          git commit -m 'Rebind French A1 LanguageTool evidence after typography repair [skip ci]'
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
