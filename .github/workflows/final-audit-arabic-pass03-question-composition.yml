name: Final Arabic audit pass 03 - question composition
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/final_audit_arabic_pass03_question_composition.py'
      - 'reading/arabic/**/passages.jsonl'
      - '.github/workflows/final-audit-arabic-pass03-question-composition.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # Explicit refresh of the current canonical question sets.
      - name: Run final review pass 03
        run: python reading/tools/final_audit_arabic_pass03_question_composition.py
      - name: Commit audit artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_pass03_question_composition.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record final Arabic audit pass 03 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main