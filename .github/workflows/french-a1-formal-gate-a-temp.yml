name: TEMP French A1 formal Gate A

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/french-a1-formal-gate-a-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-french-a1-formal-gate-a
  cancel-in-progress: false

jobs:
  gate-a:
    if: github.event.pull_request.head.ref == 'repair/french-a1-review-integrity-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic validation dependencies
        run: python -m pip install --quiet jsonschema stanza
      - name: Run strict A1 source/exposure audit
        shell: bash
        run: |
          set -euo pipefail
          python reading/tools/audit_french_a1_generation_integrity.py
      - name: Run formal protocol Gate A across all French A1 records
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib, json, re, subprocess, unicodedata
          import stanza
          from jsonschema import Draft202012Validator

          ROOT=Path('.')
          CORPUS=ROOT/'reading/french/a1/passages.jsonl'
          EXPECTED='769bb4867e7f3571992378dca439d455aa9fb42586fcad0c61a35e185d5a3c78'
          sha=hashlib.sha256(CORPUS.read_bytes()).hexdigest()
          if sha != EXPECTED:
              raise SystemExit(f'FAIL CLOSED: A1 hash drift {sha} != {EXPECTED}')
          blob=subprocess.check_output(['git','hash-object',str(CORPUS)],text=True).strip()
          rows=[json.loads(x) for x in CORPUS.read_text(encoding='utf-8').splitlines() if x.strip()]
          gen=json.loads((ROOT/'reading/audit/french_a1_generation_integrity.json').read_text(encoding='utf-8'))
          if gen.get('status')!='PASS' or gen.get('failures') or gen.get('legacy_unit01_exposure_variances'):
              raise SystemExit('FAIL CLOSED: prerequisite strict generation/exposure audit is not clean')

          blockers=[]; checks={}; warnings=[]
          def block(kind, details=None):
              item={'kind':kind}
              if details is not None:item['details']=details
              blockers.append(item)

          schema=json.loads((ROOT/'reading/schema/passage.schema.json').read_text(encoding='utf-8'))
          validator=Draft202012Validator(schema)
          schema_errors=[]
          for r in rows:
              for e in validator.iter_errors(r):
                  schema_errors.append({'passage_id':r.get('id'),'path':list(e.path),'message':e.message})
          checks['schema_valid_100_percent']=not schema_errors
          if schema_errors:block('schema_validation',schema_errors[:25])

          expected_ids=[f'fr-a1-u{u:02d}-p{p:02d}' for u in range(1,11) for p in range(1,7)]
          ids=[r.get('id') for r in rows]
          grid_ok=(len(rows)==60 and ids==expected_ids and [r.get('sequence') for r in rows]==list(range(1,61)) and len(set(ids))==60 and Counter(r.get('unit') for r in rows)==Counter({u:6 for u in range(1,11)}) and all(r.get('language')=='fr' and r.get('cefr')=='A1' for r in rows))
          checks['identity_sequence_level_grid']=grid_ok
          if not grid_ok:block('identity_sequence_level_grid')

          qa=[]; dup=[]; band=[]; local_target=[]; checkpoint=[]; unicode=[]; hygiene=[]
          banned=['pipeline','frontier lock','generation batch','generated by','todo','placeholder','lorem ipsum','c2 unit']
          internal_id=re.compile(r'fr-(?:rank|a1|a2|b1|b2|c1|c2)-',re.I)
          arabic_script=re.compile(r'[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff]')
          for r in rows:
              qs=r.get('questions',[]); ans=r.get('answer_key',[])
              qids=[q.get('id') for q in qs]; aids=[a.get('id') for a in ans]
              amap={a.get('id'):a for a in ans}; qmap={q.get('id'):q for q in qs}
              if len(qs)!=10 or len(ans)!=10 or len(set(qids))!=10 or len(set(aids))!=10:
                  qa.append({'passage_id':r['id'],'kind':'cardinality_or_duplicate_id'})
              for q in qs:
                  a=amap.get(q.get('answer_id'))
                  if not a or a.get('question_id')!=q.get('id'):
                      qa.append({'passage_id':r['id'],'question_id':q.get('id'),'kind':'forward_link'})
              for a in ans:
                  q=qmap.get(a.get('question_id'))
                  if not q or q.get('answer_id')!=a.get('id'):
                      qa.append({'passage_id':r['id'],'answer_id':a.get('id'),'kind':'back_link'})
              prompts=[unicodedata.normalize('NFC',q.get('prompt','')).strip().casefold() for q in qs]
              dup.extend({'passage_id':r['id'],'prompt':p} for p,c in Counter(prompts).items() if p and c>1)
              wc=len(r.get('text','').split())
              if r.get('word_count')!=wc or not 90<=wc<=140:
                  band.append({'passage_id':r['id'],'stored':r.get('word_count'),'actual':wc})
              declared={item.get('id') for field in ('new_lexical_targets','review_lexical_targets','grammar_targets','discourse_targets') for item in r.get(field,[]) if isinstance(item,dict)}
              for q in qs:
                  for tid in q.get('target_ids',[]):
                      if tid not in declared:local_target.append({'passage_id':r['id'],'question_id':q['id'],'target_id':tid})
              if r['id'].endswith('-p06') and r.get('new_lexical_targets'):
                  checkpoint.append(r['id'])
              learner=[r.get('title',''),r.get('text','')]+[q.get('prompt','') for q in qs]+[a.get('answer','') for a in ans]+[a.get('explanation','') for a in ans]
              for s in learner:
                  if s != unicodedata.normalize('NFC',s):unicode.append({'passage_id':r['id'],'kind':'non_nfc'})
                  if any(ord(ch)<32 and ch not in '\n\t\r' for ch in s):unicode.append({'passage_id':r['id'],'kind':'control_character'})
                  if s.count('«')!=s.count('»'):unicode.append({'passage_id':r['id'],'kind':'unbalanced_guillemets','sample':s[:120]})
                  if s.count('(')!=s.count(')'):unicode.append({'passage_id':r['id'],'kind':'unbalanced_parentheses','sample':s[:120]})
                  low=unicodedata.normalize('NFKC',s).casefold()
                  if any(x in low for x in banned):hygiene.append({'passage_id':r['id'],'kind':'workflow_or_placeholder_language','sample':s[:120]})
                  if internal_id.search(s):hygiene.append({'passage_id':r['id'],'kind':'internal_id','sample':s[:120]})
                  if arabic_script.search(s):hygiene.append({'passage_id':r['id'],'kind':'unintended_non_french_script','sample':s[:120]})
          checks['question_answer_one_to_one']=not qa
          checks['duplicate_prompts_within_passage_zero']=not dup
          checks['word_band_and_stored_counts']=not band
          checks['assessment_targets_locally_declared']=not local_target
          checks['checkpoint_p06_zero_new']=not checkpoint
          checks['unicode_punctuation_sanity']=not unicode
          checks['learner_facing_hygiene']=not hygiene
          for kind,arr in [('question_answer_integrity',qa),('duplicate_prompt',dup),('word_band',band),('local_target',local_target),('checkpoint_zero_new',checkpoint),('unicode_punctuation',unicode),('learner_hygiene',hygiene)]:
              if arr:block(kind,arr[:25] if isinstance(arr,list) else arr)

          source_paths=['french_top1000.csv','french_top3000.csv','reading/lexicons/french.jsonl','reading/lexicons/french_a1_support.json']
          changed=subprocess.run(['git','diff','--name-only','origin/main...HEAD','--',*source_paths],text=True,capture_output=True,check=True).stdout.strip().splitlines()
          checks['source_lexicons_unchanged_from_main']=not changed
          if changed:block('source_lexicon_changed',changed)
          source_hashes={p:hashlib.sha256((ROOT/p).read_bytes()).hexdigest() for p in source_paths}

          stanza.download('fr',processors='tokenize,pos,lemma',verbose=False)
          nlp=stanza.Pipeline('fr',processors='tokenize,pos,lemma',use_gpu=False,verbose=False)
          def norm(s):
              return re.sub(r"^[^\w]+|[^\w]+$",'',unicodedata.normalize('NFC',str(s or '')).replace('’',"'").casefold(),flags=re.UNICODE)
          introduced={}; stage_high={}; stage_order={'R1':1,'R2':2,'R3':3,'R4':4,'R5':5,'long_term':6}; visibility=[]; chronology=[]; review_checks=0
          for r in rows:
              doc=nlp(r['text'])
              toks={(norm(w.text),norm(w.lemma)) for sent in doc.sentences for w in sent.words}
              all_fields='\n'.join([r.get('text','')]+[q.get('prompt','') for q in r.get('questions',[])]+[a.get('answer','') for a in r.get('answer_key',[])])
              qtargets={tid for q in r.get('questions',[]) for tid in q.get('target_ids',[])}
              for rv in r.get('review_lexical_targets',[]):
                  review_checks+=1; tid=rv.get('id'); rep=rv.get('representation'); form=norm(rv.get('form'))
                  intro=introduced.get(tid)
                  if intro is None or intro['sequence']>=r['sequence']:
                      chronology.append({'passage_id':r['id'],'target_id':tid,'kind':'review_before_introduction'})
                      continue
                  cur=stage_order.get(rv.get('review_stage'),0); prior=stage_high.get(tid,0)
                  if cur<prior:chronology.append({'passage_id':r['id'],'target_id':tid,'kind':'stage_regression','prior':prior,'current':cur})
                  stage_high[tid]=max(prior,cur)
                  keys={form,norm(intro.get('form')),norm(intro.get('lemma'))}-{''}
                  running=any(surface in keys or lemma in keys for surface,lemma in toks)
                  exact=any(re.search(r'(?<!\w)'+re.escape(k)+r'(?!\w)',unicodedata.normalize('NFC',all_fields).casefold(),flags=re.UNICODE) for k in keys)
                  linked=tid in qtargets
                  visible=running if rep=='running_text' else (running or exact or linked)
                  if not visible:visibility.append({'passage_id':r['id'],'target_id':tid,'form':rv.get('form'),'representation':rep,'keys':sorted(keys)})
              for t in r.get('new_lexical_targets',[]):
                  introduced[t.get('id')]={'sequence':r['sequence'],'form':t.get('form'),'lemma':t.get('lemma')}
          checks['review_target_visibility_100_percent']=not visibility
          checks['review_target_chronology_and_stage_monotonicity']=not chronology
          if visibility:block('review_target_visibility',visibility[:30])
          if chronology:block('review_target_chronology',chronology[:30])

          checks['strict_source_rank_exposure_integrity']=True
          checks['future_target_leakage_rule']='NOT_APPLICABLE_NO_FRENCH_A1_PROHIBITION_RECORDED'
          warnings.append({'kind':'future_target_leakage','hard_rule_applicable':False,'reason':'The protocol says to block future-target leakage where prohibited; no French A1 repository policy prohibiting incidental pre-exposure was identified.'})

          evidence={
              'schema_version':1,'date':'2026-08-22','language':'fr','level':'A1',
              'audit':'formal_protocol_gate_a_current_corpus',
              'protocol':'reading/planning/EDUCATOR_RELEASE_VERIFICATION_PROTOCOL.md §3',
              'status':'PASS_DETERMINISTIC_FORMAL_GATE_A_NEEDS_LATER_RELEASE_GATES' if not blockers else 'FAIL_DETERMINISTIC_FORMAL_GATE_A',
              'bound_sha256':sha,'bound_git_blob':blob,
              'scope':{'passages':len(rows),'questions':sum(len(r.get('questions',[])) for r in rows),'answers':sum(len(r.get('answer_key',[])) for r in rows),'review_target_checks':review_checks},
              'checks':checks,'blocker_count':len(blockers),'blockers':blockers,'warnings':warnings,
              'source_lexicon_sha256':source_hashes,
              'independent_review':{'semantic_accuracy':'PENDING','french_naturalness_orthography':'PENDING','pedagogical_a1_fit':'PENDING','assessment_answer_grounding':'PENDING','independent_machine_tools':'PENDING','independent_model_family':'PENDING','native_professional':'PENDING','educator_release':'PENDING','blind_review':'PENDING'},
              'release_effect':'NONE_AUTOMATIC: Gate A is deterministic integrity only. French remains REOPEN_REQUIRED until mandatory later gates are completed against the same then-current hashes.'
          }
          out=ROOT/'reading/audit/french_a1_formal_gate_a_2026-08-22.json'
          out.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':evidence['status'],'sha256':sha,'blockers':len(blockers),'review_checks':review_checks},ensure_ascii=False))
          if blockers:raise SystemExit(1)
          PY
      - name: Commit Gate A evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_a1_formal_gate_a_2026-08-22.json reading/audit/french_a1_generation_integrity.json
          if git diff --cached --quiet; then
            echo 'No evidence changes.'
            exit 0
          fi
          git commit -m 'Run French A1 formal deterministic Gate A [skip ci]'
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
