name: LANG-WB reviewer bundles

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Reviewer bundle to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arabic
          - french
          - urdu
  push:
    paths:
      - '.github/workflows/language-workbook-reviewer-bundles.yml'
      - 'scripts/build_lang_wb_reviewer_bundle.py'

permissions:
  contents: read

jobs:
  build-reviewer-bundles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build requested reviewer bundle ZIPs
        shell: bash
        env:
          REQUESTED_LANGUAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.language || 'all' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lang-wb-reviewer-bundles"
          rm -rf "$out"
          mkdir -p "$out"

          if [ "$REQUESTED_LANGUAGE" = all ]; then
            languages='arabic french urdu'
          else
            languages="$REQUESTED_LANGUAGE"
          fi

          for lang in $languages; do
            python scripts/build_lang_wb_reviewer_bundle.py "$lang" --output-root "$out"
            test -s "$out/${lang}_lang_wb_v1.0_reviewer_bundle.zip"
          done

          printf 'Built reviewer package(s) at commit %s\n' "$GITHUB_SHA"
          ls -lh "$out"/*.zip

      - name: Upload reviewer bundle ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: lang-wb-reviewer-bundles-${{ github.sha }}
          path: ${{ runner.temp }}/lang-wb-reviewer-bundles/*.zip
          if-no-files-found: error
          retention-days: 14
