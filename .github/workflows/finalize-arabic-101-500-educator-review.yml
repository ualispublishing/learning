name: Finalize Arabic 101-500 educator review
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/finalize_arabic_101_500_educator_review.py'
      - '.github/workflows/finalize-arabic-101-500-educator-review.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/finalize_arabic_101_500_educator_review.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add audit/arabic_101_500_educator_review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize Arabic 101-500 educator review'
          git pull --rebase origin main
          git push origin HEAD:main
