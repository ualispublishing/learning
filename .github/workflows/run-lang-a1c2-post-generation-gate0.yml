name: LANG-A1C2 Post-generation Gate 0

on:
  push:
    paths:
      - '.github/workflows/run-lang-a1c2-post-generation-gate0.yml'
      - 'reading/tools/run_post_generation_gate0.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hash-bound Gate 0 audit
        run: python reading/tools/run_post_generation_gate0.py
      - name: Mark Gate 0 verification queue complete
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('reading/VERIFICATION_TASKS.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('Updated: 2026-08-23', 'Updated: 2026-08-30', 1)
          items = [
              '`PROJECT_TRACKS.json` routes the session to `LANG-A1C2` and excludes the workbook roots.',
              '`reading/STATE_MANIFEST.json` matches the exact tracked live-state bytes and aggregate SHA-256.',
              '`python reading/tools/validate_continuation_state.py` passes against the routed state bundle and live canonical files.',
              'Stored production totals equal canonical JSONL counts.',
              'Active frontier in `CONTINUATION.json`, `STATUS.json`, and `ACTIVE_GENERATION_PLAN.json` agrees.',
              'Cached release summary in `CONTINUATION.json` agrees with `RELEASE_STATUS.json`.',
              'Pinned Urdu A1 blob still matches the canonical file before relying on its final integrity audit.',
          ]
          for item in items:
              old = f'- [ ] {item}'
              new = f'- [x] {item}'
              if old not in text and new not in text:
                  raise SystemExit(f'Missing Gate 0 checklist item: {item}')
              text = text.replace(old, new, 1)
          marker = '- [ ] A zero-step/skipped CI run is never treated as verification success.'
          note = '\n\nFresh Gate 0 evidence: `reading/audit/post_generation_gate0_2026-08-30.json` (exact 1,080-passage corpus; release claim false).'
          if note.strip() not in text:
              if marker not in text:
                  raise SystemExit('Gate 0 marker missing')
              text = text.replace(marker, marker + note, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Refresh state manifest and revalidate
        run: |
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py
      - name: Commit Gate 0 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/post_generation_gate0_2026-08-30.json \
                  reading/VERIFICATION_TASKS.md \
                  reading/STATE_MANIFEST.json
          if git diff --cached --quiet; then
            echo 'No Gate 0 changes required.'
            exit 0
          fi
          git commit -m 'Record post-generation LANG-A1C2 Gate 0 pass'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
