name: Restore language workbook curation baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-language-workbook-curation-baseline.yml'

permissions:
  contents: write

concurrency:
  group: restore-language-workbook-curation-baseline
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good source-locked curation ledgers
        shell: bash
        run: |
          set -euo pipefail
          baseline='d0d2be7ecf4ec4927eaad79d1bfc1f236da81d96'
          files=(
            'curation/language-workbooks/v1.0/arabic_sentence_row_decisions.json'
            'curation/language-workbooks/v1.0/french_sentence_row_decisions.json'
            'curation/language-workbooks/v1.0/urdu_sentence_row_decisions.json'
            'curation/language-workbooks/v1.0/sentence_row_decision_summary.json'
          )
          git cat-file -e "${baseline}^{commit}"
          for file in "${files[@]}"; do
            git show "${baseline}:${file}" > "${file}"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo 'Curation ledgers already match the known-good baseline.'
            exit 0
          fi
          git commit -m 'Restore source-locked language workbook curation baseline'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo 'Could not publish restored curation baseline after retries.'
          exit 1

# The baseline is the last known-good curation state immediately before an overly broad
# downstream-audit trigger recompiled the historical decision ledgers on 2026-08-29.
