name: Recalibrate final Arabic A2 Units04-08 Pass07
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/recalibrate_final_arabic_a2_units04_08_pass07.py'
      - '.github/workflows/recalibrate-final-arabic-a2-units04-08-pass07.yml'
permissions:
  contents: write
jobs:
  recalibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded final A2 remediation
        run: python reading/tools/recalibrate_final_arabic_a2_units04_08_pass07.py
      - name: Refresh Pass 07 against remediated corpus
        run: python reading/tools/final_audit_arabic_pass07_cefr_difficulty_calibration.py
      - name: Validate complete A2 and zero actionable Pass07 backlog
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/arabic/a2/passages.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==60 and len({r['id'] for r in rows})==60
          for r in rows:
              actual=len(re.findall(r'\S+',str(r.get('text',''))))
              assert actual==int(r.get('word_count',0)), (r['id'],actual,r.get('word_count'))
              assert 140 <= r['word_count'] <= 220, (r['id'],r['word_count'])
          p06=[r for r in rows if r['id']=='ar-a2-u04-p06'][0]
          assert p06['new_lexical_targets']==[]
          assert p06['speed_training']['new_word_policy']=='none'
          audit=json.loads(Path('reading/audit/final_arabic_pass07_cefr_difficulty_calibration.json').read_text(encoding='utf-8'))
          assert audit['coverage_metric']['missing_value_semantics']=='UNMEASURED_NOT_FAILURE'
          assert audit['coverage_metric']['measured_passages']==0
          assert audit['coverage_metric']['unmeasured_passages']==360
          for level in ('a1','a2','b1','b2','c1','c2'):
              assert audit['levels'][level]['flagged_passages']==0, (level,audit['levels'][level])
          assert audit['totals']['review_flags']==0, audit['totals']
          assert audit['status']=='PASS', audit['status']
          assert audit['cross_level']['mean_word_count_non_decreasing'] is True
          print({'a2_min':min(r['word_count'] for r in rows),'a2_max':max(r['word_count'] for r in rows),'a2_mean':audit['levels']['a2']['word_count_mean'],'review_flags':0,'coverage_unmeasured':360,'status':audit['status']})
          PY
      - name: Commit canonical corpus and refreshed audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a2/passages.jsonl reading/audit/final_arabic_pass07_cefr_difficulty_calibration.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete Arabic A2 Pass07 length remediation [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
