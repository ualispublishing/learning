name: Audit Arabic phrase bank deeply

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_arabic_phrase_bank.py'
      - '.github/workflows/audit-arabic-phrase-bank.yml'
      - 'audit/run_phrase_bank_deep_audit.request'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Arabic morphology tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install camel-tools
          ok=0
          for attempt in 1 2 3 4 5; do
            if camel_data -i morphology-db-msa-r13; then ok=1; break; fi
            echo "CAMeL data download attempt $attempt/5 failed"
            sleep $((attempt * 4))
          done
          test "$ok" = 1
      - name: Audit all phrase-bank rows
        run: python scripts/audit_arabic_phrase_bank.py
      - name: Commit audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/arabic_phrase_bank_audit.csv audit/arabic_phrase_bank_review_queue.csv audit/arabic_phrase_bank_audit_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit Arabic phrase bank deeply [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
