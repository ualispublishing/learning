name: Install audited SecurityX CAS-005 v4.1

on:
  push:
    branches: [securityx-pages-clean-final]
    paths:
      - '.securityx-pages/site-tarxz/**'
      - '.github/workflows/securityx-install.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: securityx-pages-clean-final
          fetch-depth: 0

      - name: Reconstruct and verify audited archive
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .securityx-pages/site-tarxz -maxdepth 1 -type f -name 'part-*.txt' | wc -l | tr -d ' ')
          test "$count" = "22"

          : > /tmp/securityx.b64
          for n in $(seq 0 21); do
            i=$(printf '%03d' "$n")
            f=".securityx-pages/site-tarxz/part-$i.txt"
            test -f "$f"
            if [ "$i" = "009" ]; then
              head -c 12000 "$f" >> /tmp/securityx.b64
            elif [ "$i" = "014" ]; then
              test "$(wc -c < .securityx-pages/site-tarxz/fix-014-a.txt | tr -d ' ')" = "6000"
              test "$(wc -c < .securityx-pages/site-tarxz/fix-014-b.txt | tr -d ' ')" = "6000"
              cat .securityx-pages/site-tarxz/fix-014-a.txt .securityx-pages/site-tarxz/fix-014-b.txt >> /tmp/securityx.b64
            else
              cat "$f" >> /tmp/securityx.b64
            fi
          done

          test "$(wc -c < /tmp/securityx.b64 | tr -d ' ')" = "263080"
          base64 -d /tmp/securityx.b64 > /tmp/securityx.tar.xz
          echo '55ae0aed8973791b9d2847c0559b8f5cc863c5fbb3aa50e3e47e001f641618fa  /tmp/securityx.tar.xz' | sha256sum -c -

          rm -rf /tmp/securityx-expanded
          mkdir -p /tmp/securityx-expanded
          tar -xJf /tmp/securityx.tar.xz -C /tmp/securityx-expanded
          src=/tmp/securityx-expanded/SecurityX_CAS005_GitHub_Pages_v4_1
          test -f "$src/index.html"
          test -f "$src/data/final_audit.json"
          test -f "$src/data/quality_audit_v4_1.json"

          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('/tmp/securityx-expanded/SecurityX_CAS005_GitHub_Pages_v4_1')
          manifest = json.loads((root / 'MANIFEST.json').read_text())
          for item in manifest:
              p = root / item['path']
              assert p.is_file(), f"missing manifest file: {item['path']}"
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              assert h == item['sha256'], f"hash mismatch: {item['path']}"
              assert p.stat().st_size == item['bytes'], f"size mismatch: {item['path']}"

          a = json.loads((root / 'data/final_audit.json').read_text())
          assert a['cards'] == 1156
          assert a['eight_layers_per_card'] == 1156
          assert a['published_blueprint_topics_checked'] == 618
          assert a['published_blueprint_topics_mapped'] == 618
          assert a['objective_sections'] == 23
          assert a['practice_questions'] == 100
          assert a['practice_domain_distribution'] == {
              'Governance, Risk, and Compliance': 20,
              'Security Architecture': 27,
              'Security Engineering': 31,
              'Security Operations': 22,
          }
          assert sorted(a['practice_answer_letter_distribution'].values()) == [25, 25, 25, 25]
          assert a['pbq_drills'] == 12
          assert a['sources'] == 42
          assert a['prerequisite_cycles'] == 0
          assert a['duplicate_fronts'] == 0
          assert a['duplicate_direct_answers'] == 0
          assert a['structural_issues'] == []
          assert a['browser_study_behavior']['retrieval_gate'] is True
          assert a['browser_study_behavior']['eight_layer_reveal'] is True
          assert a['browser_study_behavior']['local_spaced_review'] is True

          q = json.loads((root / 'data/quality_audit_v4_1.json').read_text())
          assert q['cards'] == 1156
          assert q['eight_layer_cards'] == 1156
          assert q['blueprint_examples'] == 618
          assert q['blueprint_examples_mapped'] == 618
          assert q['prerequisite_graph']['invalid_refs'] == 0
          assert q['prerequisite_graph']['cycles'] == 0
          assert q['deterministic_issues'] == []
          print('SecurityX archive, manifest, and audit assertions passed.')
          PY

          node --check "$src/app.js"
          for f in "$src"/data/cards-*.js "$src"/data/meta.js; do node --check "$f"; done

      - name: Install canonical study site
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/securityx-expanded/SecurityX_CAS005_GitHub_Pages_v4_1
          dst=subjects/securityx/cas-005/study-site
          rm -rf "$dst"
          mkdir -p "$dst"
          cp -a "$src"/. "$dst"/
          rm -rf .securityx-pages

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install audited SecurityX CAS-005 v4.1 study site'
          git push origin HEAD:securityx-pages-clean-final
