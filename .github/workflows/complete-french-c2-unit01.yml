# Triggered after sealed C1 generation-integrity PASS.
name: Complete French C2 Unit 01
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/select_french_c2_unit01_targets.py'
      - 'reading/tools/generate_french_c2_unit01.py'
      - 'reading/tools/generate_french_c2_unit01_retry.py'
      - 'reading/tools/audit_french_c2_unit01_calibration.py'
      - 'reading/tools/lock_french_c2_unit01_frontier.py'
      - 'reading/tools/complete_french_c2_unit01.py'
      - 'reading/tools/resolve_french_c2_unit_plan.py'
      - 'reading/tools/probe_french_c2_unit_targets.py'
      - 'reading/tools/sync_french_c2_unit_frontier.py'
      - '.github/workflows/complete-french-c2-unit01.yml'
concurrency:
  group: french-c2-canonical-writer
  cancel-in-progress: false
permissions: {contents: write}
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Run C2 Unit01 calibration transaction
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python reading/tools/complete_french_c2_unit01.py 2>&1 | tee /tmp/c2u01.log
      - name: Preserve failure log
        if: steps.run.outcome != 'success'
        run: mkdir -p reading/audit && cp /tmp/c2u01.log reading/audit/french_c2_unit01_workflow_failure.txt || true
      - name: Commit validated C2 calibration progress
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/c2/passages.jsonl reading/audit reading/STATUS.json reading/TASKS.md reading/AGENT_HANDOFF.md
          git diff --cached --quiet && exit 0
          git commit -m 'Complete guarded French C2 Unit 01 calibration [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
      - name: Fail if C2 calibration did not seal
        if: steps.run.outcome != 'success'
        run: exit 1
