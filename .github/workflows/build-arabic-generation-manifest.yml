name: Build Arabic generation manifest
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/arabic/**/passages.jsonl'
      - 'reading/tools/build_arabic_generation_manifest.py'
      - '.github/workflows/build-arabic-generation-manifest.yml'
permissions:
  contents: write
concurrency:
  group: arabic-generation-manifest
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/build_arabic_generation_manifest.py
      - name: Commit structural manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/manifests/arabic_generation_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Arabic generation manifest [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
