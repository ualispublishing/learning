name: Probe established LANG-A1C2 workflow execution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-language-a1c2-week-ready.yml'

permissions:
  contents: write

concurrency:
  group: lang-a1c2-execution-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record probe
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p reading/audit
          printf 'LANG-A1C2 workflow execution probe passed.\n' > reading/audit/urdu_a2_u02_runner_probe_2026-08-24.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/urdu_a2_u02_runner_probe_2026-08-24.txt
          git commit -m 'Record LANG-A1C2 Unit 2 runner probe [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          git push origin HEAD:main
