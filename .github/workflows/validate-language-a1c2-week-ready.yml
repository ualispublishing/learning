name: Diagnose and complete Urdu A2 Unit 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-language-a1c2-week-ready.yml'

permissions:
  contents: write

concurrency:
  group: lang-a1c2-unit02-debug-runner
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Recover pinned reviewed transaction
        shell: bash
        run: |
          set -euo pipefail
          PIN='a4e1149f2e0964595f1ceb359b18b791b3eeca91'
          SRC='.github/workflows/apply-language-a1c2-urdu-a2-unit02.yml'
          git show "${PIN}:${SRC}" > /tmp/original-unit02.yml
          python - <<'PY'
          import pathlib, re, textwrap
          src = pathlib.Path('/tmp/original-unit02.yml').read_text(encoding='utf-8')
          packet = re.search(r'PACKET_B64_GZ: "([^"]+)"', src)
          marker = "          python - <<'PY'\n"
          if not packet or marker not in src:
              raise SystemExit('Pinned Unit 2 payload/script recovery failed.')
          body = src.split(marker, 1)[1].split("\n          PY", 1)[0]
          pathlib.Path('/tmp/packet.txt').write_text(packet.group(1), encoding='utf-8')
          pathlib.Path('/tmp/apply-unit02.py').write_text(textwrap.dedent(body), encoding='utf-8')
          PY

      - name: Apply and validate with captured diagnostics
        id: transaction
        continue-on-error: true
        shell: bash
        run: |
          set +e
          export PACKET_B64_GZ="$(cat /tmp/packet.txt)"
          {
            echo '=== apply pinned Unit 2 ==='
            python /tmp/apply-unit02.py
            APPLY_RC=$?
            echo "apply_rc=${APPLY_RC}"
            if [ "$APPLY_RC" -ne 0 ]; then exit "$APPLY_RC"; fi
            echo '=== derive active plan ==='
            python reading/tools/extract_active_generation_plan.py
            DERIVE_RC=$?
            echo "derive_rc=${DERIVE_RC}"
            if [ "$DERIVE_RC" -ne 0 ]; then exit "$DERIVE_RC"; fi
            echo '=== refresh manifest ==='
            python reading/tools/refresh_state_manifest.py
            REFRESH_RC=$?
            echo "refresh_rc=${REFRESH_RC}"
            if [ "$REFRESH_RC" -ne 0 ]; then exit "$REFRESH_RC"; fi
            echo '=== validate continuation ==='
            python reading/tools/validate_continuation_state.py
            VALIDATE_RC=$?
            echo "validate_rc=${VALIDATE_RC}"
            exit "$VALIDATE_RC"
          } > /tmp/unit02-transaction.log 2>&1
          RC=$?
          cat /tmp/unit02-transaction.log
          exit "$RC"

      - name: Persist exact failure log
        if: steps.transaction.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(cat /tmp/unit02-transaction.log)"
          git reset --hard HEAD
          mkdir -p reading/audit
          {
            echo 'LANG-A1C2 Urdu A2 Unit 2 transaction diagnostic'
            echo 'Date: 2026-08-24'
            echo 'Pinned staging commit: a4e1149f2e0964595f1ceb359b18b791b3eeca91'
            echo
            printf '%s\n' "$LOG"
          } > reading/audit/urdu_a2_u02_transaction_debug_2026-08-24.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/urdu_a2_u02_transaction_debug_2026-08-24.txt
          git commit -m 'Record Urdu A2 Unit 2 transaction diagnostic [skip ci]'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main

      - name: Commit successful Unit 2 transaction
        if: steps.transaction.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BASE_HEAD="$(git rev-parse HEAD)"
          git add reading/urdu/a2/passages.jsonl \
            reading/audit/urdu_a2_u02_lexical_sense_check_2026-08-24.json \
            reading/audit/urdu_a2_u02_quality_pass_2026-08-24.json \
            reading/STATUS.json reading/CONTINUATION.json reading/TASKS.md \
            reading/AGENT_HANDOFF_V2.md reading/planning/ACTIVE_GENERATION_PLAN.json \
            reading/STATE_MANIFEST.json
          git commit -m 'Complete Urdu A2 Unit 2 and advance to Unit 3 [skip ci]'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_HEAD" ]; then
            CHANGED="$(git diff --name-only "$BASE_HEAD"..origin/main || true)"
            printf '%s\n' "$CHANGED"
            if printf '%s\n' "$CHANGED" | grep -Eq '^(reading/urdu/a2/passages\.jsonl|reading/STATUS\.json|reading/CONTINUATION\.json|reading/TASKS\.md|reading/AGENT_HANDOFF_V2\.md|reading/planning/ACTIVE_GENERATION_PLAN\.json|reading/STATE_MANIFEST\.json)$'; then
              echo 'Critical LANG-A1C2 state changed concurrently; refusing to overwrite it.'
              exit 1
            fi
            git rebase origin/main
            python reading/tools/extract_active_generation_plan.py
            python reading/tools/refresh_state_manifest.py
            python reading/tools/validate_continuation_state.py
            git add reading/planning/ACTIVE_GENERATION_PLAN.json reading/STATE_MANIFEST.json
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
