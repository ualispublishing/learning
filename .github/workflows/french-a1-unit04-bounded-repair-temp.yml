name: TEMP French A1 Unit 04 bounded repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/french-a1-unit04-bounded-repair-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-french-a1-unit04-bounded-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'repair/french-a1-review-integrity-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact Unit 04 repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('reading/french/a1/passages.jsonl')
          before=hashlib.sha256(p.read_bytes()).hexdigest()
          want='769bb4867e7f3571992378dca439d455aa9fb42586fcad0c61a35e185d5a3c78'
          if before != want: raise SystemExit(f'FAIL CLOSED: A1 hash drift {before} != {want}')
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          by={r['id']:r for r in rows}

          p02=by['fr-a1-u04-p02']
          q=next(q for q in p02['questions'] if q['id']=='q9')
          a=next(a for a in p02['answer_key'] if a['question_id']=='q9')
          oldq='Complète : J’ai dix minutes de _____ avant le bus.'
          newq='Complète : J’ai assez de _____ avant le bus.'
          if (q.get('prompt'),q.get('type'),a.get('answer'),q.get('target_ids')) != (oldq,'cloze_transfer','temps',['fr-rank-0091']):
              raise SystemExit('FAIL CLOSED: u04-p02/q9 source drift')
          q['prompt']=newq

          p03=by['fr-a1-u04-p03']
          old_text=p03['text']
          replacements=[
              ('Quand la porte ouvre, tout le monde entre calmement.','Quand la porte s’ouvre, tout le monde entre calmement.'),
              ('Personne ne veut commencer sans lui.','Tout le monde veut attendre Sami.'),
              ('quand personne n’est pressé.','quand le groupe n’est pas pressé.')
          ]
          text=old_text
          for old,new in replacements:
              if text.count(old)!=1: raise SystemExit(f'FAIL CLOSED: expected one P03 span: {old}')
              text=text.replace(old,new,1)
          target=next(t for t in p03['new_lexical_targets'] if t.get('id')=='fr-rank-0108')
          if target.get('form')!='personne' or target.get('intended_sense')!='person' or target.get('exposures_in_text')!=4:
              raise SystemExit('FAIL CLOSED: personne target metadata drift')
          target['exposures_in_text']=2
          p03['text']=text
          p03['word_count']=len(text.split())
          if not 90 <= p03['word_count'] <= 140: raise SystemExit('FAIL CLOSED: repaired P03 outside A1 word band')
          if text.count('personne') + text.count('Personne') != 2:
              raise SystemExit('FAIL CLOSED: expected exactly two personne noun-sense surfaces after repair')
          if 'Personne ne' in text or 'personne n’' in text or 'personne n\'' in text:
              raise SystemExit('FAIL CLOSED: negative-pronoun personne remains')

          p.write_text('\n'.join(json.dumps(r,ensure_ascii=False,sort_keys=True) for r in rows)+'\n',encoding='utf-8')
          after=hashlib.sha256(p.read_bytes()).hexdigest()
          evidence={
            'schema_version':1,'date':'2026-08-22','language':'fr','level':'A1','unit':4,
            'status':'BOUNDED_REPAIR_APPLIED_NEEDS_DETERMINISTIC_RERUN',
            'before_sha256':before,'after_sha256':after,
            'confirmed_repair_count':3,
            'repairs':[
              {'passage_id':'fr-a1-u04-p02','question_id':'q9','kind':'unnatural_cloze_output','before_prompt':oldq,'after_prompt':newq,'answer_unchanged':'temps','target_ids_unchanged':['fr-rank-0091']},
              {'passage_id':'fr-a1-u04-p03','field':'text','kind':'grammar_syntax','before':'Quand la porte ouvre, tout le monde entre calmement.','after':'Quand la porte s’ouvre, tout le monde entre calmement.'},
              {'passage_id':'fr-a1-u04-p03','field':'text/new_lexical_targets','target_id':'fr-rank-0108','kind':'target_sense_contamination_and_exposure_mismatch','before_spans':['Personne ne veut commencer sans lui.','quand personne n’est pressé.'],'after_spans':['Tout le monde veut attendre Sami.','quand le groupe n’est pas pressé.'],'before_exposures_in_text':4,'after_exposures_in_text':2,'intended_sense_unchanged':'person'}
            ],
            'answers_changed':False,'target_ids_changed':False,'target_lemma_changed':False,'target_sense_changed':False,
            'passage_text_changed':True,
            'release_effect':'NONE_AUTOMATIC: French remains REOPEN_REQUIRED; independent semantic/native/pedagogical/educator review remains pending.'
          }
          Path('reading/audit/french_a1_unit04_bounded_repair_2026-08-22.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'before':before,'after':after,'p03_word_count':p03['word_count']},ensure_ascii=False))
          PY
      - name: Rerun strict French A1 integrity
        shell: bash
        run: |
          set -euo pipefail
          python reading/tools/audit_french_a1_generation_integrity.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('reading/french/a1/passages.jsonl'); sha=hashlib.sha256(p.read_bytes()).hexdigest()
          audit=json.loads(Path('reading/audit/french_a1_generation_integrity.json').read_text(encoding='utf-8'))
          if audit.get('status')!='PASS' or audit.get('failures') or audit.get('legacy_unit01_exposure_variances'):
              raise SystemExit(f'FAIL CLOSED: generation integrity failed: {audit.get("failures")}')
          evp=Path('reading/audit/french_a1_unit04_bounded_repair_2026-08-22.json');ev=json.loads(evp.read_text(encoding='utf-8'))
          if sha!=ev['after_sha256']:raise SystemExit('FAIL CLOSED: evidence hash mismatch')
          ev['status']='PASS_DETERMINISTIC_FRENCH_A1_UNIT04_BOUNDED_REPAIR_NEEDS_INDEPENDENT_REVIEW'
          ev['bound_sha256']=sha;ev['generation_integrity_status']='PASS'
          evp.write_text(json.dumps(ev,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':ev['status'],'bound_sha256':sha},ensure_ascii=False))
          PY
      - name: Commit durable repair outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a1/passages.jsonl reading/audit/french_a1_generation_integrity.json reading/audit/french_a1_unit04_bounded_repair_2026-08-22.json
          git commit -m 'Repair French A1 Unit 04 semantic defects [skip ci]'
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
