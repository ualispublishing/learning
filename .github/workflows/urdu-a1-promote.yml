name: Urdu A1 guarded promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/urdu-a1-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair calibration and promote Unit 02
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          ROOT = Path('.')
          CANON = ROOT / 'reading/urdu/a1/passages.jsonl'
          STAGING = ROOT / 'reading/urdu/a1/staging/unit02'
          PLAN = ROOT / 'reading/audit/urdu_a1_unit02_generation_plan.json'
          STATUS = ROOT / 'reading/STATUS.json'
          HANDOFF = ROOT / 'reading/AGENT_HANDOFF.md'
          TASKS = ROOT / 'reading/TASKS.md'
          EXPECTED_BEFORE_BLOB = '7899fc1dd857625e5c3419a31bc116dbfa658de5'
          TODAY = '2026-08-19'

          def git_blob_sha(data: bytes) -> str:
              header = f'blob {len(data)}\0'.encode('utf-8')
              return hashlib.sha1(header + data).hexdigest()

          def exact_count(text: str, form: str) -> int:
              return len(re.findall(rf'(?<!\w){re.escape(form)}(?!\w)', text))

          def validate_record(r, expected_sequence=None):
              required = {
                  'id','language','cefr','unit','sequence','revision','title','passage_type','genre',
                  'domains','topics','text','word_count','sentence_count','estimated_known_token_coverage',
                  'new_lexical_targets','review_lexical_targets','grammar_targets','discourse_targets',
                  'questions','answer_key','speed_training','quality'
              }
              missing = sorted(required - set(r))
              assert not missing, (r.get('id'), 'missing', missing)
              assert r['language'] == 'ur' and r['cefr'] == 'A1'
              if expected_sequence is not None:
                  assert r['sequence'] == expected_sequence, (r['id'], r['sequence'], expected_sequence)
              assert r['word_count'] == len(r['text'].split()), (r['id'], 'word_count')
              assert 90 <= r['word_count'] <= 140, (r['id'], 'A1 word band', r['word_count'])
              assert len(r['questions']) == 10 and len(r['answer_key']) == 10, (r['id'], '10Q10A')
              qids = {q['id'] for q in r['questions']}
              aids = {a['id'] for a in r['answer_key']}
              assert len(qids) == 10 and len(aids) == 10
              assert all(q['answer_id'] in aids for q in r['questions'])
              assert all(a['question_id'] in qids for a in r['answer_key'])
              local_targets = {t['id'] for t in r['new_lexical_targets']} | {t['id'] for t in r['review_lexical_targets']}
              for q in r['questions']:
                  for target_id in q.get('target_ids', []):
                      assert target_id in local_targets, (r['id'], 'nonlocal question target', target_id)
              for t in r['new_lexical_targets']:
                  actual = exact_count(r['text'], t['form'])
                  assert actual >= 1, (r['id'], 'new target absent', t['form'])
                  assert t['exposures_in_text'] == actual, (r['id'], 'exposure mismatch', t['form'], t['exposures_in_text'], actual)
              for t in r['review_lexical_targets']:
                  if t.get('representation') == 'running_text':
                      assert exact_count(r['text'], t['form']) >= 1, (r['id'], 'running_text review absent', t['form'])
              if r['sequence'] % 6 == 0:
                  assert len(r['new_lexical_targets']) == 0, (r['id'], 'checkpoint new targets')

          before_bytes = CANON.read_bytes()
          before_blob = git_blob_sha(before_bytes)
          assert before_blob == EXPECTED_BEFORE_BLOB, ('canonical Urdu blob changed; refusing promotion', before_blob)
          existing = [json.loads(line) for line in before_bytes.decode('utf-8').splitlines() if line.strip()]
          assert len(existing) == 6
          assert [r['sequence'] for r in existing] == [1,2,3,4,5,6]

          removed_reviews = []
          exposure_repairs = []
          for r in existing:
              for t in r['new_lexical_targets']:
                  actual = exact_count(r['text'], t['form'])
                  assert actual >= 1
                  if t.get('exposures_in_text') != actual:
                      exposure_repairs.append({
                          'passage_id': r['id'], 'target_id': t['id'], 'form': t['form'],
                          'before': t.get('exposures_in_text'), 'after': actual
                      })
                      t['exposures_in_text'] = actual
              repaired_reviews = []
              for rv in r['review_lexical_targets']:
                  if rv.get('representation') == 'running_text' and exact_count(r['text'], rv['form']) == 0:
                      removed_reviews.append({
                          'passage_id': r['id'], 'target_id': rv['id'], 'form': rv['form'],
                          'review_stage': rv['review_stage'], 'reason': 'declared running_text review absent from running text'
                      })
                  else:
                      repaired_reviews.append(rv)
              r['review_lexical_targets'] = repaired_reviews
              r['revision'] = max(2, int(r.get('revision', 1)) + 1)
              q = r['quality']
              q.update({
                  'status':'calibrated','linguistic_review':'pass','pedagogical_review':'pass',
                  'coverage_check':'pass','answer_key_check':'pass','schema_check':'pass','fact_check':'not_required'
              })
              notes = list(q.get('notes') or [])
              notes.append('Current-standard Urdu A1 calibration audit completed 2026-08-19; legacy review metadata repaired without changing passage text.')
              q['notes'] = notes
              validate_record(r, r['sequence'])

          # Known defect set from the pre-promotion audit. Fail closed if the source does not match it.
          assert len(exposure_repairs) == 1, exposure_repairs
          assert exposure_repairs[0]['passage_id'] == 'ur-a1-u01-p05'
          assert exposure_repairs[0]['form'] == 'اب'
          assert exposure_repairs[0]['before'] == 7 and exposure_repairs[0]['after'] == 4
          assert len(removed_reviews) == 14, removed_reviews

          staged_paths = sorted(STAGING.glob('ur-a1-u02-p*.json'))
          assert len(staged_paths) == 6, [p.name for p in staged_paths]
          staged = []
          for expected_sequence, p in zip(range(7,13), staged_paths):
              r = json.loads(p.read_text(encoding='utf-8'))
              # Small language-quality repairs discovered during the promotion pass.
              if r['id'] == 'ur-a1-u02-p02':
                  r['questions'][8]['prompt'] = 'خالی جگہ پُر کریں: اس _____ میری کلاس صبح ہوتی ہے۔'
                  r['answer_key'][8]['explanation'] = '«اس سال» ایک برس کی مدت بتاتا ہے۔'
              elif r['id'] == 'ur-a1-u02-p03':
                  r['answer_key'][7]['answer'] = 'ایسا سوال جس کا جواب ہاں یا نہیں میں دیا جا سکتا ہے۔'
              elif r['id'] == 'ur-a1-u02-p05':
                  r['genre'] = 'routine narrative'
                  r['answer_key'][2]['answer'] = 'کسی کام کو کرنے کا امکان یا مناسب وقت۔'
                  r['answer_key'][5]['answer'] = 'کسی کام کو کرنے کا امکان یا مناسب وقت۔'
              elif r['id'] == 'ur-a1-u02-p06':
                  r['questions'][6]['prompt'] = 'خالی جگہیں پُر کریں: اس _____ منظم _____ کے لیے میں روز چارٹ دیکھتا ہوں۔'
              validate_record(r, expected_sequence)
              staged.append(r)
              p.write_text(json.dumps(r, ensure_ascii=False, separators=(',',':')) + '\n', encoding='utf-8')

          combined = existing + staged
          assert [r['sequence'] for r in combined] == list(range(1,13))
          assert len({r['id'] for r in combined}) == 12
          assert sum(len(r['questions']) for r in combined) == 120
          assert sum(len(r['answer_key']) for r in combined) == 120
          for r in combined:
              validate_record(r, r['sequence'])

          out = ''.join(json.dumps(r, ensure_ascii=False, separators=(',',':')) + '\n' for r in combined)
          CANON.write_text(out, encoding='utf-8')
          after_bytes = CANON.read_bytes()
          after_blob = git_blob_sha(after_bytes)
          after_sha256 = hashlib.sha256(after_bytes).hexdigest()

          calibration_audit = {
              'language':'ur','cefr':'A1','unit':1,'audit_date':TODAY,
              'status':'PASS_AFTER_REPAIR','pre_repair_status':'FAIL_REPAIR_REQUIRED',
              'before_canonical_blob':before_blob,'after_canonical_blob':after_blob,
              'passages':6,'questions':60,'answers':60,'word_counts':[r['word_count'] for r in existing],
              'new_target_exposure_repairs':exposure_repairs,
              'removed_invalid_running_text_reviews':removed_reviews,
              'post_repair_checks':{
                  'sequences_1_6':True,'ten_questions_each':True,'ten_answers_each':True,
                  'question_answer_linkage':True,'a1_word_band_90_140':True,
                  'question_targets_locally_declared':True,'new_target_exposure_counts_exact':True,
                  'running_text_review_visibility_exact':True,'p06_zero_new_targets':True,
                  'linguistic_review':'PASS','pedagogical_review':'PASS','answer_key_review':'PASS'
              },
              'repair_scope':'metadata plus quality-state repair only; Unit 1 passage text, questions, and answers unchanged'
          }
          (ROOT/'reading/audit/urdu_a1_calibration_current_standard_audit.json').write_text(
              json.dumps(calibration_audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          result = {
              'language':'ur','cefr':'A1','unit':2,'date':TODAY,'status':'CANONICAL_PROMOTED',
              'canonical_path':'reading/urdu/a1/passages.jsonl','canonical_blob':after_blob,
              'canonical_sha256':after_sha256,'sequences':[7,8,9,10,11,12],
              'passages':6,'questions':60,'answers':60,
              'word_counts':[r['word_count'] for r in staged],
              'new_targets':[t['form'] for r in staged for t in r['new_lexical_targets']],
              'structural_checks':{
                  'ten_questions_each':True,'ten_answers_each':True,'a1_word_band_90_140':True,
                  'question_answer_linkage':True,'question_targets_locally_declared':True,
                  'new_target_exposure_counts_exact':True,'running_text_review_visibility_exact':True,
                  'p06_zero_new_targets':True
              },
              'formal_final_audit':'deferred under generation-first policy'
          }
          (ROOT/'reading/audit/urdu_a1_unit02_generation_result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          plan = json.loads(PLAN.read_text(encoding='utf-8'))
          plan['status'] = 'CANONICAL_PROMOTED'
          plan['promotion_date'] = TODAY
          plan['canonical_path'] = 'reading/urdu/a1/passages.jsonl'
          plan['canonical_blob_after_promotion'] = after_blob
          plan['canonical_sequences'] = [7,8,9,10,11,12]
          plan['generation_result'] = 'reading/audit/urdu_a1_unit02_generation_result.json'
          plan['calibration_audit'] = 'reading/audit/urdu_a1_calibration_current_standard_audit.json'
          PLAN.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          status = json.loads(STATUS.read_text(encoding='utf-8'))
          status['updated'] = TODAY
          status['overall_status'] = 'in_progress'
          status['active_language'] = 'Urdu'
          status['phase'] = 'Arabic and French are sealed. Urdu A1 calibration is accepted after current-standard repair; Unit 02 is canonical and generation-first production continues.'
          urdu = status.setdefault('urdu', {})
          urdu['state'] = 'ACTIVE_A1_GENERATION'
          urdu['canonical_passages'] = 12
          urdu['levels'] = {'a1':12,'a2':0,'b1':0,'b2':0,'c1':0,'c2':0}
          urdu['calibration'] = {
              'status':'ACCEPTED_AFTER_REPAIR','sequences':[1,2,3,4,5,6],
              'audit_artifact':'reading/audit/urdu_a1_calibration_current_standard_audit.json'
          }
          urdu['a1_generation'] = {
              'status':'ACTIVE','canonical_passages':12,'completed_units':[1,2],
              'last_sequence':12,'unit02_result':'reading/audit/urdu_a1_unit02_generation_result.json',
              'next_sequence':13,'next_unit':3
          }
          urdu['next_target'] = 'Generate Urdu A1 Unit 03 as sequences 13-18 under the generation-first policy; keep formal final audit deferred.'
          status['next_actions'] = [
              'keep Arabic sealed unless canonical Arabic changes',
              'keep French sealed unless deliberate canonical French changes invalidate hash-bound approval',
              'continue Urdu A1 from sequence 13 in guarded six-passage units',
              'preserve source lexicons read-only and defer multi-pass final audit until the generation milestone'
          ]
          important = status.setdefault('important_files', [])
          for item in [
              'reading/audit/urdu_a1_calibration_current_standard_audit.json',
              'reading/audit/urdu_a1_unit02_generation_plan.json',
              'reading/audit/urdu_a1_unit02_generation_result.json'
          ]:
              if item not in important:
                  important.append(item)
          STATUS.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def upsert_frontier(path: Path, body: str):
              start = '<!-- CURRENT_URDU_FRONTIER_START -->'
              end = '<!-- CURRENT_URDU_FRONTIER_END -->'
              old = path.read_text(encoding='utf-8')
              block = start + '\n' + body.rstrip() + '\n' + end + '\n\n'
              if start in old and end in old:
                  old = re.sub(re.escape(start) + r'.*?' + re.escape(end) + r'\n*', block, old, flags=re.S)
                  path.write_text(old, encoding='utf-8')
              else:
                  path.write_text(block + old, encoding='utf-8')

          upsert_frontier(HANDOFF, f'''## Current Urdu frontier — {TODAY}

- Arabic: sealed / approved (360 canonical passages).
- French: sealed / approved (360 canonical passages; hash-bound final approval remains authoritative).
- Urdu: active.
- Urdu A1 calibration sequences 1-6: **accepted after current-standard repair**. See `reading/audit/urdu_a1_calibration_current_standard_audit.json`.
- Urdu A1 Unit 02 sequences 7-12: **canonical generated**. See `reading/audit/urdu_a1_unit02_generation_result.json`.
- Urdu A1 canonical total: **12 passages / 120 questions / 120 answers**.
- Next exact frontier: **Unit 03, sequences 13-18**.
- Continue under `reading/planning/GENERATION_FIRST_FINAL_AUDIT_POLICY.md`; source lexicons stay read-only; do not reopen Arabic/French without a deliberate canonical change.''')

          upsert_frontier(TASKS, f'''## Current execution queue — {TODAY}

- [x] Keep Arabic sealed.
- [x] Keep French sealed.
- [x] Audit Urdu A1 calibration sequences 1-6 against current guards.
- [x] Repair legacy Urdu calibration review/exposure metadata without changing passage text.
- [x] Promote Urdu A1 Unit 02 sequences 7-12 to canonical JSONL.
- [ ] Generate Urdu A1 Unit 03 sequences 13-18 as the next guarded six-passage batch.
- [ ] Continue Urdu A1 through sequence 60 before level-level final audit unless a severe defect requires immediate repair.''')

          print(json.dumps({
              'before_blob':before_blob,'after_blob':after_blob,'passages':12,
              'removed_invalid_reviews':len(removed_reviews),'exposure_repairs':len(exposure_repairs),
              'unit02_word_counts':[r['word_count'] for r in staged]
          }, ensure_ascii=False))
          PY

      - name: Commit promoted Urdu corpus
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes produced; failing closed.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/urdu/a1/staging/unit02 reading/audit/urdu_a1_calibration_current_standard_audit.json reading/audit/urdu_a1_unit02_generation_plan.json reading/audit/urdu_a1_unit02_generation_result.json reading/STATUS.json reading/AGENT_HANDOFF.md reading/TASKS.md
          git commit -m 'Promote Urdu A1 unit 02 after calibration repair'
          git push origin HEAD:main
