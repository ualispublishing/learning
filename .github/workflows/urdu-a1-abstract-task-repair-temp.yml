name: TEMP Urdu A1 abstract task repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/urdu-a1-abstract-task-repair-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-urdu-a1-abstract-task-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'audit/urdu-a1-final-deterministic-2026-08-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/urdu-a1-final-deterministic-2026-08-22
      - name: Adjudicate and repair remaining abstract A1 task candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,datetime

          corpus=Path('reading/urdu/a1/passages.jsonl')
          before='d513cf0dcd19d6c283da2cb2e45d07dc8715e6d71eca18783f84cab3cb45b9bd'
          got=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if got!=before: raise SystemExit(f'FAIL CLOSED corpus drift {got}')
          rows=[json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]
          byid={r['id']:r for r in rows}

          # Preserve the Unit 02 operational negation contrast as an adjudicated false positive.
          keep=('ur-a1-u02-p01','q8','کون سا جملہ بتاتا ہے کہ کوئی چیز باقی نہیں رہنی چاہیے: «کچھ نہ رہ جائے» یا «کچھ رہ جائے»؟','«کچھ نہ رہ جائے»۔')
          kr=byid[keep[0]]; kq=next(q for q in kr['questions'] if q['id']==keep[1]); ka=next(a for a in kr['answer_key'] if a['id']==kq['answer_id'])
          if kq['prompt']!=keep[2] or ka['answer']!=keep[3]: raise SystemExit('FAIL CLOSED Unit02 false-positive candidate drift')

          repairs=[
            {
              'passage_id':'ur-a1-u03-p01','question_id':'q4',
              'old_prompt':'«کیونکہ» جملے میں کیا کام کرتا ہے?'.replace('?', '؟'),
              'old_type':'vocabulary_in_context','old_answer':'یہ وجہ بتاتا ہے۔','old_explanation':'«کیونکہ» پہلے بیان کی وجہ متعارف کراتا ہے۔',
              'new_prompt':'«عائشہ سیب لیتی ہے کیونکہ اسے سیب پسند ہے» میں «کیونکہ» کے بعد کیا بتایا گیا ہے؟',
              'new_type':'vocabulary_in_context','new_answer':'عائشہ کو سیب پسند ہے۔','new_explanation':'یہ بات سیب لینے کی وجہ بتاتی ہے۔',
              'reason':'Replace abstract function wording with concrete reason comprehension while preserving the کیونکہ target.'
            },
            {
              'passage_id':'ur-a1-u03-p05','question_id':'q3',
              'old_prompt':'متن میں «اپنا» کس تعلق کو دکھاتا ہے؟','old_type':'vocabulary_in_context','old_answer':'اپنی ملکیت یا اپنے ہی کام کی طرف اشارہ کرتا ہے۔','old_explanation':'یہاں عائشہ کے اپنے ناشتے اور اپنے کام کی بات ہے۔',
              'new_prompt':'«عائشہ اپنا ناشتہ خود تیار کرے گی» میں ناشتہ کس کا ہے؟',
              'new_type':'reference_resolution','new_answer':'عائشہ کا اپنا ناشتہ۔','new_explanation':'«اپنا» عائشہ کے اپنے ناشتے کی طرف اشارہ کرتا ہے۔',
              'reason':'Replace abstract relation-label reasoning with concrete ownership/reference resolution.'
            },
            {
              'passage_id':'ur-a1-u04-p03','question_id':'q4',
              'old_prompt':'«ہمارے گھر» میں «ہمارے» کس تعلق کو دکھاتا ہے؟','old_type':'vocabulary_in_context','old_answer':'عائشہ اور اس کے گھر والوں سے متعلق۔','old_explanation':'«ہمارے» مشترک ملکیت یا تعلق دکھاتا ہے۔',
              'new_prompt':'«ہمارے گھر میں دو کمرے ہیں» میں گھر کس کا ہے؟',
              'new_type':'reference_resolution','new_answer':'عائشہ اور اس کے گھر والوں کا۔','new_explanation':'«ہمارے» عائشہ اور اس کے گھر والوں کے گھر کی طرف اشارہ کرتا ہے۔',
              'reason':'Replace abstract possession-relation wording with concrete reference resolution.'
            }
          ]
          evidence=[]
          for rp in repairs:
            r=byid[rp['passage_id']]
            q=next(q for q in r['questions'] if q['id']==rp['question_id'])
            a=next(a for a in r['answer_key'] if a['id']==q['answer_id'])
            for field,key in [('prompt','old_prompt'),('type','old_type')]:
              if q.get(field)!=rp[key]: raise SystemExit(f'FAIL CLOSED q drift {rp["passage_id"]} {rp["question_id"]} {field}: {q.get(field)!r}')
            if a.get('answer')!=rp['old_answer'] or a.get('explanation')!=rp['old_explanation']:
              raise SystemExit(f'FAIL CLOSED answer drift {rp["passage_id"]} {rp["question_id"]}')
            before_obj={'prompt':q['prompt'],'type':q['type'],'answer':a['answer'],'explanation':a['explanation'],'target_ids':q.get('target_ids',[])}
            q['prompt']=rp['new_prompt']; q['type']=rp['new_type']; a['answer']=rp['new_answer']; a['explanation']=rp['new_explanation']
            after_obj={'prompt':q['prompt'],'type':q['type'],'answer':a['answer'],'explanation':a['explanation'],'target_ids':q.get('target_ids',[])}
            evidence.append({'passage_id':rp['passage_id'],'question_id':rp['question_id'],'before':before_obj,'after':after_obj,'reason':rp['reason']})

          corpus.write_text('\n'.join(json.dumps(r,ensure_ascii=False,separators=(',',':')) for r in rows)+'\n',encoding='utf-8')
          after=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if after==before: raise SystemExit('FAIL CLOSED no corpus change')

          # Structural and learner-facing revalidation.
          if len(rows)!=60 or [r['sequence'] for r in rows]!=list(range(1,61)): raise SystemExit('FAIL corpus identity/sequence')
          formal=[]; roman=[]; leakage=[]
          for r in rows:
            if len(r['questions'])!=10 or len(r['answer_key'])!=10: raise SystemExit(f'FAIL cardinality {r["id"]}')
            ans={a['id']:a for a in r['answer_key']}
            declared={t['id'] for k in ('new_lexical_targets','review_lexical_targets') for t in r.get(k,[])} | {t['id'] for k in ('grammar_targets','discourse_targets') for t in r.get(k,[])}
            prompts=[]
            for q in r['questions']:
              if q.get('answer_id') not in ans or ans[q['answer_id']].get('question_id')!=q['id']: raise SystemExit(f'FAIL link {r["id"]} {q["id"]}')
              if any(t not in declared for t in q.get('target_ids',[])): raise SystemExit(f'FAIL nonlocal target {r["id"]} {q["id"]}')
              prompts.append(q['prompt'])
              if q.get('type') in {'grammar_category','grammar_function'}: formal.append((r['id'],q['id']))
            if len(prompts)!=len(set(prompts)): raise SystemExit(f'FAIL duplicate prompt {r["id"]}')
            fields=[r.get('title',''),r.get('text','')]+[q.get('prompt','') for q in r['questions']]+[a.get('answer','') for a in r['answer_key']]+[a.get('explanation','') for a in r['answer_key']]
            for text in fields:
              text=str(text or '')
              if re.search(r'[A-Za-z]',text): roman.append((r['id'],text))
            for a in r['answer_key']:
              exp=str(a.get('explanation') or '')
              if re.search(r'یہ\s+سوال|سوال\s+.*جانچ|نحو|نحوی|گرامر|لسانی\s+اصطلاح|جانچتا\s+ہے|جانچتی\s+ہے|\b(?:audit|review|target|schema|generated|generation)\b',exp,re.I): leakage.append((r['id'],a['id'],exp))
          if formal or roman or leakage: raise SystemExit(f'FAIL residual hygiene formal={formal[:5]} roman={roman[:3]} leakage={leakage[:3]}')

          adjud={
            'schema_version':1,'date':'2026-08-23','language':'ur','level':'A1','review_kind':'abstract_task_candidate_adjudication_and_bounded_repair',
            'source_inventory':'reading/audit/urdu_a1_abstract_task_candidates_2026-08-22.json','before_sha256':before,'after_sha256':after,
            'inventory_candidates':4,'confirmed_repairs':3,'adjudicated_false_positives':1,
            'false_positive':{'passage_id':keep[0],'question_id':keep[1],'classification':'KEEP_OPERATIONAL_NEGATION_CONTRAST','rationale':'The item asks the learner to choose which full sentence means that nothing should remain; the learner is not asked to name a grammatical category or function.'},
            'repairs':evidence,
            'verification':{'passage_prose_unchanged':True,'target_linkage_preserved_for_repaired_items':True,'qa_linkage_valid':True,'local_question_targets_only':True,'duplicate_prompts_zero':True,'formal_task_types_zero':True,'learner_facing_roman_script_zero':True,'internal_review_explanation_leakage_zero':True},
            'status':'PASS_INTERNAL_ABSTRACT_TASK_CLASS_ADJUDICATED_NEEDS_INDEPENDENT_REVIEW','release_effect':'NONE_AUTOMATIC: Urdu A1 remains non-release-ready.'
          }
          Path('reading/audit/urdu_a1_abstract_task_adjudication_2026-08-23.json').write_text(json.dumps(adjud,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          final_path=Path('reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json')
          final=json.loads(final_path.read_text(encoding='utf-8'))
          final['generated_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          final['status']='PASS_DETERMINISTIC_POST_ABSTRACT_TASK_REPAIR_NEEDS_INDEPENDENT_REVIEW'
          final['scope']='Fresh deterministic audit after bounded Urdu A1 abstract-task candidate adjudication/repair and learner-explanation hygiene cleanup; no native-speaker, independent-model, educator, or release approval.'
          final['source']={'path':'reading/urdu/a1/passages.jsonl','actual_sha256':after,'hash_bound':True,'prior_sha256':before,'repair_evidence':['reading/audit/urdu_a1_learner_explanation_hygiene_repair_2026-08-23.json','reading/audit/urdu_a1_abstract_task_adjudication_2026-08-23.json']}
          final['counts'].update({'passages':60,'questions':600,'answers':600,'formal_task_types':0,'learner_facing_roman_script_findings':0,'learner_explanation_internal_review_leakage_findings':0,'violations':0})
          final['checks'].update({'passage_count_exact_60':True,'sequences_contiguous_1_60':True,'ten_questions_answers_and_linkage':True,'duplicate_prompts_zero':True,'question_targets_local':True,'grammar_category_and_grammar_function_types_zero':True,'learner_facing_roman_script_zero':True,'learner_explanation_internal_review_leakage_zero':True})
          final['violations']=[]
          final['review_frontier']={'internal_units01_02_semantic_qa_pedagogy':'COMPLETE_INTERNAL_WITH_EXPLANATION_HYGIENE_REPAIR','metalinguistic_class_corpus_wide':'ADJUDICATED_INTERNAL','abstract_task_candidate_class_through_unit04':'ADJUDICATED_INTERNAL','units03_10_full_semantic_naturalness_answer_pedagogy':'PENDING_INTERNAL','native_urdu_naturalness_orthography':'PENDING','independent_model_family':'PENDING','educator_cefr':'PENDING','blind_postrepair':'PENDING'}
          final_path.write_text(json.dumps(final,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'after_sha256':after,'confirmed_repairs':3,'false_positives':1,'status':final['status']},ensure_ascii=False))
          PY
      - name: Commit bounded repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/audit/urdu_a1_abstract_task_adjudication_2026-08-23.json reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json
          git rm -f .github/workflows/urdu-a1-abstract-task-repair-temp.yml
          git commit -m 'Repair Urdu A1 abstract task candidates [skip ci]'
          git push origin HEAD:audit/urdu-a1-final-deterministic-2026-08-22
