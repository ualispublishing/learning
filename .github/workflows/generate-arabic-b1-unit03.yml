name: Generate Arabic B1 Unit 03
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_arabic_b1_unit03.py'
      - '.github/workflows/generate-arabic-b1-unit03.yml'
permissions:
  contents: write
concurrency:
  group: arabic-b1-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Remove obvious typography artifact
        run: sed -i 's/يراهـا/يراها/g' reading/tools/generate_arabic_b1_unit03.py
      - run: python reading/tools/generate_arabic_b1_unit03.py
      - name: Commit generated B1 passages and generator cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/tools/generate_arabic_b1_unit03.py reading/arabic/b1/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate Arabic B1 Unit 03 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
