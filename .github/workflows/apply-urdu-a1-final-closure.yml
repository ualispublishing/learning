name: Apply Urdu A1 final closure

on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/apply_urdu_a1_final_closure.py'
      - '.github/workflows/apply-urdu-a1-final-closure.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply bounded final closure
        run: python reading/tools/apply_urdu_a1_final_closure.py
      - name: Commit closure repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/audit/urdu_a1_final_closure_repairs_2026-08-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply Urdu A1 final closure repairs [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
