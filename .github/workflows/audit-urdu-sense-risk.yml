name: Audit Urdu continuation sense risk

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_urdu_top3000_sense_risk.py'
      - '.github/workflows/audit-urdu-sense-risk.yml'
      - 'audit/run_urdu_sense_risk.request'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run full bilingual disagreement audit
        run: python scripts/audit_urdu_top3000_sense_risk.py
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/urdu_top3000_sense_risk.json audit/urdu_top3000_sense_risk_queue.csv audit/urdu_top3000_sense_risk_sample.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit all Urdu continuation senses [skip ci]'
          for n in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*3))
          done
          exit 1
