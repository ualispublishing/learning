name: Arabic A1+A2 remaining 23

on:
  push:
    branches: [audit/arabic-a1-a2-integrated-2026-08-23]
    paths:
      - 'reading/tools/extract_arabic_a1_a2_remaining_23.py'
      - 'reading/tools/summarize_arabic_remaining_23.py'
      - '.github/workflows/arabic-a1-a2-remaining-23.yml'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'reading/tools/extract_arabic_a1_a2_remaining_23.py'
      - 'reading/tools/summarize_arabic_remaining_23.py'
      - '.github/workflows/arabic-a1-a2-remaining-23.yml'

permissions:
  contents: write

concurrency:
  group: arabic-a1-a2-remaining-23-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract compact blocker manifest
        run: python reading/tools/extract_arabic_a1_a2_remaining_23.py
      - name: Build concise decision sheet
        run: python reading/tools/summarize_arabic_remaining_23.py
      - name: Commit blocker manifest and summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/audit/arabic_a1_a2_remaining_23_2026-08-23.json reading/audit/arabic_a1_a2_remaining_23_summary_2026-08-23.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract Arabic A1/A2 remaining blockers [skip ci]"
          git fetch origin audit/arabic-a1-a2-integrated-2026-08-23
          git rebase origin/audit/arabic-a1-a2-integrated-2026-08-23
          git push origin HEAD:audit/arabic-a1-a2-integrated-2026-08-23
