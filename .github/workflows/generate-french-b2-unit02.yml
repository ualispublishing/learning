name: Generate French B2 Unit 02
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_french_b2_unit02.py'
      - 'reading/tools/generate_french_b2_unit02_retry.py'
      - '.github/workflows/generate-french-b2-unit02.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Generate and validate B2 Unit 02
        run: python reading/tools/generate_french_b2_unit02.py
      - name: Independent B2 Unit 02 checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/french/b2/passages.jsonl').read_text().splitlines() if x.strip()]
          assert len(rows)==12 and [r['sequence'] for r in rows]==list(range(1,13))
          u=rows[6:]
          assert [r['id'] for r in u]==[f'fr-b2-u02-p{i:02d}' for i in range(1,7)]
          assert all(r['language']=='fr' and r['cefr']=='B2' and r['unit']==2 for r in u)
          assert all(350<=r['word_count']<=550 and r['word_count']==len(r['text'].split()) for r in u)
          assert all(len(r['questions'])==10 and len(r['answer_key'])==10 for r in u)
          assert all(len(r['new_lexical_targets'])==4 for r in u[:5]) and not u[-1]['new_lexical_targets']
          expected={'promettre','avenir','attendre','confiance','grave','calmer','solution','responsabilité','partager','opinion','secret','surtout','ordre','lieu','coût','préférer','ramener','pareil','lumière','pousser'}
          new=[t for r in u[:5] for t in r['new_lexical_targets']]
          assert len(new)==20 and {t['form'] for t in new}==expected and len({t['id'] for t in new})==20
          prior_ids={t['id'] for r in rows[:6] for t in r.get('new_lexical_targets',[])}
          prior_forms={t['form'] for r in rows[:6] for t in r.get('new_lexical_targets',[])}
          assert not prior_ids & {t['id'] for t in new} and not prior_forms & {t['form'] for t in new}
          required={'main_claim','argument_relation','assumption','inference','reference_resolution','stance','summary'}
          qtypes={q['type'] for r in u for q in r['questions']}
          assert required.issubset(qtypes)
          for r in u:
            local={t['id'] for f in ('new_lexical_targets','review_lexical_targets') for t in r.get(f,[])}
            amap={a['question_id']:a['id'] for a in r['answer_key']}
            for q in r['questions']:
              assert amap[q['id']]==q['answer_id'] and all(x in local for x in q.get('target_ids',[]))
          assert 'stance' not in '\n'.join(r['text'] for r in u)
          assert all('stance' not in q['prompt'] for r in u for q in r['questions'])
          print({'status':'PASS','b2_passages':12,'unit02_questions':60,'unit02_answers':60,'unit02_new_targets':20,'checkpoint_zero_new':True})
          PY
      - name: Commit canonical French B2 Unit 02
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/b2/passages.jsonl
          git diff --cached --quiet && exit 0
          git commit -m 'Generate French B2 Unit 02 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
