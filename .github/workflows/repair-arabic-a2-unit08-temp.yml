name: TEMP Repair Arabic A2 Unit 08 metalinguistic tasks

on:
  push:
    branches: [repair/arabic-a2-u08-metalinguistic-2026-08-21]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/arabic-a2-u08-metalinguistic-2026-08-21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded repair and validate
        run: python reading/tools/repair_arabic_a2_unit08_metalinguistic.py
      - name: Commit durable repair and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a2/passages.jsonl \
            reading/audit/arabic_a2_u08_metalinguistic_repair_2026-08-21.json \
            reading/audit/arabic_a2_u08_metalinguistic_postrepair_2026-08-21.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Arabic A2 Unit 08 metalinguistic tasks [skip ci]'
          git push origin HEAD:repair/arabic-a2-u08-metalinguistic-2026-08-21
