name: Generate Arabic A2 Unit 02
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_arabic_a2_unit02.py'
      - '.github/workflows/generate-arabic-a2-unit02.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore omitted current-plan target mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('reading/tools/generate_arabic_a2_unit02.py')
          text = p.read_text(encoding='utf-8')
          needle = 'T={\n'
          mapping = '621:("حالي","current; present",["contrast","scenario_resolution"]),\n'
          if mapping not in text:
              if needle not in text:
                  raise SystemExit('target map marker not found')
              text = text.replace(needle, needle + mapping, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - run: python reading/tools/generate_arabic_a2_unit02.py
      - name: Commit generated A2 passages and generator fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/tools/generate_arabic_a2_unit02.py reading/arabic/a2/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate Arabic A2 Unit 02 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
