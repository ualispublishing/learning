name: Repair final Arabic B2 U04 P06 naturalness
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_final_arabic_b2_u04_p06_naturalness.py'
      - '.github/workflows/repair-final-arabic-b2-u04-p06-naturalness.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/repair_final_arabic_b2_u04_p06_naturalness.py
      - name: Commit canonical naturalness repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/b2/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair B2 comparative naturalness [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
