name: Arabic Gate B forward runner

on:
  push:
    paths:
      - '.github/workflows/apply-arabic-gate-b-a2-unit07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  b1-unit7-nfc-reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact routed state before NFC reconciliation
        run: python reading/tools/validate_continuation_state.py

      - name: Reconcile exact B1 Unit 7 NFC regression
        run: python reading/tools/reconcile_arabic_gate_b_b1_unit07_nfc.py

      - name: Rebuild and rebind Arabic evidence without advancing review counts
        run: |
          python reading/tools/run_post_generation_gate0.py
          python reading/tools/run_arabic_fresh_deterministic_revalidation.py
          python reading/tools/audit_arabic_metalinguistic_cefr_candidates.py
          python reading/tools/adjudicate_arabic_b1_c2_metalinguistic_cefr.py
          python reading/tools/build_arabic_gate_b_naturalness_review.py
          python reading/tools/record_arabic_gate_b_b1_unit07_decisions.py
          python reading/tools/sync_arabic_gate_b_progress.py
          python reading/tools/sync_arabic_release_global_blocker.py
          python reading/tools/sync_verification_tasks_from_release.py
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py

      - name: Commit bounded Unit 7 NFC reconciliation and rebound evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/b1/passages.jsonl \
                  reading/audit/arabic_gate_b_decisions_2026-08-30/b1_u07.json \
                  reading/audit/post_generation_gate0_2026-08-30.json \
                  reading/audit/arabic_fresh_deterministic_revalidation_2026-08-30.json \
                  reading/audit/arabic_metalinguistic_cefr_candidate_inventory_2026-08-30.json \
                  reading/audit/arabic_b1_c2_metalinguistic_cefr_triage_2026-08-30.json \
                  reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json \
                  reading/audit/arabic_gate_b_packets_2026-08-30 \
                  reading/RELEASE_STATUS.json reading/VERIFICATION_TASKS.md reading/STATE_MANIFEST.json
          git commit -m 'Reconcile Arabic Gate B B1 Unit 7 NFC evidence'

      - name: Rebase and regenerate evidence on exact push candidate
        run: |
          git fetch origin main
          git rebase origin/main
          python reading/tools/validate_continuation_state.py
          python reading/tools/run_post_generation_gate0.py
          python reading/tools/run_arabic_fresh_deterministic_revalidation.py
          python reading/tools/audit_arabic_metalinguistic_cefr_candidates.py
          python reading/tools/adjudicate_arabic_b1_c2_metalinguistic_cefr.py
          python reading/tools/build_arabic_gate_b_naturalness_review.py
          python reading/tools/record_arabic_gate_b_b1_unit07_decisions.py
          python reading/tools/sync_arabic_gate_b_progress.py
          python reading/tools/sync_arabic_release_global_blocker.py
          python reading/tools/sync_verification_tasks_from_release.py
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py
          git add reading/audit/arabic_gate_b_decisions_2026-08-30/b1_u07.json \
                  reading/audit/post_generation_gate0_2026-08-30.json \
                  reading/audit/arabic_fresh_deterministic_revalidation_2026-08-30.json \
                  reading/audit/arabic_metalinguistic_cefr_candidate_inventory_2026-08-30.json \
                  reading/audit/arabic_b1_c2_metalinguistic_cefr_triage_2026-08-30.json \
                  reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json \
                  reading/audit/arabic_gate_b_packets_2026-08-30 \
                  reading/RELEASE_STATUS.json reading/VERIFICATION_TASKS.md reading/STATE_MANIFEST.json
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          python reading/tools/validate_continuation_state.py
          git push origin HEAD:main
