name: External fact check French and Urdu top 1000

on:
  workflow_dispatch:
  push:
    paths:
      - 'french_top1000.csv'
      - 'urdu_top1000.csv'
      - 'scripts/verify_french_urdu_top1000_external.py'
      - '.github/workflows/verify-french-urdu-top1000-external.yml'

concurrency:
  group: verify-french-urdu-top1000-external-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install wordnet tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install wn
      - name: Verify all French and Urdu cards
        run: python scripts/verify_french_urdu_top1000_external.py
      - name: Commit verification evidence
        run: |
          if [ -z "$(git status --porcelain -- audit/french_top1000_external_verification.csv audit/french_top1000_external_verification_summary.json audit/urdu_top1000_external_verification.csv audit/urdu_top1000_external_verification_summary.json)" ]; then
            echo 'No verification evidence changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/french_top1000_external_verification.csv audit/french_top1000_external_verification_summary.json audit/urdu_top1000_external_verification.csv audit/urdu_top1000_external_verification_summary.json
          git commit -m 'Record French and Urdu top1000 external fact checks [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
