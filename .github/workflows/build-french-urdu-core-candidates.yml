name: Build French and Urdu core candidates

on:
  push:
    paths:
      - 'scripts/build_french_urdu_core_candidates_v2.py'
      - 'scripts/build_french_urdu_core_candidates_v3.py'
      - 'scripts/refine_french_urdu_candidate_meanings.py'
      - 'scripts/refine_french_urdu_candidate_meanings_v2.py'
      - 'scripts/refine_french_urdu_candidate_meanings_v3.py'
      - 'scripts/audit_french_urdu_core_candidates.py'
      - 'scripts/audit_french_urdu_core_candidates_v2.py'
      - '.github/workflows/build-french-urdu-core-candidates.yml'
  workflow_dispatch:

concurrency:
  group: build-french-urdu-core-candidates
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verification tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --upgrade pip
          python -m pip install wordfreq wn
          python - <<'PY'
          import time, wn
          for lexicon in ('omw-en:2.0', 'omw-fr:2.0'):
              last = None
              for attempt in range(5):
                  try:
                      wn.download(lexicon)
                      break
                  except Exception as exc:
                      last = exc
                      print(f'{lexicon} download attempt {attempt + 1}/5 failed: {exc}')
                      time.sleep(3 * (attempt + 1))
              else:
                  raise SystemExit(f'Could not download {lexicon} after 5 attempts: {last}')
          PY

      - name: Download French lexical sources
        run: |
          curl -k -L --fail --retry 5 --retry-all-errors \
            'https://www.lexique.org/databases/Lexique400/Lexique400.tsv' \
            -o /tmp/Lexique400.tsv
          curl -L --fail --retry 5 --retry-all-errors \
            'https://kaikki.org/dictionary/French/kaikki.org-dictionary-French.jsonl' \
            -o /tmp/kaikki-french.jsonl
          curl -L --fail --retry 5 --retry-all-errors \
            'https://raw.githubusercontent.com/freedict/fd-dictionaries/master/fra-eng/fra-eng.tei' \
            -o /tmp/fra-eng.tei
          curl -L --fail --retry 5 --retry-all-errors \
            'https://raw.githubusercontent.com/omwn/tufs/master/tufs-vocab.tsv' \
            -o /tmp/tufs-vocab.tsv

      - name: Download Urdu lexical sources
        run: |
          curl -L --fail --retry 5 --retry-all-errors \
            'https://www.cle.org.pk/Downloads/ling_resources/wordlists/UrduHighFreqWords%285000%29.pdf' \
            -o /tmp/urdu-frequency.pdf
          curl -L --fail --retry 5 --retry-all-errors \
            'https://www.cle.org.pk/Downloads/ling_resources/wordlists/Urdu%20WordNet%201.0%20Wordlist.pdf' \
            -o /tmp/urdu-wordnet.pdf
          curl -L --fail --retry 5 --retry-all-errors \
            'https://www.cle.org.pk/Downloads/ling_resources/wordlists/Closed%20Class%20Word%20List%20v1.1.pdf' \
            -o /tmp/urdu-closed.pdf
          curl -L --fail --retry 5 --retry-all-errors \
            'https://raw.githubusercontent.com/rohan-c0de/ReadUrdu-Devanagari-English/main/data/dictionary.json' \
            -o /tmp/readurdu-dictionary.json
          curl -L --fail --retry 5 --retry-all-errors \
            'https://kaikki.org/dictionary/Urdu/kaikki.org-dictionary-Urdu.jsonl' \
            -o /tmp/kaikki-urdu.jsonl
          pdftotext -layout /tmp/urdu-frequency.pdf /tmp/urdu-frequency.txt
          pdftotext -layout /tmp/urdu-wordnet.pdf /tmp/urdu-wordnet.txt
          pdftotext -layout /tmp/urdu-closed.pdf /tmp/urdu-closed.txt

      - name: Build French candidate
        run: |
          python scripts/build_french_urdu_core_candidates_v3.py \
            --language french \
            --lexique /tmp/Lexique400.tsv \
            --kaikki /tmp/kaikki-french.jsonl \
            --legacy-french french_top1000.csv

      - name: Refine French meanings with reviewed exceptions
        run: |
          python scripts/refine_french_urdu_candidate_meanings_v3.py \
            --language french \
            --legacy french_top1000.csv \
            --kaikki /tmp/kaikki-french.jsonl \
            --freedict /tmp/fra-eng.tei

      - name: Audit French meanings independently
        run: |
          python scripts/audit_french_urdu_core_candidates_v2.py \
            --language french \
            --evidence audit/french_core1000_candidate_evidence.csv \
            --tufs-vocab /tmp/tufs-vocab.tsv

      - name: Build Urdu candidate
        run: |
          python scripts/build_french_urdu_core_candidates_v3.py \
            --language urdu \
            --kaikki /tmp/kaikki-urdu.jsonl \
            --urdu-freq-text /tmp/urdu-frequency.txt \
            --urdu-wordnet-text /tmp/urdu-wordnet.txt \
            --urdu-closed-text /tmp/urdu-closed.txt \
            --readurdu /tmp/readurdu-dictionary.json

      - name: Refine Urdu meanings with reviewed exceptions
        run: |
          python scripts/refine_french_urdu_candidate_meanings_v3.py \
            --language urdu \
            --legacy urdu_top1000.csv \
            --kaikki /tmp/kaikki-urdu.jsonl

      - name: Audit Urdu meanings independently
        run: |
          python scripts/audit_french_urdu_core_candidates_v2.py \
            --language urdu \
            --evidence audit/urdu_core1000_candidate_evidence.csv \
            --readurdu /tmp/readurdu-dictionary.json \
            --tufs-vocab /tmp/tufs-vocab.tsv

      - name: Commit candidate and audit evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/french_core1000_candidate_evidence.csv \
                  audit/french_top1000_candidate.csv \
                  audit/french_core_candidate_rejections.csv \
                  audit/french_core1000_candidate_summary.json \
                  audit/french_meaning_refinement_summary.json \
                  audit/french_core1000_semantic_audit.csv \
                  audit/french_core1000_semantic_review_queue.csv \
                  audit/french_core1000_semantic_audit_summary.json \
                  audit/urdu_core1000_candidate_evidence.csv \
                  audit/urdu_top1000_candidate.csv \
                  audit/urdu_core_candidate_rejections.csv \
                  audit/urdu_core1000_candidate_summary.json \
                  audit/urdu_meaning_refinement_summary.json \
                  audit/urdu_core1000_semantic_audit.csv \
                  audit/urdu_core1000_semantic_review_queue.csv \
                  audit/urdu_core1000_semantic_audit_summary.json
          git commit -m 'Audit fully reviewed French and Urdu core1000 candidates [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
