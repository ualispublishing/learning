name: One-shot CISSP v1.26 release builder

on:
  push:
    branches:
      - cissp-v1.26-release-20260830
    paths:
      - scripts/build_cissp_v126_release.py
      - .github/workflows/cissp-v1.26-promote-branch.yml

permissions:
  contents: write

jobs:
  build-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cissp-v1.26-release-20260830
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build coherent v1.26 release state
        run: python scripts/build_cissp_v126_release.py
      - name: Remove one-shot builder files
        run: |
          rm scripts/build_cissp_v126_release.py
          rm .github/workflows/cissp-v1.26-promote-branch.yml
      - name: Commit generated release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Build CISSP Atlas v1.26 release candidate'
          git push origin HEAD:cissp-v1.26-release-20260830
