name: Generate French B2 Unit 06
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_french_b2_unit06.py'
      - 'reading/tools/generate_french_b2_unit06_retry.py'
      - '.github/workflows/generate-french-b2-unit06.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Generate and validate B2 Unit 06
        id: generate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python reading/tools/generate_french_b2_unit06_retry.py 2>&1 | tee /tmp/french_b2_u06_generation.log
      - name: Persist failure diagnostic
        if: steps.generate.outcome != 'success'
        run: |
          mkdir -p reading/audit
          cp /tmp/french_b2_u06_generation.log reading/audit/french_b2_unit06_generation_failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_b2_unit06_generation_failure.txt
          git commit -m 'Record French B2 Unit 06 generation failure [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
      - name: Stop after failed generator
        if: steps.generate.outcome != 'success'
        run: exit 1
      - name: Independent B2 Unit 06 checks
        if: steps.generate.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/french/b2/passages.jsonl').read_text().splitlines() if x.strip()]
          assert len(rows)==36 and [r['sequence'] for r in rows]==list(range(1,37))
          u=rows[30:]
          assert [r['id'] for r in u]==[f'fr-b2-u06-p{i:02d}' for i in range(1,7)]
          assert all(350<=r['word_count']<=550 and r['word_count']==len(r['text'].split()) for r in u)
          assert all(len(r['questions'])==10 and len(r['answer_key'])==10 for r in u)
          assert all(len(r['new_lexical_targets'])==4 for r in u[:5]) and not u[-1]['new_lexical_targets']
          expected={'téléphone','compte','message','adresse','photo','nom','visage','voix','contrôler','suivre','connaître','cacher','client','bureau','demander','répondre','vendre','chercher','trouver','monde'}
          new=[t for r in u[:5] for t in r['new_lexical_targets']]
          assert len(new)==20 and {t['form'] for t in new}==expected and len({t['id'] for t in new})==20
          prior_ids={t['id'] for r in rows[:30] for t in r.get('new_lexical_targets',[])}
          prior_forms={t['form'] for r in rows[:30] for t in r.get('new_lexical_targets',[])}
          assert not prior_ids & {t['id'] for t in new} and not prior_forms & {t['form'] for t in new}
          pair='fr-b2-u06-data-control-opinions'
          assert u[2]['paired_text_group']==pair and u[3]['paired_text_group']==pair
          assert all(r['paired_text_group'] is None for r in (u[0],u[1],u[4],u[5]))
          for r in u:
            local={t['id'] for f in ('new_lexical_targets','review_lexical_targets') for t in r.get(f,[])}
            amap={a['question_id']:a['id'] for a in r['answer_key']}
            for q in r['questions']:
              assert amap[q['id']]==q['answer_id'] and all(x in local for x in q.get('target_ids',[]))
          print({'status':'PASS','b2_passages':36,'unit06_questions':60,'unit06_answers':60,'unit06_new_targets':20,'checkpoint_zero_new':True,'paired_group':pair})
          PY
      - name: Commit canonical French B2 Unit 06
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/b2/passages.jsonl
          git diff --cached --quiet && exit 0
          git commit -m 'Generate French B2 Unit 06 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
