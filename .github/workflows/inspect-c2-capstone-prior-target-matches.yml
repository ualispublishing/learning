name: Inspect C2 capstone prior target matches
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/inspect_c2_capstone_prior_target_matches.py'
      - '.github/workflows/inspect-c2-capstone-prior-target-matches.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/inspect_c2_capstone_prior_target_matches.py
      - name: Commit diagnostic artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_c2_capstone_prior_target_matches.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspect C2 capstone prior target matches [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
