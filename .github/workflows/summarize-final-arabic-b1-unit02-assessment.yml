name: Summarize final Arabic B1 Unit02 assessment
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/summarize_final_arabic_b1_unit02_assessment.py'
      - '.github/workflows/summarize-final-arabic-b1-unit02-assessment.yml'
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/summarize_final_arabic_b1_unit02_assessment.py
      - name: Commit summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_b1_unit02_assessment_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Summarize B1 Unit02 assessment design [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
