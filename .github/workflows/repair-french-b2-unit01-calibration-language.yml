name: Repair French B2 Unit 01 Calibration Language
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_french_b2_unit01_calibration_language.py'
      - '.github/workflows/repair-french-b2-unit01-calibration-language.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Apply and validate narrow B2 calibration language repair
        run: python reading/tools/repair_french_b2_unit01_calibration_language.py
      - name: Independent repair checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/french/b2/passages.jsonl').read_text().splitlines() if x.strip()]
          assert len(rows)==6
          assert all(350<=r['word_count']<=550 and r['word_count']==len(r['text'].split()) for r in rows)
          assert all(len(r['questions'])==10 and len(r['answer_key'])==10 for r in rows)
          assert all(len(r['new_lexical_targets'])==4 for r in rows[:5]) and not rows[-1]['new_lexical_targets']
          assert rows[2]['paired_text_group']=='fr-b2-u01-citizen-science-access' and rows[3]['paired_text_group']==rows[2]['paired_text_group']
          alltext='\n'.join(r['text'] for r in rows)
          assert 'stance' not in alltext and all('stance' not in q['prompt'] for r in rows for q in r['questions'])
          assert 'position d’un auteur' in rows[-1]['text']
          assert 'Quelle position finale' in next(q['prompt'] for q in rows[-1]['questions'] if q['id']=='q7')
          print({'status':'PASS','b2_passages':6,'language_repair':True})
          PY
      - name: Commit repaired B2 calibration corpus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/b2/passages.jsonl
          git diff --cached --quiet && exit 0
          git commit -m 'Repair French B2 Unit 01 calibration language [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
