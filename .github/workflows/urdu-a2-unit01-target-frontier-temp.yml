name: TEMP Urdu A2 Unit 01 target frontier

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/urdu-a2-unit01-target-frontier-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-urdu-a2-unit01-target-frontier
  cancel-in-progress: false

jobs:
  derive:
    if: github.event.pull_request.head.ref == 'plan/urdu-a2-unit01-2026-08-23'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/urdu-a2-unit01-2026-08-23
      - name: Derive exact unused thematic A2 target frontier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,re

          a1=Path('reading/urdu/a1/passages.jsonl')
          lex=Path('reading/lexicons/urdu.jsonl')
          a1_sha=hashlib.sha256(a1.read_bytes()).hexdigest()
          lex_sha=hashlib.sha256(lex.read_bytes()).hexdigest()
          rows=[json.loads(x) for x in a1.read_text(encoding='utf-8').splitlines() if x.strip()]
          if len(rows)!=60: raise SystemExit(f'FAIL CLOSED A1 frontier not 60 passages: {len(rows)}')
          used_ids=set(); used_forms=set()
          for r in rows:
            for k in ('new_lexical_targets','review_lexical_targets'):
              for t in r.get(k,[]):
                if t.get('id'): used_ids.add(t['id'])
                if t.get('form'): used_forms.add(t['form'])
          fresh_ids={t['id'] for r in rows for t in r.get('new_lexical_targets',[]) if t.get('id')}
          if len(fresh_ids)!=100: raise SystemExit(f'FAIL CLOSED expected 100 A1 fresh target IDs, got {len(fresh_ids)}')

          keywords={
            'service':5,'office':5,'department':5,'road':5,'street':5,'hospital':5,'patient':4,
            'contact':5,'details':4,'information':4,'address':5,'appointment':5,'schedule':4,'hours':3,
            'center':4,'centre':4,'local':3,'neighborhood':5,'neighbourhood':5,'route':3,'map':3,
            'document':4,'form':4,'help':3,'assistance':4,'bank':3,'market':3,'store':3,'shop':3,
            'public':2,'location':4,'clinic':5,'pharmacy':5,'service;':5
          }
          candidates=[]
          for line in lex.read_text(encoding='utf-8').splitlines():
            if not line.strip(): continue
            x=json.loads(line)
            if x.get('planning_band')!='A2_core_candidate': continue
            if x.get('id') in used_ids or x.get('form') in used_forms: continue
            pos=str(x.get('part_of_speech_source') or '').lower()
            if any(bad in pos for bad in ('closed-class','particle','pronoun','numeral','name')): continue
            meaning=str(x.get('meaning_en_source') or '').lower()
            score=sum(w for k,w in keywords.items() if k in meaning)
            if score<=0: continue
            candidates.append({
              'id':x['id'],'form':x['form'],'rank':x['rank'],'meaning_en_source':x.get('meaning_en_source'),
              'part_of_speech_source':x.get('part_of_speech_source'),'planning_band':x.get('planning_band'),
              'source_file':x.get('source_file'),'theme_score':score
            })
          candidates.sort(key=lambda x:(-x['theme_score'],x['rank']))
          payload={
            'schema_version':1,'date':'2026-08-23','language':'ur','level':'A2','unit':1,
            'theme':'neighborhood and services','genres':['story','service information','message'],
            'a1_frontier':{'path':'reading/urdu/a1/passages.jsonl','sha256':a1_sha,'passages':60,'fresh_lexical_target_ids':len(fresh_ids),'all_declared_lexical_ids':len(used_ids)},
            'lexicon':{'path':'reading/lexicons/urdu.jsonl','sha256':lex_sha,'source_file':'urdu_top1000.csv'},
            'selection_policy':'Unused A2_core_candidate content words only; exact A1 target-ID/form exclusion; theme-keyword scoring is high-recall candidate discovery, not automatic semantic approval.',
            'candidate_count':len(candidates),'top_candidates':candidates[:40],
            'status':'CANDIDATE_FRONTIER_DERIVED_NEEDS_CONTEXTUAL_SELECTION',
            'release_effect':'NONE: planning evidence only; no A2 corpus generated or approved.'
          }
          Path('reading/audit/urdu_a2_unit01_target_frontier_2026-08-23.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'a1_sha256':a1_sha,'used_ids':len(used_ids),'fresh_ids':len(fresh_ids),'candidate_count':len(candidates),'top_candidates':candidates[:25]},ensure_ascii=False))
          PY
      - name: Commit evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/urdu_a2_unit01_target_frontier_2026-08-23.json
          git rm -f .github/workflows/urdu-a2-unit01-target-frontier-temp.yml
          git commit -m 'Derive Urdu A2 Unit 01 target frontier [skip ci]'
          git push origin HEAD:plan/urdu-a2-unit01-2026-08-23
