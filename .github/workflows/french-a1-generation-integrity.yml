name: French A1 generation milestone integrity
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_french_a1_verified_sense_overrides.py'
      - 'reading/tools/audit_french_a1_generation_integrity.py'
      - '.github/workflows/french-a1-generation-integrity.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record verified reader-sense overrides
        run: python reading/tools/repair_french_a1_verified_sense_overrides.py
      - name: Run A1 generation integrity audit
        run: python reading/tools/audit_french_a1_generation_integrity.py
      - name: Commit A1 closeout evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a1/passages.jsonl reading/audit/french_a1_generation_integrity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Close French A1 generation milestone [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
