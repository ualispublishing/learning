name: Check C2 generation state
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/check_c2_generation_state.py'
      - '.github/workflows/check-c2-generation-state.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/check_c2_generation_state.py
      - name: Commit structural generation state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/planning/C2_GENERATION_STATE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record C2 structural generation state [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
