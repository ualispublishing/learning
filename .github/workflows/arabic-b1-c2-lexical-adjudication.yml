name: Arabic B1-C2 lexical adjudication

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'reading/tools/adjudicate_arabic_b1_c2_lexical_diagnostics.py'
      - '.github/workflows/arabic-b1-c2-lexical-adjudication.yml'

permissions:
  contents: write

concurrency:
  group: arabic-b1-c2-lexical-adjudication-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  adjudicate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adjudicate lexical diagnostics
        run: python reading/tools/adjudicate_arabic_b1_c2_lexical_diagnostics.py
      - name: Commit adjudication evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/audit/arabic_b1_c2_lexical_diagnostic_adjudication_2026-08-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Adjudicate Arabic B1-C2 lexical diagnostics [skip ci]"
          git fetch origin audit/arabic-b1-c2-final-2026-08-23
          git rebase origin/audit/arabic-b1-c2-final-2026-08-23
          git push origin HEAD:audit/arabic-b1-c2-final-2026-08-23
