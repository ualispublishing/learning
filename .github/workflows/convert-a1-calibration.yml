name: Convert A1 calibration drafts

on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/convert_a1_calibration.py'
      - '.github/workflows/convert-a1-calibration.yml'
      - 'reading/run_a1_conversion.request'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Convert reviewed staging files to canonical JSONL
        run: python reading/tools/convert_a1_calibration.py
      - name: Commit canonical calibration JSONL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a1/passages.jsonl reading/urdu/a1/passages.jsonl reading/a1_calibration_conversion_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Convert A1 calibration drafts to JSONL [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
