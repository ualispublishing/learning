name: Generate French A2 Unit 01 Retry
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_french_a2_unit01_retry.py'
      - 'reading/tools/generate_french_a2_unit01_retry2.py'
      - 'reading/tools/generate_french-a2-unit01-retry3.py'
      - 'reading/tools/generate_french_a2_unit01_retry4.py'
      - 'reading/tools/generate_french_a2_unit01_retry5.py'
      - '.github/workflows/generate-french-a2-unit01-retry.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --quiet jsonschema
      - name: Generate and validate hardened French A2 Unit 01
        run: python reading/tools/generate_french_a2_unit01_retry5.py
      - name: Independent A2 Unit 01 checks
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('reading/french/a2/passages.jsonl')
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==6
          assert [r['sequence'] for r in rows]==list(range(1,7))
          assert [r['id'] for r in rows]==[f'fr-a2-u01-p{i:02d}' for i in range(1,7)]
          assert all(r['language']=='fr' and r['cefr']=='A2' and r['unit']==1 for r in rows)
          assert all(140<=r['word_count']<=220 for r in rows)
          assert sum(len(r['new_lexical_targets']) for r in rows[:5])==10
          assert rows[-1]['new_lexical_targets']==[]
          assert sum(len(r['questions']) for r in rows)==60
          assert sum(len(r['answer_key']) for r in rows)==60
          forms=[t['form'] for r in rows[:5] for t in r['new_lexical_targets']]
          assert forms==['retard','conseil','erreur','expliquer','essayer','possible','réparer','éviter','rendez-vous','découvrir']
          assert 'mistake' not in p.read_text(encoding='utf-8')
          p4=rows[3]
          ev=next(t for t in p4['new_lexical_targets'] if t['form']=='éviter')
          assert ev['source_rank']==662
          assert re.search(r'(?<!\w)éviter(?!\w)',p4['text'],re.I)
          for r in rows:
              local={str(t['id']) for f in ('new_lexical_targets','review_lexical_targets') for t in r.get(f,[]) if isinstance(t,dict) and t.get('id')}
              amap={a['question_id']:a['id'] for a in r['answer_key']}
              assert len(amap)==10
              for q in r['questions']:
                  assert amap[q['id']]==q['answer_id']
                  assert all(tid in local for tid in q.get('target_ids',[]))
              for t in r['review_lexical_targets']:
                  if t['representation'] in {'running_text','summary'}:
                      assert re.search(rf'(?<!\w){re.escape(t["form"])}(?!\w)',r['text'],re.I)
          print({'status':'PASS','french_a2_passages':6,'questions':60,'answers':60,'new_targets':10,'checkpoint_new_targets':0})
          PY
      - name: Commit French A2 Unit 01 canonical file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a2/passages.jsonl
          if git diff --cached --quiet; then
            echo 'No canonical changes to commit'
            exit 0
          fi
          git commit -m 'Generate French A2 Unit 01 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
