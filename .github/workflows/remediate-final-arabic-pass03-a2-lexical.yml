name: Remediate final Arabic Pass 03 A2 lexical
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/remediate_final_arabic_pass03_a2_lexical.py'
      - '.github/workflows/remediate-final-arabic-pass03-a2-lexical.yml'
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install structural validator dependency
        run: python -m pip install --quiet jsonschema
      - name: Apply eight-case A2 lexical remediation
        run: python reading/tools/remediate_final_arabic_pass03_a2_lexical.py
      - name: Recompute structural integrity
        run: python reading/tools/final_audit_arabic_pass01_data_integrity.py
      - name: Recompute Pass 03
        run: python reading/tools/final_audit_arabic_pass03_question_composition.py
      - name: Require Pass 03 clean
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('reading/audit/final_arabic_pass03_question_composition.json').read_text(encoding='utf-8'))
          if p.get('status') != 'PASS' or p.get('totals',{}).get('review_flags') != 0:
              raise SystemExit(f"Pass03 not clean: status={p.get('status')} flags={p.get('totals',{}).get('review_flags')}")
          print('pass03=PASS flags=0')
          PY
      - name: Recompute Pass 04 diagnostics
        run: python reading/tools/final_audit_arabic_pass04_answer_evidence_alignment.py
      - name: Synchronize current final-review status
        run: python reading/tools/update_arabic_final_review_status.py
      - name: Commit canonical remediation and refreshed affected audits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            reading/arabic/a2/passages.jsonl \
            reading/audit/final_arabic_pass01_data_integrity.json \
            reading/audit/final_arabic_pass03_question_composition.json \
            reading/audit/final_arabic_pass04_answer_evidence_alignment.json \
            reading/STATUS.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Close final A2 Pass 03 lexical composition debt [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
