name: Sync French PR13 with current main cleanup

on:
  push:
    branches:
      - repair/french-a1-review-integrity-2026-08-20
    paths:
      - .github/workflows/french-pr13-sync-main-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: french-pr13-sync-main-cleanup
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
          fetch-depth: 0
      - name: Merge current main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/french-pr13-sync-main-cleanup.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-shot PR13 main-sync workflow [skip ci]'
          fi
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
