name: French A1 substantive Gate A

on:
  push:
    branches:
      - repair/french-a1-review-integrity-2026-08-20
    paths:
      - .github/workflows/french-a1-substantive-gate-a.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/french-a1-substantive-gate-a.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: french-a1-substantive-gate-a
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync current main and install deterministic audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python -m pip install --quiet jsonschema stanza

      - name: Guard current A1 and rerun existing deterministic audits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('reading/french/a1/passages.jsonl')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          want='b509f77c71e28505f80efaf202cb36cd5c45c5646bbd86cbf9773daf0743d037'
          if got != want:
              raise SystemExit(f'FAIL CLOSED: A1 hash drift {got} != {want}')
          print('A1 exact SHA guard PASS', got)
          PY
          python reading/tools/audit_french_a1_generation_integrity.py
          cp reading/audit/french_final_whole_audit.json /tmp/french_final_whole_audit.legacy.json
          python reading/tools/audit_french_final_whole_v3.py
          cp reading/audit/french_final_whole_audit.json /tmp/french_final_whole_audit.current.json
          cp /tmp/french_final_whole_audit.legacy.json reading/audit/french_final_whole_audit.json

      - name: Regenerate current-hash coverage evidence without touching historical artifact
        shell: bash
        run: |
          set -euo pipefail
          cp reading/audit/french_coverage_evidence_2026-08-19.json /tmp/french_coverage_evidence.legacy.json
          cp reading/audit/french_curriculum_exposure_ledger_2026-08-19.json /tmp/french_curriculum_exposure_ledger.legacy.json
          python - <<'PY'
          from pathlib import Path
          src_path=Path('reading/tools/audit_french_curriculum_coverage.py')
          src=src_path.read_text(encoding='utf-8')
          old='"a1": "1cdb31ecb8b987c50051bb6f8fa5b2f7fda812cb3004c81ab8697f832fceacba"'
          new='"a1": "b509f77c71e28505f80efaf202cb36cd5c45c5646bbd86cbf9773daf0743d037"'
          if old not in src:
              raise SystemExit('FAIL CLOSED: expected historical A1 hash anchor missing from coverage tool')
          src=src.replace(old,new,1)
          ns={'__name__':'__main__','__file__':str(src_path),'__package__':None}
          exec(compile(src,str(src_path),'exec'),ns)
          PY
          cp reading/audit/french_coverage_evidence_2026-08-19.json /tmp/french_coverage_evidence.current.json
          cp reading/audit/french_curriculum_exposure_ledger_2026-08-19.json /tmp/french_curriculum_exposure_ledger.current.json
          cp /tmp/french_coverage_evidence.legacy.json reading/audit/french_coverage_evidence_2026-08-19.json
          cp /tmp/french_curriculum_exposure_ledger.legacy.json reading/audit/french_curriculum_exposure_ledger_2026-08-19.json

      - name: Build formal A1 Gate A and current coverage artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import csv, hashlib, json, re, subprocess, unicodedata
          import stanza
          from jsonschema import Draft202012Validator

          ROOT=Path('.')
          A1=ROOT/'reading/french/a1/passages.jsonl'
          SCHEMA=ROOT/'reading/schema/passage.schema.json'
          rows=[json.loads(x) for x in A1.read_text(encoding='utf-8').splitlines() if x.strip()]
          a1_sha=hashlib.sha256(A1.read_bytes()).hexdigest()
          a1_blob=subprocess.check_output(['git','hash-object',str(A1)],text=True).strip()
          expected='b509f77c71e28505f80efaf202cb36cd5c45c5646bbd86cbf9773daf0743d037'
          if a1_sha != expected:
              raise SystemExit('FAIL CLOSED: A1 changed during batch')

          gen=json.loads((ROOT/'reading/audit/french_a1_generation_integrity.json').read_text(encoding='utf-8'))
          whole=json.loads(Path('/tmp/french_final_whole_audit.current.json').read_text(encoding='utf-8'))
          if gen.get('status')!='PASS' or whole.get('status')!='PASS' or whole.get('failed_passes'):
              raise SystemExit('FAIL CLOSED: prerequisite deterministic audit failed')
          if whole.get('level_blobs',{}).get('a1') != a1_blob:
              raise SystemExit('FAIL CLOSED: whole audit A1 blob mismatch')

          blockers=[]; warnings=[]
          schema=json.loads(SCHEMA.read_text(encoding='utf-8'))
          validator=Draft202012Validator(schema)
          schema_errors=[]
          for r in rows:
              for e in validator.iter_errors(r):
                  schema_errors.append({'passage_id':r.get('id'),'path':list(e.path),'message':e.message})
          if schema_errors:
              blockers.append({'kind':'schema_validation','count':len(schema_errors),'examples':schema_errors[:20]})

          ids=[r.get('id') for r in rows]
          if len(rows)!=60 or [r.get('sequence') for r in rows] != list(range(1,61)) or len(set(ids))!=60:
              blockers.append({'kind':'grid_or_identity'})
          units=Counter(r.get('unit') for r in rows)
          if units != Counter({u:6 for u in range(1,11)}):
              blockers.append({'kind':'unit_grid','actual':dict(units)})

          qa_errors=[]; dup_prompt=[]; banned=[]; unicode_errors=[]
          banned_fragments=['pipeline','frontier lock','c2 unit','unité c2','calibration','todo','placeholder','lorem ipsum','generated by','generation batch']
          def learner_strings(r):
              out=[r.get('title',''),r.get('text','')]
              out += [q.get('prompt','') for q in r.get('questions',[])]
              out += [a.get('answer','') for a in r.get('answer_key',[])]
              out += [a.get('explanation','') for a in r.get('answer_key',[])]
              return out
          for r in rows:
              qs=r.get('questions',[]); ans=r.get('answer_key',[])
              qids=[q.get('id') for q in qs]; aids=[a.get('id') for a in ans]
              if len(qs)!=10 or len(ans)!=10 or len(set(qids))!=10 or len(set(aids))!=10:
                  qa_errors.append({'passage_id':r['id'],'kind':'cardinality_or_duplicate_id'})
              amap={a.get('id'):a for a in ans}; qmap={q.get('id'):q for q in qs}
              for q in qs:
                  a=amap.get(q.get('answer_id'))
                  if not a or a.get('question_id')!=q.get('id'):
                      qa_errors.append({'passage_id':r['id'],'question_id':q.get('id'),'kind':'linkage'})
              for a in ans:
                  q=qmap.get(a.get('question_id'))
                  if not q or q.get('answer_id')!=a.get('id'):
                      qa_errors.append({'passage_id':r['id'],'answer_id':a.get('id'),'kind':'backlink'})
              prompts=[unicodedata.normalize('NFC',q.get('prompt','')).strip().casefold() for q in qs]
              for p,c in Counter(prompts).items():
                  if p and c>1: dup_prompt.append({'passage_id':r['id'],'prompt':p,'count':c})
              combined='\n'.join(learner_strings(r))
              low=unicodedata.normalize('NFKC',combined).casefold()
              for frag in banned_fragments:
                  if frag in low: banned.append({'passage_id':r['id'],'fragment':frag})
              if re.search(r'fr-(?:rank|a1|a2|b1|b2|c1|c2)-',combined,re.I):
                  banned.append({'passage_id':r['id'],'fragment':'internal id'})
              for s in learner_strings(r):
                  if s != unicodedata.normalize('NFC',s):
                      unicode_errors.append({'passage_id':r['id'],'kind':'non_nfc'})
                  if any(ord(ch)<32 and ch not in '\n\t\r' for ch in s):
                      unicode_errors.append({'passage_id':r['id'],'kind':'control_character'})
          if qa_errors: blockers.append({'kind':'question_answer_integrity','count':len(qa_errors),'examples':qa_errors[:20]})
          if dup_prompt: blockers.append({'kind':'duplicate_prompt_within_passage','count':len(dup_prompt),'examples':dup_prompt[:20]})
          if banned: blockers.append({'kind':'learner_facing_internal_language','count':len(banned),'examples':banned[:20]})
          if unicode_errors: blockers.append({'kind':'unicode_or_control','count':len(unicode_errors),'examples':unicode_errors[:20]})

          # Source lexicons must not be changed by this PR.
          source_paths=['french_top1000.csv','french_top3000.csv','reading/lexicons/french.jsonl','reading/lexicons/french_a1_support.json']
          diff=subprocess.run(['git','diff','--name-only','origin/main...HEAD','--',*source_paths],text=True,capture_output=True,check=True).stdout.strip().splitlines()
          if diff:
              blockers.append({'kind':'source_lexicon_changed','paths':diff})
          source_hashes={p:hashlib.sha256((ROOT/p).read_bytes()).hexdigest() for p in source_paths}

          # Revalidate review-target visibility and chronology using Stanza lemmas/surfaces.
          stanza.download('fr',processors='tokenize,pos,lemma',verbose=False)
          nlp=stanza.Pipeline('fr',processors='tokenize,pos,lemma',use_gpu=False,verbose=False)
          lex_rows=[json.loads(x) for x in (ROOT/'reading/lexicons/french.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          lex={x['id']:x for x in lex_rows}
          def norm(s):
              return re.sub(r"^[^\w]+|[^\w]+$",'',unicodedata.normalize('NFC',str(s or '')).replace('’',"'").casefold(),flags=re.UNICODE)
          introduced={}; high={}; stage_order={'R1':1,'R2':2,'R3':3,'R4':4,'R5':5,'long_term':6}
          visibility=[]; chronology=[]; review_checks=0
          lemma_cache={}
          for r in rows:
              doc=nlp(r['text'])
              toks={(norm(w.text),norm(w.lemma)) for s in doc.sentences for w in s.words}
              lemma_cache[r['id']]=toks
              allsurf='\n'.join(learner_strings(r))
              qtargets={tid for q in r.get('questions',[]) for tid in q.get('target_ids',[])}
              for rv in r.get('review_lexical_targets',[]):
                  review_checks+=1; tid=rv.get('id'); stage=rv.get('review_stage')
                  if tid not in introduced:
                      chronology.append({'passage_id':r['id'],'target_id':tid,'kind':'review_before_introduction'})
                  prior=high.get(tid,0); cur=stage_order.get(stage,0)
                  if cur<prior:
                      chronology.append({'passage_id':r['id'],'target_id':tid,'kind':'stage_regression','prior':prior,'current':cur})
                  high[tid]=max(prior,cur)
                  l=lex.get(tid,{})
                  keys={norm(rv.get('form')),norm(l.get('form')),norm(l.get('match_form')),norm(l.get('lemma'))}-{''}
                  running=any(surface in keys or lemma in keys for surface,lemma in toks)
                  exact=any(re.search(r'(?<!\w)'+re.escape(k)+r'(?!\w)',norm(allsurf),flags=re.UNICODE) for k in keys)
                  linked=tid in qtargets
                  if rv.get('representation')=='running_text':
                      visible=running
                  else:
                      visible=running or exact or linked
                  if not visible:
                      visibility.append({'passage_id':r['id'],'target_id':tid,'form':rv.get('form'),'representation':rv.get('representation'),'keys':sorted(keys)})
              for t in r.get('new_lexical_targets',[]):
                  introduced[t.get('id')]=r['sequence']
          if visibility: blockers.append({'kind':'review_target_visibility','count':len(visibility),'examples':visibility[:30]})
          if chronology: blockers.append({'kind':'review_chronology','count':len(chronology),'examples':chronology[:30]})

          # Exact exposure declarations: current policy is exact literal surface count after Unit 01.
          # Unit 01 is retained as legacy morphology-selected evidence, so formal Gate A remains blocked
          # until those five declarations are normalized or explicitly replaced with exact method evidence.
          legacy=gen.get('legacy_unit01_exposure_variances',[])
          legacy_detail=[]
          for x in legacy:
              r=next(z for z in rows if z['id']==x['passage_id'])
              target=next(t for t in r.get('new_lexical_targets',[]) if t.get('form')==x['form'])
              keys={norm(target.get('form')),norm(target.get('lemma'))}-{''}
              toks=lemma_cache[r['id']]
              lemma_hits=sum(1 for surface,lemma in toks if surface in keys or lemma in keys)
              legacy_detail.append({**x,'stanza_surface_or_lemma_token_hits':lemma_hits})
          if legacy:
              blockers.append({'kind':'legacy_unit01_exposure_declarations_not_exact_current_convention','count':len(legacy),'records':legacy_detail})

          # Future incidental lexical pre-exposure is diagnostic only: French A1 policy does not define
          # a strict no-pre-exposure invariant. The protocol says to enforce leakage only where prohibited.
          first={t['id']:(r['sequence'],t.get('form'),t.get('lemma')) for r in rows for t in r.get('new_lexical_targets',[])}
          exact_future=[]
          for tid,(seq,form,lemma) in first.items():
              keys={norm(form),norm(lemma)}-{''}
              for earlier in rows[:seq-1]:
                  toks=lemma_cache[earlier['id']]
                  if any(surface in keys or lem in keys for surface,lem in toks):
                      exact_future.append({'target_id':tid,'introduced_sequence':seq,'earlier_passage_id':earlier['id']})
                      break
          warnings.append({'kind':'prospective_pre_exposure_diagnostic','hard_rule_applicable':False,'count':len(exact_future),'examples':exact_future[:30],'reason':'No repository French A1 policy found that prohibits incidental pre-exposure; protocol requires future-target leakage blocking only where prohibited.'})

          gate={
            'schema_version':1,
            'date':'2026-08-22',
            'language':'fr','level':'A1',
            'audit':'formal_protocol_gate_a_current_corpus',
            'protocol':'reading/planning/EDUCATOR_RELEASE_VERIFICATION_PROTOCOL.md §3',
            'bound_sha256':a1_sha,'bound_git_blob':a1_blob,
            'scope':{'passages':60,'questions':600,'answers':600,'units':10,'new_targets':100,'review_targets_checked':review_checks},
            'status':'PASS' if not blockers else 'BLOCKED',
            'blocker_count':len(blockers),
            'blockers':blockers,
            'warnings':warnings,
            'checks':{
              'schema_validation':not schema_errors,
              'grid_sequence_unique_ids':len(rows)==60 and [r.get('sequence') for r in rows]==list(range(1,61)) and len(set(ids))==60,
              'unit_grid':units==Counter({u:6 for u in range(1,11)}),
              'question_answer_linkage':not qa_errors,
              'word_band_and_target_source_identity':'PASS via current french_a1_generation_integrity.json',
              'new_target_exposure_current_convention_units02_10':'PASS via current french_a1_generation_integrity.json',
              'legacy_unit01_exact_exposure_declarations':not legacy,
              'review_visibility':not visibility,
              'review_chronology':not chronology,
              'checkpoint_zero_new':'PASS via current french_a1_generation_integrity.json',
              'local_question_target_declarations':'PASS via current french_a1_generation_integrity.json',
              'source_lexicons_unchanged_in_pr':not diff,
              'source_lexicon_sha256':source_hashes,
              'learner_facing_internal_language_hygiene':not banned,
              'unicode_nfc_and_control_hygiene':not unicode_errors,
              'whole_french_15_lens_current_corpus_diagnostic':'PASS',
            },
            'important_boundary':{
              'formal_gate_a_is_release_approval':False,
              'internal_deterministic_audit_is_independent_human_review':False,
              'linguistic_gate_b_completed':False,
              'qa_semantic_gate_c_completed':False,
              'cefr_pedagogy_gate_d_completed':False,
            },
            'release_effect':'NONE_AUTOMATIC: formal Gate A must pass and all later independent/human gates remain required.'
          }
          gate_path=ROOT/'reading/audit/french_a1_formal_gate_a_2026-08-22.json'
          gate_path.write_text(json.dumps(gate,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          coverage=json.loads(Path('/tmp/french_coverage_evidence.current.json').read_text(encoding='utf-8'))
          a1_passages=[x for x in coverage.get('passages',[]) if x.get('level')=='A1']
          a1_chron=[x for x in coverage.get('chronology_findings',[]) if str(x.get('passage_id','')).startswith('fr-a1-')]
          cov={
            'schema_version':1,'date':'2026-08-22','language':'fr','level':'A1',
            'audit':'current_a1_curriculum_coverage_diagnostic',
            'status':'EVIDENCE_ONLY_DO_NOT_AUTOPROMOTE',
            'bound_sha256':a1_sha,'bound_git_blob':a1_blob,
            'method':coverage.get('method'),
            'summary':coverage.get('coverage_summary_by_level',{}).get('A1'),
            'passage_count':len(a1_passages),
            'passages':a1_passages,
            'a1_chronology_findings':a1_chron,
            'decision':coverage.get('decision'),
            'important_boundary':{
              'may_set_estimated_known_token_coverage_from_this_artifact':False,
              'may_set_quality_coverage_check_pass_from_this_artifact':False,
              'reason':'This is curriculum-support evidence, not measured individual learner mastery or independent pedagogical approval.'
            }
          }
          cov_path=ROOT/'reading/audit/french_a1_current_coverage_diagnostic_2026-08-22.json'
          cov_path.write_text(json.dumps(cov,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Align status registries without pretending Gate A passed.
          sp=ROOT/'reading/STATUS.json'; s=json.loads(sp.read_text(encoding='utf-8'))
          f=s.setdefault('french',{}); a1s=f.setdefault('a1_completion',{})
          a1s['formal_protocol_gate_a_status']=gate['status']
          a1s['formal_protocol_gate_a_artifact']=str(gate_path)
          a1s['current_coverage_diagnostic']=str(cov_path)
          a1s['next_gate_a_action']='Resolve the bounded Unit01 legacy exposure-declaration semantics, rerun formal Gate A, then continue substantive record-level coverage/language/Q&A review without auto-promoting evidence.'
          sp.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          rp=ROOT/'reading/RELEASE_STATUS.json'; rs=json.loads(rp.read_text(encoding='utf-8'))
          fr=rs.setdefault('languages',{}).setdefault('french',{})
          fr['release_state']='REOPEN_REQUIRED'; fr['educator_release_ready']=False
          fr['latest_current_a1_revalidation']={
            'date':'2026-08-22','canonical_sha256':a1_sha,'canonical_blob':a1_blob,
            'formal_protocol_gate_a_status':gate['status'],'formal_protocol_gate_a_artifact':str(gate_path),
            'current_coverage_diagnostic':str(cov_path),
            'release_evidence_completeness_gate_status':'FAIL',
            'release_evidence_completeness_artifact':'reading/audit/french_current_deterministic_gate_a_2026-08-22.json',
            'release_evidence_open_findings':2160,
            'independent_semantic_native_educator_review':'PENDING'
          }
          fr['reason']='Current A1 structural/content diagnostics pass except the formal Gate-A exact-exposure requirement remains blocked by five legacy Unit01 declaration semantics. The separate release-evidence completeness gate also remains FAIL, and required independent language/pedagogy/human review is incomplete.'
          rp.write_text(json.dumps(rs,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print(json.dumps({'formal_gate_a':gate['status'],'gate_a_blockers':[b['kind'] for b in blockers],'coverage_summary':cov['summary']},ensure_ascii=False,indent=2))
          PY

      - name: Remove one-shot workflow and commit durable evidence only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/french-a1-substantive-gate-a.yml
          git add -A
          # Historical whole/coverage artifacts were restored before this point.
          git diff --cached -- reading/audit/french_final_whole_audit.json reading/audit/french_coverage_evidence_2026-08-19.json reading/audit/french_curriculum_exposure_ledger_2026-08-19.json
          git commit -m 'Substantively revalidate French A1 Gate A evidence [skip ci]'
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
