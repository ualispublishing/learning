name: Audit Urdu A1 final integrity

on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/audit_urdu_a1_final_integrity.py'
      - '.github/workflows/audit-urdu-a1-final-integrity.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run independent integrity audit
        id: validate
        continue-on-error: true
        run: python reading/tools/audit_urdu_a1_final_integrity.py
      - name: Commit integrity report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/urdu_a1_final_integrity_2026-08-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Urdu A1 final integrity audit [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
      - name: Enforce audit result
        if: steps.validate.outcome == 'failure'
        run: exit 1
