name: French A1 later review opportunity micro summary
on:
  push:
    branches: [repair/french-a1-coverage-2026-08-19]
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit R2/R3 window opportunities only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('reading/audit/french_a1_later_review_opportunities_2026-08-19.json').read_text(encoding='utf-8'))
          out={'schema_version':1,'date':'2026-08-19','language':'fr','level':'A1','targets':{}}
          for tid,d in x['targets'].items():
            out['targets'][tid]={'lemma':d['lemma'],'intro':d['intro'],'r2_window_hits':d['r2_window_hits'],'r3_window_hits':d['r3_window_hits']}
          Path('reading/audit/french_a1_later_review_opportunities_micro_2026-08-19.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit micro summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_a1_later_review_opportunities_micro_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Condense French A1 later review opportunities [skip ci]'
          git push origin HEAD:repair/french-a1-coverage-2026-08-19
