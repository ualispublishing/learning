name: French A1 Unit 07 targeted regression repair
on:
  push:
    branches: [repair/french-a1-coverage-2026-08-19]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair u07p04 exposure count and stale route questions
        run: |
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          path=Path('reading/french/a1/passages.jsonl')
          rows=[json.loads(x) for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          r=next(x for x in rows if x['id']=='fr-a1-u07-p04')
          if r['revision']!=5:
              raise SystemExit(f'unexpected u07p04 revision {r["revision"]}; expected 5')
          targets={t['id']:t for t in r['new_lexical_targets']}
          q={x['id']:x for x in r['questions']}
          a={x['id']:x for x in r['answer_key']}
          def count(form): return len(re.findall(rf'(?<!\w){re.escape(form)}(?!\w)',r['text'],flags=re.I|re.UNICODE))
          actual_gauche=count('gauche'); actual_droite=count('droite')
          if actual_gauche!=5 or actual_droite!=3:
              raise SystemExit(f'unexpected current target counts gauche={actual_gauche}, droite={actual_droite}')
          targets['fr-rank-0721']['exposures_in_text']=actual_gauche
          targets['fr-rank-0276']['exposures_in_text']=actual_droite
          q['q7']['prompt']='D’après le texte, ils tournent d’abord à _____ : « gauche » ou « droite » ?'
          q['q9']['prompt']='La bibliothèque est du côté gauche. Complète : Tourne à _____. '
          # Normalize the trailing space immediately; kept separate above for visual auditability.
          q['q9']['prompt']=q['q9']['prompt'].strip()
          if a['a7']['answer']!='« gauche ».' or a['a9']['answer']!='gauche':
              raise SystemExit('answer drift for q7/q9')
          r['revision']=6
          r['quality']['status']='draft'
          for field in ['linguistic_review','pedagogical_review','coverage_check','answer_key_check','schema_check']:
              r['quality'][field]='pending'
          r['quality'].setdefault('notes',[]).append('2026-08-19 targeted regression repair: synchronized gauche/droite exposures_in_text with revised prose and removed stale carrefour/café assumptions from q7/q9.')
          if targets['fr-rank-0721']['exposures_in_text']!=count('gauche') or targets['fr-rank-0276']['exposures_in_text']!=count('droite'):
              raise SystemExit('post-repair target exposure mismatch')
          if 'carrefour' in q['q7']['prompt'].casefold() or 'café' in q['q9']['prompt'].casefold():
              raise SystemExit('stale route assumption remains')
          path.write_text('\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in rows)+'\n',encoding='utf-8')
          h=hashlib.sha256(path.read_bytes()).hexdigest()
          out={'schema_version':1,'date':'2026-08-19','language':'fr','level':'A1','passage_id':r['id'],'status':'REPAIRED_PENDING_FULL_REGRESSION','revision':r['revision'],'target_exposure_counts':{'gauche':actual_gauche,'droite':actual_droite},'question_repairs':{'q7':q['q7']['prompt'],'q9':q['q9']['prompt']},'answer_checks':{'q7':a['a7']['answer'],'q9':a['a9']['answer']},'post_repair_a1_sha256':h}
          Path('reading/audit/french_a1_u07p04_target_question_regression_repair_2026-08-19.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit targeted repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a1/passages.jsonl reading/audit/french_a1_u07p04_target_question_regression_repair_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix French A1 Unit 07 repair regressions [skip ci]'
          git push origin HEAD:repair/french-a1-coverage-2026-08-19
