name: French A1 Unit 07 contrast-question repair
on:
  push:
    branches: [repair/french-a1-coverage-2026-08-19]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make u07p05 q8 uniquely defensible
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          path=Path('reading/french/a1/passages.jsonl')
          before=hashlib.sha256(path.read_bytes()).hexdigest(); expected='5b8780d6d4dfbc01d3ac0856042672d3f05f219a3419607334e70e29221deed3'
          if before!=expected: raise SystemExit(f'input hash drift {before} != {expected}')
          rows=[json.loads(x) for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          p=next(x for x in rows if x['id']=='fr-a1-u07-p05')
          q=next(x for x in p['questions'] if x['id']=='q8'); a=next(x for x in p['answer_key'] if x['id']=='a8')
          old=q['prompt']; expected_old='On veut aller au parc. Quel mot convient pour ce qu’on suit : « chemin » ou « rue » ?'
          if old!=expected_old: raise SystemExit(f'q8 drift: {old!r}')
          if a['answer']!='chemin': raise SystemExit(f'a8 drift: {a["answer"]!r}')
          q['prompt']='Dans un parc, on marche sur un petit _____ entre les arbres : « chemin » ou « rue » ?'
          p['revision']=int(p.get('revision') or 0)+1
          p['quality']['status']='draft'
          for f in ['linguistic_review','pedagogical_review','coverage_check','answer_key_check','schema_check']: p['quality'][f]='pending'
          p['quality'].setdefault('notes',[]).append('2026-08-19 educator recertification: repaired q8 contrast ambiguity; the old prompt allowed both suivre un chemin and suivre une rue, while the new park-path context has one clearly best answer.')
          path.write_text('\n'.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in rows)+'\n',encoding='utf-8')
          after=hashlib.sha256(path.read_bytes()).hexdigest()
          out={'schema_version':1,'date':'2026-08-19','language':'fr','level':'A1','passage_id':p['id'],'question_id':'q8','status':'REPAIRED_PENDING_FULL_REGRESSION','old_prompt':old,'new_prompt':q['prompt'],'answer':a['answer'],'rationale':'Old transfer context admitted both chemin and rue as natural; new park-path context makes chemin uniquely defensible.','input_a1_hash':before,'post_repair_a1_hash':after,'revision':p['revision']}
          Path('reading/audit/french_a1_u07p05_q8_ambiguity_repair_2026-08-19.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit ambiguity repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a1/passages.jsonl reading/audit/french_a1_u07p05_q8_ambiguity_repair_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair French A1 Unit 07 contrast ambiguity [skip ci]'
          git push origin HEAD:repair/french-a1-coverage-2026-08-19
