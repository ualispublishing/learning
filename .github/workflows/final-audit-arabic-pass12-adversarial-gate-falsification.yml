name: Final Arabic audit pass 12 - adversarial gate falsification
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/final_audit_arabic_pass12_adversarial_gate_falsification.py'
      - '.github/workflows/final-audit-arabic-pass12-adversarial-gate-falsification.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run final adversarial Pass 12
        id: pass12
        continue-on-error: true
        run: python reading/tools/final_audit_arabic_pass12_adversarial_gate_falsification.py
      - name: Synchronize final-review status from Pass 12
        if: always()
        run: python reading/tools/update_arabic_final_review_status.py
      - name: Commit Pass 12 evidence and synchronized status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            reading/audit/final_arabic_pass12_adversarial_gate_falsification.json \
            reading/STATUS.json
          if git diff --cached --quiet; then
            echo 'No Pass 12/status changes to commit'
          else
            git commit -m 'Record final Arabic audit pass 12 and approval state [skip ci]'
            git fetch origin main
            git rebase --autostash origin/main
            git push origin HEAD:main
          fi
      - name: Require genuine final approval
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p12=json.loads(Path('reading/audit/final_arabic_pass12_adversarial_gate_falsification.json').read_text(encoding='utf-8'))
          status=json.loads(Path('reading/STATUS.json').read_text(encoding='utf-8'))
          approved=(
              p12.get('status') == 'PASS'
              and p12.get('final_approval') is True
              and not p12.get('hard_regressions')
              and not p12.get('final_approval_blockers')
              and status.get('arabic_final_review',{}).get('final_approval') is True
              and status.get('arabic',{}).get('formal_final_approval') is True
              and status.get('approved_passages') == 360
          )
          if not approved:
              raise SystemExit(f'Arabic final approval remains closed: pass12={p12.get("status")} status_review={status.get("arabic_final_review",{})}')
          print('ARABIC_FINAL_APPROVAL=TRUE passages=360')
          PY
