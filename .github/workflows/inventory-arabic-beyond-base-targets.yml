name: Inventory Arabic beyond-base targets
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/inventory_arabic_beyond_base_targets.py'
      - '.github/workflows/inventory-arabic-beyond-base-targets.yml'
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/inventory_arabic_beyond_base_targets.py
      - name: Commit inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_beyond_base_target_inventory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inventory Arabic beyond-base target conventions [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
