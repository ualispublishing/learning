name: Language bounded repair

on:
  push:
    branches:
      - 'repair/**'
    paths:
      - 'reading/audit/manifests/*.json'
      - 'reading/audit/manifests/**/*.json'
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - 'reading/audit/manifests/*.json'
      - 'reading/audit/manifests/**/*.json'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: language-bounded-repair-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find changed repair manifests
        id: manifests
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            base='${{ github.event.pull_request.base.ref }}'
            git fetch origin "$base"
            git diff --name-only "origin/$base...HEAD" -- reading/audit/manifests \
              | grep -E '\.json$' | sort -u > /tmp/manifests.txt || true
          else
            before='${{ github.event.before }}'
            head='${{ github.sha }}'
            if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git show --pretty='' --name-only "$head" -- reading/audit/manifests \
                | grep -E '\.json$' | sort -u > /tmp/manifests.txt || true
            else
              git diff --name-only "$before" "$head" -- reading/audit/manifests \
                | grep -E '\.json$' | sort -u > /tmp/manifests.txt || true
            fi
          fi
          if [[ ! -s /tmp/manifests.txt ]]; then
            echo 'No changed bounded-repair manifests.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat /tmp/manifests.txt
          echo 'found=true' >> "$GITHUB_OUTPUT"

      - name: Fail closed on duplicate input targets
        if: steps.manifests.outputs.found == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          manifests = [Path(x.strip()) for x in Path('/tmp/manifests.txt').read_text().splitlines() if x.strip()]
          targets = []
          for path in manifests:
              data = json.loads(path.read_text(encoding='utf-8'))
              targets.append(data['input_file'])
          duplicates = sorted(path for path, count in Counter(targets).items() if count > 1)
          if duplicates:
              raise SystemExit(f'FAIL CLOSED: multiple changed manifests target the same corpus file: {duplicates}')
          PY

      - name: Apply and verify bounded repairs
        if: steps.manifests.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/generated-paths.txt
          while IFS= read -r manifest; do
            [[ -z "$manifest" ]] && continue

            # Idempotent resume: if this exact manifest has already produced evidence
            # bound to the current corpus, verify it and do not attempt to apply twice.
            if python - "$manifest" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          post = Path(manifest['post_evidence_file'])
          if not post.exists():
              raise SystemExit(1)
          evidence = json.loads(post.read_text(encoding='utf-8'))
          current = hashlib.sha256(Path(manifest['input_file']).read_bytes()).hexdigest()
          if current != evidence.get('bound_sha256'):
              raise SystemExit(1)
          print(f"Already applied at {current}; verifying only: {sys.argv[1]}")
          PY
            then
              python reading/tools/run_bounded_assessment_repairs.py "$manifest" --verify
              continue
            fi

            python reading/tools/validate_bounded_repair_manifest.py "$manifest"
            python reading/tools/run_bounded_assessment_repairs.py "$manifest"
            python reading/tools/run_bounded_assessment_repairs.py "$manifest" --verify
            python - "$manifest" <<'PY' >> /tmp/generated-paths.txt
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(data['input_file'])
          print(data['repair_evidence_file'])
          print(data['post_evidence_file'])
          PY
          done < /tmp/manifests.txt
          sort -u -o /tmp/generated-paths.txt /tmp/generated-paths.txt
          cat /tmp/generated-paths.txt

      - name: Commit only generated corpus/evidence outputs
        if: steps.manifests.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            git add -- "$path"
          done < /tmp/generated-paths.txt
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Apply bounded language assessment repair [skip ci]'
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            target='${{ github.event.pull_request.head.ref }}'
          else
            target='${{ github.ref_name }}'
          fi
          for attempt in 1 2 3; do
            if git push origin "HEAD:$target"; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo 'git push failed after 3 transport retries' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
