name: Apply Urdu A1 Wave 3 metadata alignment

on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/apply_urdu_a1_wave3_metadata_alignment.py'
      - '.github/workflows/apply-urdu-a1-wave3-metadata-alignment.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply Wave 3 metadata alignment
        run: python reading/tools/apply_urdu_a1_wave3_metadata_alignment.py
      - name: Commit Wave 3 alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/audit/urdu_a1_wave3_metadata_alignment_2026-08-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Align Urdu A1 metadata after audit [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
