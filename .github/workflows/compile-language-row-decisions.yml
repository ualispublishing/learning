name: Compile language row decisions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit/language-workbooks/v1.0/arabic_sentence_editorial_audit_001_250.json'
      - 'audit/language-workbooks/v1.0/arabic_sentence_editorial_audit_251_500.json'
      - 'audit/language-workbooks/v1.0/arabic_sentence_editorial_audit_501_750.json'
      - 'audit/language-workbooks/v1.0/arabic_sentence_editorial_audit_751_1000.json'
      - 'audit/language-workbooks/v1.0/arabic_sentence_second_pass_amendments.json'
      - 'audit/language-workbooks/v1.0/french_sentence_editorial_audit_001_250.json'
      - 'audit/language-workbooks/v1.0/french_sentence_editorial_audit_251_500.json'
      - 'audit/language-workbooks/v1.0/french_sentence_editorial_audit_501_750.json'
      - 'audit/language-workbooks/v1.0/french_sentence_editorial_audit_751_1000.json'
      - 'audit/language-workbooks/v1.0/french_sentence_second_pass_amendments.json'
      - 'audit/language-workbooks/v1.0/urdu_sentence_editorial_audit.json'
      - 'audit/language-workbooks/v1.0/urdu_sentence_editorial_audit_251_500.json'
      - 'audit/language-workbooks/v1.0/urdu_sentence_editorial_audit_501_750.json'
      - 'audit/language-workbooks/v1.0/urdu_sentence_editorial_audit_751_1000.json'
      - 'audit/language-workbooks/v1.0/urdu_sentence_second_pass_amendments.json'
      - 'scripts/compile_sentence_row_decisions_v1.py'
      - '.github/workflows/compile-language-row-decisions.yml'

permissions:
  contents: write

jobs:
  compile-row-decisions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile row decisions from completed audits
        run: python scripts/compile_sentence_row_decisions_v1.py

      - name: Commit deterministic row-decision artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add curation/language-workbooks/v1.0/*_sentence_row_decisions.json
          git add curation/language-workbooks/v1.0/sentence_row_decision_summary.json
          if git diff --cached --quiet; then
            echo 'No row-decision changes to commit.'
          else
            git commit -m 'Compile audited sentence row decisions'
            git push
          fi

# Generated QA, render, release, and visual-audit files are deliberately excluded.
# They are downstream evidence and must never trigger an upstream curation recompile.
