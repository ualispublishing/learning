name: Promote Urdu B1 Unit 2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/promote-urdu-b1-u02.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Validate, append Unit 2, and advance frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root = Path('.')
          stage = root / 'reading/audit/urdu_b1_u02_generation_candidate'
          target = root / 'reading/urdu/b1/passages.jsonl'
          schema = json.loads((root / 'reading/schema/passage.schema.json').read_text(encoding='utf-8'))
          req = set(schema['required'])
          ptypes = set(schema['properties']['passage_type']['enum'])
          domains = set(schema['properties']['domains']['items']['enum'])
          qtypes = set(schema['$defs']['question']['properties']['type']['enum'])
          strategies = set(schema['$defs']['newLexicalTarget']['properties']['context_strategy']['items']['enum'])

          expected_existing_ids = [f'ur-b1-u01-p{i:02d}' for i in range(1, 7)]
          expected_ids = [f'ur-b1-u02-p{i:02d}' for i in range(1, 7)]
          expected_seq = list(range(7, 13))
          expected_targets = [
              'ur-rank-1205','ur-rank-1341','ur-rank-1143',
              'ur-rank-1114','ur-rank-1115','ur-rank-1123',
              'ur-rank-1119','ur-rank-1133','ur-rank-1173',
              'ur-rank-1343','ur-rank-1351','ur-rank-1178',
              'ur-rank-1358','ur-rank-1326','ur-rank-1137'
          ]

          def jl(path):
              return [json.loads(x) for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]

          a1 = jl(root / 'reading/urdu/a1/passages.jsonl')
          a2 = jl(root / 'reading/urdu/a2/passages.jsonl')
          b1 = jl(target)
          if len(a1) != 60 or len(a2) != 60:
              raise SystemExit('Fail closed: Urdu A1/A2 must each contain 60 canonical passages')
          if len(b1) != 6 or [r['sequence'] for r in b1] != list(range(1, 7)) or [r['id'] for r in b1] != expected_existing_ids:
              raise SystemExit('Fail closed: Urdu B1 must contain exactly canonical Unit 1 before Unit 2 promotion')

          before = target.read_bytes()
          before_sha = hashlib.sha256(before).hexdigest()
          taught = {t['id'] for r in a1 + a2 + b1 for t in r.get('new_lexical_targets', [])}
          collision = sorted(taught.intersection(expected_targets))
          if collision:
              raise SystemExit(f'Fail closed: Unit 2 target freshness collision: {collision}')

          rows = []
          learner = []
          for i in range(1, 7):
              path = stage / f'ur-b1-u02-p{i:02d}.json'
              if not path.exists():
                  raise SystemExit(f'Missing candidate: {path}')
              r = json.loads(path.read_text(encoding='utf-8'))
              r['word_count'] = len(r['text'].split())
              r['sentence_count'] = r['text'].count('۔')
              for t in r.get('new_lexical_targets', []):
                  t['exposures_in_text'] = r['text'].count(t['form'])
              # P1's planned Unit-1 review target is metadata-only rather than an exact running-text recycle.
              for t in r.get('review_lexical_targets', []):
                  if r['id'] == 'ur-b1-u02-p01' and t['id'] == 'ur-rank-1036' and t['representation'] == 'running_text' and t['form'] not in r['text']:
                      t['representation'] = 'other'
              path.write_text(json.dumps(r, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
              rows.append(r)
              learner += [r['title'], r['text']]
              learner += [q['prompt'] for q in r['questions']]
              learner += [a['answer'] for a in r['answer_key']]

          if [r['id'] for r in rows] != expected_ids or [r['sequence'] for r in rows] != expected_seq:
              raise SystemExit('Unit 2 ID/sequence contract failed')
          if [r['passage_type'] for r in rows] != ['instructional','reinforcement','interleaved','transfer','integration','checkpoint']:
              raise SystemExit('Unit 2 role cycle failed')
          if [len(r['new_lexical_targets']) for r in rows] != [3,3,3,3,3,0]:
              raise SystemExit('Unit 2 target distribution failed')
          if [t['id'] for r in rows[:5] for t in r['new_lexical_targets']] != expected_targets:
              raise SystemExit('Unit 2 target order/identity failed')
          if any(t['exposures_in_text'] < 1 for r in rows for t in r['new_lexical_targets']):
              raise SystemExit('Unit 2 new target absent from learner text')
          if not {'profile','workplace scenario','email'}.issubset({r['genre'] for r in rows}):
              raise SystemExit('Required Unit 2 genres missing')

          p6 = rows[-1]
          if p6['new_lexical_targets'] or not p6['speed_training']['timed'] or p6['speed_training']['new_word_policy'] != 'none':
              raise SystemExit('Unit 2 P6 checkpoint policy failed')
          review_forms = {t['form'] for t in p6['review_lexical_targets'] if t['representation'] == 'running_text'}
          expected_forms = {t['form'] for r in rows[:5] for t in r['new_lexical_targets']}
          if review_forms != expected_forms or any(form not in p6['text'] for form in expected_forms):
              raise SystemExit('Unit 2 P6 does not visibly recycle all 15 new targets')

          for r in rows:
              missing = req - set(r)
              if missing:
                  raise SystemExit(f'{r["id"]} missing required fields: {sorted(missing)}')
              if r['passage_type'] not in ptypes or any(d not in domains for d in r['domains']):
                  raise SystemExit(f'Enum failure: {r["id"]}')
              if len(r['questions']) != 10 or len(r['answer_key']) != 10:
                  raise SystemExit(f'10x10 failed: {r["id"]}')
              if not 220 <= r['word_count'] <= 320:
                  raise SystemExit(f'B1 word band failed {r["id"]}: {r["word_count"]}')
              amap = {a['id']: a for a in r['answer_key']}
              if len(amap) != 10:
                  raise SystemExit(f'Duplicate answer IDs: {r["id"]}')
              for t in r.get('new_lexical_targets', []):
                  if any(x not in strategies for x in t['context_strategy']):
                      raise SystemExit(f'Invalid context strategy {r["id"]}/{t["id"]}')
              for q in r['questions']:
                  if q['type'] not in qtypes or q['answer_id'] not in amap or amap[q['answer_id']]['question_id'] != q['id']:
                      raise SystemExit(f'QA link/type failure {r["id"]}/{q["id"]}')

          learner_text = '\n'.join(learner)
          if re.search(r'[A-Za-z\u0900-\u097F]', learner_text):
              raise SystemExit('Learner-facing Latin/Devanagari leakage')

          append_payload = ''.join(json.dumps(r, ensure_ascii=False, separators=(',', ':')) + '\n' for r in rows).encode('utf-8')
          target.write_bytes(before + append_payload)
          after = target.read_bytes()
          if not after.startswith(before) or after[:len(before)] != before:
              raise SystemExit('Pre-existing Urdu B1 canonical bytes changed')
          final = jl(target)
          if len(final) != 12 or [r['sequence'] for r in final] != list(range(1, 13)) or [r['id'] for r in final[-6:]] != expected_ids:
              raise SystemExit('Canonical B1 post-append check failed')

          (stage / 'manifest.json').write_text(json.dumps({
              'schema_version': 1, 'project_id': 'LANG-A1C2', 'language': 'ur', 'cefr': 'B1', 'unit': 2,
              'date': '2026-08-24', 'status': 'CANONICALIZED', 'canonical_target': 'reading/urdu/b1/passages.jsonl',
              'sequence_range': [7, 12], 'record_count': 6, 'release_promotion': False
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          validation = {
              'schema_version': 1, 'project_id': 'LANG-A1C2', 'language': 'ur', 'cefr': 'B1', 'unit': 2,
              'date': '2026-08-24', 'canonicalized': True, 'release_promotion': False,
              'word_counts': [r['word_count'] for r in rows],
              'checks': {
                  'prior_a1_a2_60_each': 'PASS', 'prior_b1_unit1_exact': 'PASS',
                  'freshness_across_all_prior_urdu': 'PASS', 'record_count': 'PASS',
                  'sequence_7_through_12': 'PASS', 'role_cycle': 'PASS',
                  'question_answer_10x10': 'PASS', 'bidirectional_links': 'PASS',
                  'new_target_distribution_3_3_3_3_3_0': 'PASS', 'new_target_text_exposure': 'PASS',
                  'required_genres': 'PASS', 'p6_checkpoint_policy': 'PASS', 'p6_all_target_recycling': 'PASS',
                  'learner_script_scan': 'PASS', 'schema_required_fields_enums_and_context_strategies': 'PASS',
                  'b1_word_band': 'PASS', 'preexisting_canonical_bytes_preserved': 'PASS'
              }
          }
          (root / 'reading/audit/urdu_b1_u02_generation_validation_2026-08-24.json').write_text(json.dumps(validation, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          promotion = {
              'schema_version': 1, 'project_id': 'LANG-A1C2', 'language': 'ur', 'cefr': 'B1', 'unit': 2,
              'date': '2026-08-24', 'status': 'CANONICAL_PROMOTION_PASS', 'release_promotion': False,
              'before_record_count': 6, 'after_record_count': 12, 'appended_sequences': expected_seq,
              'appended_ids': expected_ids, 'preexisting_bytes_preserved_exactly': True,
              'canonical_sha256_before': before_sha, 'canonical_sha256_after': hashlib.sha256(after).hexdigest()
          }
          (root / 'reading/audit/urdu_b1_u02_promotion_2026-08-24.json').write_text(json.dumps(promotion, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lexp = root / 'reading/audit/urdu_b1_u02_lexical_sense_check_2026-08-24.json'
          lex = json.loads(lexp.read_text(encoding='utf-8'))
          lex['status'] = 'PASS_FOR_GENERATION_TARGET_SENSES_AND_CANONICAL_FRESHNESS'
          lex['freshness_result'] = 'PASS'
          lex['freshness_scope'] = 'Exact target IDs checked against all canonical Urdu A1, A2, and B1 Unit 1 new_lexical_targets immediately before Unit 2 append.'
          lexp.write_text(json.dumps(lex, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sp = root / 'reading/STATUS.json'
          s = json.loads(sp.read_text(encoding='utf-8'))
          s['current']['canonical_passages'] = 852
          s['current']['remaining_generation_passages'] = 228
          s['current']['active_language'] = 'urdu'
          s['current']['active_level'] = 'B1'
          u = s['languages']['urdu']
          u['generation_state'] = 'B1_IN_PROGRESS'
          u['canonical_passages'] = 132
          u['remaining_generation_passages'] = 228
          u['next_generation_level'] = 'B1'
          sp.write_text(json.dumps(s, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cp = root / 'reading/CONTINUATION.json'
          c = json.loads(cp.read_text(encoding='utf-8'))
          c['production']['canonical_passages'] = 852
          cu = c['production']['urdu']
          cu['state'] = 'B1_GENERATION_IN_PROGRESS'
          cu['canonical_passages'] = 132
          cu['next_generation_level'] = 'B1'
          c['active_frontier']['production'] = {
              'language': 'urdu', 'level': 'B1',
              'action': 'Continue generation-first production from Urdu B1 Unit 3 / sequence 13 using the canonical roadmap and ten-question contract.'
          }
          c['exact_next_actions'] = [
              'Validate the routed state bundle and live canonical counts.',
              'Use reading/planning/ACTIVE_GENERATION_PLAN.json to start guarded Urdu B1 Unit 3 generation at sequence 13.',
              'Keep release/educator verification separate from generation progress.'
          ]
          cp.write_text(json.dumps(c, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pp = root / 'reading/planning/ACTIVE_GENERATION_PLAN.json'
          p = json.loads(pp.read_text(encoding='utf-8'))
          p['active_language'] = 'urdu'; p['active_level'] = 'B1'; p['active_unit'] = 3; p['start_sequence'] = 13
          p['canonical_active_path'] = 'reading/urdu/b1/passages.jsonl'; p['existing_active_level_passages'] = 12
          p['roadmap_lookup'] = '$.levels.B1'
          p['active_unit_roadmap'] = {'unit': 3, 'theme': 'technology in daily life', 'genres': ['explanatory article','opinion','story']}
          pp.write_text(json.dumps(p, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          tp = root / 'reading/TASKS.md'
          t = tp.read_text(encoding='utf-8')
          t = t.replace('Canonical production frontier: **Urdu B1, Unit 2, sequence 7**.', 'Canonical production frontier: **Urdu B1, Unit 3, sequence 13**.', 1)
          t = t.replace('- Urdu: 126/360 generated; A1-A2 complete, B1 in progress.', '- Urdu: 132/360 generated; A1-A2 complete, B1 in progress.', 1)
          t = t.replace('- Project: 846/1080 generated.', '- Project: 852/1080 generated.', 1)
          tp.write_text(t, encoding='utf-8')

          hp = root / 'reading/AGENT_HANDOFF_V2.md'
          h = hp.read_text(encoding='utf-8')
          h = h.replace('- Canonical generated total: **846**.', '- Canonical generated total: **852**.', 1)
          h = h.replace('- Urdu: **126/360**; A1-A2 generation complete and B1 generation in progress.', '- Urdu: **132/360**; A1-A2 generation complete and B1 generation in progress.', 1)
          h = h.replace('Continue **Urdu B1**, starting from Unit 2 / sequence 7, under:', 'Continue **Urdu B1**, starting from Unit 3 / sequence 13, under:', 1)
          h = h.replace('B1 Unit 2 uses the roadmap theme **work and workplace choices** with `profile`, `workplace scenario`, and `email` genres.', 'B1 Unit 3 uses the roadmap theme **technology in daily life** with `explanatory article`, `opinion`, and `story` genres.', 1)
          h = h.replace('resume guarded generation at **Urdu B1 Unit 2 / sequence 7** using the B1 Unit 2 roadmap theme `work and workplace choices`.', 'resume guarded generation at **Urdu B1 Unit 3 / sequence 13** using the B1 Unit 3 roadmap theme `technology in daily life`.', 1)
          hp.write_text(h, encoding='utf-8')

          (root / 'reading/audit/urdu_b1_u02_state_reconcile_2026-08-24.json').write_text(json.dumps({
              'schema_version': 1, 'project_id': 'LANG-A1C2', 'date': '2026-08-24', 'status': 'PASS',
              'canonical_urdu_b1_passages': 12, 'project_canonical_passages': 852, 'urdu_canonical_passages': 132,
              'next_frontier': {'language':'urdu','level':'B1','unit':3,'sequence':13}, 'release_promotion': False
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Refresh and validate live state
        shell: bash
        run: |
          set -euo pipefail
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py

      - name: Commit canonical Unit 2 and state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/b1/passages.jsonl \
                  reading/audit/urdu_b1_u02_generation_candidate \
                  reading/audit/urdu_b1_u02_generation_validation_2026-08-24.json \
                  reading/audit/urdu_b1_u02_promotion_2026-08-24.json \
                  reading/audit/urdu_b1_u02_state_reconcile_2026-08-24.json \
                  reading/audit/urdu_b1_u02_lexical_sense_check_2026-08-24.json \
                  reading/STATUS.json reading/CONTINUATION.json \
                  reading/planning/ACTIVE_GENERATION_PLAN.json \
                  reading/TASKS.md reading/AGENT_HANDOFF_V2.md reading/STATE_MANIFEST.json
          git commit -m 'Add Urdu B1 Unit 2 and advance to Unit 3'
          git pull --rebase origin main
          git push
