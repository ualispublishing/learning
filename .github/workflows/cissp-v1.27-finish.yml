name: Finish CISSP v1.27 release candidate

on:
  push:
    branches:
      - cissp-v1.27-release-20260830
    paths:
      - scripts/finish_cissp_v127_release.py
      - .github/workflows/cissp-v1.27-finish.yml

permissions:
  contents: write

jobs:
  finish-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cissp-v1.27-release-20260830
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finish coherent v1.27 release-candidate state
        run: python scripts/finish_cissp_v127_release.py
      - name: Validate CISSP release candidate
        run: |
          python subjects/cissp/2024-outline/study-site/audit.py
          python subjects/cissp/2024-outline/study-site/question-bank/quality_gate.py
      - name: Remove one-shot helper files
        run: |
          rm scripts/finish_cissp_v127_release.py
          rm .github/workflows/cissp-v1.27-finish.yml
      - name: Commit exact release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Build CISSP Atlas v1.27 release candidate'
          git push origin HEAD:cissp-v1.27-release-20260830
