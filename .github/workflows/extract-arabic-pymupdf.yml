name: Extract Arabic common-word source with PyMuPDF

on:
  push:
    paths:
      - 'scripts/extract_al_said_pymupdf.py'
      - '.github/workflows/extract-arabic-pymupdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF
        run: python -m pip install --quiet pymupdf
      - name: Download source PDF
        run: |
          curl --http1.1 -k -L --fail --retry 5 --retry-all-errors \
            'https://revistaseug.ugr.es/index.php/meaharabe/article/download/23634/25105/99973' \
            -o /tmp/al_said_2023.pdf
      - name: Inspect first table page token geometry
        run: |
          python - <<'PY'
          import pymupdf, re
          doc=pymupdf.open('/tmp/al_said_2023.pdf')
          ar=re.compile(r'[\u0621-\u064a]')
          for pno in (18,19):
              print('=== PDF PAGE',pno+1,'===')
              for w in doc[pno].get_text('words', sort=False):
                  x0,y0,x1,y1,text,block,line,word=w
                  if ar.search(text) or re.fullmatch(r'[0-9.]+',text):
                      print(f'{x0:.1f}\t{y0:.1f}\t{x1:.1f}\t{y1:.1f}\tb{block}l{line}\t{text!r}')
          PY
      - name: Extract and validate ranks
        run: python scripts/extract_al_said_pymupdf.py --pdf /tmp/al_said_2023.pdf
      - name: Commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/al_said_2023_msa1000.csv audit/al_said_2023_msa1000_debug.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract published MSA 1000 with PyMuPDF [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
