name: Build final Arabic Pass07 A2 short snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/build_final_arabic_pass07_a2_short_snapshot.py'
      - '.github/workflows/build-final-arabic-pass07-a2-short-snapshot.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact snapshot
        run: python reading/tools/build_final_arabic_pass07_a2_short_snapshot.py
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_pass07_a2_short_snapshot.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build A2 Pass07 short-passage snapshot [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
