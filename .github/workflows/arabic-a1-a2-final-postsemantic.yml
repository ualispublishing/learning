name: Arabic A1+A2 final postsemantic

on:
  push:
    branches: [audit/arabic-a1-a2-integrated-2026-08-23]
    paths:
      - 'reading/tools/audit_arabic_a1_a2_final_postsemantic.py'
      - '.github/workflows/arabic-a1-a2-final-postsemantic.yml'

permissions:
  contents: write

concurrency:
  group: arabic-a1-a2-final-postsemantic
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/arabic-a1-a2-integrated-2026-08-23
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run final post-semantic validator
        run: python reading/tools/audit_arabic_a1_a2_final_postsemantic.py
      - name: Commit final evidence
        if: always()
        run: |
          if [ ! -f reading/audit/arabic_a1_a2_final_postsemantic_validation_2026-08-23.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/audit/arabic_a1_a2_final_postsemantic_validation_2026-08-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Arabic A1/A2 final post-semantic validation [skip ci]"
          git fetch origin audit/arabic-a1-a2-integrated-2026-08-23
          git rebase origin/audit/arabic-a1-a2-integrated-2026-08-23
          git push origin HEAD:audit/arabic-a1-a2-integrated-2026-08-23
