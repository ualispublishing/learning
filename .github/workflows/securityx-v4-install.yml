name: Install SecurityX CAS-005 v4.1

on:
  push:
    branches: [securityx-pages-clean-final]
    paths:
      - '.securityx-pages/txz/**'
      - '.github/workflows/securityx-v4-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean release branch
        uses: actions/checkout@v4
        with:
          ref: securityx-pages-clean-final
          fetch-depth: 0

      - name: Reconstruct and verify audited archive
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .securityx-pages/txz -maxdepth 1 -type f -name 'part-*.txt' | wc -l | tr -d ' ')
          echo "Transport parts: $count"
          test "$count" -eq 22
          cat .securityx-pages/txz/part-*.txt | base64 -d > /tmp/securityx.tar.xz
          echo '55ae0aed8973791b9d2847c0559b8f5cc863c5fbb3aa50e3e47e001f641618fa  /tmp/securityx.tar.xz' | sha256sum -c -
          rm -rf /tmp/securityx-expanded
          mkdir -p /tmp/securityx-expanded
          tar -xJf /tmp/securityx.tar.xz -C /tmp/securityx-expanded
          src=/tmp/securityx-expanded/SecurityX_CAS005_GitHub_Pages_v4_1
          test -f "$src/index.html"
          test -f "$src/app.js"
          test -f "$src/styles.css"
          test -f "$src/data/final_audit.json"
          test -f "$src/data/quality_audit_v4_1.json"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/securityx-expanded/SecurityX_CAS005_GitHub_Pages_v4_1/data/final_audit.json')
          a = json.loads(p.read_text())
          assert a['cards'] == 1156
          assert a['eight_layers_per_card'] == 1156
          assert a['published_blueprint_topics_checked'] == 618
          assert a['published_blueprint_topics_mapped'] == 618
          assert a['objective_sections'] == 23
          assert a['practice_questions'] == 100
          assert a['pbq_drills'] == 12
          assert a['sources'] == 42
          assert a['prerequisite_cycles'] == 0
          assert a['duplicate_fronts'] == 0
          assert a['duplicate_direct_answers'] == 0
          assert a['structural_issues'] == []
          assert sorted(a['practice_answer_letter_distribution'].values()) == [25, 25, 25, 25]
          assert a['practice_domain_distribution'] == {
              'Governance, Risk, and Compliance': 20,
              'Security Architecture': 27,
              'Security Engineering': 31,
              'Security Operations': 22,
          }
          behavior = a['browser_study_behavior']
          assert behavior['retrieval_gate'] is True
          assert behavior['eight_layer_reveal'] is True
          assert behavior['local_spaced_review'] is True
          assert behavior['interval_days'] == [0, 1, 3, 7, 14, 30, 60, 120]
          print('SecurityX v4.1 audit assertions passed')
          PY

      - name: Install canonical site and permanent Pages workflow
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/securityx-expanded/SecurityX_CAS005_GitHub_Pages_v4_1
          dst=subjects/securityx/cas-005/study-site
          rm -rf "$dst"
          mkdir -p "$dst"
          cp -a "$src"/. "$dst"/
          rm -rf .securityx-pages
          rm -f .github/workflows/securityx-v4-install.yml
          mkdir -p .github/workflows
          cat > .github/workflows/deploy-securityx-pages.yml <<'YAML'
          name: Deploy SecurityX study site to GitHub Pages

          on:
            push:
              branches: ["main"]
              paths:
                - "subjects/securityx/cas-005/study-site/**"
                - ".github/workflows/deploy-securityx-pages.yml"
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: "pages"
            cancel-in-progress: true

          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Configure Pages
                  uses: actions/configure-pages@v5
                - name: Upload SecurityX static site
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: subjects/securityx/cas-005/study-site
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install audited SecurityX CAS-005 v4.1 study site'
          git push origin HEAD:securityx-pages-clean-final
