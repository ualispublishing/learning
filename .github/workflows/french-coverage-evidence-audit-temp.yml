name: TEMP French coverage evidence audit

on:
  push:
    branches: [main]
    paths:
      - 'reading/tools/audit_french_curriculum_coverage.py'
      - 'reading/run_french_coverage_evidence_audit.request'
      - '.github/workflows/french-coverage-evidence-audit-temp.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install deterministic NLP dependency
        run: python -m pip install --disable-pip-version-check 'stanza==1.10.1'
      - name: Run French curriculum coverage evidence audit
        run: python reading/tools/audit_french_curriculum_coverage.py
      - name: Commit durable audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_curriculum_exposure_ledger_2026-08-19.json reading/audit/french_coverage_evidence_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit French curriculum coverage evidence [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
