name: Remediate final Arabic Pass 04 answer evidence
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/remediate_final_arabic_pass04_answer_evidence.py'
      - '.github/workflows/remediate-final-arabic-pass04-answer-evidence.yml'
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install structural validator dependency
        run: python -m pip install --quiet jsonschema
      - name: Apply nine answer-evidence repairs
        run: python reading/tools/remediate_final_arabic_pass04_answer_evidence.py
      - name: Recompute structural integrity
        run: python reading/tools/final_audit_arabic_pass01_data_integrity.py
      - name: Recompute Pass 03 question composition
        run: python reading/tools/final_audit_arabic_pass03_question_composition.py
      - name: Require Pass 03 to remain clean
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('reading/audit/final_arabic_pass03_question_composition.json').read_text(encoding='utf-8'))
          if p.get('status') != 'PASS' or p.get('totals',{}).get('review_flags') != 0:
              raise SystemExit(f"Pass03 regression: status={p.get('status')} flags={p.get('totals',{}).get('review_flags')}")
          print('pass03=PASS flags=0')
          PY
      - name: Recompute Pass 04 answer-evidence alignment
        run: python reading/tools/final_audit_arabic_pass04_answer_evidence_alignment.py
      - name: Require Pass 04 clean with adjudications current
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('reading/audit/final_arabic_pass04_answer_evidence_alignment.json').read_text(encoding='utf-8'))
          t=p.get('totals',{})
          if p.get('status') != 'PASS':
              raise SystemExit(f"Pass04 not PASS: {p.get('status')}")
          if t.get('unresolved_review_flags') != 0 or t.get('review_flags') != 0:
              raise SystemExit(f"Pass04 unresolved flags remain: {t}")
          if t.get('manual_adjudications_applied') != 21:
              raise SystemExit(f"Expected 21 manual adjudications, got {t.get('manual_adjudications_applied')}")
          if t.get('stale_adjudications') != 0:
              raise SystemExit(f"Stale Pass04 adjudications present: {p.get('stale_adjudication_keys')}")
          print(f"pass04=PASS raw_candidates={t.get('raw_blocking_candidates_before_adjudication')} manual_adjudications=21 unresolved=0")
          PY
      - name: Synchronize current final-review status
        run: python reading/tools/update_arabic_final_review_status.py
      - name: Commit canonical remediation and refreshed affected audits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            reading/arabic/a2/passages.jsonl \
            reading/arabic/c2/passages.jsonl \
            reading/audit/final_arabic_pass01_data_integrity.json \
            reading/audit/final_arabic_pass03_question_composition.json \
            reading/audit/final_arabic_pass04_answer_evidence_alignment.json \
            reading/STATUS.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Close Arabic Pass 04 answer-evidence debt [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
