name: LANG-WB human sign-off validation and promotion status

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/language-workbook-final-human-promotion.yml'
      - 'audit/language-workbooks/v1.0/native-signoffs/*.json'
      - 'scripts/validate_lang_wb_native_signoff.py'
      - 'scripts/validate_lang_wb_signoff_diff.py'
      - 'scripts/workbook_final_human_promotion_gate.py'
  pull_request:
    paths:
      - '.github/workflows/language-workbook-final-human-promotion.yml'
      - 'audit/language-workbooks/v1.0/native-signoffs/*.json'
      - 'scripts/validate_lang_wb_native_signoff.py'
      - 'scripts/validate_lang_wb_signoff_diff.py'
      - 'scripts/workbook_final_human_promotion_gate.py'

permissions:
  contents: read

jobs:
  validate-human-signoffs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate sign-off changes in this push or pull request
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            head="$CURRENT_SHA"
          fi
          echo "Validating native-signoff diff: $base..$head"
          python scripts/validate_lang_wb_signoff_diff.py "$base" "$head"

      - name: Evaluate overall three-language promotion status
        shell: bash
        run: |
          set +e
          python scripts/workbook_final_human_promotion_gate.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "LANG-WB final human promotion gate: PASS"
          elif [ "$code" -eq 2 ]; then
            echo "Submitted sign-off record(s) are valid, but LANG-WB remains on human-review HOLD until the current candidate has valid latest PASS records for Arabic, French, and Urdu."
          else
            exit "$code"
          fi

      - name: Show promotion-gate report
        if: always()
        run: |
          if [ -f audit/language-workbooks/v1.0/final_human_promotion_gate.json ]; then
            cat audit/language-workbooks/v1.0/final_human_promotion_gate.json
          fi
