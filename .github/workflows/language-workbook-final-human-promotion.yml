name: LANG-WB final human promotion gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'audit/language-workbooks/v1.0/native-signoffs/*.json'

permissions:
  contents: read

jobs:
  final-human-promotion-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate latest current-candidate human sign-offs
        run: python scripts/workbook_final_human_promotion_gate.py

      - name: Show promotion-gate report
        if: always()
        run: |
          if [ -f audit/language-workbooks/v1.0/final_human_promotion_gate.json ]; then
            cat audit/language-workbooks/v1.0/final_human_promotion_gate.json
          fi
