name: TEMP Urdu A1 Units 09-10 explanation boilerplate audit

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/urdu-a1-units09-10-explanation-boilerplate-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-urdu-a1-units09-10-explanation-boilerplate
  cancel-in-progress: false

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'audit/urdu-a1-final-deterministic-2026-08-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/urdu-a1-final-deterministic-2026-08-22
      - name: Quantify exact generic learner-facing explanation placeholders
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json

          corpus=Path('reading/urdu/a1/passages.jsonl')
          expected='636f8b2f18b1948ae4155cb605b8ebd989d412f73d0bf82f8269378d4046cc2f'
          got=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if got!=expected: raise SystemExit(f'FAIL CLOSED corpus drift {got}')
          rows=[json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]
          scope=[r for r in rows if r.get('unit') in (9,10)]
          if len(scope)!=12: raise SystemExit(f'FAIL CLOSED expected 12 Unit09-10 records, got {len(scope)}')
          placeholder='متن اور سوال کے مطابق یہی مناسب جواب ہے۔'
          findings=[]; nonempty=[]
          for r in scope:
            for a in r.get('answer_key',[]):
              exp=str(a.get('explanation') or '')
              if exp.strip(): nonempty.append((r['id'],a['id'],exp))
              if exp==placeholder:
                findings.append({'passage_id':r['id'],'answer_id':a['id'],'question_id':a['question_id'],'answer':a.get('answer'),'explanation':exp})
          by_unit={9:0,10:0}
          for f in findings:
            by_unit[int(f['passage_id'].split('-u')[1].split('-')[0])]+=1
          payload={
            'schema_version':1,'date':'2026-08-23','language':'ur','level':'A1','units':[9,10],
            'audit':'exact_generic_answer_explanation_placeholder_inventory','bound_sha256':expected,
            'records':len(scope),'answers':sum(len(r.get('answer_key',[])) for r in scope),
            'nonempty_explanations':len(nonempty),'exact_placeholder_count':len(findings),'counts_by_unit':by_unit,
            'placeholder':placeholder,'findings':findings,
            'status':'PLACEHOLDER_CLASS_CONFIRMED_REQUIRES_HYGIENE_CLEANUP' if findings else 'PASS_NO_EXACT_PLACEHOLDERS',
            'scope_note':'Exact-match diagnostic only. This does not judge the correctness of answer text or the quality of non-placeholder explanations.',
            'release_effect':'NONE_AUTOMATIC: diagnostic only; Urdu A1 remains non-release-ready.'
          }
          Path('reading/audit/urdu_a1_units09_10_explanation_boilerplate_audit_2026-08-23.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'records':len(scope),'answers':payload['answers'],'nonempty_explanations':len(nonempty),'exact_placeholder_count':len(findings),'counts_by_unit':by_unit},ensure_ascii=False))
          PY
      - name: Commit diagnostic evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/urdu_a1_units09_10_explanation_boilerplate_audit_2026-08-23.json
          git rm -f .github/workflows/urdu-a1-units09-10-explanation-boilerplate-temp.yml
          git commit -m 'Audit Urdu A1 Units 09-10 explanation placeholders [skip ci]'
          git push origin HEAD:audit/urdu-a1-final-deterministic-2026-08-22
