name: Finalize French Reading
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/audit_french_final_whole.py'
      - 'reading/tools/audit_french_final_whole_v3.py'
      - 'reading/tools/repair_and_audit_french_final.py'
      - 'reading/tools/repair_and_audit_french_final_v3.py'
      - 'reading/tools/generate_french_c2_unit10_preflight.py'
      - 'reading/tools/approve_french_after_final_audit.py'
      - '.github/workflows/finalize-french-reading.yml'
concurrency:
  group: french-final-canonical-writer
  cancel-in-progress: false
permissions: {contents: write}
jobs:
  final-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema

      - name: Apply confirmed repairs and run whole-French audit v3
        id: final
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python reading/tools/repair_and_audit_french_final_v3.py 2>&1 | tee /tmp/french-final.log

      - name: Approve exact live hash-bound French corpus
        id: approval
        if: steps.final.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python reading/tools/approve_french_after_final_audit.py 2>&1 | tee /tmp/french-approval.log

      - name: Verify final French seal invariants
        id: verify
        if: steps.final.outcome == 'success' && steps.approval.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          audit = json.loads((root / 'reading/audit/french_final_whole_audit.json').read_text())
          repair = json.loads((root / 'reading/audit/french_final_repair_transaction.json').read_text())
          approval = json.loads((root / 'reading/audit/french_final_approval.json').read_text())
          status = json.loads((root / 'reading/STATUS.json').read_text())

          assert audit['status'] == 'PASS'
          assert audit['approval_ready'] is True
          assert audit['audit_pass_count'] == 15
          assert not audit.get('failed_passes')
          assert audit['canonical_passages'] == 360
          assert audit['questions'] == 3600
          assert audit['answers'] == 3600

          assert repair['status'] == 'PASS_READY_FOR_FRENCH_APPROVAL'
          assert repair['audit_status'] == 'PASS'
          assert repair['historical_frontier_locks_preserved'] is True
          assert repair['temporary_source_binding_restored'] is True

          assert approval['status'] == 'APPROVED'
          assert approval['canonical_passages'] == 360
          assert approval['questions'] == 3600
          assert approval['answers'] == 3600
          assert approval['audit_pass_count'] == 15
          assert approval['whole_corpus_sha256'] == audit['whole_corpus_sha256']
          assert approval['level_blobs'] == audit['level_blobs']
          assert approval['repair_final_c2_blob'] == repair['final_c2_blob']
          assert approval['level_blobs']['c2'] == repair['final_c2_blob']
          assert approval['historical_frontier_locks_preserved'] is True
          assert approval['temporary_source_binding_restored'] is True

          assert status['overall_status'] == 'in_progress'
          assert status['active_language'] == 'Urdu'
          assert 'Urdu' not in status.get('paused_languages', [])
          assert status['approved_passages'] == 720
          assert status['french']['state'] == 'APPROVED'
          assert status['french']['formal_final_approval'] is True
          assert status['french']['generation_complete'] is True
          assert status['french']['final_audit']['approval'] == 'APPROVED'
          assert status['french']['final_audit']['whole_corpus_sha256'] == audit['whole_corpus_sha256']
          assert status['french']['final_audit']['level_blobs'] == audit['level_blobs']
          assert status['urdu']['state'] == 'ACTIVE_A1'
          assert status['urdu']['canonical_passages'] == 6

          print('French final seal + Urdu handoff invariants: PASS')
          PY

      - name: Preserve final-review failure logs
        if: steps.final.outcome != 'success' || steps.approval.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          mkdir -p reading/audit
          if [ -f /tmp/french-final.log ]; then cp /tmp/french-final.log reading/audit/french_final_workflow_failure.txt; fi
          if [ -f /tmp/french-approval.log ]; then cp /tmp/french-approval.log reading/audit/french_final_approval_workflow_failure.txt; fi

      - name: Commit only audit-bound canonical state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/c2/passages.jsonl reading/audit reading/STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Seal French reading after final whole-corpus audit [skip ci]'
          git fetch origin main && git rebase --autostash origin/main && git push origin HEAD:main

      - name: Fail if final French seal did not pass
        if: steps.final.outcome != 'success' || steps.approval.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
