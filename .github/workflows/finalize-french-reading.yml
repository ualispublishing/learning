name: Finalize French Reading
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/audit_french_final_whole.py'
      - 'reading/tools/repair_and_audit_french_final.py'
      - 'reading/tools/generate_french_c2_unit10_preflight.py'
      - '.github/workflows/finalize-french-reading.yml'
concurrency:
  group: french-final-canonical-writer
  cancel-in-progress: false
permissions: {contents: write}
jobs:
  final-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Apply confirmed repairs and run whole-French audit
        id: final
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python reading/tools/repair_and_audit_french_final.py 2>&1 | tee /tmp/french-final.log
      - name: Preserve final-review failure log
        if: steps.final.outcome != 'success'
        run: |
          mkdir -p reading/audit
          cp /tmp/french-final.log reading/audit/french_final_workflow_failure.txt || true
      - name: Commit only audit-bound canonical state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/c2/passages.jsonl reading/audit
          git diff --cached --quiet && exit 0
          git commit -m 'Run whole-French final review transaction [skip ci]'
          git fetch origin main && git rebase --autostash origin/main && git push origin HEAD:main
      - name: Fail if final French review did not pass
        if: steps.final.outcome != 'success'
        run: exit 1
