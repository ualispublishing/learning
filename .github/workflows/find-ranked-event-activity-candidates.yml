name: Find ranked event activity candidates
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/find_ranked_event_activity_candidates.py'
      - '.github/workflows/find-ranked-event-activity-candidates.yml'
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/find_ranked_event_activity_candidates.py
      - name: Commit candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_event_activity_rank_candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Find event activity rank candidates [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
