name: Apply Arabic Gate C B1 Unit 2
on:
  push:
permissions:
  contents: write
jobs:
  arabic-gate-c-b1-unit02:
    if: github.event.head_commit.message == 'Run Arabic Gate C B1 Unit 2 now'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact pre-B1-Unit-2 Gate C state
        run: |
          set -euo pipefail
          python reading/tools/validate_continuation_state.py
          test -e reading/audit/arabic_gate_c_decisions_2026-09-05/b1_u01.json
          test ! -e reading/audit/arabic_gate_c_decisions_2026-09-05/b1_u02.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reading/RELEASE_STATUS.json').read_text())['languages']['arabic'];m=json.loads(Path('reading/STATE_MANIFEST.json').read_text());c=r['comprehension_review_progress'];d=r['latest_deterministic_gate']
          assert m['aggregate_sha256']=='94a0aa2de77c0bc9b9ae4c27d13fd5f8baf984f0135e33a0e4d2db893cdcfd79'
          assert r['release_state']=='REOPEN_REQUIRED' and r['educator_release_ready'] is False
          assert (c['fresh_records_reviewed'],c['fresh_qa_pairs_reviewed'],c['fresh_records_with_findings'],c['fresh_findings'])==(126,1260,77,142) and c['levels_completed']==['A1','A2']
          assert d['open_findings']==1080
          PY
      - name: Verify exact-current B1 Unit 2 clean Gate C batch
        run: python reading/tools/apply_arabic_gate_c_b1_unit02.py
      - name: Record and synchronize clean Gate C evidence
        run: |
          python reading/tools/record_arabic_gate_c_b1_unit02_decisions.py
          python reading/tools/sync_arabic_gate_c_progress.py
          python reading/tools/sync_verification_tasks_arabic_gate_c_b1_unit02.py
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py
      - name: Assert exact post-B1-Unit-2 state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reading/RELEASE_STATUS.json').read_text())['languages']['arabic'];c=r['comprehension_review_progress'];d=r['latest_deterministic_gate'];g=json.loads(Path('reading/audit/arabic_gate_c_decisions_2026-09-05/b1_u02.json').read_text())
          assert r['release_state']=='REOPEN_REQUIRED' and r['educator_release_ready'] is False
          assert (c['fresh_records_reviewed'],c['fresh_qa_pairs_reviewed'],c['fresh_records_with_findings'],c['fresh_findings'])==(132,1320,77,142) and c['levels_completed']==['A1','A2']
          assert (g['records_reviewed'],g['qa_pairs_reviewed'],g['records_with_findings'],g['fresh_findings'])==(6,60,0,0)
          assert all(x['decision']=='PASS' and x['finding_count']==0 for x in g['decisions']) and g['quality_promotion'] is False and g['release_claim'] is False
          assert d['open_findings']==1080
          PY
      - name: Commit clean Gate C B1 Unit 2 evidence and exact state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/arabic_gate_c_decisions_2026-09-05/b1_u02.json reading/RELEASE_STATUS.json reading/VERIFICATION_TASKS.md reading/STATE_MANIFEST.json
          git commit -m 'Complete Arabic Gate C B1 Unit 2 review'
      - name: Rebase and regenerate exact push candidate
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          python reading/tools/validate_continuation_state.py
          python reading/tools/record_arabic_gate_c_b1_unit02_decisions.py
          python reading/tools/sync_arabic_gate_c_progress.py
          python reading/tools/sync_verification_tasks_arabic_gate_c_b1_unit02.py
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py
          git add reading/audit/arabic_gate_c_decisions_2026-09-05/b1_u02.json reading/RELEASE_STATUS.json reading/VERIFICATION_TASKS.md reading/STATE_MANIFEST.json
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reading/RELEASE_STATUS.json').read_text())['languages']['arabic'];c=r['comprehension_review_progress']
          assert (c['fresh_records_reviewed'],c['fresh_qa_pairs_reviewed'],c['fresh_records_with_findings'],c['fresh_findings'])==(132,1320,77,142) and c['levels_completed']==['A1','A2']
          assert r['release_state']=='REOPEN_REQUIRED' and r['educator_release_ready'] is False and r['latest_deterministic_gate']['open_findings']==1080
          PY
          git push origin HEAD:main
