name: Arabic A1+A2 final validation

on:
  push:
    branches: [audit/arabic-a1-a2-integrated-2026-08-23]
    paths:
      - 'reading/tools/final_validate_arabic_a1_a2_2026_08_23.py'
      - '.github/workflows/arabic-a1-a2-final-validation.yml'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'reading/tools/final_validate_arabic_a1_a2_2026_08_23.py'
      - '.github/workflows/arabic-a1-a2-final-validation.yml'

permissions:
  contents: write

concurrency:
  group: arabic-a1-a2-final-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run final pinned validation
        run: python reading/tools/final_validate_arabic_a1_a2_2026_08_23.py
      - name: Commit final validation evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/audit/arabic_a1_a2_final_validation_2026-08-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate Arabic A1/A2 at zero unresolved diagnostics [skip ci]"
          git fetch origin audit/arabic-a1-a2-integrated-2026-08-23
          git rebase origin/audit/arabic-a1-a2-integrated-2026-08-23
          git push origin HEAD:audit/arabic-a1-a2-integrated-2026-08-23
