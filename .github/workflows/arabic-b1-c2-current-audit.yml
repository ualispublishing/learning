name: Arabic B1-C2 current audit

on:
  push:
    branches: [audit/arabic-b1-c2-final-2026-08-23]
    paths:
      - 'reading/tools/audit_arabic_b1_c2_current.py'
      - '.github/workflows/arabic-b1-c2-current-audit.yml'

permissions:
  contents: write

concurrency:
  group: arabic-b1-c2-current-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/arabic-b1-c2-final-2026-08-23
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit current Arabic B1-C2 corpus
        run: python reading/tools/audit_arabic_b1_c2_current.py
      - name: Commit inventory and semantic packets
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/audit/arabic_b1_c2_current_inventory_2026-08-23.json reading/audit/arabic_b1_c2_semantic_candidates_2026-08-23 || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit current Arabic B1-C2 corpus [skip ci]"
          git push origin HEAD:audit/arabic-b1-c2-final-2026-08-23
