name: Summarize A1 reading coverage

on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/summarize_a1_coverage.py'
      - '.github/workflows/summarize-a1-reading-coverage.yml'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/summarize_a1_coverage.py
      - name: Commit compact summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/a1_unit01_coverage_compact.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Summarize A1 reading coverage [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
