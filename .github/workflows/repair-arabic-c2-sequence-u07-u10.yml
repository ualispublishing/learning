name: Repair Arabic C2 sequence U07-U10
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_arabic_c2_sequence_u07_u10.py'
      - '.github/workflows/repair-arabic-c2-sequence-u07-u10.yml'
permissions:
  contents: write
concurrency:
  group: arabic-c2-generation
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/repair_arabic_c2_sequence_u07_u10.py
      - name: Commit deterministic sequence repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/c2/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Arabic C2 sequence continuity [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
