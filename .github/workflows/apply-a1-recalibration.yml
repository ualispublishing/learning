name: Apply staged A1 recalibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/apply_a1_recalibration.py'
      - 'reading/recalibration/*.json'
      - '.github/workflows/apply-a1-recalibration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply Arabic, French, and Urdu configs
        run: |
          python reading/tools/apply_a1_recalibration.py arabic
          python reading/tools/apply_a1_recalibration.py french
          python reading/tools/apply_a1_recalibration.py urdu
      - name: Commit recalibrated passages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a1/passages.jsonl reading/french/a1/passages.jsonl reading/urdu/a1/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply staged A1 recalibration [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
