name: French coverage v2 temporary diagnostic
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  run:
    if: github.event.pull_request.head.ref == 'audit/french-coverage-v2-2026-08-19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Run policy-backed v2 diagnostic
        run: python reading/tools/audit_french_curriculum_coverage_v2.py
      - name: Commit diagnostic only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_coverage_evidence_v2_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record French coverage v2 policy diagnostic [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
