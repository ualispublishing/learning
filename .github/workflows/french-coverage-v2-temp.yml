name: French coverage v2 temporary full audit
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  run:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/french-coverage-v2-2026-08-19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned deterministic NLP dependency
        run: python -m pip install --disable-pip-version-check 'stanza==1.10.1'
      - name: Reconstruct and narrowly patch historical coverage audit
        shell: bash
        run: |
          git show 7634a9adfed00675d087b70edf5792a333ca03e9:reading/tools/audit_french_curriculum_coverage.py > reading/tools/audit_french_curriculum_coverage_full_v2_runtime.py
          python - <<'PY'
          from pathlib import Path
          p=Path('reading/tools/audit_french_curriculum_coverage_full_v2_runtime.py')
          s=p.read_text(encoding='utf-8')
          old='FUNCTION_POS = {"AUX", "ADP", "CCONJ", "SCONJ", "DET", "PRON", "PART"}'
          new=old+'\nFUNCTION_FORMS = {str(v).casefold() for v in json.loads((READING / "planning" / "a1_function_support.json").read_text(encoding="utf-8"))["french"]["function_forms"]}'
          if old not in s: raise SystemExit('FUNCTION_POS anchor missing')
          s=s.replace(old,new,1)
          old='elif w.upos in FUNCTION_POS:'
          new='elif w.upos in FUNCTION_POS or surface in FUNCTION_FORMS or lemma in FUNCTION_FORMS:'
          if old not in s: raise SystemExit('classification anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('french_curriculum_exposure_ledger_2026-08-19.json','french_curriculum_exposure_ledger_full_v2_2026-08-19.json')
          s=s.replace('french_coverage_evidence_2026-08-19.json','french_coverage_evidence_full_v2_2026-08-19.json')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run corrected full NLP coverage audit
        run: python reading/tools/audit_french_curriculum_coverage_full_v2_runtime.py
      - name: Annotate v2 methodology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reading/audit/french_coverage_evidence_full_v2_2026-08-19.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          x['schema_version']=2
          x['v2_methodology_correction']={'base_implementation_commit':'7634a9adfed00675d087b70edf5792a333ca03e9','stanza_version':'1.10.1','only_classifier_change':'closed-class UPOS OR normalized surface/lemma in reading/planning/a1_function_support.json:french.function_forms counts as grammar_function_support','does_not_establish_learner_mastery':True,'may_populate_estimated_known_token_coverage':False,'may_auto_promote_quality_status':False}
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Run independent review-stage timing audit
        run: python reading/tools/audit_french_review_stage_timing.py
      - name: Commit durable audit evidence to PR branch
        run: |
          rm -f reading/tools/audit_french_curriculum_coverage_full_v2_runtime.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_curriculum_exposure_ledger_full_v2_2026-08-19.json reading/audit/french_coverage_evidence_full_v2_2026-08-19.json reading/audit/french_coverage_methodology_correction_v2_2026-08-19.json reading/audit/french_review_stage_timing_audit_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Run corrected French coverage and stage-timing audits [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
