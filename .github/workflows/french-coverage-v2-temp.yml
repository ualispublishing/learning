name: French coverage v2 micro summary
on:
  push:
    branches: [audit/french-coverage-v2-2026-08-19]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit small summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('reading/audit/french_coverage_v2_compact_adjudication_2026-08-19.json')
          x = json.loads(src.read_text(encoding='utf-8'))
          out = {
            'schema_version': 1,
            'date': '2026-08-19',
            'language': 'fr',
            'bound_canonical_hashes': x['bound_canonical_hashes'],
            'levels': {},
            'chronology_findings': x['chronology_findings_from_full_v2'],
            'flagged_target_histories': x['flagged_target_histories'],
            'spacing_event_counts': x['spacing_event_counts'],
            'spacing_candidates_total': x['spacing_candidates_total'],
            'decisions': x['decisions']
          }
          for level, r in x['level_summary'].items():
            out['levels'][level] = {
              'tokens': r['total_counted_tokens'],
              'unknown_tokens': r['uncontrolled_unknown_tokens_exact'],
              'weighted_unknown_rate': r['weighted_uncontrolled_unknown_rate'],
              'support_gate_pass': r['support_gate_pass'],
              'support_gate_review_required': r['support_gate_review_required'],
              'top15_candidate_lemmas': r['top_candidate_lemmas_visible_in_per_passage_top25'][:15],
              'worst5_passages': r['worst_passages'][:5]
            }
          Path('reading/audit/french_coverage_v2_micro_summary_2026-08-19.json').write_text(json.dumps(out, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - name: Commit micro summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_coverage_v2_micro_summary_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record French coverage v2 micro summary [skip ci]'
          git push origin HEAD:audit/french-coverage-v2-2026-08-19
