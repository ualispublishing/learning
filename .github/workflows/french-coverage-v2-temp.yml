name: French coverage v2 temporary diagnostic
on:
  push:
    branches: [audit/french-coverage-v2-2026-08-19]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run policy-backed v2 diagnostic
        run: python reading/tools/audit_french_curriculum_coverage_v2.py
      - name: Commit compact methodology correction only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_coverage_methodology_correction_v2_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record French coverage v2 methodology correction [skip ci]'
          git push origin HEAD:audit/french-coverage-v2-2026-08-19
