name: Complete French B2 to C1 Frontier
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/complete_french_b2_to_c1_frontier.py'
      - '.github/workflows/complete-french-b2-to-c1-frontier.yml'
concurrency:
  group: french-b2-completion-orchestrator
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Run serialized B2 completion pipeline
        shell: bash
        run: |
          set -o pipefail
          # Retry from the exact live canonical frontier; the Python orchestrator
          # decides whether Unit08, Unit09, Unit10, or only sealing work remains.
          python reading/tools/complete_french_b2_to_c1_frontier.py 2>&1 | tee /tmp/french_b2_completion_pipeline.log
      - name: Preserve unexpected orchestrator stderr
        if: failure()
        run: |
          mkdir -p reading/audit
          cp /tmp/french_b2_completion_pipeline.log reading/audit/french_b2_completion_orchestrator_failure.txt || true
      - name: Commit all validated progress and audit artifacts
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/b2/passages.jsonl reading/audit reading/STATUS.json reading/TASKS.md reading/AGENT_HANDOFF.md
          git diff --cached --quiet && exit 0
          git commit -m 'Complete guarded French B2 pipeline toward C1 frontier [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
