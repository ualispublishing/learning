name: Repair final Arabic pass 01 record contract
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_final_arabic_pass01_record_contract.py'
      - '.github/workflows/repair-final-arabic-pass01-record-contract.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/repair_final_arabic_pass01_record_contract.py
      - name: Commit canonical metadata repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a1/passages.jsonl reading/arabic/a2/passages.jsonl reading/arabic/b1/passages.jsonl reading/arabic/b2/passages.jsonl reading/arabic/c1/passages.jsonl reading/arabic/c2/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Normalize Arabic reader metadata contract [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
