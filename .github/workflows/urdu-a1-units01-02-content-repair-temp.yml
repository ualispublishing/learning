name: TEMP Urdu A1 Units 01-02 content repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/urdu-a1-units01-02-content-repair-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-urdu-a1-units01-02-content-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'audit/urdu-a1-final-deterministic-2026-08-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/urdu-a1-final-deterministic-2026-08-22
      - name: Apply bounded internal-review repairs and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import copy, hashlib, json, re

          corpus = Path('reading/urdu/a1/passages.jsonl')
          expected_before = 'e6450c04b6aa7d47b501e0cfbf2664fa37b2e95490ab363945f7d757dfa34a1d'
          before_bytes = corpus.read_bytes()
          before_sha = hashlib.sha256(before_bytes).hexdigest()
          if before_sha != expected_before:
              raise SystemExit(f'FAIL CLOSED corpus drift: {before_sha}')

          rows = [json.loads(x) for x in before_bytes.decode('utf-8').splitlines() if x.strip()]
          if len(rows) != 60:
              raise SystemExit(f'FAIL CLOSED expected 60 rows, got {len(rows)}')
          by_id = {r['id']: r for r in rows}
          if len(by_id) != 60:
              raise SystemExit('FAIL CLOSED duplicate passage id')

          # Preserve all passage prose and all lexical target declarations/review schedules.
          preserved = {
              r['id']: {
                  'text': copy.deepcopy(r['text']),
                  'title': copy.deepcopy(r['title']),
                  'new_lexical_targets': copy.deepcopy(r.get('new_lexical_targets', [])),
                  'review_lexical_targets': copy.deepcopy(r.get('review_lexical_targets', [])),
                  'word_count': r.get('word_count'),
                  'sentence_count': r.get('sentence_count'),
              } for r in rows
          }

          repairs = [
              {
                  'passage_id':'ur-a1-u01-p04','question_id':'q6',
                  'before': {'prompt':'«اگر» کا کام کیا ہے؟','type':'single_word_definition','answer':'کسی شرط کو بیان کرنا۔'},
                  'after': {'prompt':'«اگر دروازہ کھلا ہو تو ہم اندر جائیں گے» میں اندر جانے کی شرط کیا ہے؟','type':'cause_effect','answer':'دروازہ کھلا ہونا۔','explanation':'یہ سوال «اگر» کے استعمال کو عملی شرط کے طور پر جانچتا ہے، نحوی اصطلاح نہیں مانگتا۔'},
                  'reason':'Replace formal function wording with an operational condition-in-context task while preserving the اگر target.'
              },
              {
                  'passage_id':'ur-a1-u01-p05','question_id':'q10',
                  'before': {'prompt':'«ہم» کس قسم کا لفظ ہے؟','type':'grammar_category','answer':'ضمیر۔'},
                  'after': {'prompt':'کون سا جملہ دو یا زیادہ لوگوں کی مشترک بات کرتا ہے: «میں بازار جاؤں گا» یا «ہم بازار جائیں گے»؟','type':'contrast','answer':'«ہم بازار جائیں گے»۔','explanation':'«ہم» بولنے والے کو ایک یا زیادہ دوسرے لوگوں کے ساتھ شامل کرتا ہے۔'},
                  'reason':'Remove a grammatical-category label task and test communicative use of ہم instead.'
              },
              {
                  'passage_id':'ur-a1-u01-p06','question_id':'q8',
                  'before': {'prompt':'«اگر موسم اچھا ہو» میں «اگر» کیا متعارف کراتا ہے؟','type':'grammar_function','answer':'ایک شرط۔'},
                  'after': {'prompt':'اگر موسم اچھا ہو تو عائشہ اتوار کو کیا کرتی ہے؟','type':'cause_effect','answer':'وہ پارک جاتی ہے۔','explanation':'یہ سوال «اگر» کے معنی کو عبارت کے نتیجے کے ساتھ جوڑتا ہے۔'},
                  'reason':'Replace a grammar-function label with direct conditional comprehension.'
              },
              {
                  'passage_id':'ur-a1-u02-p01','question_id':'q8',
                  'before': {'prompt':'«کچھ نہ رہ جائے» میں «نہ» کیا کرتا ہے؟','type':'grammar_function','answer':'یہ نفی کرتا ہے، یعنی چیز کے رہ جانے کو رد کرتا ہے۔'},
                  'after': {'prompt':'کون سا جملہ بتاتا ہے کہ کوئی چیز باقی نہیں رہنی چاہیے: «کچھ نہ رہ جائے» یا «کچھ رہ جائے»؟','type':'contrast','answer':'«کچھ نہ رہ جائے»۔','explanation':'«نہ» یہاں رہ جانے کی نفی کرتا ہے۔'},
                  'reason':'Test negation operationally through a meaning contrast rather than asking for a function label.'
              },
              {
                  'passage_id':'ur-a1-u02-p02','question_id':'q8',
                  'before': {'prompt':'«اس کی روز کی زندگی» میں «کی» کیا تعلق دکھاتا ہے؟','type':'grammar_function','answer':'یہ عائشہ اور اس کی زندگی کے درمیان ملکیت/تعلق دکھاتا ہے۔'},
                  'after': {'prompt':'«اس کی روز کی زندگی» میں زندگی کس کی ہے؟','type':'reference_resolution','answer':'عائشہ کی۔','explanation':'«کی» عائشہ اور زندگی کے تعلق کو ظاہر کرتی ہے۔'},
                  'reason':'Replace explicit grammar-relation terminology with a concrete ownership/reference question.'
              },
              {
                  'passage_id':'ur-a1-u02-p03','question_id':'q8',
                  'before': {'prompt':'«کیا تم میری مدد کر سکتی ہو؟» کس قسم کا سوال ہے؟','type':'grammar_function','answer':'ایسا سوال جس کا جواب ہاں یا نہیں میں دیا جا سکتا ہے۔'},
                  'after': {'prompt':'«کیا تم میری مدد کر سکتی ہو؟» کا مناسب مختصر جواب کون سا ہے: «ہاں، کر سکتی ہوں» یا «سات بجے»؟','type':'contrast','answer':'«ہاں، کر سکتی ہوں»۔','explanation':'«کیا» سے بنا یہ سوال ہاں یا نہیں کے جواب کے لیے استعمال ہوا ہے۔'},
                  'reason':'Replace question-type terminology with an operational response-selection task.'
              }
          ]

          changed_questions = []
          for spec in repairs:
              r = by_id[spec['passage_id']]
              q = next((q for q in r['questions'] if q['id'] == spec['question_id']), None)
              if q is None:
                  raise SystemExit(f"FAIL CLOSED missing question {spec['passage_id']} {spec['question_id']}")
              a = next((a for a in r['answer_key'] if a['id'] == q['answer_id']), None)
              if a is None:
                  raise SystemExit(f"FAIL CLOSED missing linked answer {spec['passage_id']} {spec['question_id']}")
              b = spec['before']
              if q.get('prompt') != b['prompt'] or q.get('type') != b['type'] or a.get('answer') != b['answer']:
                  raise SystemExit(f"FAIL CLOSED before-state mismatch {spec['passage_id']} {spec['question_id']}")
              q['prompt'] = spec['after']['prompt']
              q['type'] = spec['after']['type']
              a['answer'] = spec['after']['answer']
              a['explanation'] = spec['after']['explanation']
              changed_questions.append((spec['passage_id'], spec['question_id']))

          linkage_fix = {
              'passage_id':'ur-a1-u02-p06','question_id':'q2',
              'before_target_ids':['ur-rank-0077','ur-rank-0121'],
              'after_target_ids':[],
              'reason':'q2 asks what tool organizes the day and is answered by “a simple chart”; سال and زندگی are not the assessed answer concepts here. Both targets remain explicitly assessed together in q7.'
          }
          r = by_id[linkage_fix['passage_id']]
          q = next(q for q in r['questions'] if q['id'] == linkage_fix['question_id'])
          if q.get('target_ids') != linkage_fix['before_target_ids']:
              raise SystemExit('FAIL CLOSED q2 target linkage before-state mismatch')
          q.pop('target_ids', None)
          q7 = next(q for q in r['questions'] if q['id'] == 'q7')
          if q7.get('target_ids') != linkage_fix['before_target_ids']:
              raise SystemExit('FAIL CLOSED expected q7 to retain both year/life review targets')

          # Core integrity checks.
          for r in rows:
              if len(r.get('questions', [])) != 10 or len(r.get('answer_key', [])) != 10:
                  raise SystemExit(f"FAIL CLOSED 10Q/10A violation {r['id']}")
              qids = {q['id'] for q in r['questions']}
              aids = {a['id'] for a in r['answer_key']}
              if len(qids) != 10 or len(aids) != 10:
                  raise SystemExit(f"FAIL CLOSED duplicate Q/A id {r['id']}")
              amap = {a['id']: a for a in r['answer_key']}
              for q in r['questions']:
                  if q.get('answer_id') not in amap or amap[q['answer_id']].get('question_id') != q['id']:
                      raise SystemExit(f"FAIL CLOSED linkage {r['id']} {q['id']}")
              prompts = [q['prompt'] for q in r['questions']]
              if len(prompts) != len(set(prompts)):
                  raise SystemExit(f"FAIL CLOSED duplicate prompt {r['id']}")
              local_ids = {x['id'] for x in r.get('new_lexical_targets', [])} | {x['id'] for x in r.get('review_lexical_targets', [])}
              for q in r['questions']:
                  for tid in q.get('target_ids', []):
                      if tid not in local_ids:
                          raise SystemExit(f"FAIL CLOSED nonlocal target {r['id']} {q['id']} {tid}")

          # Prose/target schedule must be byte-semantically unchanged at object level.
          for r in rows:
              p = preserved[r['id']]
              for key in ('text','title','new_lexical_targets','review_lexical_targets','word_count','sentence_count'):
                  if r.get(key) != p[key]:
                      raise SystemExit(f"FAIL CLOSED preserved field changed: {r['id']} {key}")

          # Units 01-02 should no longer contain formal category/function task types or the reviewed formal wording patterns.
          formal_types = []
          formal_wording = []
          patterns = [
              'کس قسم کا لفظ', 'کس قسم کا سوال', 'کا کام کیا ہے', 'کیا متعارف کراتا ہے', 'کیا تعلق دکھاتا ہے'
          ]
          for r in rows:
              if r.get('unit') not in (1,2):
                  continue
              for q in r['questions']:
                  if q.get('type') in {'grammar_category','grammar_function'}:
                      formal_types.append([r['id'], q['id'], q.get('type'), q.get('prompt')])
                  if any(p in q.get('prompt','') for p in patterns):
                      formal_wording.append([r['id'], q['id'], q.get('prompt')])
          if formal_types or formal_wording:
              raise SystemExit(f'FAIL CLOSED residual formal tasks: types={formal_types} wording={formal_wording}')

          # Learner-facing Roman-script check remains zero.
          roman = []
          for r in rows:
              fields = [('title', r.get('title','')), ('text', r.get('text',''))]
              for q in r['questions']:
                  fields.append((f"question:{q['id']}", q.get('prompt','')))
              for a in r['answer_key']:
                  fields.append((f"answer:{a['id']}", a.get('answer','')))
                  fields.append((f"explanation:{a['id']}", a.get('explanation','')))
              for field, value in fields:
                  if re.search(r'[A-Za-z]', value or ''):
                      roman.append([r['id'], field, value])
          if roman:
              raise SystemExit(f'FAIL CLOSED Roman-script findings: {roman[:5]}')

          out = ''.join(json.dumps(r, ensure_ascii=False, sort_keys=False) + '\n' for r in rows)
          corpus.write_text(out, encoding='utf-8')
          after_sha = hashlib.sha256(corpus.read_bytes()).hexdigest()
          if after_sha == before_sha:
              raise SystemExit('FAIL CLOSED expected bounded corpus change but hash is unchanged')

          evidence = {
              'schema_version':1,
              'date':'2026-08-22',
              'language':'ur','level':'A1','units':[1,2],
              'review_kind':'internal_semantic_answer_pedagogy_review_and_bounded_repair',
              'before_sha256':before_sha,'after_sha256':after_sha,
              'records_reviewed':12,'questions_reviewed':120,'answers_reviewed':120,
              'confirmed_metalinguistic_repairs':len(repairs),
              'target_linkage_repairs':1,
              'repairs':repairs,
              'target_linkage_repair':linkage_fix,
              'verification':{
                  'passage_prose_unchanged':True,
                  'titles_unchanged':True,
                  'lexical_target_declarations_unchanged':True,
                  'review_target_schedules_unchanged':True,
                  'word_sentence_metadata_unchanged':True,
                  'ten_questions_answers_per_passage':True,
                  'qa_linkage_valid':True,
                  'local_question_target_ids_only':True,
                  'duplicate_prompts_within_passage_zero':True,
                  'units01_02_formal_metalinguistic_types_zero':True,
                  'units01_02_reviewed_formal_wording_patterns_zero':True,
                  'learner_facing_roman_script_zero':True
              },
              'adjudication_notes':[
                  'Most Units 01-02 passage prose and Q/A content was retained after internal semantic/answer-support review.',
                  'The repaired class is narrow: formal grammar-category/function prompts inappropriate for the intended A1 operational task profile.',
                  'One unrelated target-linkage omission was corrected by removing سال/زندگی from ur-a1-u02-p06 q2; q7 still directly assesses both targets.',
                  'Potential native-style refinements such as highly idiomatic phrasing are not silently treated as resolved by this internal review.'
              ],
              'independent_review':{
                  'native_urdu_naturalness_orthography':'PENDING',
                  'independent_model_family':'PENDING',
                  'educator_cefr_a1':'PENDING',
                  'blind_postrepair':'PENDING'
              },
              'status':'PASS_INTERNAL_UNITS01_02_BOUNDED_REPAIR_NEEDS_INDEPENDENT_REVIEW',
              'release_effect':'NONE_AUTOMATIC: Urdu A1 remains non-release-ready.'
          }
          Path('reading/audit/urdu_a1_units01_02_internal_review_2026-08-22.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps({'before_sha256':before_sha,'after_sha256':after_sha,'repairs':len(repairs),'target_linkage_repairs':1,'status':evidence['status']}, ensure_ascii=False))
          PY
      - name: Commit bounded repair evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/audit/urdu_a1_units01_02_internal_review_2026-08-22.json
          git rm -f .github/workflows/urdu-a1-units01-02-content-repair-temp.yml
          git commit -m 'Review and repair Urdu A1 Units 01-02 [skip ci]'
          git push origin HEAD:audit/urdu-a1-final-deterministic-2026-08-22
