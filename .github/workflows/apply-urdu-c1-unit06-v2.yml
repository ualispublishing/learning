name: Apply Urdu C1 Unit 06 v2

on:
  push:
    branches:
      - main
    paths:
      - "reading/tools/apply_urdu_c1_unit06_v2.py"
      - ".github/workflows/apply-urdu-c1-unit06-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-urdu-c1-unit06-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded Unit 6 candidate and validate
        run: python reading/tools/apply_urdu_c1_unit06_v2.py
      - name: Commit canonical unit
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/urdu/c1/candidates/unit06 reading/urdu/c1/passages.jsonl reading/CONTINUATION.json reading/STATUS.json reading/TASKS.md reading/AGENT_HANDOFF_V2.md reading/planning/ACTIVE_GENERATION_PLAN.json reading/STATE_MANIFEST.json reading/audit/urdu_c1_u06_generation_qa_2026-08-26.json
          git commit -m "Canonicalize Urdu C1 Unit 6 and advance frontier"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
