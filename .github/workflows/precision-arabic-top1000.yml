name: Precision audit Arabic top 1000

on:
  push:
    paths:
      - 'scripts/precision_arabic_top1000.py'
      - 'scripts/build_arabic_core_candidates.py'
      - 'scripts/reconcile_arabic_msa1000.py'
      - 'scripts/build_arabic_top1000_precision.py'
      - '.github/workflows/precision-arabic-top1000.yml'
  workflow_dispatch:

concurrency:
  group: precision-arabic-top1000-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Arabic morphology and disambiguation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install camel-tools
          camel_data -i morphology-db-msa-r13
          camel_data -i disambig-mle-calima-msa-r13

      - name: Download CAMeL MSA frequency lists
        run: |
          curl -L --fail --retry 5 --retry-all-errors \
            'https://github.com/CAMeL-Lab/Camel_Arabic_Frequency_Lists/releases/download/v1.0/MSA_freq_lists.tsv.zip' \
            -o /tmp/MSA_freq_lists.tsv.zip

      - name: Build broad lexical validation candidates
        run: |
          python scripts/build_arabic_core_candidates.py \
            --frequency-zip /tmp/MSA_freq_lists.tsv.zip \
            --candidate-count 10000

      - name: Reconcile published 1,000 ranks
        run: python scripts/reconcile_arabic_msa1000.py

      - name: Build precision candidate deck
        run: python scripts/build_arabic_top1000_precision.py

      - name: Audit existing Arabic deck
        run: python scripts/precision_arabic_top1000.py --audit-only

      - name: Commit audit evidence
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- audit/)" ]; then
            echo 'No audit changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/
          git commit -m 'Build Arabic top-1000 precision candidate [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
