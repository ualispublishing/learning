name: Precision audit Arabic top 1000

on:
  push:
    paths:
      - 'scripts/precision_arabic_top1000.py'
      - '.github/workflows/precision-arabic-top1000.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Arabic morphology tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install camel-tools
          camel_data -i morphology-db-msa-r13

      - name: Inspect Al-Said 2023 open MSA list
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl -L --fail --retry 3 \
            'https://digibug.ugr.es/bitstream/handle/10481/80090/23634-Galerada%20publicada%20%28PDF%29-99973-2-10-20230201.pdf?isAllowed=y&sequence=1' \
            -o /tmp/al_said_2023.pdf
          pdftotext -layout /tmp/al_said_2023.pdf /tmp/al_said_2023.txt
          echo '=== LAST 1400 LINES OF OPEN-ACCESS SOURCE ==='
          tail -n 1400 /tmp/al_said_2023.txt

      - name: Audit all Arabic top-1000 rows
        run: python scripts/precision_arabic_top1000.py --audit-only

      - name: Commit audit evidence
        run: |
          if [ -z "$(git status --porcelain -- audit/arabic_top1000_morphology_audit.csv audit/arabic_top1000_audit_summary.json)" ]; then
            echo 'No audit changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/arabic_top1000_morphology_audit.csv audit/arabic_top1000_audit_summary.json
          git commit -m 'Audit Arabic top-1000 morphology [skip ci]'
          git push
