name: Precision audit Arabic top 1000

on:
  push:
    paths:
      - 'scripts/precision_arabic_top1000.py'
      - 'scripts/build_arabic_core_candidates.py'
      - 'scripts/build_arabic_top1000_precision.py'
      - 'scripts/finalize_arabic_top1000_precision.py'
      - 'scripts/rebuild_arabic_top1000_learner_safe.py'
      - 'scripts/rebuild_arabic_top1000_learner_safe_v2.py'
      - 'scripts/rebuild_arabic_top1000_learner_safe_v3.py'
      - 'scripts/rebuild_arabic_top1000_learner_safe_v4.py'
      - 'scripts/report_arabic_top1000_manual_coverage.py'
      - 'scripts/promote_arabic_top1000_learner_safe.py'
      - 'scripts/audit_arabic_top1000_learner_safe.py'
      - 'scripts/audit_arabic_top1000_learner_safe_v2.py'
      - '.github/workflows/precision-arabic-top1000.yml'
  workflow_dispatch:

concurrency:
  group: precision-arabic-top1000-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Arabic morphology tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install camel-tools
          camel_data -i morphology-db-msa-r13
          camel_data -i disambig-mle-calima-msa-r13

      - name: Download CAMeL MSA frequency lists
        run: |
          curl -L --fail --retry 5 --retry-all-errors \
            'https://github.com/CAMeL-Lab/Camel_Arabic_Frequency_Lists/releases/download/v1.0/MSA_freq_lists.tsv.zip' \
            -o /tmp/MSA_freq_lists.tsv.zip

      - name: Build broad validated MSA candidate inventory
        run: |
          python scripts/build_arabic_core_candidates.py \
            --frequency-zip /tmp/MSA_freq_lists.tsv.zip \
            --candidate-count 10000

      - name: Repair source extraction and morphology exceptions
        run: python scripts/finalize_arabic_top1000_precision.py

      - name: Build fully explicit learner-safe meanings
        run: python scripts/rebuild_arabic_top1000_learner_safe_v4.py

      - name: Require full explicit semantic coverage
        run: python scripts/report_arabic_top1000_manual_coverage.py

      - name: Promote only after learner-safety validation
        run: python scripts/promote_arabic_top1000_learner_safe.py

      - name: Independent learner-safety audit
        run: python scripts/audit_arabic_top1000_learner_safe_v2.py

      - name: Commit validated deck and audit evidence
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- arabic_top1000.csv audit/)" ]; then
            echo 'No validated Arabic changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arabic_top1000.csv audit/
          git commit -m 'Promote learner-safe Arabic top 1000 [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
