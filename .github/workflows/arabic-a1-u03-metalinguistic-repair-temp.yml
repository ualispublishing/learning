name: TEMP Arabic A1 Unit 03 repair refinement
on:
  push:
    branches: [repair/arabic-a1-u03-metalinguistic-2026-08-20]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/arabic-a1-u03-metalinguistic-2026-08-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/refine_arabic_a1_u03_repair.py
      - name: Commit refinement and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a1/passages.jsonl reading/audit/arabic_a1_u03_metalinguistic_refinement_2026-08-20.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refine Arabic A1 Unit 03 repair [skip ci]'
          git push origin HEAD:repair/arabic-a1-u03-metalinguistic-2026-08-20
