name: Attest live learner CSVs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/attest_live_csvs.py'
      - '.github/workflows/attest-live-csvs.yml'
      - 'audit/run_live_csv_attestation.request'

permissions:
  contents: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify all live learner CSVs
        run: python scripts/attest_live_csvs.py
      - name: Commit attestation
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/live_csv_attestation.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Attest live learner CSVs [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
