name: Build Urdu top3000 continuation v16

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_urdu_top3000_v16.py'
      - 'audit/opus_targeted_urdu_evidence.json'
      - '.github/workflows/build-urdu-top3000-v16.yml'
      - 'audit/run_urdu_top3000_v16.request'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frequency tooling
        run: python -m pip install wordfreq
      - name: Build independent OPUS-corroborated candidate
        run: python scripts/build_urdu_top3000_v16.py
      - name: Commit candidate evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/urdu_top3000_candidate_v16.csv audit/urdu_top3000_continuation_evidence_v16.csv audit/urdu_top3000_rejections_v16.csv audit/urdu_top3000_candidate_v16_summary.json audit/urdu_top3000_v16_stratified_sample.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build independent OPUS-corroborated Urdu top3000 v16 [skip ci]'
          for n in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*3))
          done
          exit 1
