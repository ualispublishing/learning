name: Inspect lexical source extraction

on:
  push:
    paths:
      - '.github/workflows/inspect-source-extraction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Download sources
        run: |
          curl -k -L --fail 'https://www.lexique.org/databases/Lexique400/Lexique400.tsv' -o /tmp/Lexique400.tsv
          curl -L --fail 'https://www.cle.org.pk/Downloads/ling_resources/wordlists/UrduHighFreqWords%285000%29.pdf' -o /tmp/urdu-frequency.pdf
          pdftotext -layout /tmp/urdu-frequency.pdf /tmp/urdu-layout.txt
          pdftotext -raw /tmp/urdu-frequency.pdf /tmp/urdu-raw.txt
      - name: Inspect representative source rows
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          lex = {}
          with open('/tmp/Lexique400.tsv', encoding='utf-8-sig', newline='') as f:
              r=csv.DictReader(f, delimiter='\t')
              for row in r:
                  lemma=(row.get('4_Lemme') or '').lower()
                  mot=(row.get('1_Mot') or '').lower()
                  if lemma in {'d','de','c','ce','l','le','con','on','être','avoir'} or mot in {'d','de','c','ce','l','le','con','on'}:
                      lex.setdefault(lemma,[]).append({k:row.get(k) for k in ['1_Mot','4_Lemme','5_Cgram','10_FreqMot','11_FreqOrtho','12_FreqLemme','14_IsLem']})
          layout=Path('/tmp/urdu-layout.txt').read_text(encoding='utf-8',errors='replace')
          raw=Path('/tmp/urdu-raw.txt').read_text(encoding='utf-8',errors='replace')
          out={'lexique_samples':lex,'urdu_layout_repr':repr(layout[:8000]),'urdu_raw_repr':repr(raw[:8000])}
          Path('audit/source_extraction_diagnostics.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2)[:20000])
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/source_extraction_diagnostics.json
          git commit -m 'Record lexical source extraction diagnostics [skip ci]'
          git push
