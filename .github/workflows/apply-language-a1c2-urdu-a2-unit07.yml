name: Apply vetted LANG-A1C2 Urdu A2 Unit 7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-language-a1c2-urdu-a2-unit07.yml'
      - 'reading/tools/integrate_urdu_a2_u07.py'
      - 'reading/staging/u07_exact_p01.tmp'
      - 'reading/staging/u07_exact_p02.tmp'
      - 'reading/staging/u07_exact_p03.tmp'
      - 'reading/staging/u07_exact_p04.tmp'
      - 'reading/staging/u07_exact_p05.tmp'
      - 'reading/staging/u07_exact_p06.tmp'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lang-a1c2-urdu-a2-unit07-main
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Apply guarded Unit 7 transaction
        run: python reading/tools/integrate_urdu_a2_u07.py

      - name: Remove temporary Unit 7 staging machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            reading/staging/u07_exact_p01.tmp \
            reading/staging/u07_exact_p02.tmp \
            reading/staging/u07_exact_p03.tmp \
            reading/staging/u07_exact_p04.tmp \
            reading/staging/u07_exact_p05.tmp \
            reading/staging/u07_exact_p06.tmp \
            reading/tools/integrate_urdu_a2_u07.py \
            .github/workflows/apply-language-a1c2-urdu-a2-unit07.yml

      - name: Commit and preserve concurrent unrelated work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate vetted Urdu A2 Unit 7 and advance to Unit 8 [skip ci]"

          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
            python reading/tools/extract_active_generation_plan.py
            python reading/tools/refresh_state_manifest.py
            python reading/tools/validate_continuation_state.py
            git add reading/planning/ACTIVE_GENERATION_PLAN.json reading/STATE_MANIFEST.json
            git commit --amend --no-edit
          fi

          git push origin HEAD:main
