name: Audit Arabic modern sense risk

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_arabic_modern_sense_risk.py'
      - 'scripts/repair_arabic_second_pass_high_frequency.py'
      - 'scripts/repair_arabic_second_pass_101_500.py'
      - 'scripts/refine_arabic_second_pass_101_500.py'
      - 'scripts/refine_arabic_101_500_round2.py'
      - 'scripts/normalize_arabic_repaired_card_layout.py'
      - 'scripts/build_arabic_top100_review_snapshot.py'
      - 'scripts/build_arabic_101_500_review_snapshot.py'
      - 'reading/tools/audit_arabic_a1_flashcard_alignment.py'
      - 'reading/tools/refine_arabic_a1_target_metadata.py'
      - 'reading/arabic/a1/passages.jsonl'
      - '.github/workflows/audit-arabic-modern-sense-risk.yml'
      - 'audit/run_arabic_modern_sense_risk.request'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply confirmed second-pass high-frequency repairs
        run: python scripts/repair_arabic_second_pass_high_frequency.py
      - name: Apply confirmed ranks 101-500 repairs
        run: python scripts/repair_arabic_second_pass_101_500.py
      - name: Apply ranks 101-500 refinement layer
        run: python scripts/refine_arabic_second_pass_101_500.py
      - name: Apply ranks 101-500 round-two refinements
        run: python scripts/refine_arabic_101_500_round2.py
      - name: Normalize repaired-card field layout
        run: python scripts/normalize_arabic_repaired_card_layout.py
      - name: Synchronize Arabic A1 target metadata
        run: python reading/tools/refine_arabic_a1_target_metadata.py
      - name: Build ranks 1-100 educator review snapshot
        run: python scripts/build_arabic_top100_review_snapshot.py
      - name: Install corpus dictionary tooling
        run: python -m pip install word2word
      - name: Audit both Arabic vocabulary decks and A1 target alignment
        run: python scripts/audit_arabic_modern_sense_risk.py
      - name: Build ranks 101-500 educator priority snapshot
        run: python scripts/build_arabic_101_500_review_snapshot.py
      - name: Commit repaired deck and audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arabic_top1000.csv reading/arabic/a1/passages.jsonl audit/arabic_top100_second_pass_snapshot.json audit/arabic_101_500_second_pass_snapshot.json audit/arabic_101_500_priority_review.json audit/arabic_101_500_second_pass_summary.json audit/arabic_modern_sense_risk_summary.json audit/arabic_top3000_modern_sense_risk_queue.json audit/arabic_top1000_modern_sense_review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair and re-audit Arabic high-frequency cards [skip ci]'
          for n in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*3))
          done
          exit 1
