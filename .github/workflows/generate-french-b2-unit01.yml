name: Generate French B2 Unit 01
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_french_b2_unit01.py'
      - 'reading/tools/generate_french_b2_unit01_retry.py'
      - '.github/workflows/generate-french-b2-unit01.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Generate and validate B2 Unit 01 calibration
        run: python reading/tools/generate_french_b2_unit01.py
      - name: Independent B2 calibration checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/french/b2/passages.jsonl').read_text().splitlines() if x.strip()]
          assert len(rows)==6 and [r['sequence'] for r in rows]==list(range(1,7))
          assert [r['id'] for r in rows]==[f'fr-b2-u01-p{i:02d}' for i in range(1,7)]
          assert all(r['language']=='fr' and r['cefr']=='B2' and r['unit']==1 for r in rows)
          assert all(350<=r['word_count']<=550 and r['word_count']==len(r['text'].split()) for r in rows)
          assert all(len(r['questions'])==10 and len(r['answer_key'])==10 for r in rows)
          assert all(len(r['new_lexical_targets'])==4 for r in rows[:5]) and rows[-1]['new_lexical_targets']==[]
          expected={'supposer','cause','effet','preuve','sécurité','protéger','suffire','moyen','public','apporter','libre','accepter','tromper','certain','général','ressembler','apprécier','ainsi','valoir','intéresser'}
          new=[t for r in rows[:5] for t in r['new_lexical_targets']]
          assert len(new)==20 and {t['form'] for t in new}==expected and len({t['id'] for t in new})==20
          assert rows[2]['paired_text_group']=='fr-b2-u01-citizen-science-access' and rows[3]['paired_text_group']==rows[2]['paired_text_group']
          for r in rows:
            local={t['id'] for f in ('new_lexical_targets','review_lexical_targets') for t in r.get(f,[])}; amap={a['question_id']:a['id'] for a in r['answer_key']}
            for q in r['questions']: assert amap[q['id']]==q['answer_id'] and all(x in local for x in q.get('target_ids',[]))
          print({'status':'PASS','b2_passages':6,'questions':60,'answers':60,'new_targets':20,'paired_viewpoints':True,'checkpoint_zero_new':True})
          PY
      - name: Commit canonical French B2 Unit 01
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/b2/passages.jsonl
          git diff --cached --quiet && exit 0
          git commit -m 'Generate French B2 Unit 01 calibration [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
