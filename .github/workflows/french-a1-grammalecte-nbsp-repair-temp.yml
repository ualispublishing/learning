name: TEMP French A1 Grammalecte NBSP repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/french-a1-grammalecte-nbsp-repair-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-french-a1-grammalecte-nbsp-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'repair/french-a1-review-integrity-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
      - name: Install pinned Grammalecte wrapper in isolated virtualenv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check pygrammalecte==1.5.0
      - name: Apply exact NBSP findings and verify post-repair scan
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from collections import Counter,defaultdict
          import hashlib,json
          from pygrammalecte import grammalecte_text

          corpus=Path('reading/french/a1/passages.jsonl')
          old_scan_path=Path('reading/audit/french_a1_grammalecte_fullscan_2026-08-22.json')
          old_scan=json.loads(old_scan_path.read_text(encoding='utf-8'))
          expected_old='7dbdb48ffc6efd00106490ca9b10ad25643bf7e89967e8fbd2977a04641d6ea3'
          old_hash=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if old_hash!=expected_old or old_scan.get('bound_sha256')!=expected_old:
              raise SystemExit(f'FAIL CLOSED old corpus/scan drift corpus={old_hash} scan={old_scan.get("bound_sha256")}')
          findings=old_scan.get('findings',[])
          if old_scan.get('raw_finding_count')!=2040 or len(findings)!=2040:
              raise SystemExit('FAIL CLOSED raw scan count drift')
          nbsp=[f for f in findings if f.get('type')=='nbsp']
          non_nbsp=[f for f in findings if f.get('type')!='nbsp']
          if len(nbsp)!=1992 or len(non_nbsp)!=48:
              raise SystemExit(f'FAIL CLOSED expected 1992 NBSP + 48 non-NBSP, got {len(nbsp)} + {len(non_nbsp)}')

          rows=[json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]
          by_id={r['id']:r for r in rows}

          def target_ref(f):
              r=by_id[f['passage_id']]
              field=f['field']; item=f.get('item_id')
              if field in {'title','text'}:
                  return r,field
              if field=='question_prompt':
                  q=next((q for q in r['questions'] if q.get('id')==item),None)
                  if not q: raise SystemExit(f'FAIL CLOSED missing question {f["passage_id"]} {item}')
                  return q,'prompt'
              if field=='answer':
                  a=next((a for a in r['answer_key'] if a.get('id')==item),None)
                  if not a: raise SystemExit(f'FAIL CLOSED missing answer {f["passage_id"]} {item}')
                  return a,'answer'
              raise SystemExit(f'FAIL CLOSED unsupported field {field}')

          grouped=defaultdict(list)
          refs={}
          for f in nbsp:
              obj,key=target_ref(f)
              locator=(f['passage_id'],f['field'],f.get('item_id'))
              grouped[locator].append(f); refs[locator]=(obj,key)

          replacements=0
          for locator,fs in grouped.items():
              obj,key=refs[locator]
              text=obj[key]
              for f in sorted(fs,key=lambda x:int(x['start']),reverse=True):
                  start,end=int(f['start']),int(f['end'])
                  matched=f.get('matched_text')
                  suggestions=f.get('suggestions') or []
                  if not suggestions: raise SystemExit(f'FAIL CLOSED no NBSP suggestion {locator} {start}')
                  if text[start:end]!=matched:
                      raise SystemExit(f'FAIL CLOSED span mismatch {locator} {start}:{end} expected={matched!r} got={text[start:end]!r}')
                  replacement=suggestions[0]
                  if len(replacement)!=len(matched):
                      raise SystemExit(f'FAIL CLOSED unexpected NBSP replacement width {locator} {matched!r}->{replacement!r}')
                  text=text[:start]+replacement+text[end:]
                  replacements+=1
              obj[key]=text
          if replacements!=1992:
              raise SystemExit(f'FAIL CLOSED replacement count {replacements}')

          corpus.write_text('\n'.join(json.dumps(r,ensure_ascii=False) for r in rows)+'\n',encoding='utf-8')
          new_hash=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if new_hash==old_hash:
              raise SystemExit('FAIL CLOSED NBSP repair produced no hash change')

          def scan_field(passage_id,field,item_id,text):
              out=[]
              for m in grammalecte_text(text):
                  start=int(getattr(m,'start',0)); end=int(getattr(m,'end',start))
                  suggestions=getattr(m,'suggestions',[]) or []
                  if not isinstance(suggestions,(list,tuple)): suggestions=[str(suggestions)]
                  out.append({
                    'passage_id':passage_id,'field':field,'item_id':item_id,
                    'message_class':type(m).__name__,'line':int(getattr(m,'line',1)),
                    'start':start,'end':end,'matched_text':text[start:end],
                    'word':getattr(m,'word',None),'message':getattr(m,'message',''),
                    'suggestions':list(suggestions),'rule':getattr(m,'rule',None),
                    'type':getattr(m,'type',None),'url':getattr(m,'url','') or '',
                    'source_text':text
                  })
              return out

          new_findings=[]; field_counts=Counter(); chars=0
          for r in rows:
              for field,text,item in [('title',r['title'],None),('text',r['text'],None)]:
                  field_counts[field]+=1; chars+=len(text); new_findings.extend(scan_field(r['id'],field,item,text))
              for q in r['questions']:
                  text=q['prompt']; field_counts['question_prompt']+=1; chars+=len(text); new_findings.extend(scan_field(r['id'],'question_prompt',q['id'],text))
              for a in r['answer_key']:
                  text=a['answer']; field_counts['answer']+=1; chars+=len(text); new_findings.extend(scan_field(r['id'],'answer',a['id'],text))

          new_nbsp=[f for f in new_findings if f.get('type')=='nbsp']
          new_non=[f for f in new_findings if f.get('type')!='nbsp']
          if new_nbsp:
              raise SystemExit(f'FAIL CLOSED post-repair Grammalecte still reports {len(new_nbsp)} NBSP findings')

          def sig(f):
              return (f.get('passage_id'),f.get('field'),f.get('item_id'),f.get('message_class'),
                      f.get('matched_text'),f.get('word'),f.get('message'),f.get('rule'),f.get('type'))
          if Counter(map(sig,non_nbsp))!=Counter(map(sig,new_non)):
              before=Counter(map(sig,non_nbsp)); after=Counter(map(sig,new_non))
              raise SystemExit(f'FAIL CLOSED non-NBSP finding multiset changed removed={list((before-after).elements())[:5]} added={list((after-before).elements())[:5]}')

          by_class=Counter(f['message_class'] for f in new_findings)
          by_rule=Counter(str(f.get('rule')) for f in new_findings)
          by_type=Counter(str(f.get('type')) for f in new_findings)
          post_scan={
            'schema_version':1,'date':'2026-08-22','language':'fr','level':'A1',
            'audit':'independent_machine_detector_grammalecte_post_nbsp_repair',
            'status':'RAW_FINDINGS_RECORDED_NEEDS_ADJUDICATION',
            'bound_sha256':new_hash,
            'scope':{'passages':len(rows),'questions':sum(len(r['questions']) for r in rows),'answers':sum(len(r['answer_key']) for r in rows),'learner_facing_fields_scanned':sum(field_counts.values()),'characters_scanned':chars,'field_counts':dict(field_counts)},
            'tool':{'name':'Grammalecte via pygrammalecte','pygrammalecte_version':'1.5.0','underlying_grammalecte_version':'2.1.1 per pygrammalecte 1.4+/1.5 package metadata'},
            'raw_finding_count':len(new_findings),'findings_by_message_class':dict(by_class),'findings_by_rule':dict(by_rule),'findings_by_type':dict(by_type),
            'passages_with_findings':len({f['passage_id'] for f in new_findings}),'findings':new_findings
          }
          Path('reading/audit/french_a1_grammalecte_post_nbsp_fullscan_2026-08-22.json').write_text(json.dumps(post_scan,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          repair={
            'schema_version':1,'date':'2026-08-22','language':'fr','level':'A1',
            'repair':'grammalecte_nbsp_typography_repair','old_sha256':old_hash,'new_sha256':new_hash,
            'old_scan':'reading/audit/french_a1_grammalecte_fullscan_2026-08-22.json','post_scan':'reading/audit/french_a1_grammalecte_post_nbsp_fullscan_2026-08-22.json',
            'applied_replacements':replacements,'post_repair_nbsp_findings':len(new_nbsp),'non_nbsp_findings_before':len(non_nbsp),'non_nbsp_findings_after':len(new_non),
            'non_nbsp_multiset_preserved':True,
            'authoritative_typography_basis':[
              {'source':'Office québécois de la langue française — espace insécable','url':'https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/8360213/espace-insecable'},
              {'source':'Office québécois de la langue française — deux-points','url':'https://vitrinelinguistique.oqlf.gouv.qc.ca/23325/la-ponctuation/deux-points/emplois-courants-du-deux-points'},
              {'source':'Office québécois de la langue française — guillemets','url':'https://vitrinelinguistique.oqlf.gouv.qc.ca/23363/la-ponctuation/guillemets/generalites-sur-les-guillemets'},
              {'source':'Unicode UAX #14 line breaking','url':'https://www.unicode.org/reports/tr14/'}
            ],
            'scope_note':'Only exact Grammalecte type=nbsp suggestions from the hash-bound pre-repair scan were applied to learner-facing title/text/question/answer fields. No lexical, grammatical, semantic, answer-key, target, or metadata changes were made by this repair.',
            'release_effect':'NO_RELEASE_APPROVAL: canonical hash changed; deterministic and later independent release gates must be rebound.'
          }
          Path('reading/audit/french_a1_grammalecte_nbsp_repair_2026-08-22.json').write_text(json.dumps(repair,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'old_sha256':old_hash,'new_sha256':new_hash,'replacements':replacements,'post_findings':len(new_findings),'post_nbsp':len(new_nbsp),'non_nbsp_preserved':True},ensure_ascii=False))
          PY
      - name: Re-run French A1 deterministic generation integrity
        run: .venv/bin/python reading/tools/audit_french_a1_generation_integrity.py
      - name: Commit bounded typography repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a1/passages.jsonl reading/audit/french_a1_generation_integrity.json reading/audit/french_a1_grammalecte_post_nbsp_fullscan_2026-08-22.json reading/audit/french_a1_grammalecte_nbsp_repair_2026-08-22.json
          git rm -f .github/workflows/french-a1-grammalecte-nbsp-repair-temp.yml
          git commit -m 'Repair French A1 non-breaking-space typography [skip ci]'
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
