name: Sync French B2 Unit 05 Frontier
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/sync_french_b2_unit05_frontier.py'
      - '.github/workflows/sync-french-b2-unit05-frontier.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Advance from matching Unit 05 lock
        run: python reading/tools/sync_french_b2_unit05_frontier.py
      - name: Commit synchronized frontier files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/STATUS.json reading/TASKS.md reading/AGENT_HANDOFF.md
          git diff --cached --quiet && exit 0
          git commit -m 'Advance French B2 frontier to Unit 06 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
