name: Repair final Arabic C2 U01 P03 mubarir sense
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_final_arabic_c2_u01_p03_mubarrir_sense.py'
      - '.github/workflows/repair-final-arabic-c2-u01-p03-mubarrir-sense.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/repair_final_arabic_c2_u01_p03_mubarrir_sense.py
      - name: Commit lexical-sense repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/c2/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Normalize C2 مبرر lexical sense [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
