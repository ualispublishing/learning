name: TEMP Arabic A2 Unit 01 metalinguistic repair
on:
  push:
    branches: [repair/arabic-a2-u01-metalinguistic-2026-08-21]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/arabic-a2-u01-metalinguistic-2026-08-21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/repair_arabic_a2_u01_metalinguistic.py
      - name: Commit repair and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a2/passages.jsonl reading/audit/arabic_a2_u01_metalinguistic_repair_2026-08-21.json reading/audit/arabic_a2_u01_metalinguistic_postrepair_2026-08-21.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Arabic A2 Unit 01 metalinguistic tasks [skip ci]'
          git push origin HEAD:repair/arabic-a2-u01-metalinguistic-2026-08-21
