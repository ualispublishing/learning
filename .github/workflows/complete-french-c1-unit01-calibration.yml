name: Complete French C1 Unit 01 Calibration
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/audit/french_c1_readiness.json'
      - 'reading/tools/complete_french_c1_unit01_calibration.py'
      - 'reading/tools/resolve_french_c1_unit01_plan.py'
      - 'reading/tools/probe_french_c1_unit01_targets.py'
      - 'reading/tools/select_french_c1_unit01_calibration_targets.py'
      - 'reading/tools/generate_french_c1_unit01_calibration.py'
      - 'reading/tools/audit_french_c1_unit01_calibration.py'
      - '.github/workflows/complete-french-c1-unit01-calibration.yml'
concurrency:
  group: french-c1-canonical-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Run serialized C1 Unit01 calibration
        id: calibrate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python reading/tools/complete_french_c1_unit01_calibration.py 2>&1 | tee /tmp/french_c1_u01_pipeline.log
      - name: Preserve unexpected pipeline log
        if: steps.calibrate.outcome != 'success'
        run: |
          mkdir -p reading/audit
          cp /tmp/french_c1_u01_pipeline.log reading/audit/french_c1_unit01_workflow_failure.txt || true
      - name: Commit all independently validated progress
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/b2/passages.jsonl reading/audit reading/STATUS.json reading/TASKS.md reading/AGENT_HANDOFF.md
          [ -f reading/french/c1/passages.jsonl ] && git add reading/french/c1/passages.jsonl || true
          git diff --cached --quiet && exit 0
          git commit -m 'Complete guarded French C1 Unit 01 calibration pipeline [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
      - name: Fail workflow if calibration did not seal
        if: steps.calibrate.outcome != 'success'
        run: exit 1
