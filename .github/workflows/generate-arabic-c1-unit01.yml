name: Generate Arabic C1 Unit 01
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_arabic_c1_unit01.py'
      - '.github/workflows/generate-arabic-c1-unit01.yml'
permissions:
  contents: write
concurrency:
  group: arabic-c1-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/generate_arabic_c1_unit01.py
      - name: Commit generated C1 passages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/c1/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate Arabic C1 Unit 01 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
