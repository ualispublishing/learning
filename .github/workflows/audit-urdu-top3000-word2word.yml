name: Audit Urdu top3000 with third semantic source

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_urdu_top3000_word2word.py'
      - '.github/workflows/audit-urdu-top3000-word2word.yml'
      - 'audit/run_urdu_top3000_word2word.request'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bilingual lexicon tooling
        run: python -m pip install --upgrade pip word2word
      - name: Run independent Urdu-English semantic audit
        run: python scripts/audit_urdu_top3000_word2word.py
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/urdu_top3000_multisource_audit.csv audit/urdu_top3000_multisource_review_queue.csv audit/urdu_top3000_multisource_audit_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit Urdu top3000 with third semantic source [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
