name: Arabic A1+A2 manual review triage v2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'reading/tools/triage_arabic_a1_a2_manual_review_v2.py'
      - '.github/workflows/arabic-a1-a2-manual-review-triage-v2.yml'

permissions:
  contents: write

concurrency:
  group: arabic-a1-a2-manual-review-triage-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage-v2:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run lemma-aware triage
        run: python reading/tools/triage_arabic_a1_a2_manual_review_v2.py
      - name: Commit triage v2 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/audit/arabic_a1_a2_manual_review_triage_v2_2026-08-23.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Triage Arabic A1/A2 evidence with lemma variants [skip ci]"
          git fetch origin audit/arabic-a1-a2-integrated-2026-08-23
          git rebase origin/audit/arabic-a1-a2-integrated-2026-08-23
          git push origin HEAD:audit/arabic-a1-a2-integrated-2026-08-23
