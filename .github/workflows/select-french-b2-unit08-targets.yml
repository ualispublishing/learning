name: Select French B2 Unit 08 Targets
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/select_french_b2_unit08_targets.py'
      - '.github/workflows/select-french-b2-unit08-targets.yml'
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Select Unit 08 targets from persisted fresh probe
        run: python reading/tools/select_french_b2_unit08_targets.py
      - name: Commit auditable Unit 08 target selection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_b2_unit08_target_selection.json
          git diff --cached --quiet && exit 0
          git commit -m 'Select French B2 Unit 08 targets [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
