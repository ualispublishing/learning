name: Diagnose language workbook final-decision duplicates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_language_workbook_decision_duplicates_v1.py"
      - ".github/workflows/diagnose-language-workbook-decision-duplicates-v1.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/diagnose_language_workbook_decision_duplicates_v1.py
