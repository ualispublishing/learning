name: Analyze final Arabic Pass 03 A1-A2 remediation
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/analyze_final_arabic_pass03_a1_a2_remediation.py'
      - 'reading/arabic/a1/passages.jsonl'
      - 'reading/arabic/a2/passages.jsonl'
      - '.github/workflows/analyze-final-arabic-pass03-a1-a2-remediation.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build guarded remediation map
        run: python reading/tools/analyze_final_arabic_pass03_a1_a2_remediation.py
      - name: Commit analysis artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_pass03_a1_a2_remediation_map.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Map remaining A1-A2 Pass 03 remediation [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
