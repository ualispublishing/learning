name: LANG-A1C2 Urdu C1 Unit 2 one-shot

on:
  push:
    paths:
      - '.github/workflows/lang-a1c2-urdu-c1-u02-once.yml'

permissions:
  contents: write

concurrency:
  group: lang-a1c2-urdu-c1-u02-source-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture guarded source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply Urdu C1 Unit 2 source batch
        run: python reading/tools/_tmp_generate_urdu_c1_u02.py

      - name: Derive active generation plan
        run: python reading/tools/extract_active_generation_plan.py

      - name: Refresh exact-byte state manifest
        run: python reading/tools/refresh_state_manifest.py

      - name: Validate continuation state
        run: python reading/tools/validate_continuation_state.py

      - name: Verify exact new frontier
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/urdu/c1/passages.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==12, len(rows)
          assert [r['sequence'] for r in rows[-6:]]==[7,8,9,10,11,12]
          assert [r['id'] for r in rows[-6:]]==[f'ur-c1-u02-p0{i}' for i in range(1,7)]
          plan=json.loads(Path('reading/planning/ACTIVE_GENERATION_PLAN.json').read_text(encoding='utf-8'))
          assert plan['language']=='urdu' and plan['level']=='C1'
          assert plan['unit']==3 and plan['start_sequence']==13, plan
          cont=json.loads(Path('reading/CONTINUATION.json').read_text(encoding='utf-8'))
          status=json.loads(Path('reading/STATUS.json').read_text(encoding='utf-8'))
          assert cont['production']['canonical_passages']==972
          assert cont['production']['urdu']['canonical_passages']==252
          assert status['current']['canonical_passages']==972
          assert status['current']['remaining_generation_passages']==108
          assert status['languages']['urdu']['canonical_passages']==252
          assert status['languages']['urdu']['remaining_generation_passages']==108
          print('frontier verification PASS: Urdu C1 Unit 3 / sequence 13')
          PY

      - name: Commit validated source and derived state atomically
        shell: bash
        env:
          START_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm reading/tools/_tmp_generate_urdu_c1_u02.py
          git rm .github/workflows/lang-a1c2-urdu-c1-u02-once.yml
          git add -A

          echo 'Changed paths:'
          git diff --cached --name-only

          python - <<'PY'
          import subprocess
          allowed={
            '.github/workflows/lang-a1c2-urdu-c1-u02-once.yml',
            'reading/tools/_tmp_generate_urdu_c1_u02.py',
            'reading/urdu/c1/passages.jsonl',
            'reading/CONTINUATION.json',
            'reading/STATUS.json',
            'reading/TASKS.md',
            'reading/AGENT_HANDOFF_V2.md',
            'reading/planning/ACTIVE_GENERATION_PLAN.json',
            'reading/STATE_MANIFEST.json',
            'reading/audit/urdu_c1_u02_generation_2026-08-26.json',
          }
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          unexpected=changed-allowed
          required={'reading/urdu/c1/passages.jsonl','reading/CONTINUATION.json','reading/STATUS.json','reading/TASKS.md','reading/AGENT_HANDOFF_V2.md','reading/planning/ACTIVE_GENERATION_PLAN.json','reading/STATE_MANIFEST.json','reading/audit/urdu_c1_u02_generation_2026-08-26.json'}
          assert not unexpected, unexpected
          assert required <= changed, (required-changed)
          PY

          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$REMOTE_SHA" != "$START_SHA" ]; then
            echo "Refusing stale source commit: source=$START_SHA remote=$REMOTE_SHA" >&2
            exit 1
          fi

          git commit -m 'Continue LANG-A1C2 Urdu C1 Unit 2'

          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$REMOTE_SHA" != "$START_SHA" ]; then
            echo "Refusing stale source push: source=$START_SHA remote=$REMOTE_SHA" >&2
            exit 1
          fi
          git push origin HEAD:main
