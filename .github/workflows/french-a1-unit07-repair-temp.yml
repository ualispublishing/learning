name: French A1 full post-visibility regression
on:
  push:
    branches: [repair/french-a1-coverage-2026-08-19]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned deterministic NLP dependency
        run: python -m pip install --disable-pip-version-check 'stanza==1.10.1'
      - name: Reconstruct corrected full-corpus coverage audit against repaired A1
        run: |
          python - <<'PY'
          import hashlib,json,re,subprocess
          from pathlib import Path
          root=Path('.')
          a1=root/'reading/french/a1/passages.jsonl'
          current_a1=hashlib.sha256(a1.read_bytes()).hexdigest()
          expected_a1='a146ddf582099d702b6096c107ad2cb8e01df82c21304b9f076a0f876479649a'
          if current_a1 != expected_a1:
              raise SystemExit(f'A1 drift before regression: {current_a1} != {expected_a1}')
          fixed=json.loads((root/'reading/planning/a1_function_support.json').read_text(encoding='utf-8'))['french'].get('function_expressions',[])
          text='\n'.join(json.loads(x)['text'].replace('’',"'").casefold() for x in a1.read_text(encoding='utf-8').splitlines() if x.strip())
          scope={
            'abord_tokens':len(re.findall(r'\babord\b',text)),
            'd_abord':text.count("d'abord"),
            'tandis_tokens':len(re.findall(r'\btandis\b',text)),
            'tandis_que':text.count('tandis que'),
            'afin_tokens':len(re.findall(r'\bafin\b',text)),
            'afin_de_or_que':text.count('afin de')+text.count('afin que')
          }
          if scope['abord_tokens']!=scope['d_abord'] or scope['tandis_tokens']!=scope['tandis_que'] or scope['afin_tokens']!=scope['afin_de_or_que']:
              raise SystemExit('fixed-expression scope is not safe: '+json.dumps(scope,ensure_ascii=False))
          (root/'reading/audit/french_a1_fixed_expression_scope_post_visibility_2026-08-19.json').write_text(json.dumps({'scope':scope,'configured_expressions':fixed,'status':'PASS'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          src=subprocess.check_output(['git','show','7634a9adfed00675d087b70edf5792a333ca03e9:reading/tools/audit_french_curriculum_coverage.py'],text=True)
          # Bind the historical implementation to the repaired A1 hash, retaining all
          # other original level hashes unchanged.
          old_a1='"a1": "1cdb31ecb8b987c50051bb6f8fa5b2f7fda812cb3004c81ab8697f832fceacba"'
          new_a1=f'"a1": "{current_a1}"'
          if old_a1 not in src: raise SystemExit('A1 expected-hash anchor missing')
          src=src.replace(old_a1,new_a1,1)
          old='FUNCTION_POS = {"AUX", "ADP", "CCONJ", "SCONJ", "DET", "PRON", "PART"}'
          new=old+'\nFUNCTION_FORMS = {str(v).casefold() for v in json.loads((READING / "planning" / "a1_function_support.json").read_text(encoding="utf-8"))["french"]["function_forms"]}\nA1_FIXED_FUNCTION_LEMMAS = {"abord", "tandis", "afin"}'
          if old not in src: raise SystemExit('FUNCTION_POS anchor missing')
          src=src.replace(old,new,1)
          old_rule='elif w.upos in FUNCTION_POS:'
          new_rule='elif w.upos in FUNCTION_POS or surface in FUNCTION_FORMS or lemma in FUNCTION_FORMS or (level == "a1" and lemma in A1_FIXED_FUNCTION_LEMMAS):'
          if old_rule not in src: raise SystemExit('classification rule anchor missing')
          src=src.replace(old_rule,new_rule,1)
          src=src.replace('french_curriculum_exposure_ledger_2026-08-19.json','french_curriculum_exposure_ledger_post_a1_visibility_2026-08-19.json')
          src=src.replace('french_coverage_evidence_2026-08-19.json','french_coverage_evidence_post_a1_visibility_2026-08-19.json')
          (root/'reading/tools/audit_french_post_a1_visibility_runtime.py').write_text(src,encoding='utf-8')
          PY
      - name: Run corrected full coverage / exposure audit
        run: python reading/tools/audit_french_post_a1_visibility_runtime.py
      - name: Run independent lemma-aware review visibility regression
        run: |
          python - <<'PY'
          import hashlib,json,re,unicodedata
          from collections import Counter,defaultdict
          from pathlib import Path
          import stanza
          root=Path('.')
          levels=['a1','a2','b1','b2','c1','c2']
          def norm(s):
              s=unicodedata.normalize('NFC',str(s or '')).replace('’',"'").replace('‘',"'").casefold().strip()
              return re.sub(r"^[^\w]+|[^\w]+$",'',s,flags=re.UNICODE)
          lex={r['id']:r for r in [json.loads(x) for x in (root/'reading/lexicons/french.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]}
          stanza.download('fr',processors='tokenize,pos,lemma',verbose=False)
          nlp=stanza.Pipeline('fr',processors='tokenize,pos,lemma',use_gpu=False,verbose=False)
          findings=[]; total=0; by_level=defaultdict(Counter)
          hashes={}
          for level in levels:
              pth=root/f'reading/french/{level}/passages.jsonl'; hashes[level.upper()]=hashlib.sha256(pth.read_bytes()).hexdigest()
              rows=[json.loads(x) for x in pth.read_text(encoding='utf-8').splitlines() if x.strip()]
              for p in rows:
                  doc=nlp(p['text']); text_keys=set()
                  for sent in doc.sentences:
                      for w in sent.words:
                          for z in (w.text,w.lemma):
                              k=norm(z)
                              if k:text_keys.add(k)
                  qtargets={tid for q in p.get('questions',[]) for tid in q.get('target_ids',[])}
                  for r in p.get('review_lexical_targets',[]):
                      total+=1; tid=r.get('id'); rep=r.get('representation') or 'missing'; lr=lex.get(tid,{})
                      keys={norm(r.get('form')),norm(lr.get('form')),norm(lr.get('match_form')),norm(lr.get('lemma'))}-{''}
                      text_match=bool(keys & text_keys); qmatch=tid in qtargets
                      kind=None
                      if rep in {'running_text','summary'} and not text_match: kind='text_review_invisible'
                      elif rep in {'contrast','cloze','production'} and not text_match and not qmatch: kind='task_review_invisible'
                      elif rep in {'other','reference'} and not text_match and not qmatch: kind='unresolved_other_review_invisible'
                      if kind:
                          by_level[level.upper()][kind]+=1
                          findings.append({'level':level.upper(),'passage_id':p['id'],'sequence':p['sequence'],'target_id':tid,'form':r.get('form'),'stage':r.get('review_stage'),'representation':rep,'text_match':text_match,'question_target_match':qmatch,'kind':kind})
          out={'schema_version':2,'date':'2026-08-19','language':'fr','status':'PASS' if not findings else 'FAIL','bound_hashes':hashes,'review_entries_scanned':total,'finding_count':len(findings),'by_level':{k:dict(v) for k,v in by_level.items()},'findings':findings,'method':'stanza==1.10.1 surface/lemma + target-question evidence; exact historical visibility repaired separately'}
          (root/'reading/audit/french_review_target_visibility_post_a1_repair_2026-08-19.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':out['status'],'finding_count':out['finding_count'],'by_level':out['by_level'],'findings':findings[:100]},ensure_ascii=False,indent=2))
          PY
      - name: Annotate rebuilt coverage evidence and emit compact result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reading/audit/french_coverage_evidence_post_a1_visibility_2026-08-19.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          x['schema_version']=4
          x['supersedes_for_repaired_a1']=['reading/audit/french_coverage_evidence_2026-08-19.json','reading/audit/french_coverage_evidence_full_v2_2026-08-19.json']
          x['post_a1_repair_method']={
              'base_implementation_commit':'7634a9adfed00675d087b70edf5792a333ca03e9',
              'stanza_version':'1.10.1',
              'repository_function_forms':True,
              'a1_fixed_expression_scope_checked':True,
              'a1_support_lexicon_version':2,
              'review_visibility_repair_applied':True,
              'learner_mastery_inferred':False,
              'estimated_known_token_coverage_population_allowed':False,
              'auto_approval_allowed':False
          }
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          a1=x['coverage_summary_by_level']['A1']
          compact={
              'schema_version':1,'date':'2026-08-19','language':'fr','level':'A1',
              'a1_hash':x['bound_canonical_hashes']['A1'],
              'coverage_summary':a1,
              'classification_counts_global':x['classification_counts'],
              'chronology_findings':x['chronology_findings'],
              'target_ledger_summary':x['target_ledger_summary'],
              'a1_review_visibility':json.loads(Path('reading/audit/french_review_target_visibility_post_a1_repair_2026-08-19.json').read_text(encoding='utf-8')),
              'decision':x['decision']
          }
          Path('reading/audit/french_a1_post_repair_regression_summary_2026-08-19.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'a1_hash':compact['a1_hash'],'coverage_summary':a1,'chronology_findings':compact['chronology_findings'],'target_ledger_summary':compact['target_ledger_summary'],'visibility_status':compact['a1_review_visibility']['status'],'visibility_findings':compact['a1_review_visibility']['finding_count']},ensure_ascii=False,indent=2))
          PY
          rm -f reading/tools/audit_french_post_a1_visibility_runtime.py
      - name: Commit rebuilt regression evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_a1_fixed_expression_scope_post_visibility_2026-08-19.json reading/audit/french_curriculum_exposure_ledger_post_a1_visibility_2026-08-19.json reading/audit/french_coverage_evidence_post_a1_visibility_2026-08-19.json reading/audit/french_review_target_visibility_post_a1_repair_2026-08-19.json reading/audit/french_a1_post_repair_regression_summary_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild French A1 coverage and exposure evidence [skip ci]'
          git push origin HEAD:repair/french-a1-coverage-2026-08-19
