name: French A1 post-repair coverage regression
on:
  push:
    branches: [repair/french-a1-coverage-2026-08-19]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned deterministic NLP dependency
        run: python -m pip install --disable-pip-version-check 'stanza==1.10.1'
      - name: Assert A1 fixed-expression scope and reconstruct audit
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/french/a1/passages.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          text='\n'.join(r['text'].replace('’',"'").casefold() for r in rows)
          checks={
            'abord_tokens':len(re.findall(r'\babord\b',text)),
            'd_abord_expressions':text.count("d'abord"),
            'tandis_tokens':len(re.findall(r'\btandis\b',text)),
            'tandis_que_expressions':text.count('tandis que'),
            'afin_tokens':len(re.findall(r'\bafin\b',text)),
            'afin_de_que_expressions':text.count('afin de')+text.count('afin que')
          }
          if checks['abord_tokens'] != checks['d_abord_expressions']:
            raise SystemExit(f'abord has non-d’abord A1 use: {checks}')
          if checks['tandis_tokens'] != checks['tandis_que_expressions']:
            raise SystemExit(f'tandis has non-tandis-que A1 use: {checks}')
          if checks['afin_tokens'] != checks['afin_de_que_expressions']:
            raise SystemExit(f'afin has non-purpose-linker A1 use: {checks}')
          Path('reading/audit/french_a1_fixed_expression_scope_2026-08-19.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          import subprocess
          src=subprocess.check_output(['git','show','7634a9adfed00675d087b70edf5792a333ca03e9:reading/tools/audit_french_curriculum_coverage.py'],text=True)
          old='FUNCTION_POS = {"AUX", "ADP", "CCONJ", "SCONJ", "DET", "PRON", "PART"}'
          new=old+'\nFUNCTION_FORMS = {str(v).casefold() for v in json.loads((READING / "planning" / "a1_function_support.json").read_text(encoding="utf-8"))["french"]["function_forms"]}\nA1_FIXED_FUNCTION_LEMMAS = {"abord", "tandis", "afin"}'
          if old not in src: raise SystemExit('FUNCTION_POS anchor missing')
          src=src.replace(old,new,1)
          old_rule='elif w.upos in FUNCTION_POS:'
          new_rule='elif w.upos in FUNCTION_POS or surface in FUNCTION_FORMS or lemma in FUNCTION_FORMS or (level == "a1" and lemma in A1_FIXED_FUNCTION_LEMMAS):'
          if old_rule not in src: raise SystemExit('classification anchor missing')
          src=src.replace(old_rule,new_rule,1)
          old_guard='if got != EXPECTED_HASHES[level]:\n            raise SystemExit(f"canonical hash drift for {level}: expected {EXPECTED_HASHES[level]}, got {got}")'
          new_guard='if level != "a1" and got != EXPECTED_HASHES[level]:\n            raise SystemExit(f"canonical hash drift for {level}: expected {EXPECTED_HASHES[level]}, got {got}")'
          if old_guard not in src: raise SystemExit('hash guard anchor missing')
          src=src.replace(old_guard,new_guard,1)
          src=src.replace('french_curriculum_exposure_ledger_2026-08-19.json','french_curriculum_exposure_ledger_a1_repair_v3_2026-08-19.json')
          src=src.replace('french_coverage_evidence_2026-08-19.json','french_coverage_evidence_a1_repair_v3_2026-08-19.json')
          Path('reading/tools/audit_french_a1_repair_v3_runtime.py').write_text(src,encoding='utf-8')
          PY
      - name: Run pinned full comparison audit
        run: python reading/tools/audit_french_a1_repair_v3_runtime.py
      - name: Annotate regression evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reading/audit/french_coverage_evidence_a1_repair_v3_2026-08-19.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          x['schema_version']=3
          x['repair_regression_method']={
            'base_implementation_commit':'7634a9adfed00675d087b70edf5792a333ca03e9',
            'stanza_version':'1.10.1',
            'a1_hash_is_new_repair_hash':True,
            'other_level_hashes_must_match_prior_canonical':True,
            'repository_function_forms_enabled':True,
            'a1_fixed_expression_lemmas':['abord','tandis','afin'],
            'fixed_expression_scope_asserted_by':'reading/audit/french_a1_fixed_expression_scope_2026-08-19.json',
            'support_lexicon':'reading/lexicons/french_a1_support.json version 2',
            'does_not_establish_learner_mastery':True,
            'may_populate_estimated_known_token_coverage':False,
            'may_auto_approve_passages':False
          }
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f reading/tools/audit_french_a1_repair_v3_runtime.py
      - name: Commit regression evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_a1_fixed_expression_scope_2026-08-19.json reading/audit/french_curriculum_exposure_ledger_a1_repair_v3_2026-08-19.json reading/audit/french_coverage_evidence_a1_repair_v3_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit French A1 coverage after educator repairs [skip ci]'
          git push origin HEAD:repair/french-a1-coverage-2026-08-19
