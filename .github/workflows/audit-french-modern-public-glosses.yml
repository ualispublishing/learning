name: Audit French modern public glosses

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_french_modern_public_glosses.py'
      - '.github/workflows/audit-french-modern-public-glosses.yml'
      - 'audit/run_french_modern_public_glosses.request'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install corpus dictionary tooling
        run: python -m pip install word2word
      - name: Audit both French decks
        run: python scripts/audit_french_modern_public_glosses.py
      - name: Commit audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/french_modern_public_gloss_audit_summary.json audit/french_top1000_modern_public_review.json audit/french_top3000_modern_public_review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit French modern public glosses [skip ci]'
          for n in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*3))
          done
          exit 1
