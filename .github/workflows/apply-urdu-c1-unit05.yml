name: Apply Urdu C1 Unit 05

on:
  push:
    branches:
      - main
    paths:
      - "reading/urdu/c1/candidates/unit05/**"
      - "reading/audit/urdu_c1_u05_generation_qa_2026-08-26.json"
      - "reading/tools/apply_urdu_c1_unit05.py"
      - ".github/workflows/apply-urdu-c1-unit05.yml"

permissions:
  contents: write

concurrency:
  group: apply-urdu-c1-unit05
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize stale handoff frontier
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("reading/AGENT_HANDOFF_V2.md")
          text = path.read_text(encoding="utf-8")
          stale = "resume guarded generation at **Urdu C1 Unit 4 / sequence 19** using the C1 Unit 4 roadmap theme `language, identity, and society`."
          expected = "resume guarded generation at **Urdu C1 Unit 5 / sequence 25** using the C1 Unit 5 roadmap theme `scientific uncertainty and communication`."
          if stale in text:
              text = text.replace(stale, expected, 1)
              path.write_text(text, encoding="utf-8")
          elif expected not in text:
              raise SystemExit("Handoff exact-next-action is neither the known stale Unit 4 state nor the expected Unit 5 state")
          PY
      - name: Apply candidate and validate
        run: python reading/tools/apply_urdu_c1_unit05.py
      - name: Commit canonical unit
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/urdu/c1/passages.jsonl reading/CONTINUATION.json reading/STATUS.json reading/TASKS.md reading/AGENT_HANDOFF_V2.md reading/planning/ACTIVE_GENERATION_PLAN.json reading/STATE_MANIFEST.json reading/audit/urdu_c1_u05_generation_qa_2026-08-26.json
          git commit -m "Canonicalize Urdu C1 Unit 5 and advance frontier"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
