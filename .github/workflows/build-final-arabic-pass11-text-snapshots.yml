name: Build final Arabic pass 11 text snapshots
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/build_final_arabic_pass11_text_snapshots.py'
      - '.github/workflows/build-final-arabic-pass11-text-snapshots.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/build_final_arabic_pass11_text_snapshots.py
      - name: Commit snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/pass11_texts reading/audit/final_arabic_pass11_text_snapshot_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build Arabic Pass 11 text snapshots [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
