name: TEMP French coverage adjudication summary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'reading/run_french_coverage_adjudication_summary.request'

permissions:
  contents: write

jobs:
  summarize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/french-coverage-adjudication-summary-2026-08-19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Build compact adjudication dataset
        run: python reading/tools/summarize_french_coverage_adjudication.py
      - name: Commit summary artifact to audit branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_coverage_adjudication_candidates_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Summarize French coverage adjudication candidates [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
