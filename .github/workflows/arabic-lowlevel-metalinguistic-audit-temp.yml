name: TEMP Arabic A1-A2 metalinguistic audit
on:
  push:
    branches: [audit/arabic-lowlevel-metalinguistic-2026-08-20]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/arabic-lowlevel-metalinguistic-2026-08-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run candidate audit
        run: python reading/tools/audit_arabic_lowlevel_metalinguistic.py
      - name: Commit audit evidence to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/arabic_a1_a2_metalinguistic_candidate_audit_2026-08-20.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit Arabic A1-A2 metalinguistic candidates [skip ci]'
          git push origin HEAD:audit/arabic-lowlevel-metalinguistic-2026-08-20
