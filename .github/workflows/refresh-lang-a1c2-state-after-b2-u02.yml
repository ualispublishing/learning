name: Refresh LANG-A1C2 state after B2 Unit 3

on:
  push:
    paths:
      - '.github/workflows/refresh-lang-a1c2-state-after-b2-u02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh exact-byte state manifest
        shell: bash
        run: |
          set -euo pipefail
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py

      - name: Commit refreshed state lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/STATE_MANIFEST.json
          git commit -m 'Refresh LANG-A1C2 state manifest after B2 Unit 3'

      - name: Rebase and validate exact push candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py
          git add reading/STATE_MANIFEST.json
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          python reading/tools/validate_continuation_state.py
          git push origin HEAD:main
