name: Start French Final Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/sync_french_c2_completion.py'
      - '.github/workflows/start-french-final-audit.yml'
concurrency:
  group: french-final-audit-writer
  cancel-in-progress: false
permissions: {contents: write}
jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify sealed C2 and activate final audit
        run: python reading/tools/sync_french_c2_completion.py
      - name: Commit audit frontier state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/STATUS.json reading/TASKS.md reading/AGENT_HANDOFF.md reading/planning/C2_GENERATION_STATE.json
          git diff --cached --quiet && exit 0
          git commit -m 'Activate whole-French final audit [skip ci]'
          git fetch origin main && git rebase --autostash origin/main && git push origin HEAD:main
