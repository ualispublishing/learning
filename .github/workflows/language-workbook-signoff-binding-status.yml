name: LANG-WB sign-off binding status

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/language-workbook-signoff-binding-status.yml'
      - 'audit/language-workbooks/v1.0/FINAL_NATIVE_SIGNOFF_TEMPLATE.json'
      - 'scripts/workbook_final_human_promotion_gate.py'
      - 'scripts/validate_lang_wb_expected_human_hold.py'
      - 'completed/languages/workbooks/v1.0/RELEASE_MANIFEST.json'
      - 'completed/languages/workbooks/v1.0/arabic/00_arabic_complete_master.pdf'
      - 'completed/languages/workbooks/v1.0/french/00_french_complete_master.pdf'
      - 'completed/languages/workbooks/v1.0/urdu/00_urdu_complete_master.pdf'
  pull_request:
    paths:
      - '.github/workflows/language-workbook-signoff-binding-status.yml'
      - 'audit/language-workbooks/v1.0/FINAL_NATIVE_SIGNOFF_TEMPLATE.json'
      - 'scripts/workbook_final_human_promotion_gate.py'
      - 'scripts/validate_lang_wb_expected_human_hold.py'
      - 'completed/languages/workbooks/v1.0/RELEASE_MANIFEST.json'
      - 'completed/languages/workbooks/v1.0/arabic/00_arabic_complete_master.pdf'
      - 'completed/languages/workbooks/v1.0/french/00_french_complete_master.pdf'
      - 'completed/languages/workbooks/v1.0/urdu/00_urdu_complete_master.pdf'

permissions:
  contents: read

jobs:
  signoff-binding-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Evaluate current-candidate sign-off binding
        shell: bash
        run: |
          set +e
          python scripts/workbook_final_human_promotion_gate.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "LANG-WB current-candidate human promotion state: PASS"
          elif [ "$code" -eq 2 ]; then
            python scripts/validate_lang_wb_expected_human_hold.py
            echo "LANG-WB remains on a validated expected human-review HOLD for the current production candidate."
          else
            exit "$code"
          fi

      - name: Show binding-status report
        if: always()
        run: |
          if [ -f audit/language-workbooks/v1.0/final_human_promotion_gate.json ]; then
            cat audit/language-workbooks/v1.0/final_human_promotion_gate.json
          fi
