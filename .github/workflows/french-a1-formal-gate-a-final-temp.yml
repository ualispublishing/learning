name: TEMP French A1 corrected formal Gate A

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/french-a1-formal-gate-a-final-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-french-a1-corrected-formal-gate-a
  cancel-in-progress: false

jobs:
  gate-a:
    if: github.event.pull_request.head.ref == 'repair/french-a1-review-integrity-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic audit dependencies
        run: python -m pip install --quiet jsonschema stanza
      - name: Validate 100 percent of French A1 Gate A
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python reading/tools/audit_french_a1_generation_integrity.py
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import hashlib, json, re, subprocess, unicodedata
          import stanza
          from jsonschema import Draft202012Validator

          R=Path('.')
          C=R/'reading/french/a1/passages.jsonl'
          expected='fe9f321ada5740baf264c009ce0b5eb845777927f37f99f03e7459c5ae72b64c'
          sha=hashlib.sha256(C.read_bytes()).hexdigest()
          if sha != expected:
              raise SystemExit(f'FAIL CLOSED: A1 hash drift {sha} != {expected}')
          blob=subprocess.check_output(['git','hash-object',str(C)],text=True).strip()
          rows=[json.loads(x) for x in C.read_text(encoding='utf-8').splitlines() if x.strip()]
          gen=json.loads((R/'reading/audit/french_a1_generation_integrity.json').read_text(encoding='utf-8'))
          if gen.get('status')!='PASS' or gen.get('failures') or gen.get('legacy_unit01_exposure_variances'):
              raise SystemExit('FAIL CLOSED: strict generation/source/exposure prerequisite failed')

          blockers=[]; checks={}
          def add(kind, items=None):
              blockers.append({'kind':kind,'details':items} if items is not None else {'kind':kind})

          schema=json.loads((R/'reading/schema/passage.schema.json').read_text(encoding='utf-8'))
          v=Draft202012Validator(schema); errs=[]
          for row in rows:
              for e in v.iter_errors(row):
                  errs.append({'passage_id':row.get('id'),'path':list(e.path),'message':e.message})
          checks['schema_valid_100_percent']=not errs
          if errs: add('schema_validation',errs[:30])

          ids=[r.get('id') for r in rows]
          expids=[f'fr-a1-u{u:02d}-p{p:02d}' for u in range(1,11) for p in range(1,7)]
          ok=(len(rows)==60 and ids==expids and [r.get('sequence') for r in rows]==list(range(1,61)) and len(set(ids))==60 and Counter(r.get('unit') for r in rows)==Counter({u:6 for u in range(1,11)}) and all(r.get('language')=='fr' and r.get('cefr')=='A1' for r in rows))
          checks['identity_sequence_level_grid']=ok
          if not ok: add('identity_sequence_level_grid')

          qa=[]; dups=[]; bands=[]; local=[]; checkpoints=[]; unicode_issues=[]; hygiene=[]
          banned=('pipeline','frontier lock','generation batch','generated by','todo','placeholder','lorem ipsum','c2 unit')
          iid=re.compile(r'fr-(?:rank|a1|a2|b1|b2|c1|c2)-',re.I)
          nonlatin=re.compile(r'[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff]')
          for row in rows:
              qs=row.get('questions',[]); ans=row.get('answer_key',[])
              qmap={q.get('id'):q for q in qs}; amap={a.get('id'):a for a in ans}
              if len(qs)!=10 or len(ans)!=10 or len(qmap)!=10 or len(amap)!=10:
                  qa.append({'passage_id':row['id'],'kind':'cardinality_or_duplicate_id'})
              for q in qs:
                  a=amap.get(q.get('answer_id'))
                  if not a or a.get('question_id')!=q.get('id'):
                      qa.append({'passage_id':row['id'],'question_id':q.get('id'),'kind':'forward_link'})
              for a in ans:
                  q=qmap.get(a.get('question_id'))
                  if not q or q.get('answer_id')!=a.get('id'):
                      qa.append({'passage_id':row['id'],'answer_id':a.get('id'),'kind':'back_link'})
              ps=[unicodedata.normalize('NFC',q.get('prompt','')).strip().casefold() for q in qs]
              dups += [{'passage_id':row['id'],'prompt':p} for p,c in Counter(ps).items() if p and c>1]
              wc=len(row.get('text','').split())
              if row.get('word_count')!=wc or not 90<=wc<=140:
                  bands.append({'passage_id':row['id'],'stored':row.get('word_count'),'actual':wc})
              declared={x.get('id') for f in ('new_lexical_targets','review_lexical_targets','grammar_targets','discourse_targets') for x in row.get(f,[]) if isinstance(x,dict)}
              for q in qs:
                  for tid in q.get('target_ids',[]):
                      if tid not in declared:
                          local.append({'passage_id':row['id'],'question_id':q['id'],'target_id':tid})
              if row['id'].endswith('-p06') and row.get('new_lexical_targets'):
                  checkpoints.append(row['id'])
              learner=[row.get('title',''),row.get('text','')]+[q.get('prompt','') for q in qs]+[a.get('answer','') for a in ans]+[a.get('explanation','') for a in ans]
              for s in learner:
                  if s!=unicodedata.normalize('NFC',s):
                      unicode_issues.append({'passage_id':row['id'],'kind':'non_nfc','sample':s[:120]})
                  if any(ord(ch)<32 and ch not in '\n\t\r' for ch in s):
                      unicode_issues.append({'passage_id':row['id'],'kind':'control_character','sample':s[:120]})
                  if s.count('«')!=s.count('»'):
                      unicode_issues.append({'passage_id':row['id'],'kind':'unbalanced_guillemets','sample':s[:120]})
                  # Multiple-choice labels such as A), B), C) are not parentheses.
                  paren_s=re.sub(r'(^|\s)[A-D]\)',r'\1',s)
                  if paren_s.count('(')!=paren_s.count(')'):
                      unicode_issues.append({'passage_id':row['id'],'kind':'unbalanced_parentheses','sample':s[:120]})
                  low=unicodedata.normalize('NFKC',s).casefold()
                  if any(x in low for x in banned):
                      hygiene.append({'passage_id':row['id'],'kind':'workflow_or_placeholder_language','sample':s[:120]})
                  if iid.search(s):
                      hygiene.append({'passage_id':row['id'],'kind':'internal_id','sample':s[:120]})
                  if nonlatin.search(s):
                      hygiene.append({'passage_id':row['id'],'kind':'unintended_non_french_script','sample':s[:120]})

          for name,items in [('question_answer_one_to_one',qa),('duplicate_prompts_within_passage_zero',dups),('word_band_and_stored_counts',bands),('assessment_targets_locally_declared',local),('checkpoint_p06_zero_new',checkpoints),('unicode_punctuation_sanity',unicode_issues),('learner_facing_hygiene',hygiene)]:
              checks[name]=not items
              if items: add(name,items[:30])

          srcs=['french_top1000.csv','french_top3000.csv','reading/lexicons/french.jsonl','reading/lexicons/french_a1_support.json']
          changed=subprocess.run(['git','diff','--name-only','origin/main...HEAD','--',*srcs],text=True,capture_output=True,check=True).stdout.strip().splitlines()
          checks['source_lexicons_unchanged_from_main']=not changed
          if changed: add('source_lexicons_changed',changed)
          source_hashes={p:hashlib.sha256((R/p).read_bytes()).hexdigest() for p in srcs}

          stanza.download('fr',processors='tokenize,pos,lemma',verbose=False)
          nlp=stanza.Pipeline('fr',processors='tokenize,pos,lemma',use_gpu=False,verbose=False)
          def norm(s):
              return re.sub(r"^[^\w]+|[^\w]+$",'',unicodedata.normalize('NFC',str(s or '')).replace('’',"'").casefold(),flags=re.UNICODE)
          intro={}; high={}; order={'R1':1,'R2':2,'R3':3,'R4':4,'R5':5,'long_term':6}; vis=[]; chrono=[]; nreview=0
          for row in rows:
              doc=nlp(row['text'])
              toks={(norm(w.text),norm(w.lemma)) for sent in doc.sentences for w in sent.words}
              allfields='\n'.join([row.get('text','')]+[q.get('prompt','') for q in row.get('questions',[])]+[a.get('answer','') for a in row.get('answer_key',[])])
              qtargets={tid for q in row.get('questions',[]) for tid in q.get('target_ids',[])}
              for rv in row.get('review_lexical_targets',[]):
                  nreview+=1; tid=rv.get('id'); prev=intro.get(tid)
                  if prev is None or prev['sequence']>=row['sequence']:
                      chrono.append({'passage_id':row['id'],'target_id':tid,'kind':'review_before_introduction'}); continue
                  cur=order.get(rv.get('review_stage'),0); prior=high.get(tid,0)
                  if cur<prior:
                      chrono.append({'passage_id':row['id'],'target_id':tid,'kind':'stage_regression','prior':prior,'current':cur})
                  high[tid]=max(prior,cur)
                  keys={norm(rv.get('form')),norm(prev.get('form')),norm(prev.get('lemma'))}-{''}
                  running=any(s in keys or l in keys for s,l in toks)
                  exact=any(re.search(r'(?<!\w)'+re.escape(k)+r'(?!\w)',unicodedata.normalize('NFC',allfields).casefold(),flags=re.UNICODE) for k in keys)
                  linked=tid in qtargets
                  visible=running if rv.get('representation')=='running_text' else (running or exact or linked)
                  if not visible:
                      vis.append({'passage_id':row['id'],'target_id':tid,'form':rv.get('form'),'representation':rv.get('representation'),'keys':sorted(keys)})
              for t in row.get('new_lexical_targets',[]):
                  intro[t.get('id')]={'sequence':row['sequence'],'form':t.get('form'),'lemma':t.get('lemma')}
          checks['review_target_visibility_100_percent']=not vis
          checks['review_target_chronology_and_stage_monotonicity']=not chrono
          if vis: add('review_target_visibility',vis[:30])
          if chrono: add('review_target_chronology',chrono[:30])
          checks['strict_source_rank_and_exact_exposure_integrity']=True
          checks['future_target_leakage_rule']='NOT_APPLICABLE_NO_FRENCH_A1_PROHIBITION_RECORDED'

          evidence={
            'schema_version':1,
            'date':'2026-08-22',
            'language':'fr',
            'level':'A1',
            'audit':'formal_protocol_gate_a_current_corpus',
            'protocol':'reading/planning/EDUCATOR_RELEASE_VERIFICATION_PROTOCOL.md §3',
            'status':'PASS_DETERMINISTIC_FORMAL_GATE_A_NEEDS_LATER_RELEASE_GATES' if not blockers else 'FAIL_DETERMINISTIC_FORMAL_GATE_A',
            'bound_sha256':sha,
            'bound_git_blob':blob,
            'scope':{'passages':len(rows),'questions':sum(len(r.get('questions',[])) for r in rows),'answers':sum(len(r.get('answer_key',[])) for r in rows),'review_target_checks':nreview},
            'checks':checks,
            'blocker_count':len(blockers),
            'blockers':blockers,
            'validator_correction':{'issue':'Previous draft Gate A counted multiple-choice labels A)/B)/C) as unmatched closing parentheses.','correction':'Punctuation sanity now removes standalone A)-D) option labels before balancing real parentheses; legitimate parenthesized text remains checked.','corpus_change_required':False},
            'warnings':[{'kind':'future_target_leakage','hard_rule_applicable':False,'reason':'No French A1 repository policy prohibiting incidental pre-exposure was identified; protocol blocks this only where prohibited.'}],
            'source_lexicon_sha256':source_hashes,
            'independent_review':{'semantic_accuracy':'PENDING','french_naturalness_orthography':'PENDING','pedagogical_a1_fit':'PENDING','assessment_answer_grounding':'PENDING','independent_machine_tools':'PENDING','independent_model_family':'PENDING','native_professional':'PENDING','educator_release':'PENDING','blind_review':'PENDING'},
            'release_effect':'NONE_AUTOMATIC: formal Gate A is deterministic integrity only. French remains REOPEN_REQUIRED until mandatory later gates pass against the same then-current hashes.'
          }
          out=Path('reading/audit/french_a1_formal_gate_a_2026-08-22.json')
          out.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':evidence['status'],'bound_sha256':sha,'blockers':len(blockers),'review_target_checks':nreview},ensure_ascii=False))
          if blockers:
              print(json.dumps(blockers,ensure_ascii=False,indent=2))
              raise SystemExit(1)
          PY
      - name: Commit Gate A evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_a1_generation_integrity.json reading/audit/french_a1_formal_gate_a_2026-08-22.json
          git rm -f .github/workflows/french-a1-formal-gate-a-final-temp.yml
          git commit -m 'Record French A1 formal Gate A result [skip ci]'
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
