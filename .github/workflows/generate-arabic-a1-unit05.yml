name: Generate Arabic A1 Unit 05

on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_arabic_a1_unit05.py'
      - '.github/workflows/generate-arabic-a1-unit05.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Remove accidental Arabic elongation typo before generation
        run: sed -i 's/داخـل/داخل/g' reading/tools/generate_arabic_a1_unit05.py
      - name: Generate canonical Arabic A1 Unit 05
        run: python reading/tools/generate_arabic_a1_unit05.py
      - name: Commit generated passages and first-draft typo fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/tools/generate_arabic_a1_unit05.py reading/arabic/a1/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate Arabic A1 Unit 05 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
