name: Update Arabic final review status
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/update_arabic_final_review_status.py'
      - '.github/workflows/update-arabic-final-review-status.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/update_arabic_final_review_status.py
      - name: Commit synchronized final-review status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/STATUS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize Arabic final review status [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
