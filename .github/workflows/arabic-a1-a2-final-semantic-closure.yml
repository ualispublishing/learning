name: Arabic A1+A2 final semantic closure

on:
  push:
    branches: [audit/arabic-a1-a2-integrated-2026-08-23]
    paths:
      - 'reading/tools/apply_arabic_a1_a2_final_semantic_closure.py'
      - '.github/workflows/arabic-a1-a2-final-semantic-closure.yml'

permissions:
  contents: write

concurrency:
  group: arabic-a1-a2-final-semantic-closure
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/arabic-a1-a2-integrated-2026-08-23
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply semantic closure
        run: python reading/tools/apply_arabic_a1_a2_final_semantic_closure.py
      - name: Commit closed corpus and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/arabic/a1/passages.jsonl reading/arabic/a2/passages.jsonl reading/audit/arabic_a1_a2_final_semantic_closure_2026-08-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply Arabic A1/A2 final semantic closure [skip ci]"
          git fetch origin audit/arabic-a1-a2-integrated-2026-08-23
          git rebase origin/audit/arabic-a1-a2-integrated-2026-08-23
          git push origin HEAD:audit/arabic-a1-a2-integrated-2026-08-23
