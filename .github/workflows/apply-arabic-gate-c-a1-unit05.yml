name: Apply Arabic Gate C A1 Unit 5

on:
  push:

permissions:
  contents: write

jobs:
  arabic-gate-c-a1-unit05:
    if: github.event.head_commit.message == 'Run Arabic Gate C A1 Unit 5 now'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact pre-Unit-5 Gate C state
        run: |
          set -euo pipefail
          python reading/tools/validate_continuation_state.py
          for u in 01 02 03 04; do test -e reading/audit/arabic_gate_c_decisions_2026-09-05/a1_u${u}.json; done
          test ! -e reading/audit/arabic_gate_c_decisions_2026-09-05/a1_u05.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reading/RELEASE_STATUS.json').read_text(encoding='utf-8'))['languages']['arabic']
          m=json.loads(Path('reading/STATE_MANIFEST.json').read_text(encoding='utf-8'))
          assert m['aggregate_sha256']=='b53a41acc586c2f11ee12d645b38d18e063551e763c7465070a1adf4c978280a'
          assert r['release_state']=='REOPEN_REQUIRED' and r['educator_release_ready'] is False
          b=r['naturalness_review_progress']; c=r['comprehension_review_progress']; d=r['latest_deterministic_gate']
          assert (b['fresh_records_reviewed'],b['fresh_records_with_findings'],b['fresh_findings'])==(360,308,560)
          assert (c['fresh_records_reviewed'],c['fresh_qa_pairs_reviewed'],c['fresh_records_with_findings'],c['fresh_findings'])==(24,240,5,5)
          assert d['open_findings']==1080
          assert d['finding_classes']=={'coverage_missing_or_zero':360,'coverage_not_pass':360,'not_approved':360}
          PY
      - name: Apply exact-current A1 Unit 5 Gate C repairs
        run: python reading/tools/apply_arabic_gate_c_a1_unit05.py
      - name: Rebuild and bind Gate B and Gate C evidence
        run: |
          set -euo pipefail
          python reading/tools/run_post_generation_gate0.py
          python reading/tools/run_arabic_fresh_deterministic_revalidation.py
          python reading/tools/audit_arabic_metalinguistic_cefr_candidates.py
          python reading/tools/adjudicate_arabic_b1_c2_metalinguistic_cefr.py
          python reading/tools/build_arabic_gate_b_naturalness_review.py
          python reading/tools/record_arabic_gate_c_a1_unit05_decisions.py
          python reading/tools/sync_arabic_gate_b_progress.py
          python reading/tools/sync_arabic_release_global_blocker.py
          python reading/tools/sync_arabic_gate_c_progress.py
          python reading/tools/sync_verification_tasks_arabic_gate_c_a1_unit05.py
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py
      - name: Assert exact post-Unit-5 state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reading/RELEASE_STATUS.json').read_text(encoding='utf-8'))['languages']['arabic']
          b=r['naturalness_review_progress']; c=r['comprehension_review_progress']; d=r['latest_deterministic_gate']
          assert r['release_state']=='REOPEN_REQUIRED' and r['educator_release_ready'] is False
          assert (b['fresh_records_reviewed'],b['fresh_records_with_findings'],b['fresh_findings'])==(360,308,560)
          assert (c['fresh_records_reviewed'],c['fresh_qa_pairs_reviewed'],c['fresh_records_with_findings'],c['fresh_findings'])==(30,300,10,15)
          assert c['status']=='FRESH_GATE_C_INTERNAL_REVIEW_IN_PROGRESS' and c['levels_completed']==[]
          assert c['decision_artifacts']==[f'reading/audit/arabic_gate_c_decisions_2026-09-05/a1_u{i:02d}.json' for i in range(1,6)]
          assert d['open_findings']==1080 and d['finding_classes']=={'coverage_missing_or_zero':360,'coverage_not_pass':360,'not_approved':360}
          g=json.loads(Path('reading/audit/arabic_gate_c_decisions_2026-09-05/a1_u05.json').read_text(encoding='utf-8'))
          assert (g['records_reviewed'],g['qa_pairs_reviewed'],g['records_with_findings'],g['fresh_findings'])==(6,60,5,10)
          assert g['quality_promotion'] is False and g['release_claim'] is False
          PY
      - name: Commit bounded Gate C Unit 5 repair and exact state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a1/passages.jsonl \
            reading/audit/arabic_gate_c_decisions_2026-09-05/a1_u05.json \
            reading/audit/arabic_gate_b_decisions_2026-08-30/a1_u05.json \
            reading/audit/post_generation_gate0_2026-08-30.json \
            reading/audit/arabic_fresh_deterministic_revalidation_2026-08-30.json \
            reading/audit/arabic_metalinguistic_cefr_candidate_inventory_2026-08-30.json \
            reading/audit/arabic_b1_c2_metalinguistic_cefr_triage_2026-08-30.json \
            reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json \
            reading/audit/arabic_gate_b_packets_2026-08-30 \
            reading/RELEASE_STATUS.json reading/VERIFICATION_TASKS.md reading/STATE_MANIFEST.json
          git commit -m 'Complete Arabic Gate C A1 Unit 5 review'
      - name: Rebase and regenerate exact push candidate
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          python reading/tools/validate_continuation_state.py
          python reading/tools/run_post_generation_gate0.py
          python reading/tools/run_arabic_fresh_deterministic_revalidation.py
          python reading/tools/audit_arabic_metalinguistic_cefr_candidates.py
          python reading/tools/adjudicate_arabic_b1_c2_metalinguistic_cefr.py
          python reading/tools/build_arabic_gate_b_naturalness_review.py
          python reading/tools/record_arabic_gate_c_a1_unit05_decisions.py
          python reading/tools/sync_arabic_gate_b_progress.py
          python reading/tools/sync_arabic_release_global_blocker.py
          python reading/tools/sync_arabic_gate_c_progress.py
          python reading/tools/sync_verification_tasks_arabic_gate_c_a1_unit05.py
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py
          git add reading/arabic/a1/passages.jsonl \
            reading/audit/arabic_gate_c_decisions_2026-09-05/a1_u05.json \
            reading/audit/arabic_gate_b_decisions_2026-08-30/a1_u05.json \
            reading/audit/post_generation_gate0_2026-08-30.json \
            reading/audit/arabic_fresh_deterministic_revalidation_2026-08-30.json \
            reading/audit/arabic_metalinguistic_cefr_candidate_inventory_2026-08-30.json \
            reading/audit/arabic_b1_c2_metalinguistic_cefr_triage_2026-08-30.json \
            reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json \
            reading/audit/arabic_gate_b_packets_2026-08-30 \
            reading/RELEASE_STATUS.json reading/VERIFICATION_TASKS.md reading/STATE_MANIFEST.json
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          python reading/tools/validate_continuation_state.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reading/RELEASE_STATUS.json').read_text(encoding='utf-8'))['languages']['arabic']
          assert r['release_state']=='REOPEN_REQUIRED' and r['educator_release_ready'] is False
          assert r['naturalness_review_progress']['fresh_records_reviewed']==360
          assert r['comprehension_review_progress']['fresh_records_reviewed']==30
          assert r['comprehension_review_progress']['fresh_qa_pairs_reviewed']==300
          assert r['latest_deterministic_gate']['open_findings']==1080
          PY
          git push origin HEAD:main
