name: Complete French C1 Remaining
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/complete_french_c1_remaining.py'
      - 'reading/tools/complete_french_c1_unit10.py'
      - 'reading/tools/audit_french_c1_generation_integrity.py'
      - 'reading/tools/sync_french_c1_completion.py'
      - 'reading/tools/prepare_french_c2_readiness.py'
      - '.github/workflows/complete-french-c1-remaining.yml'
concurrency:
  group: french-c1-canonical-writer
  cancel-in-progress: false
permissions: {contents: write}
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Run serialized remaining C1 pipeline
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python reading/tools/complete_french_c1_remaining.py 2>&1 | tee /tmp/french_c1_remaining.log
      - name: Preserve failure log
        if: steps.run.outcome != 'success'
        run: mkdir -p reading/audit && cp /tmp/french_c1_remaining.log reading/audit/french_c1_remaining_workflow_failure.txt || true
      - name: Commit all validated progress and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/c1/passages.jsonl reading/audit reading/STATUS.json reading/TASKS.md reading/AGENT_HANDOFF.md
          git diff --cached --quiet && exit 0
          git commit -m 'Advance serialized French C1 remaining pipeline [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
      - name: Fail at first unresolved C1 guard
        if: steps.run.outcome != 'success'
        run: exit 1
