name: Lock French B2 Unit 04 Frontier
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/lock_french_b2_unit04_frontier.py'
      - '.github/workflows/lock-french-b2-unit04-frontier.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate Unit 04 frontier
        run: python reading/tools/lock_french_b2_unit04_frontier.py
      - name: Commit Unit 04 frontier lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_b2_unit04_frontier_lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Lock French B2 Unit 04 frontier [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
