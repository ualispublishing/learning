name: Refresh Arabic B1-C2 triage current

on:
  push:
    paths:
      - '.github/workflows/refresh-arabic-b1-c2-triage-current.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed or repair PROJECT_TRACKS manifest bookkeeping only
        shell: bash
        run: |
          set +e
          output="$(python reading/tools/validate_continuation_state.py 2>&1)"; rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            python - "$output" <<'PY'
          import sys
          errors=[line[2:] for line in sys.argv[1].splitlines() if line.startswith('- ')]
          allowed=(
            'STATE_MANIFEST blob drift: PROJECT_TRACKS.json:',
            'STATE_MANIFEST byte-size drift: PROJECT_TRACKS.json:',
            'STATE_MANIFEST state_file_bytes mismatch',
            'STATE_MANIFEST aggregate_sha256 mismatch',
          )
          unexpected=[e for e in errors if not any(e.startswith(p) for p in allowed)]
          if not errors or unexpected or not any(e.startswith('STATE_MANIFEST blob drift: PROJECT_TRACKS.json:') for e in errors):
              raise SystemExit(f'Unexpected routed-state drift; refusing Arabic triage refresh: {unexpected or errors}')
          PY
            python reading/tools/refresh_state_manifest.py
            python reading/tools/validate_continuation_state.py
          fi

      - name: Rebuild exact-current Gate 0 and metalinguistic evidence
        run: |
          python reading/tools/run_post_generation_gate0.py
          python reading/tools/audit_arabic_metalinguistic_cefr_candidates.py
          python reading/tools/adjudicate_arabic_b1_c2_metalinguistic_cefr.py

      - name: Commit hash-bound evidence safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/post_generation_gate0_2026-08-30.json \
                  reading/audit/arabic_metalinguistic_cefr_candidate_inventory_2026-08-30.json \
                  reading/audit/arabic_b1_c2_metalinguistic_cefr_triage_2026-08-30.json
          if ! git diff --quiet -- reading/STATE_MANIFEST.json; then git add reading/STATE_MANIFEST.json; fi
          if git diff --cached --quiet; then
            echo 'Evidence already current.'
            exit 0
          fi
          git commit -m 'Refresh current Arabic B1-C2 metalinguistic triage'
          git fetch origin main
          git rebase origin/main
          python reading/tools/validate_continuation_state.py
          python reading/tools/run_post_generation_gate0.py
          python reading/tools/audit_arabic_metalinguistic_cefr_candidates.py
          python reading/tools/adjudicate_arabic_b1_c2_metalinguistic_cefr.py
          git add reading/audit/post_generation_gate0_2026-08-30.json \
                  reading/audit/arabic_metalinguistic_cefr_candidate_inventory_2026-08-30.json \
                  reading/audit/arabic_b1_c2_metalinguistic_cefr_triage_2026-08-30.json
          if ! git diff --quiet -- reading/STATE_MANIFEST.json; then git add reading/STATE_MANIFEST.json; fi
          git commit --amend --no-edit
          python reading/tools/validate_continuation_state.py
          git push origin HEAD:main
