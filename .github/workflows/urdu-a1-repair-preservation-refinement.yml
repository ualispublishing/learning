name: Urdu A1 Repair Preservation Refinement

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write

concurrency:
  group: urdu-a1-repair-preservation-refinement
  cancel-in-progress: false

jobs:
  refine:
    if: github.head_ref == 'audit/urdu-a1-final-deterministic-2026-08-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Refine bounded repairs and rerun deterministic audit
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          STATUS="$(python - <<'PY'
          import hashlib
          import json
          import re
          import unicodedata
          from datetime import datetime, timezone
          from pathlib import Path

          corpus_path = Path('reading/urdu/a1/passages.jsonl')
          repair_path = Path('reading/audit/urdu_a1_premature_target_repairs_2026-08-22.json')
          audit_path = Path('reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json')
          expected_intermediate_sha = '9968988956d8813543a6ca800ecaadc3df973ab6b22b001a56ce84c0a39911d2'
          original_sha = '3673ec71bf52d6d01ae11e8fd864eebc7f5fe1c3acac2ae19e4e2229ee14b728'

          raw = corpus_path.read_bytes()
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected_intermediate_sha:
              raise SystemExit(f'FAIL source drift: {actual} != {expected_intermediate_sha}')

          refinements = {
              'ur-a1-u04-p01': [
                  (
                      'عائشہ کہتی ہے کہ یہ تصویر اہم ہے کیونکہ اس میں سب ایک ساتھ ہیں۔',
                      'عائشہ کہتی ہے کہ یہ تصویر اہم ہے کیونکہ اس میں خاندان کے سب افراد ایک ساتھ ہیں۔'
                  )
              ],
              'ur-a1-u04-p02': [
                  (
                      'مریم بھی اپنی خالہ کے ساتھ آتی ہے۔',
                      'مریم بھی پارک آتی ہے۔'
                  )
              ],
              'ur-a1-u06-p01': [
                  (
                      'اس وقت عائشہ پہلی بار محلے کی نئی لائبریری پیدل جا رہی ہے۔',
                      'آج عائشہ پہلی بار محلے کی نئی لائبریری پیدل جا رہی ہے۔'
                  )
              ],
          }

          lines = raw.decode('utf-8').splitlines()
          out = []
          seen = set()
          for line in lines:
              rec = json.loads(line)
              rid = rec.get('id')
              if rid in refinements:
                  text = rec.get('text', '')
                  for before, after in refinements[rid]:
                      if text.count(before) != 1:
                          raise SystemExit(f'FAIL exact refinement anchor for {rid}: {before!r}')
                      text = text.replace(before, after)
                  rec['text'] = text
                  rec['word_count'] = len(text.split())
                  out.append(json.dumps(rec, ensure_ascii=False))
                  seen.add(rid)
              else:
                  out.append(line)
          if seen != set(refinements):
              raise SystemExit(f'FAIL refinement record set: {seen}')

          new_raw = ('\n'.join(out) + '\n').encode('utf-8')
          corpus_path.write_bytes(new_raw)
          after_sha = hashlib.sha256(new_raw).hexdigest()
          records = [json.loads(line) for line in new_raw.decode('utf-8').splitlines() if line.strip()]

          def norm(s):
              return unicodedata.normalize('NFC', str(s or ''))

          def tokens(s):
              return re.findall(r'[^\W_]+', norm(s), flags=re.UNICODE)

          def has_surface(text, form):
              ft = tokens(form)
              tt = tokens(text)
              if not ft:
                  return False
              n = len(ft)
              return any(tt[i:i+n] == ft for i in range(len(tt)-n+1))

          ascii_re = re.compile(r'[A-Za-z]')
          problems = []
          checks = {}

          checks['source_corpus_before_sha256_exact'] = actual == expected_intermediate_sha
          checks['passage_count_exact_60'] = len(records) == 60
          ids = [r.get('id') for r in records]
          checks['passage_ids_unique'] = len(ids) == len(set(ids)) == 60
          checks['sequences_contiguous_1_60'] = [r.get('sequence') for r in records] == list(range(1, 61))
          by_unit = {u: [] for u in range(1, 11)}
          for r in records:
              by_unit.setdefault(r.get('unit'), []).append(r)
          checks['units_exact_1_10_and_six_each'] = set(r.get('unit') for r in records) == set(range(1, 11)) and all(len(by_unit[u]) == 6 for u in range(1, 11))
          checks['language_ur_cefr_a1_id_sequence_alignment'] = all(
              r.get('language') == 'ur'
              and str(r.get('cefr', '')).upper() == 'A1'
              and r.get('id') == f"ur-a1-u{r.get('unit'):02d}-p{((r.get('sequence')-1)%6)+1:02d}"
              for r in records
          )
          checks['a1_word_band_and_stored_counts'] = all(
              isinstance(r.get('word_count'), int)
              and 90 <= r.get('word_count') <= 140
              and r.get('word_count') == len(str(r.get('text', '')).split())
              for r in records
          )

          qa_ok = True
          duplicate_prompts = 0
          local_ok = True
          visibility_ok = True
          review_visibility_ok = True
          roman_findings = 0
          new_ids = []
          new_decl_count = 0
          for r in records:
              qs = r.get('questions') or []
              ans = r.get('answer_key') or []
              if len(qs) != 10 or len(ans) != 10:
                  qa_ok = False
              qids = [q.get('id') for q in qs]
              aids = [a.get('id') for a in ans]
              if len(qids) != len(set(qids)) or len(aids) != len(set(aids)):
                  qa_ok = False
              amap = {a.get('id'): a for a in ans}
              for q in qs:
                  a = amap.get(q.get('answer_id'))
                  if not a or a.get('question_id') != q.get('id'):
                      qa_ok = False
              prompts = [norm(q.get('prompt')).strip() for q in qs]
              duplicate_prompts += len(prompts) - len(set(prompts))
              new_targets = r.get('new_lexical_targets') or []
              reviews = r.get('review_lexical_targets') or []
              new_decl_count += len(new_targets)
              local_ids = {t.get('id') for t in new_targets + reviews if t.get('id')}
              for q in qs:
                  for tid in q.get('target_ids') or []:
                      if tid not in local_ids:
                          local_ok = False
              for t in new_targets:
                  tid, form = t.get('id'), t.get('form')
                  if tid:
                      new_ids.append(tid)
                  if form and not has_surface(r.get('text', ''), form):
                      visibility_ok = False
              for t in reviews:
                  if t.get('representation') == 'running_text' and t.get('form') and not has_surface(r.get('text', ''), t.get('form')):
                      review_visibility_ok = False
              learner_strings = [r.get('text', '')] + [q.get('prompt', '') for q in qs]
              learner_strings += [a.get('answer', '') for a in ans] + [a.get('explanation', '') for a in ans]
              if any(ascii_re.search(str(s or '')) for s in learner_strings):
                  roman_findings += 1

          checks['ten_questions_answers_and_linkage'] = qa_ok and sum(len(r.get('questions') or []) for r in records) == 600 and sum(len(r.get('answer_key') or []) for r in records) == 600
          checks['duplicate_prompts_within_passage_zero'] = duplicate_prompts == 0
          checks['question_targets_locally_declared'] = local_ok
          checks['new_target_id_collisions_zero'] = len(new_ids) == len(set(new_ids))
          checks['new_targets_visible_exact_token'] = visibility_ok
          checks['running_text_reviews_visible_exact_token'] = review_visibility_ok

          unit_policy_ok = True
          premature = []
          for unit in range(1, 11):
              urs = sorted(by_unit[unit], key=lambda r: r.get('sequence'))
              unit_target_ids = set()
              introductions = []
              for idx, r in enumerate(urs, start=1):
                  nts = r.get('new_lexical_targets') or []
                  if idx <= 5 and len(nts) != 2:
                      unit_policy_ok = False
                  if idx == 6 and nts:
                      unit_policy_ok = False
                  for t in nts:
                      if t.get('id'):
                          unit_target_ids.add(t['id'])
                      if t.get('id') and t.get('form'):
                          introductions.append((r.get('sequence'), t['id'], t['form']))
              p06 = urs[-1]
              p06_reviews = {t.get('id') for t in (p06.get('review_lexical_targets') or []) if t.get('id')}
              if not unit_target_ids.issubset(p06_reviews):
                  unit_policy_ok = False
              for r in urs:
                  for intro_seq, tid, form in introductions:
                      if intro_seq > r.get('sequence') and has_surface(r.get('text', ''), form):
                          premature.append({'unit': unit, 'record_id': r.get('id'), 'target_id': tid, 'form': form, 'introduced_sequence': intro_seq, 'earlier_sequence': r.get('sequence')})
          checks['p01_p05_two_new_and_p06_review_policy'] = unit_policy_ok
          checks['premature_future_target_exposure_zero_exact_token_same_unit'] = not premature
          checks['learner_facing_roman_script_zero'] = roman_findings == 0

          for name, ok in checks.items():
              if not ok:
                  problems.append({'check': name})
          if premature:
              problems.append({'check': 'premature_future_target_exposure_zero_exact_token_same_unit', 'detail': premature})

          repair = json.loads(repair_path.read_text(encoding='utf-8'))
          if repair.get('after_sha256') != expected_intermediate_sha:
              raise SystemExit('FAIL repair evidence does not bind the intermediate corpus')
          repair['intermediate_sha256_before_preservation_refinement'] = expected_intermediate_sha
          repair['after_sha256'] = after_sha
          final_after_by_before = {
              'عائشہ کہتی ہے کہ یہ تصویر اہم ہے کیونکہ اس میں سب گھر والے ساتھ ہیں۔': 'عائشہ کہتی ہے کہ یہ تصویر اہم ہے کیونکہ اس میں خاندان کے سب افراد ایک ساتھ ہیں۔',
              'مریم بھی اپنے گھر والوں کے ساتھ آتی ہے۔': 'مریم بھی پارک آتی ہے۔',
              'ہفتے کی صبح عائشہ پہلی بار محلے کی نئی لائبریری پیدل جا رہی ہے۔': 'آج عائشہ پہلی بار محلے کی نئی لائبریری پیدل جا رہی ہے۔',
          }
          for item in repair.get('repairs', []):
              if item.get('before') in final_after_by_before:
                  item['after'] = final_after_by_before[item['before']]
          repair['preservation_refinement'] = {
              'reason': 'Refine three mechanically valid substitutions so the bounded repair preserves source meaning and local answer support without introducing unsupported relationship detail or a contextless deictic opening.',
              'intermediate_sha256': expected_intermediate_sha,
              'content_scope': ['ur-a1-u04-p01', 'ur-a1-u04-p02', 'ur-a1-u06-p01'],
              'questions_changed': False,
              'answers_changed': False,
              'target_declarations_changed': False,
              'independent_review_claimed': False,
          }
          repair['postrepair_checks'] = checks
          repair['postrepair_problem_count'] = len(problems)
          repair['postrepair_problems'] = problems
          repair['status'] = 'PASS_DETERMINISTIC_BOUNDED_REPAIR_NEEDS_INDEPENDENT_REVIEW' if not problems else 'FAIL_DETERMINISTIC_BOUNDED_REPAIR'
          repair_path.write_text(json.dumps(repair, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          if audit.get('source', {}).get('actual_sha256') != expected_intermediate_sha:
              raise SystemExit('FAIL audit evidence does not bind the intermediate corpus')
          audit['generated_at_utc'] = datetime.now(timezone.utc).isoformat()
          audit['source']['pre_repair_sha256'] = original_sha
          audit['source']['intermediate_repair_sha256'] = expected_intermediate_sha
          audit['source']['actual_sha256'] = after_sha
          audit['source']['hash_bound'] = True
          audit['checks'] = checks
          audit['violations'] = problems
          audit['counts']['passages'] = len(records)
          audit['counts']['questions'] = sum(len(r.get('questions') or []) for r in records)
          audit['counts']['answers'] = sum(len(r.get('answer_key') or []) for r in records)
          audit['counts']['units'] = len(set(r.get('unit') for r in records))
          audit['counts']['new_lexical_target_declarations'] = new_decl_count
          audit['counts']['duplicate_prompts_within_passage'] = duplicate_prompts
          audit['counts']['learner_facing_roman_script_findings'] = roman_findings
          audit['counts']['violations'] = len(problems)
          audit['status'] = 'PASS_DETERMINISTIC_FINAL_AUDIT_NEEDS_INDEPENDENT_REVIEW' if not problems else 'FAIL_DETERMINISTIC_FINAL_AUDIT'
          audit['repair_preservation_refinement'] = {
              'intermediate_sha256': expected_intermediate_sha,
              'final_sha256': after_sha,
              'records_refined': ['ur-a1-u04-p01', 'ur-a1-u04-p02', 'ur-a1-u06-p01'],
              'semantic_native_educator_approval_claimed': False,
          }
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(audit['status'])
          PY
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/urdu-a1-repair-preservation-refinement.yml || true
          git add reading/urdu/a1/passages.jsonl reading/audit/urdu_a1_premature_target_repairs_2026-08-22.json reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json
          git commit -m "Refine Urdu A1 bounded repair preservation [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"

          if [[ "$STATUS" != "PASS_DETERMINISTIC_FINAL_AUDIT_NEEDS_INDEPENDENT_REVIEW" ]]; then
            echo "Deterministic audit failed after preservation refinement; evidence checkpointed." >&2
            exit 1
          fi
