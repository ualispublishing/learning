name: Apply Arabic Gate C A2 Unit 10
on:
  push:
permissions:
  contents: write
jobs:
  arabic-gate-c-a2-unit10:
    if: github.event.head_commit.message == 'Run Arabic Gate C A2 Unit 10 now'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact pre-A2-Unit-10 Gate C state
        run: |
          set -euo pipefail
          python reading/tools/validate_continuation_state.py
          test -e reading/audit/arabic_gate_c_decisions_2026-09-05/a2_u09.json
          test ! -e reading/audit/arabic_gate_c_decisions_2026-09-05/a2_u10.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reading/RELEASE_STATUS.json').read_text())['languages']['arabic'];m=json.loads(Path('reading/STATE_MANIFEST.json').read_text());b=r['naturalness_review_progress'];c=r['comprehension_review_progress'];d=r['latest_deterministic_gate']
          assert m['aggregate_sha256']=='4a4877e33e432cae0802f59d6b037fd8a6635a50b28501c8bcc25ae5d2bd1e19'
          assert r['release_state']=='REOPEN_REQUIRED' and r['educator_release_ready'] is False
          assert (b['fresh_records_reviewed'],b['fresh_records_with_findings'],b['fresh_findings'])==(360,308,560)
          assert (c['fresh_records_reviewed'],c['fresh_qa_pairs_reviewed'],c['fresh_records_with_findings'],c['fresh_findings'])==(114,1140,77,142) and c['levels_completed']==['A1']
          assert d['open_findings']==1080 and d['finding_classes']=={'coverage_missing_or_zero':360,'coverage_not_pass':360,'not_approved':360}
          PY
      - name: Validate clean exact-current A2 Unit 10 Gate C review
        run: python reading/tools/apply_arabic_gate_c_a2_unit10.py
      - name: Rebuild and bind Gate B and Gate C evidence
        run: |
          set -euo pipefail
          python reading/tools/run_post_generation_gate0.py
          python reading/tools/run_arabic_fresh_deterministic_revalidation.py
          python reading/tools/audit_arabic_metalinguistic_cefr_candidates.py
          python reading/tools/adjudicate_arabic_b1_c2_metalinguistic_cefr.py
          python reading/tools/build_arabic_gate_b_naturalness_review.py
          python reading/tools/record_arabic_gate_c_a2_unit10_decisions.py
          python reading/tools/sync_arabic_gate_b_progress.py
          python reading/tools/sync_arabic_release_global_blocker.py
          python reading/tools/sync_arabic_gate_c_progress.py
          python reading/tools/sync_verification_tasks_arabic_gate_c_a2_unit10.py
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py
      - name: Assert exact post-A2-Unit-10 state and A2 completion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reading/RELEASE_STATUS.json').read_text())['languages']['arabic'];b=r['naturalness_review_progress'];c=r['comprehension_review_progress'];d=r['latest_deterministic_gate']
          assert r['release_state']=='REOPEN_REQUIRED' and r['educator_release_ready'] is False
          assert (b['fresh_records_reviewed'],b['fresh_records_with_findings'],b['fresh_findings'])==(360,308,560)
          assert (c['fresh_records_reviewed'],c['fresh_qa_pairs_reviewed'],c['fresh_records_with_findings'],c['fresh_findings'])==(120,1200,77,142)
          assert c['status']=='FRESH_GATE_C_INTERNAL_REVIEW_IN_PROGRESS' and c['levels_completed']==['A1','A2']
          g=json.loads(Path('reading/audit/arabic_gate_c_decisions_2026-09-05/a2_u10.json').read_text());assert (g['records_reviewed'],g['qa_pairs_reviewed'],g['records_with_findings'],g['fresh_findings'])==(6,60,0,0)
          assert all(x['decision']=='PASS' and x['finding_count']==0 for x in g['decisions'])
          assert g['quality_promotion'] is False and g['release_claim'] is False
          assert d['open_findings']==1080 and d['finding_classes']=={'coverage_missing_or_zero':360,'coverage_not_pass':360,'not_approved':360}
          PY
      - name: Commit clean Gate C A2 Unit 10 evidence and exact state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/arabic_gate_c_decisions_2026-09-05/a2_u10.json reading/audit/post_generation_gate0_2026-08-30.json reading/audit/arabic_fresh_deterministic_revalidation_2026-08-30.json reading/audit/arabic_metalinguistic_cefr_candidate_inventory_2026-08-30.json reading/audit/arabic_b1_c2_metalinguistic_cefr_triage_2026-08-30.json reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json reading/audit/arabic_gate_b_packets_2026-08-30 reading/RELEASE_STATUS.json reading/VERIFICATION_TASKS.md reading/STATE_MANIFEST.json
          git commit -m 'Complete Arabic Gate C A2 Unit 10 review'
      - name: Rebase and regenerate exact push candidate
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          python reading/tools/validate_continuation_state.py
          python reading/tools/run_post_generation_gate0.py
          python reading/tools/run_arabic_fresh_deterministic_revalidation.py
          python reading/tools/audit_arabic_metalinguistic_cefr_candidates.py
          python reading/tools/adjudicate_arabic_b1_c2_metalinguistic_cefr.py
          python reading/tools/build_arabic_gate_b_naturalness_review.py
          python reading/tools/record_arabic_gate_c_a2_unit10_decisions.py
          python reading/tools/sync_arabic_gate_b_progress.py
          python reading/tools/sync_arabic_release_global_blocker.py
          python reading/tools/sync_arabic_gate_c_progress.py
          python reading/tools/sync_verification_tasks_arabic_gate_c_a2_unit10.py
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py
          git add reading/audit/arabic_gate_c_decisions_2026-09-05/a2_u10.json reading/audit/post_generation_gate0_2026-08-30.json reading/audit/arabic_fresh_deterministic_revalidation_2026-08-30.json reading/audit/arabic_metalinguistic_cefr_candidate_inventory_2026-08-30.json reading/audit/arabic_b1_c2_metalinguistic_cefr_triage_2026-08-30.json reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json reading/audit/arabic_gate_b_packets_2026-08-30 reading/RELEASE_STATUS.json reading/VERIFICATION_TASKS.md reading/STATE_MANIFEST.json
          if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
          python reading/tools/validate_continuation_state.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reading/RELEASE_STATUS.json').read_text())['languages']['arabic'];c=r['comprehension_review_progress']
          assert r['release_state']=='REOPEN_REQUIRED' and r['educator_release_ready'] is False
          assert (c['fresh_records_reviewed'],c['fresh_qa_pairs_reviewed'],c['fresh_records_with_findings'],c['fresh_findings'])==(120,1200,77,142) and c['levels_completed']==['A1','A2']
          assert r['latest_deterministic_gate']['open_findings']==1080
          PY
          git push origin HEAD:main
