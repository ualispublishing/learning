name: Build language workbooks v1

on:
  push:
    paths:
      - 'scripts/build_language_workbooks_v1.py'
      - 'scripts/build_language_workbooks_v1_quality.py'
      - '.github/workflows/build-language-workbooks-v1.yml'
      - 'arabic_top1000.csv'
      - 'french_top1000.csv'
      - 'urdu_top1000.csv'
  pull_request:
    paths:
      - 'scripts/build_language_workbooks_v1.py'
      - 'scripts/build_language_workbooks_v1_quality.py'
      - '.github/workflows/build-language-workbooks-v1.yml'
      - 'audit/language-workbooks/v1.0/BUILD_TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Sync branch
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch origin "$branch"
          git checkout "$branch"
          git pull --ff-only origin "$branch"

      - name: Install PDF and font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils fonts-dejavu-core fonts-noto-core fonts-noto-extra libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 shared-mime-info
          python -m pip install --upgrade pip
          python -m pip install 'weasyprint>=66,<67' 'pypdf>=6,<7'

      - name: Attest canonical language datasets
        run: |
          python scripts/attest_live_csvs.py
          python scripts/audit_french_urdu_top1000_regressions.py

      - name: Build quality-gated production candidate
        run: python scripts/build_language_workbooks_v1_quality.py

      - name: Structural and render preflight
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' pdf; do
            qpdf --check "$pdf"
            pdfinfo "$pdf" >/dev/null
            stem=$(basename "$pdf" .pdf)
            pdftoppm -f 1 -singlefile -png -r 90 "$pdf" "/tmp/${stem}" >/dev/null 2>&1
            test -s "/tmp/${stem}.png"
            count=$((count+1))
          done < <(find completed/languages/workbooks/v1.0 -name '*.pdf' -print0)
          test "$count" -eq 42
          echo "Verified $count PDFs with qpdf, pdfinfo, and Poppler rendering."

      - name: Archive release artifact
        uses: actions/upload-artifact@v4
        with:
          name: language-workbooks-v1.0-quality
          retention-days: 30
          if-no-files-found: error
          path: |
            completed/languages/workbooks/v1.0/
            audit/language-workbooks/v1.0/

      - name: Commit verified outputs to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add completed/languages/workbooks/v1.0 audit/language-workbooks/v1.0
          if git diff --cached --quiet; then
            echo 'No release-output changes.'
            exit 0
          fi
          git commit -m 'release: rebuild language workbooks v1.0 after linguistic QA'
          git pull --rebase origin "$branch"
          git push origin "$branch"
