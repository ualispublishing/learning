name: Inspect Arabic phrase bank

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_arabic_phrase_bank.py'
      - '.github/workflows/inspect-arabic-phrase-bank.yml'
      - 'audit/run_phrase_bank_inspection.request'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect phrase bank
        run: python scripts/inspect_arabic_phrase_bank.py
      - name: Commit inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/arabic_phrase_bank_inventory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspect Arabic phrase bank [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
