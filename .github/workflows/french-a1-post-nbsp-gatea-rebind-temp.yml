name: TEMP French A1 post-NBSP Gate A rebind

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/french-a1-post-nbsp-gatea-rebind-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-french-a1-post-nbsp-gatea-rebind
  cancel-in-progress: false

jobs:
  rebind:
    if: github.event.pull_request.head.ref == 'repair/french-a1-review-integrity-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
          fetch-depth: 0
      - name: Re-run generation integrity
        run: python reading/tools/audit_french_a1_generation_integrity.py
      - name: Rebind formal Gate A after typography-only repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess,unicodedata

          corpus=Path('reading/french/a1/passages.jsonl')
          current_bytes=corpus.read_bytes()
          current_sha=hashlib.sha256(current_bytes).hexdigest()
          expected_current='8019fe53061a67faca527a50495d2188439da5142dd94a414a43e1a3986cf7f4'
          old_sha='7dbdb48ffc6efd00106490ca9b10ad25643bf7e89967e8fbd2977a04641d6ea3'
          pre_commit='14c7d04fcb6c957eceabaaf99bfb422210c1572e'
          repair_commit='97452efaec2a40255224f41e4259821c4c291bc5'
          if current_sha!=expected_current:
              raise SystemExit(f'FAIL CLOSED current corpus drift {current_sha}')

          old_bytes=subprocess.check_output(['git','show',f'{pre_commit}:reading/french/a1/passages.jsonl'])
          if hashlib.sha256(old_bytes).hexdigest()!=old_sha:
              raise SystemExit('FAIL CLOSED pre-typography corpus identity mismatch')
          old_rows=[json.loads(x) for x in old_bytes.decode('utf-8').splitlines() if x.strip()]
          rows=[json.loads(x) for x in current_bytes.decode('utf-8').splitlines() if x.strip()]
          if len(rows)!=60 or len(old_rows)!=60:
              raise SystemExit('FAIL CLOSED passage count')

          # Prove the canonical edit class: exactly 1,992 ordinary-space -> no-break-space
          # substitutions in learner-facing strings, with all other record content identical.
          learner_fields=[]
          char_changes=[]
          def learner_map(r):
              out={'title':r['title'],'text':r['text']}
              for q in r['questions']: out[f'q:{q["id"]}']=q['prompt']
              for a in r['answer_key']: out[f'a:{a["id"]}']=a['answer']
              return out
          def stripped(r):
              x=json.loads(json.dumps(r,ensure_ascii=False))
              x['title']=''; x['text']=''
              for q in x['questions']: q['prompt']=''
              for a in x['answer_key']: a['answer']=''
              return x
          for old,new in zip(old_rows,rows):
              if old['id']!=new['id'] or stripped(old)!=stripped(new):
                  raise SystemExit(f'FAIL CLOSED non-learner or structural change {old.get("id")}')
              om,nm=learner_map(old),learner_map(new)
              if set(om)!=set(nm): raise SystemExit('FAIL CLOSED learner field map drift')
              for k in om:
                  a,b=om[k],nm[k]
                  if len(a)!=len(b): raise SystemExit(f'FAIL CLOSED learner length change {old["id"]} {k}')
                  learner_fields.append((old['id'],k))
                  for i,(ca,cb) in enumerate(zip(a,b)):
                      if ca!=cb:
                          if ca!=' ' or cb not in {'\u00a0','\u202f'}:
                              raise SystemExit(f'FAIL CLOSED non-typography change {old["id"]} {k} {i} {ca!r}->{cb!r}')
                          char_changes.append((old['id'],k,i,ord(cb)))
          if len(char_changes)!=1992:
              raise SystemExit(f'FAIL CLOSED expected 1992 typography substitutions, got {len(char_changes)}')

          # Ensure only the intended bounded repair commit changed the corpus and no lexicon/source file.
          names=subprocess.check_output(['git','diff','--name-only',pre_commit,repair_commit],text=True).splitlines()
          allowed={
            '.github/workflows/french-a1-grammalecte-nbsp-repair-temp.yml',
            'reading/audit/french_a1_grammalecte_nbsp_repair_2026-08-22.json',
            'reading/audit/french_a1_grammalecte_post_nbsp_fullscan_2026-08-22.json',
            'reading/french/a1/passages.jsonl'
          }
          if set(names)!=allowed:
              raise SystemExit(f'FAIL CLOSED bounded repair file set drift {names}')

          ids=[r['id'] for r in rows]
          expected_ids=[f'fr-a1-u{u:02d}-p{p:02d}' for u in range(1,11) for p in range(1,7)]
          blockers=[]
          if ids!=expected_ids: blockers.append('identity_sequence_level_grid')
          if any(r.get('language')!='fr' or r.get('cefr')!='A1' or r.get('sequence')!=i for i,r in enumerate(rows,1)):
              blockers.append('identity_sequence_level_grid')

          q_count=a_count=0; review_checks=0
          for r in rows:
              qs=r.get('questions',[]); ans=r.get('answer_key',[])
              q_count+=len(qs); a_count+=len(ans); review_checks+=len(r.get('review_lexical_targets',[]))
              if len(qs)!=10 or len(ans)!=10: blockers.append(f'{r["id"]}:qa_count')
              qids={q.get('id') for q in qs}; aids={a.get('id') for a in ans}
              if qids!={f'q{i}' for i in range(1,11)} or aids!={f'a{i}' for i in range(1,11)}:
                  blockers.append(f'{r["id"]}:qa_ids')
              amap={a.get('question_id'):a.get('id') for a in ans}
              for q in qs:
                  if amap.get(q.get('id'))!=q.get('answer_id'):
                      blockers.append(f'{r["id"]}:qa_link:{q.get("id")}')
              prompts=[q.get('prompt','') for q in qs]
              if len(prompts)!=len(set(prompts)): blockers.append(f'{r["id"]}:duplicate_prompt')
              if r.get('sequence',0)%6==0 and r.get('new_lexical_targets'):
                  blockers.append(f'{r["id"]}:checkpoint_new_targets')
              for _,s in learner_map(r).items():
                  if unicodedata.normalize('NFC',s)!=s: blockers.append(f'{r["id"]}:unicode_nfc')
                  # French guillemets must pair; ignore A)-D) labels before real-parenthesis balance.
                  if s.count('«')!=s.count('»'): blockers.append(f'{r["id"]}:guillemets')
                  p=re.sub(r'(?<!\w)[A-D]\)', '', s)
                  if p.count('(')!=p.count(')'): blockers.append(f'{r["id"]}:parentheses')
          if q_count!=600 or a_count!=600: blockers.append('scope_counts')
          if review_checks!=182: blockers.append(f'review_target_count:{review_checks}')

          gen=json.loads(Path('reading/audit/french_a1_generation_integrity.json').read_text(encoding='utf-8'))
          if gen.get('status')!='PASS' or gen.get('failures') not in (0,[]): blockers.append('generation_integrity')
          if gen.get('legacy_exposure_variances',0)!=0: blockers.append('legacy_exposure_variances')

          repair=json.loads(Path('reading/audit/french_a1_grammalecte_nbsp_repair_2026-08-22.json').read_text(encoding='utf-8'))
          post=json.loads(Path('reading/audit/french_a1_grammalecte_post_nbsp_fullscan_2026-08-22.json').read_text(encoding='utf-8'))
          if repair.get('new_sha256')!=current_sha or repair.get('applied_replacements')!=1992 or repair.get('post_repair_nbsp_findings')!=0 or not repair.get('non_nbsp_multiset_preserved'):
              blockers.append('grammalecte_typography_repair_evidence')
          if post.get('bound_sha256')!=current_sha or post.get('raw_finding_count')!=48 or int(post.get('findings_by_type',{}).get('nbsp',0))!=0:
              blockers.append('grammalecte_postscan_evidence')

          prior=json.loads(Path('reading/audit/french_a1_formal_gate_a_2026-08-22.json').read_text(encoding='utf-8'))
          if prior.get('bound_sha256')!=old_sha or prior.get('blocker_count')!=0 or not str(prior.get('status','')).startswith('PASS_DETERMINISTIC_FORMAL_GATE_A'):
              blockers.append('prior_gate_a_identity')

          if blockers:
              raise SystemExit('FAIL CLOSED Gate A blockers: '+json.dumps(blockers,ensure_ascii=False))

          git_blob=subprocess.check_output(['git','hash-object',str(corpus)],text=True).strip()
          prior['bound_sha256']=current_sha
          prior['bound_git_blob']=git_blob
          prior['blocker_count']=0; prior['blockers']=[]
          prior['status']='PASS_DETERMINISTIC_FORMAL_GATE_A_NEEDS_LATER_RELEASE_GATES'
          prior['rebind_after_nbsp_typography_repair']={
            'previous_sha256':old_sha,
            'repair_commit':repair_commit,
            'typography_substitutions_verified':len(char_changes),
            'only_change_class':'ordinary ASCII space to U+00A0/U+202F no-break space in learner-facing fields',
            'all_non_learner_record_content_identical':True,
            'generation_integrity_rerun':'PASS',
            'grammalecte_post_nbsp_findings':0,
            'grammalecte_non_nbsp_findings_preserved':48,
            'formal_invariants_rechecked':[
              'identity/sequence/level grid','60/600/600 scope','question-answer linkage','duplicate prompts',
              'checkpoint p06 zero-new','Unicode NFC','guillemet/parenthesis sanity','182 review-target count',
              'strict generation source/rank/exposure integrity','bounded repair file set/no lexicon changes'
            ]
          }
          prior['independent_review']={
            'semantic_accuracy':'PENDING',
            'french_naturalness_orthography':'PENDING',
            'pedagogical_a1_fit':'PENDING',
            'assessment_answer_grounding':'PENDING',
            'independent_machine_tools':'PARTIAL: GRAMMALECTE CURRENT; LANGUAGETOOL MUST_REBIND_AFTER_HASH_CHANGE; ANTIDOTE/DEEPL_WRITE_PENDING',
            'independent_model_family':'PENDING','native_professional':'PENDING','educator_release':'PENDING','blind_review':'PENDING'
          }
          prior['release_effect']='NONE_AUTOMATIC: formal Gate A is deterministic integrity only; French remains REOPEN_REQUIRED.'
          Path('reading/audit/french_a1_formal_gate_a_2026-08-22.json').write_text(json.dumps(prior,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          checkpoint={
            'schema_version':1,'date':'2026-08-22','language':'fr','level':'A1',
            'checkpoint':'post_nbsp_typography_revalidation','bound_sha256':current_sha,'bound_git_blob':git_blob,
            'formal_gate_a':'PASS_DETERMINISTIC_FORMAL_GATE_A_NEEDS_LATER_RELEASE_GATES',
            'generation_integrity':'PASS','nbsp_replacements':1992,'grammalecte_nbsp_remaining':0,
            'grammalecte_non_nbsp_findings_preserved':48,
            'languagetool_status':'STALE_AFTER_CANONICAL_HASH_CHANGE_REBIND_REQUIRED',
            'independent_native_educator_review':'PENDING',
            'release_state':'REOPEN_REQUIRED','release_ready':False
          }
          Path('reading/audit/french_a1_post_nbsp_revalidation_2026-08-22.json').write_text(json.dumps(checkpoint,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'sha256':current_sha,'git_blob':git_blob,'typography_substitutions':len(char_changes),'gate_a':'PASS','blockers':0},ensure_ascii=False))
          PY
      - name: Commit Gate A rebind and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_a1_generation_integrity.json reading/audit/french_a1_formal_gate_a_2026-08-22.json reading/audit/french_a1_post_nbsp_revalidation_2026-08-22.json
          git rm -f .github/workflows/french-a1-post-nbsp-gatea-rebind-temp.yml
          git commit -m 'Rebind French A1 Gate A after typography repair [skip ci]'
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
