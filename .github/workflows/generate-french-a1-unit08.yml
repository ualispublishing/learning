name: Generate French A1 Unit 08
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_french_a1_unit08.py'
      - '.github/workflows/generate-french-a1-unit08.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet jsonschema
      - name: Append and validate Unit 08
        run: python reading/tools/generate_french_a1_unit08.py
      - name: Independent Unit 08 checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/french/a1/passages.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==48 and [r['sequence'] for r in rows]==list(range(1,49)) and len({r['id'] for r in rows})==48
          u=rows[42:]
          assert [r['id'] for r in u]==[f'fr-a1-u08-p{i:02d}' for i in range(1,7)]
          assert all(90<=r['word_count']<=140 for r in u)
          assert sum(len(r['new_lexical_targets']) for r in u[:5])==10 and u[-1]['new_lexical_targets']==[]
          assert sum(len(r['questions']) for r in u)==60 and sum(len(r['answer_key']) for r in u)==60
          for r in u:
              local={t['id'] for f in ('new_lexical_targets','review_lexical_targets') for t in r.get(f,[]) if isinstance(t,dict) and t.get('id')}
              amap={a['question_id']:a['id'] for a in r['answer_key']}; assert len(amap)==10
              for q in r['questions']:
                  assert amap[q['id']]==q['answer_id'] and all(x in local for x in q.get('target_ids',[]))
          print({'status':'PASS','french_a1_passages':48,'unit08_questions':60,'unit08_answers':60,'unit08_new_targets':10})
          PY
      - name: Commit canonical French Unit 08
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a1/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate French A1 Unit 08 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
