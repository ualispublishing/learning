name: Language workbook visual audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/language-workbook-visual-audit.yml"
  workflow_run:
    workflows:
      - "Rebuild curated language workbooks v1"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Render representative pages
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/language-workbook-visual-audit"
          rm -rf "$out"
          mkdir -p "$out"
          printf '{\n  "samples": [\n' > "$out/sample_manifest.json"
          first=1

          for lang in arabic french urdu; do
            pdf="completed/languages/workbooks/v1.0/$lang/00_${lang}_complete_master.pdf"
            test -s "$pdf"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            if [ -z "$pages" ] || [ "$pages" -lt 20 ]; then
              echo "$lang: invalid page count: $pages"
              exit 1
            fi

            # Foundations, first vocabulary page, distributed corpus pages, and final Sources/licensing page.
            p0=2
            p00=4
            p1=7
            p2=$(( (pages * 18 + 50) / 100 ))
            p3=$(( (pages * 36 + 50) / 100 ))
            p4=$(( (pages * 54 + 50) / 100 ))
            p5=$(( (pages * 72 + 50) / 100 ))
            p6=$(( (pages * 90 + 50) / 100 ))
            p7=$pages

            for page in "$p0" "$p00" "$p1" "$p2" "$p3" "$p4" "$p5" "$p6" "$p7"; do
              stem="$out/${lang}-page-${page}"
              pdftoppm -f "$page" -l "$page" -singlefile -png -r 150 "$pdf" "$stem"
              test -s "${stem}.png"
              if [ "$first" -eq 0 ]; then printf ',\n' >> "$out/sample_manifest.json"; fi
              first=0
              printf '    {"language":"%s","master_pages":%s,"sample_page":%s,"png":"%s"}' \
                "$lang" "$pages" "$page" "$(basename "${stem}.png")" >> "$out/sample_manifest.json"
            done
          done

          printf '\n  ]\n}\n' >> "$out/sample_manifest.json"
          cat "$out/sample_manifest.json"

      - name: Render repaired French cards exactly
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/language-workbook-visual-audit"
          printf '{\n  "repairs": [\n' > "$out/french_repair_manifest.json"
          first=1

          render_match() {
            label="$1"
            pdf="$2"
            needle="$3"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            found=''
            for page in $(seq 1 "$pages"); do
              if pdftotext -f "$page" -l "$page" "$pdf" - | grep -Fq "$needle"; then
                found="$page"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "Could not locate repaired card $label in $pdf"
              exit 1
            fi
            stem="$out/${label}"
            pdftoppm -f "$found" -l "$found" -singlefile -png -r 170 "$pdf" "$stem"
            test -s "${stem}.png"
            if [ "$first" -eq 0 ]; then printf ',\n' >> "$out/french_repair_manifest.json"; fi
            first=0
            printf '    {"label":"%s","pdf":"%s","page":%s,"needle":"%s","png":"%s"}' \
              "$label" "$(basename "$pdf")" "$found" "$needle" "$(basename "${stem}.png")" >> "$out/french_repair_manifest.json"
          }

          render_match \
            'french-rank-288-repair' \
            'completed/languages/workbooks/v1.0/french/08_sentences_251-0375.pdf' \
            'Could you sign here, please?'
          render_match \
            'french-rank-794-repair' \
            'completed/languages/workbooks/v1.0/french/12_sentences_751-0875.pdf' \
            'Hurry up and you can still catch your train.'

          printf '\n  ]\n}\n' >> "$out/french_repair_manifest.json"
          cat "$out/french_repair_manifest.json"

      - name: Render normalized Arabic cards exactly
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/language-workbook-visual-audit"
          printf '{\n  "normalizations": [\n' > "$out/arabic_normalization_manifest.json"
          first=1

          render_match() {
            label="$1"
            pdf="$2"
            needle="$3"
            pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
            found=''
            for page in $(seq 1 "$pages"); do
              if pdftotext -f "$page" -l "$page" "$pdf" - | grep -Fq "$needle"; then
                found="$page"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "Could not locate normalized card $label in $pdf"
              exit 1
            fi
            stem="$out/${label}"
            pdftoppm -f "$found" -l "$found" -singlefile -png -r 170 "$pdf" "$stem"
            test -s "${stem}.png"
            if [ "$first" -eq 0 ]; then printf ',\n' >> "$out/arabic_normalization_manifest.json"; fi
            first=0
            printf '    {"label":"%s","pdf":"%s","page":%s,"needle":"%s","png":"%s"}' \
              "$label" "$(basename "$pdf")" "$found" "$needle" "$(basename "${stem}.png")" >> "$out/arabic_normalization_manifest.json"
          }

          render_match \
            'arabic-rank-251-normalization' \
            'completed/languages/workbooks/v1.0/arabic/08_sentences_251-0375.pdf' \
            'Hi! Do you work here?'
          render_match \
            'arabic-rank-401-normalization' \
            'completed/languages/workbooks/v1.0/arabic/09_sentences_376-0500.pdf' \
            'Do you know who I am?'
          render_match \
            'arabic-rank-724-normalization' \
            'completed/languages/workbooks/v1.0/arabic/11_sentences_626-0750.pdf' \
            "I'm trying to understand why you didn't do it."
          render_match \
            'arabic-rank-793-normalization' \
            'completed/languages/workbooks/v1.0/arabic/12_sentences_751-0875.pdf' \
            'Because I had a cold, I stayed at home.'
          render_match \
            'arabic-rank-932-normalization' \
            'completed/languages/workbooks/v1.0/arabic/13_sentences_876-1000.pdf' \
            'If you want, I can show you how to do that.'

          printf '\n  ]\n}\n' >> "$out/arabic_normalization_manifest.json"
          cat "$out/arabic_normalization_manifest.json"

      - name: Upload representative renders
        uses: actions/upload-artifact@v4
        with:
          name: language-workbook-interior-visual-audit
          path: /tmp/language-workbook-visual-audit/*
          if-no-files-found: error
          retention-days: 7
