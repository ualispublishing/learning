name: Repair French B2 Unit 09 Pedagogical Targets
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_french_b2_unit09_pedagogical_targets.py'
      - 'reading/tools/probe_french_b2_unit09_targets.py'
      - 'reading/tools/select_french_b2_unit09_targets.py'
      - 'reading/tools/generate_french_b2_unit09_retry.py'
      - '.github/workflows/repair-french-b2-unit09-pedagogical-targets.yml'
concurrency:
  group: french-b2-unit09-pedagogical-repair
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Regenerate Unit09 from sealed Unit08 prefix
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python reading/tools/repair_french_b2_unit09_pedagogical_targets.py 2>&1 | tee /tmp/french_b2_u09_pedagogical_repair.log
      - name: Persist failure diagnostic
        if: steps.repair.outcome != 'success'
        run: |
          mkdir -p reading/audit
          cp /tmp/french_b2_u09_pedagogical_repair.log reading/audit/french_b2_unit09_pedagogical_repair_failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_b2_unit09_pedagogical_repair_failure.txt
          git commit -m 'Record French B2 Unit 09 pedagogical repair failure [skip ci]' || true
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
      - name: Stop after failed repair
        if: steps.repair.outcome != 'success'
        run: exit 1
      - name: Commit repaired canonical Unit09 and lock
        if: steps.repair.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/b2/passages.jsonl reading/audit/french_b2_unit09_target_probe.json reading/audit/french_b2_unit09_target_selection.json reading/audit/french_b2_unit09_frontier_lock.json
          git rm -f reading/audit/french_b2_unit09_generation_failure.txt reading/audit/french_b2_unit09_pedagogical_repair_failure.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Repair and lock French B2 Unit 09 pedagogical targets [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
