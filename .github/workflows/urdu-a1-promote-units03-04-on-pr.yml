name: Urdu A1 guarded promotion dispatcher

on:
  pull_request:
    branches: [main]
    paths:
      - 'reading/urdu/a1/promotion-trigger-05.txt'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run guarded Unit 05 promotion
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/urdu-a1-promote-unit05-on-pr.yml | sed '1d;$d;s/^          //' > /tmp/urdu_promote_unit05.py
          test -s /tmp/urdu_promote_unit05.py
          python /tmp/urdu_promote_unit05.py

      - name: Commit promoted Urdu Unit 05
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes produced; failing closed.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/audit/urdu_a1_unit05_generation_plan.json reading/audit/urdu_a1_unit05_staging_result.json reading/audit/urdu_a1_unit05_generation_result.json reading/audit/urdu_active_frontier_2026-08-19.json reading/STATUS.json reading/AGENT_HANDOFF.md reading/TASKS.md
          git commit -m 'Promote Urdu A1 Unit 05'
          git push origin HEAD:main
