name: Correct Arabic B1 Unit 01 target scope
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/regenerate-arabic-b1-unit01-target-scope.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Keep previously taught words as review rather than new targets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('reading/tools/generate_arabic_b1_unit01.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"target_forms":["مهارة","خبرة"]','"target_forms":["مهارة"]')
          s=s.replace('"target_forms":["خيار","هدف"]','"target_forms":["خيار"]')
          p.write_text(s,encoding='utf-8')
          PY
      - run: python reading/tools/generate_arabic_b1_unit01.py
      - name: Commit corrected generator and regenerated B1 unit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/tools/generate_arabic_b1_unit01.py reading/arabic/b1/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Correct Arabic B1 Unit 01 target scope [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
