name: Apply LANG-A1C2 Urdu A2 Unit 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-language-a1c2-urdu-a2-unit02.yml'

permissions:
  contents: write

concurrency:
  group: lang-a1c2-urdu-a2-unit02-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Recover and run the hash-bound reviewed transaction
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_COMMIT='a4e1149f2e0964595f1ceb359b18b791b3eeca91'
          ORIGINAL_PATH='.github/workflows/apply-language-a1c2-urdu-a2-unit02.yml'
          git show "${ORIGINAL_COMMIT}:${ORIGINAL_PATH}" > /tmp/original-unit02.yml
          python - <<'PY'
          import pathlib, re, textwrap
          src = pathlib.Path('/tmp/original-unit02.yml').read_text(encoding='utf-8')
          packet = re.search(r'PACKET_B64_GZ: "([^"]+)"', src)
          if not packet:
              raise SystemExit('Could not recover embedded Unit 2 packet from pinned staging commit.')
          marker = "          python - <<'PY'\n"
          if marker not in src:
              raise SystemExit('Could not recover pinned Unit 2 transaction script.')
          body = src.split(marker, 1)[1].split("\n          PY", 1)[0]
          pathlib.Path('/tmp/packet.txt').write_text(packet.group(1), encoding='utf-8')
          pathlib.Path('/tmp/apply-unit02.py').write_text(textwrap.dedent(body), encoding='utf-8')
          PY
          export PACKET_B64_GZ="$(cat /tmp/packet.txt)"
          python /tmp/apply-unit02.py

      - name: Derive next plan and validate state
        shell: bash
        run: |
          set -euo pipefail
          python reading/tools/extract_active_generation_plan.py
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py

      - name: Commit without overwriting concurrent LANG-A1C2 work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BASE_HEAD="$(git rev-parse HEAD)"
          git add reading/urdu/a2/passages.jsonl \
            reading/audit/urdu_a2_u02_lexical_sense_check_2026-08-24.json \
            reading/audit/urdu_a2_u02_quality_pass_2026-08-24.json \
            reading/STATUS.json reading/CONTINUATION.json reading/TASKS.md \
            reading/AGENT_HANDOFF_V2.md reading/planning/ACTIVE_GENERATION_PLAN.json \
            reading/STATE_MANIFEST.json
          git commit -m 'Complete Urdu A2 Unit 2 and advance to Unit 3 [skip ci]'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_HEAD" ]; then
            CHANGED="$(git diff --name-only "$BASE_HEAD"..origin/main || true)"
            printf '%s\n' "$CHANGED"
            if printf '%s\n' "$CHANGED" | grep -Eq '^(reading/urdu/a2/passages\.jsonl|reading/STATUS\.json|reading/CONTINUATION\.json|reading/TASKS\.md|reading/AGENT_HANDOFF_V2\.md|reading/planning/ACTIVE_GENERATION_PLAN\.json|reading/STATE_MANIFEST\.json)$'; then
              echo 'Critical continuation state changed concurrently; refusing to push.'
              exit 1
            fi
            git rebase origin/main
            python reading/tools/extract_active_generation_plan.py
            python reading/tools/refresh_state_manifest.py
            python reading/tools/validate_continuation_state.py
            git add reading/planning/ACTIVE_GENERATION_PLAN.json reading/STATE_MANIFEST.json
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
