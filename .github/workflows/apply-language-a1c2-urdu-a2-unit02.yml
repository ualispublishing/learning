name: Apply LANG-A1C2 Urdu A2 Unit 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-language-a1c2-urdu-a2-unit02.yml'

permissions:
  contents: write

concurrency:
  group: lang-a1c2-urdu-a2-unit02-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Apply reviewed Unit 2 transaction
        shell: bash
        env:
          PACKET_B64_GZ: ""
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess
          from pathlib import Path

          ROOT = Path.cwd(); R = ROOT / "reading"
          CANON = R / "urdu/a2/passages.jsonl"; STATUS = R / "STATUS.json"; CONT = R / "CONTINUATION.json"
          TASKS = R / "TASKS.md"; HANDOFF = R / "AGENT_HANDOFF_V2.md"
          LEX_AUDIT = R / "audit/urdu_a2_u02_lexical_sense_check_2026-08-24.json"
          QUALITY_AUDIT = R / "audit/urdu_a2_u02_quality_pass_2026-08-24.json"
          EXPECTED_SOURCE_BLOB = "e5bb0fb6fb642a37ba4f69537f960cbb324fd365"
          EXPECTED_PACKET_SHA256 = "da767ab449a2252c561dfac34aceceafeab2830a6f2403a550157196f53385af"
          EXPECTED_NEW = [["ur-rank-0751","ur-rank-0753"],["ur-rank-0716","ur-rank-0741"],["ur-rank-0901","ur-rank-0927"],["ur-rank-0879","ur-rank-0858"],[],[]]
          EXPECTED_ROLES = ["instructional","reinforcement","interleaved","transfer","integration","fluency"]
          GENRES = {"email/message","narrative","schedule"}

          def fail(msg): raise SystemExit("Urdu A2 Unit 2 integration failed: " + msg)
          def load_json(p): return json.loads(p.read_text(encoding="utf-8"))
          def write_json(p,o): p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          def read_jsonl(p):
              out=[]
              for n,raw in enumerate(p.read_text(encoding="utf-8").splitlines(),1):
                  if not raw.strip(): continue
                  try: out.append(json.loads(raw))
                  except json.JSONDecodeError as e: fail(f"invalid JSONL {p}:{n}: {e}")
              return out
          def blob(p): return subprocess.check_output(["git","hash-object",str(p.relative_to(ROOT))],text=True).strip()
          def project_count():
              total=0
              for lang in ("arabic","french","urdu"):
                  for level in ("a1","a2","b1","b2","c1","c2"):
                      p=R/lang/level/"passages.jsonl"
                      if p.exists(): total += len(read_jsonl(p))
              return total
          def urdu_count():
              total=0
              for level in ("a1","a2","b1","b2","c1","c2"):
                  p=R/"urdu"/level/"passages.jsonl"
                  if p.exists(): total += len(read_jsonl(p))
              return total
          def replace_once(text,old,new,label):
              c=text.count(old)
              if c != 1: fail(f"{label} expected once, found {c}")
              return text.replace(old,new,1)

          if blob(CANON) != EXPECTED_SOURCE_BLOB: fail(f"source blob drift: {blob(CANON)}")
          packet_bytes=gzip.decompress(base64.b64decode(os.environ["PACKET_B64_GZ"]))
          if hashlib.sha256(packet_bytes).hexdigest()!=EXPECTED_PACKET_SHA256: fail("embedded packet hash drift")
          packet=[json.loads(x) for x in packet_bytes.decode("utf-8").splitlines() if x.strip()]
          current=read_jsonl(CANON)
          if len(current)!=6 or [x.get("sequence") for x in current]!=list(range(1,7)): fail("live Urdu A2 baseline is no longer sequences 1-6")
          if [x.get("id") for x in current] != [f"ur-a2-u01-p{i:02d}" for i in range(1,7)]: fail("live Unit 1 IDs changed")
          if len(packet)!=6: fail("packet must contain six records")

          status=load_json(STATUS); cont=load_json(CONT)
          if status.get("current",{}).get("canonical_passages")!=786: fail("STATUS project total no longer 786")
          if status.get("languages",{}).get("urdu",{}).get("canonical_passages")!=66: fail("STATUS Urdu total no longer 66")
          if cont.get("production",{}).get("canonical_passages")!=786: fail("CONTINUATION project total no longer 786")
          if cont.get("production",{}).get("urdu",{}).get("canonical_passages")!=66: fail("CONTINUATION Urdu total no longer 66")
          if project_count()!=786 or urdu_count()!=66: fail("live canonical counts drifted from baseline")

          prior_ids={t.get("id") for p in (R/"urdu/a1/passages.jsonl",CANON) for row in read_jsonl(p) for t in (row.get("new_lexical_targets") or [])}
          overlap=sorted(set(x for g in EXPECTED_NEW for x in g)&prior_ids)
          if overlap: fail(f"new target IDs no longer fresh: {overlap}")

          for i,row in enumerate(packet):
              rid=f"ur-a2-u02-p{i+1:02d}"; seq=7+i
              if row.get("id")!=rid or row.get("sequence")!=seq or row.get("unit")!=2: fail(f"{rid} identity/sequence/unit mismatch")
              if row.get("language")!="ur" or row.get("cefr")!="A2" or row.get("revision")!=1: fail(f"{rid} language/level/revision mismatch")
              if row.get("passage_type")!=EXPECTED_ROLES[i] or row.get("genre") not in GENRES: fail(f"{rid} role/genre mismatch")
              wc=len(row.get("text","").split())
              if row.get("word_count")!=wc or not 140<=wc<=220: fail(f"{rid} word-count failure: {wc}")
              qs=row.get("questions") or []; ans=row.get("answer_key") or []
              if len(qs)!=10 or len(ans)!=10: fail(f"{rid} must have 10 questions and 10 answers")
              if [q.get("id") for q in qs] != [f"q{n}" for n in range(1,11)]: fail(f"{rid} q ids invalid")
              if [a.get("id") for a in ans] != [f"a{n}" for n in range(1,11)]: fail(f"{rid} answer ids invalid")
              for n,(q,a) in enumerate(zip(qs,ans),1):
                  if q.get("answer_id")!=f"a{n}" or a.get("question_id")!=f"q{n}": fail(f"{rid} q/a linkage invalid at {n}")
                  if not str(a.get("answer","")).strip(): fail(f"{rid} empty answer at {n}")
              targets=row.get("new_lexical_targets") or []
              if [t.get("id") for t in targets]!=EXPECTED_NEW[i]: fail(f"{rid} new target set mismatch")
              for t in targets:
                  exp=row["text"].count(t["form"])
                  if exp<2 or t.get("exposures_in_text")!=exp: fail(f"{rid} target exposure mismatch for {t.get('id')}")
                  if not any(t["id"] in (q.get("target_ids") or []) for q in qs): fail(f"{rid} target not assessed: {t.get('id')}")
              if i==4 and targets: fail("P5 must have no deliberate new target")
              if i==5:
                  speed=row.get("speed_training") or {}
                  if targets or speed.get("new_word_policy")!="none" or speed.get("timed") is not True: fail("P6 fluency new-word policy failure")

          old=CANON.read_text(encoding="utf-8")
          if old and not old.endswith("\n"): old += "\n"
          CANON.write_text(old+"".join(json.dumps(x,ensure_ascii=False,separators=(",",":"))+"\n" for x in packet),encoding="utf-8")
          result=read_jsonl(CANON)
          if len(result)!=12 or [x.get("sequence") for x in result]!=list(range(1,13)): fail("post-write A2 sequences invalid")
          result_blob=blob(CANON)

          status["updated"]="2026-08-24"; status["current"]["canonical_passages"]=792; status["current"]["remaining_generation_passages"]=288
          status["languages"]["urdu"]["canonical_passages"]=72; status["languages"]["urdu"]["remaining_generation_passages"]=288; write_json(STATUS,status)
          cont["updated"]="2026-08-24"; cont["production"]["canonical_passages"]=792; cont["production"]["urdu"]["canonical_passages"]=72
          cont["active_frontier"]["production"]["action"]="Continue generation-first production from Urdu A2 Unit 3 / sequence 13 using the canonical roadmap and ten-question contract. Do not reopen Urdu A1 generation unless fresh evidence identifies a concrete defect."
          if not isinstance(cont.get("exact_next_actions"),list) or len(cont["exact_next_actions"])<3: fail("CONTINUATION exact_next_actions shape changed")
          cont["exact_next_actions"][1]="Use reading/planning/ACTIVE_GENERATION_PLAN.json to start the next guarded Urdu A2 Unit 3 batch at sequence 13."; write_json(CONT,cont)

          tasks=TASKS.read_text(encoding="utf-8")
          for oldtxt,newtxt,label in [("Updated: 2026-08-23","Updated: 2026-08-24","TASKS date"),("Canonical production frontier: **Urdu A2, Unit 2, sequence 7**.","Canonical production frontier: **Urdu A2, Unit 3, sequence 13**.","TASKS frontier"),("- Urdu: 66/360 generated; A1 complete, A2 in progress.","- Urdu: 72/360 generated; A1 complete, A2 in progress.","TASKS Urdu"),("- Project: 786/1080 generated.","- Project: 792/1080 generated.","TASKS project")]: tasks=replace_once(tasks,oldtxt,newtxt,label)
          TASKS.write_text(tasks,encoding="utf-8")

          hand=HANDOFF.read_text(encoding="utf-8")
          for oldtxt,newtxt,label in [("Updated: 2026-08-23","Updated: 2026-08-24","handoff date"),("- Canonical generated total: **786**.","- Canonical generated total: **792**.","handoff project"),("- Urdu: **66/360**; A1 generation complete and A2 generation in progress.","- Urdu: **72/360**; A1 generation complete and A2 generation in progress.","handoff Urdu"),("- Urdu A2 canonical path: `reading/urdu/a2/passages.jsonl`; Unit 1 currently contains sequences 1-6.","- Urdu A2 canonical path: `reading/urdu/a2/passages.jsonl`; Units 1-2 currently contain sequences 1-12.","handoff snapshot"),("Continue **Urdu A2**, starting from Unit 2 / sequence 7, under:","Continue **Urdu A2**, starting from Unit 3 / sequence 13, under:","handoff frontier"),("Unit 2 uses the roadmap theme **plans, invitations, and changes** with `email/message`, `narrative`, and `schedule` genres.","Unit 3 uses the roadmap theme **past events and memories** with `personal narrative`, `diary`, and `short interview` genres.","handoff roadmap"),("Run `python reading/tools/validate_continuation_state.py`; if it passes, resume guarded generation at **Urdu A2 Unit 2 / sequence 7** using the Unit 2 roadmap theme `plans, invitations, and changes`.","Run `python reading/tools/validate_continuation_state.py`; if it passes, resume guarded generation at **Urdu A2 Unit 3 / sequence 13** using the Unit 3 roadmap theme `past events and memories`.","handoff next")]: hand=replace_once(hand,oldtxt,newtxt,label)
          HANDOFF.write_text(hand,encoding="utf-8")
          if project_count()!=792 or urdu_count()!=72: fail("post-write totals invalid")

          lexical={"schema_version":1,"project_id":"LANG-A1C2","language":"ur","cefr":"A2","unit":2,"date":"2026-08-24","status":"PASS_FOR_GENERATION_TARGET_SENSES","scope":"Deliberate learner-facing senses only. This does not validate whole-passage linguistic/pedagogical quality or educator/publication release readiness.","source_lexicon":"reading/lexicons/urdu.jsonl","canonical_freshness_method":"Candidate target IDs were checked against live canonical Urdu A1 and A2 new_lexical_targets; all eight were absent before Unit 2.","targets":[{"id":"ur-rank-0751","form":"منصوبہ","source_rank":751,"accepted_sense":"plan; intended course of action","dictionary":"Rekhta Dictionary","url":"https://www.rekhta.org/urdudictionary?keyword=%D9%85%D9%86%D8%B5%D9%88%D8%A8%DB%81%DB%94%DB%94%DB%94"},{"id":"ur-rank-0753","form":"توقع","source_rank":753,"accepted_sense":"expectation; what one thinks or hopes will happen","dictionary":"Rekhta Dictionary","url":"https://www.rekhtadictionary.com/meaning-of-tavaqqo"},{"id":"ur-rank-0716","form":"مصروف","source_rank":716,"accepted_sense":"busy; occupied with something","dictionary":"Rekhta Dictionary","url":"https://www.rekhta.org/urdudictionary?keyword=%D9%85%D8%B5%D8%B1%D9%88%D9%81"},{"id":"ur-rank-0741","form":"انکار","source_rank":741,"accepted_sense":"refusal; saying no to a request or invitation","dictionary":"Rekhta Dictionary","url":"https://www.rekhtadictionary.com/meaning-of-inkaar"},{"id":"ur-rank-0901","form":"اطلاع","source_rank":901,"accepted_sense":"notice; information communicated to someone","dictionary":"Rekhta Dictionary","url":"https://www.rekhtadictionary.com/meaning-of-ittilaa"},{"id":"ur-rank-0927","form":"اچانک","source_rank":927,"accepted_sense":"suddenly; unexpectedly; without advance warning","dictionary":"Rekhta Dictionary","url":"https://www.rekhtadictionary.com/meaning-of-achaanak"},{"id":"ur-rank-0879","form":"انتظام","source_rank":879,"accepted_sense":"arrangement; practical preparation for an event or activity","dictionary":"Rekhta Dictionary","url":"https://www.rekhtadictionary.com/meaning-of-intizaam"},{"id":"ur-rank-0858","form":"انتظار","source_rank":858,"accepted_sense":"waiting; staying until someone or something arrives","dictionary":"Rekhta Dictionary","url":"https://www.rekhta.org/urdudictionary?keyword=%D8%A7%D9%86%D8%AA%D8%B8%D8%A7%D8%B1"}],"generation_policy":{"P1_P4_new_targets_per_passage":2,"P5_new_targets":0,"P6_new_targets":0,"P6_new_word_policy":"none"},"quality_promotion":False}; write_json(LEX_AUDIT,lexical)
          qa={"schema_version":1,"project_id":"LANG-A1C2","language":"ur","cefr":"A2","unit":2,"date":"2026-08-24","status":"PASS_AFTER_PRECANONICAL_READER_PASS","scope":"Bounded generation-stage reader-first pass for Unit 2 only: naturalness, target-sense clarity, answer grounding/linkage, operational A2 grammar, word-band checks, roadmap role/genre checks, and fluency new-word policy. Formal corpus-wide linguistic, pedagogical, CEFR/coverage, independent/native, and educator-release gates remain pending.","source_canonical_git_blob":EXPECTED_SOURCE_BLOB,"source_a2_passages":6,"packet_sha256":EXPECTED_PACKET_SHA256,"result_canonical_git_blob":result_blob,"result_a2_passages":12,"project_passages_after":792,"urdu_passages_after":72,"unit_sequences":[7,8,9,10,11,12],"passages":6,"questions":60,"answers":60,"word_counts":{x["id"]:x["word_count"] for x in packet},"new_target_ids_by_passage":{x["id"]:[t["id"] for t in x.get("new_lexical_targets",[])] for x in packet},"new_target_exposures":{x["id"]:{t["id"]:t["exposures_in_text"] for t in x.get("new_lexical_targets",[])} for x in packet},"lexical_sense_evidence":"reading/audit/urdu_a2_u02_lexical_sense_check_2026-08-24.json","checks":{"source_blob_guard":True,"packet_hash_guard":True,"fresh_target_ids_against_live_urdu_a1_a2":True,"six_passage_role_order":True,"roadmap_genres_only":True,"word_band_140_220":True,"exactly_10_questions_and_10_answers_each":True,"bidirectional_q_a_links":True,"each_new_target_assessed":True,"target_exposure_metadata_recounted":True,"p5_has_no_new_deliberate_targets":True,"p6_has_no_new_deliberate_targets":True,"p6_new_word_policy_none":True,"post_write_project_and_urdu_counts":True},"quality_promotion":False,"educator_release_ready":False}; write_json(QUALITY_AUDIT,qa)
          print(f"unit02_applied=true result_blob={result_blob} project=792 urdu=72 a2=12")
          PY

      - name: Derive next plan and validate state
        shell: bash
        run: |
          set -euo pipefail
          python reading/tools/extract_active_generation_plan.py
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py

      - name: Commit without overwriting concurrent LANG-A1C2 work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_HEAD="$(git rev-parse HEAD)"
          git add reading/urdu/a2/passages.jsonl reading/audit/urdu_a2_u02_lexical_sense_check_2026-08-24.json reading/audit/urdu_a2_u02_quality_pass_2026-08-24.json reading/STATUS.json reading/CONTINUATION.json reading/TASKS.md reading/AGENT_HANDOFF_V2.md reading/planning/ACTIVE_GENERATION_PLAN.json reading/STATE_MANIFEST.json
          git commit -m "Complete Urdu A2 Unit 2 and advance to Unit 3 [skip ci]"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_HEAD" ]; then
            CHANGED="$(git diff --name-only "$BASE_HEAD"..origin/main || true)"
            printf '%s\n' "$CHANGED"
            if printf '%s\n' "$CHANGED" | grep -Eq '^(reading/urdu/a2/passages\.jsonl|reading/STATUS\.json|reading/CONTINUATION\.json|reading/TASKS\.md|reading/AGENT_HANDOFF_V2\.md|reading/planning/ACTIVE_GENERATION_PLAN\.json|reading/STATE_MANIFEST\.json)$'; then
              echo "Critical continuation state changed concurrently; refusing to push."
              exit 1
            fi
            git rebase origin/main
            python reading/tools/extract_active_generation_plan.py
            python reading/tools/refresh_state_manifest.py
            python reading/tools/validate_continuation_state.py
            git add reading/planning/ACTIVE_GENERATION_PLAN.json reading/STATE_MANIFEST.json
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
