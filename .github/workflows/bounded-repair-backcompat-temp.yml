name: TEMP bounded repair backward compatibility

on:
  push:
    branches:
      - infra/bounded-repair-target-linkage-2026-08-22
    paths:
      - .github/workflows/bounded-repair-backcompat-temp.yml
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/bounded-repair-backcompat-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-bounded-repair-backcompat
  cancel-in-progress: false

jobs:
  patch-and-test:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'infra/bounded-repair-target-linkage-2026-08-22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/bounded-repair-target-linkage-2026-08-22
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make linkage-count verification backward compatible
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('reading/tools/apply_bounded_assessment_repairs.py')
          s=p.read_text(encoding='utf-8')
          old='''    checks = {\n        "scope": validation["scope"],\n        "inventory_candidates": expected_candidates,\n        "confirmed_repairs": len(manifest.get("repairs", [])),\n        "adjudicated_false_positive_count": len(manifest.get("false_positives", [])),\n        "unexpected_formal_metalinguistic_finding_count": 0,\n        "exact_duplicate_prompt_count": 0,\n        "target_linkage_changed_count": expected_target_linkage_changes,\n    }\n'''
          new='''    checks = {\n        "scope": validation["scope"],\n        "inventory_candidates": expected_candidates,\n        "confirmed_repairs": len(manifest.get("repairs", [])),\n        "adjudicated_false_positive_count": len(manifest.get("false_positives", [])),\n        "unexpected_formal_metalinguistic_finding_count": 0,\n        "exact_duplicate_prompt_count": 0,\n    }\n    if any(\n        "target_ids" in repair.get(side, {})\n        for repair in manifest.get("repairs", [])\n        for side in ("before", "after")\n    ):\n        checks["target_linkage_changed_count"] = expected_target_linkage_changes\n'''
          if s.count(old)!=1:
              raise SystemExit(f'FAIL CLOSED: verify compatibility anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile reading/tools/apply_bounded_assessment_repairs.py reading/tools/validate_bounded_repair_manifest.py
      - name: Test legacy post evidence and new linkage evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json

          # Legacy-style prompt-only manifest: apply, strip the newly-added count from its post artifact,
          # then verify as if resuming evidence produced by the pre-extension runner.
          corpus=Path('reading/audit/.tmp_legacy_fixture.jsonl')
          row={'id':'fr-a1-u01-p01','cefr':'A1','unit':1,'text':'Texte.','new_lexical_targets':[],'review_lexical_targets':[],'grammar_targets':[],'discourse_targets':[],'questions':[{'id':'q1','type':'literal_detail','prompt':'Avant','answer_id':'a1'}],'answer_key':[{'id':'a1','question_id':'q1','answer':'Oui','explanation':''}]}
          corpus.write_text(json.dumps(row,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
          manifest={'schema_version':1,'date':'2026-08-22','language':'fr','level':'A1','unit':1,'input_file':str(corpus),'expected_before_sha256':hashlib.sha256(corpus.read_bytes()).hexdigest(),'expected_scope':{'records':1,'questions':1,'answers':1},'repair_evidence_file':'reading/audit/.tmp_legacy_repair.json','post_evidence_file':'reading/audit/.tmp_legacy_post.json','repairs':[{'passage_id':'fr-a1-u01-p01','question_id':'q1','before':{'prompt':'Avant','type':'literal_detail','answer':'Oui'},'after':{'prompt':'Après','type':'literal_detail','answer':'Oui','explanation':''}}],'false_positives':[],'formal_types':[],'formal_prompt_markers':[],'pass_status':'PASS_SYNTHETIC_LEGACY'}
          Path('/tmp/legacy_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # New target-linkage manifest.
          corpus2=Path('reading/audit/.tmp_linkage_fixture.jsonl')
          row2={'id':'fr-a1-u01-p01','cefr':'A1','unit':1,'text':'Texte.','new_lexical_targets':[{'id':'fr-rank-test','form':'test'}],'review_lexical_targets':[],'grammar_targets':[],'discourse_targets':[],'questions':[{'id':'q1','type':'contrast','prompt':'Prompt','answer_id':'a1'}],'answer_key':[{'id':'a1','question_id':'q1','answer':'Réponse','explanation':''}]}
          corpus2.write_text(json.dumps(row2,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
          manifest2={'schema_version':1,'date':'2026-08-22','language':'fr','level':'A1','unit':1,'input_file':str(corpus2),'expected_before_sha256':hashlib.sha256(corpus2.read_bytes()).hexdigest(),'expected_scope':{'records':1,'questions':1,'answers':1},'repair_evidence_file':'reading/audit/.tmp_linkage_repair.json','post_evidence_file':'reading/audit/.tmp_linkage_post.json','repairs':[{'passage_id':'fr-a1-u01-p01','question_id':'q1','before':{'prompt':'Prompt','type':'contrast','answer':'Réponse','target_ids':None},'after':{'prompt':'Prompt','type':'contrast','answer':'Réponse','target_ids':['fr-rank-test'],'explanation':''}}],'false_positives':[],'formal_types':[],'formal_prompt_markers':[],'pass_status':'PASS_SYNTHETIC_LINKAGE'}
          Path('/tmp/linkage_manifest.json').write_text(json.dumps(manifest2,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          python reading/tools/validate_bounded_repair_manifest.py /tmp/legacy_manifest.json
          python reading/tools/run_bounded_assessment_repairs.py /tmp/legacy_manifest.json
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('reading/audit/.tmp_legacy_post.json'); d=json.loads(p.read_text(encoding='utf-8')); d.pop('target_linkage_changed_count',None); p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python reading/tools/run_bounded_assessment_repairs.py /tmp/legacy_manifest.json --verify

          python reading/tools/validate_bounded_repair_manifest.py /tmp/linkage_manifest.json
          python reading/tools/run_bounded_assessment_repairs.py /tmp/linkage_manifest.json
          python reading/tools/run_bounded_assessment_repairs.py /tmp/linkage_manifest.json --verify
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('reading/audit/.tmp_linkage_post.json').read_text(encoding='utf-8'))
          assert d['target_linkage_changed_count']==1
          print('legacy resume + new linkage verification PASS')
          PY
          rm -f reading/audit/.tmp_legacy_fixture.jsonl reading/audit/.tmp_legacy_repair.json reading/audit/.tmp_legacy_post.json reading/audit/.tmp_linkage_fixture.jsonl reading/audit/.tmp_linkage_repair.json reading/audit/.tmp_linkage_post.json /tmp/legacy_manifest.json /tmp/linkage_manifest.json
      - name: Commit tested compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/tools/apply_bounded_assessment_repairs.py
          git commit -m 'Preserve bounded repair legacy resume compatibility [skip ci]'
          git push origin HEAD:infra/bounded-repair-target-linkage-2026-08-22
