name: Arabic external semantic audit

on:
  push:
    paths:
      - 'audit/run_arabic_external_semantic_audit.request'
      - '.github/workflows/arabic-external-semantic-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install semantic verification tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install wn wordfreq
          python - <<'PY'
          import wn
          wn.download('omw-en:2.0')
          wn.download('omw-arb:2.0')
          PY
      - name: Download independent Wiktionary extract
        run: |
          curl -L --fail --retry 5 --retry-all-errors \
            'https://kaikki.org/dictionary/Arabic/kaikki.org-dictionary-Arabic.jsonl' \
            -o /tmp/kaikki-arabic.jsonl
      - name: Run function-aware Arabic semantic audit
        run: |
          python scripts/audit_arabic_top1000_external_semantics.py \
            --kaikki-jsonl /tmp/kaikki-arabic.jsonl
      - name: Commit semantic audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/arabic_top1000_external_semantic_audit.csv \
                  audit/arabic_top1000_external_semantic_review_queue.csv \
                  audit/arabic_top1000_external_semantic_audit_summary.json
          git commit -m 'Record Arabic OMW semantic verification [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
