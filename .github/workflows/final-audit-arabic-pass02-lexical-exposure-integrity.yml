name: Final Arabic audit pass 02 - lexical exposure integrity
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/final_audit_arabic_pass02_lexical_exposure_integrity.py'
      - 'reading/arabic/**/passages.jsonl'
      - '.github/workflows/final-audit-arabic-pass02-lexical-exposure-integrity.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # Explicitly touched after the final source/sense repairs because canonical
      # repair commits use [skip ci].
      - name: Run final review pass 02
        run: python reading/tools/final_audit_arabic_pass02_lexical_exposure_integrity.py
      - name: Commit audit artifact
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_pass02_lexical_exposure_integrity.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record final Arabic audit pass 02 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
