name: Promote Urdu B2 Unit 10 bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-urdu-b2-u08.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Validate, generate, append Unit 10, and advance to C1
        shell: bash
        run: |
          set -euo pipefail
          python3 reading/tools/promote_urdu_b2_u10.py

      - name: Refresh and validate live state bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 reading/tools/refresh_state_manifest.py
          python3 reading/tools/validate_continuation_state.py

      - name: Restore Unit 8 workflow and commit canonical B2 completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout f78df2ecf25c7295dbb213480182ae01743b79eb -- .github/workflows/promote-urdu-b2-u08.yml
          git add \
            .github/workflows/promote-urdu-b2-u08.yml \
            reading/urdu/b2/passages.jsonl \
            reading/audit/urdu_b2_u10_generation_candidate \
            reading/audit/urdu_b2_u10_generation_validation_2026-08-26.json \
            reading/audit/urdu_b2_u10_promotion_2026-08-26.json \
            reading/audit/urdu_b2_u10_lexical_sense_check_2026-08-26.json \
            reading/STATUS.json \
            reading/CONTINUATION.json \
            reading/planning/ACTIVE_GENERATION_PLAN.json \
            reading/TASKS.md \
            reading/AGENT_HANDOFF_V2.md \
            reading/STATE_MANIFEST.json
          git commit -m "Add Urdu B2 Unit 10 and advance to C1"
          git push origin HEAD:main
