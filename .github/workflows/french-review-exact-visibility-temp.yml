name: French A1 exact review visibility summary temp
on:
  push:
    branches: [audit/french-coverage-v2-2026-08-19]
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Group A1 review visibility findings
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict,Counter
          from pathlib import Path
          src=Path('reading/audit/french_exact_review_visibility_audit_2026-08-19.json')
          x=json.loads(src.read_text(encoding='utf-8'))
          groups=defaultdict(list); targets=Counter(); stages=Counter(); reps=Counter()
          for f in x['findings']:
            groups[f['passage_id']].append(f)
            targets[(f['target_id'],f['form'])]+=1
            stages[f['review_stage']]+=1
            reps[f['representation']]+=1
          out={
            'schema_version':1,'date':'2026-08-19','language':'fr','level':'A1',
            'source':'reading/audit/french_exact_review_visibility_audit_2026-08-19.json',
            'bound_canonical_hash':x['bound_canonical_hashes']['A1'],
            'finding_count':len(x['findings']),'passages_with_findings':len(groups),
            'findings_by_passage':[
              {'passage_id':pid,'sequence':rows[0]['sequence'],'finding_count':len(rows),'findings':[
                {k:f[k] for k in ['target_id','form','review_stage','representation','question_target_visible','kind']}
                for f in rows
              ]} for pid,rows in sorted(groups.items(),key=lambda kv:kv[1][0]['sequence'])
            ],
            'target_frequency':[{'target_id':tid,'form':form,'count':count} for (tid,form),count in targets.most_common()],
            'stage_frequency':dict(stages),'representation_frequency':dict(reps),
            'repair_principle':[
              'Do not preserve phantom planned exposures merely to keep historical stage counts.',
              'If the target is naturally present or deliberately tested, correct the representation metadata instead of rewriting prose.',
              'If the target is neither present nor tested, remove the false review entry unless a bounded natural insertion improves the passage.',
              'After repair, rebuild the exposure ledger from actual evidence and then reassess R1-R5 timing.'
            ]
          }
          Path('reading/audit/french_a1_exact_review_visibility_summary_2026-08-19.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit compact summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_a1_exact_review_visibility_summary_2026-08-19.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Summarize French A1 review visibility defects [skip ci]'
          git push origin HEAD:audit/french-coverage-v2-2026-08-19
