name: Sync generation status on passages
on:
  push:
    paths:
      - 'reading/arabic/**/passages.jsonl'
      - '.github/workflows/sync-generation-status-on-passages.yml'
permissions:
  contents: write
concurrency:
  group: generation-status-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/update_generation_status.py
      - name: Commit synchronized status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/STATUS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize generation status [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
