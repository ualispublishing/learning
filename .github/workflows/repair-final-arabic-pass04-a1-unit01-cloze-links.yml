name: Repair final Arabic pass 04 A1 Unit01 cloze links
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_final_arabic_pass04_a1_unit01_cloze_links.py'
      - '.github/workflows/repair-final-arabic-pass04-a1-unit01-cloze-links.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/repair_final_arabic_pass04_a1_unit01_cloze_links.py
      - name: Commit canonical cloze-link repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a1/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair A1 Unit01 cloze target links [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
