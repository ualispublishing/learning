name: TEMP Urdu A1 Unit 08 focused target probe
on:
  push:
    branches: [plan/urdu-a1-unit08-2026-08-20]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/urdu-a1-unit08-2026-08-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/probe_urdu_a1_unit08_targets_400_700.py
      - name: Commit focused probe evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/urdu_a1_unit08_target_probe_400_700_2026-08-20.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Probe Urdu A1 Unit 08 rank 400-700 candidates [skip ci]'
          git push origin HEAD:plan/urdu-a1-unit08-2026-08-20
