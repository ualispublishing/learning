name: TEMP Urdu A1 Unit 08 staging validation
on:
  push:
    branches: [plan/urdu-a1-unit08-2026-08-20]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/urdu-a1-unit08-2026-08-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/validate_urdu_a1_unit08_staging.py
      - name: Commit staging evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/urdu_a1_unit08_staging_result_2026-08-20.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Validate Urdu A1 Unit 08 staging [skip ci]'
          git push origin HEAD:plan/urdu-a1-unit08-2026-08-20
