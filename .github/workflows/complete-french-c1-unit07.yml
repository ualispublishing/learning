name: Complete French C1 Unit 07
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/complete_french_c1_unit07.py'
      - 'reading/tools/select_french_c1_unit07_targets.py'
      - 'reading/tools/generate_french_c1_unit07.py'
      - '.github/workflows/complete-french-c1-unit07.yml'
concurrency:
  group: french-c1-canonical-writer
  cancel-in-progress: false
permissions: {contents: write}
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Run Unit07 transaction
        id: run
        continue-on-error: true
        run: python reading/tools/complete_french_c1_unit07.py 2>&1 | tee /tmp/c1u07.log
      - name: Preserve failure log
        if: steps.run.outcome != 'success'
        run: mkdir -p reading/audit && cp /tmp/c1u07.log reading/audit/french_c1_unit07_workflow_failure.txt || true
      - name: Commit validated progress
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/c1/passages.jsonl reading/audit reading/STATUS.json reading/TASKS.md reading/AGENT_HANDOFF.md
          git diff --cached --quiet && exit 0
          git commit -m 'Complete guarded French C1 Unit 07 pipeline [skip ci]'
          git fetch origin main && git rebase --autostash origin/main && git push origin HEAD:main
      - name: Fail if Unit07 did not seal
        if: steps.run.outcome != 'success'
        run: exit 1
