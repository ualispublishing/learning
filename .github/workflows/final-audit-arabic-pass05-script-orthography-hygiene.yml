name: Final Arabic audit pass 05 - script orthography hygiene
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/final_audit_arabic_pass05_script_orthography_hygiene.py'
      - 'reading/arabic/**/passages.jsonl'
      - '.github/workflows/final-audit-arabic-pass05-script-orthography-hygiene.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # Explicitly touched after guarded [skip ci] repairs.
      - run: python reading/tools/final_audit_arabic_pass05_script_orthography_hygiene.py
      - name: Commit audit artifact
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_pass05_script_orthography_hygiene.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record final Arabic audit pass 05 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
