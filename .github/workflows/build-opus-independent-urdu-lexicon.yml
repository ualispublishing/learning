name: Build independent OPUS Urdu lexicon

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_opus_independent_urdu_lexicon.py'
      - '.github/workflows/build-opus-independent-urdu-lexicon.yml'
      - 'audit/run_opus_independent_urdu_lexicon.request'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install word2word wordfreq requests
      - name: Build independent non-subtitle lexicon
        run: python scripts/build_opus_independent_urdu_lexicon.py
      - name: Commit lexicon evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/opus_independent_urdu_lexicon.json audit/opus_independent_urdu_lexicon_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build independent OPUS Urdu lexicon [skip ci]'
          for n in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*3))
          done
          exit 1
