name: Apply Urdu A1 Wave 2B natural collocations

on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/apply_urdu_a1_wave2b_natural_collocations.py'
      - '.github/workflows/apply-urdu-a1-wave2b-natural-collocations.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply natural-collocation repairs
        run: python reading/tools/apply_urdu_a1_wave2b_natural_collocations.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/urdu/a1/passages.jsonl').read_text(encoding='utf-8').splitlines() if x]
          assert len(rows)==60 and [r['sequence'] for r in rows]==list(range(1,61))
          r=json.loads(Path('reading/audit/urdu_a1_wave2b_natural_collocations_2026-08-23.json').read_text(encoding='utf-8'))
          assert r['cloze_question_count']==130 and r['all_cloze_structures_reconstructed'] is True
          assert r['quality_promotion'] is False
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/audit/urdu_a1_wave2b_natural_collocations_2026-08-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Improve Urdu A1 natural collocations [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
