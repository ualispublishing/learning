name: Apply Arabic Gate C C1 Unit 6 Repair

on:
  push:
    paths:
      - '.github/workflows/apply-arabic-gate-c-c1-unit06-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-rebind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on routed-state drift
        run: python reading/tools/validate_continuation_state.py

      - name: Apply one bounded learner-facing repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('reading/arabic/c1/passages.jsonl')
          pid = 'ar-c1-u06-p03'
          old_answer = 'لأن الفريق استوفى الشروط ولا يوجد نص يمنح الموظف معيارًا عامًا لتقييم فائدة النشاط.'
          new_answer = 'القضية هي متى يجوز للإدارة استخدام سلطتها التقديرية لإضافة شرط على طلب ترخيص مستوفٍ للشروط المعلنة، ومتى يصبح ذلك معيارًا غير معلن أو تعسفًا.'
          lines = path.read_text(encoding='utf-8').splitlines()
          hits = 0
          out = []
          for line in lines:
              rec = json.loads(line)
              if rec.get('id') == pid:
                  hits += 1
                  answers = {a.get('question_id'): a for a in rec.get('answer_key', [])}
                  if answers.get('q1', {}).get('answer') != old_answer:
                      raise SystemExit(f'{pid}: q1 answer drift; refusing repair')
                  answers['q1']['answer'] = new_answer
                  rec['revision'] = int(rec.get('revision', 0)) + 1
                  note = '2026-09-14 fresh Gate C comprehension/answer-grounding repair (C1 Unit 6): q1 answer rewritten as a direct one-sentence statement of the central bounded-discretion issue; passage text and question prompt unchanged; no educator/publication release claim.'
                  notes = rec.setdefault('quality', {}).setdefault('notes', [])
                  if note not in notes:
                      notes.append(note)
                  line = json.dumps(rec, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              out.append(line)
          if hits != 1:
              raise SystemExit(f'expected exactly one {pid} record; found {hits}')
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Rebuild hash-bound Arabic evidence
        shell: bash
        run: |
          set -euo pipefail
          python reading/tools/run_post_generation_gate0.py
          python reading/tools/run_arabic_fresh_deterministic_revalidation.py
          python reading/tools/audit_arabic_metalinguistic_cefr_candidates.py
          python reading/tools/adjudicate_arabic_b1_c2_metalinguistic_cefr.py
          python reading/tools/build_arabic_gate_b_naturalness_review.py

      - name: Rebind Gate B decision to exact-current learner hash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          pid = 'ar-c1-u06-p03'
          inv_path = Path('reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json')
          dec_path = Path('reading/audit/arabic_gate_b_decisions_2026-08-30/c1_u06.json')
          inv = json.loads(inv_path.read_text(encoding='utf-8'))
          new_hash = inv['levels']['c1']['record_learner_facing_sha256'][pid]
          dec = json.loads(dec_path.read_text(encoding='utf-8'))
          found = False
          for item in dec['decisions']:
              if item.get('passage_id') == pid:
                  if item.get('learner_facing_sha256') == new_hash:
                      raise SystemExit('learner hash unexpectedly unchanged after q1 repair')
                  item['learner_facing_sha256'] = new_hash
                  found = True
          if not found:
              raise SystemExit('Gate B Unit 6 decision missing target passage')
          entry = {
              'date': '2026-09-14',
              'gate_c_artifact': 'reading/audit/arabic_gate_c_decisions_2026-09-05/c1_u06.json',
              'scope': ['ar-c1-u06-p03 answer q1'],
              'gate_b_language_recheck': 'PASS',
              'reason': 'Gate C replaced one text-grounded but wrong-form causal answer with a direct declarative one-sentence summary of the central bounded-discretion issue; passage text and question prompt were preserved and Gate B was rebound to exact-current learner-facing content.',
              'release_claim': False,
          }
          rows = dec.setdefault('post_gate_c_revalidations', [])
          rows[:] = [x for x in rows if x.get('gate_c_artifact') != entry['gate_c_artifact'] or x.get('scope') != entry['scope']]
          rows.append(entry)
          dec_path.write_text(json.dumps(dec, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python reading/tools/sync_arabic_gate_b_progress.py

      - name: Close Gate C finding and record current binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          pid = 'ar-c1-u06-p03'
          inv_path = Path('reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json')
          gatec_path = Path('reading/audit/arabic_gate_c_decisions_2026-09-05/c1_u06.json')
          inv = json.loads(inv_path.read_text(encoding='utf-8'))
          level = inv['levels']['c1']
          new_hash = level['record_learner_facing_sha256'][pid]

          entry = {
              'date': '2026-09-14',
              'gate_c_artifact': 'reading/audit/arabic_gate_c_decisions_2026-09-05/c1_u06.json',
              'scope': ['ar-c1-u06-p03 answer q1'],
              'gate_b_language_recheck': 'PASS',
              'reason': 'Gate C replaced one text-grounded but wrong-form causal answer with a direct declarative one-sentence summary of the central bounded-discretion issue; passage text and question prompt were preserved and Gate B was rebound to exact-current learner-facing content.',
              'release_claim': False,
          }
          rows = inv.setdefault('post_gate_c_revalidations', [])
          rows[:] = [x for x in rows if x.get('gate_c_artifact') != entry['gate_c_artifact'] or x.get('scope') != entry['scope']]
          rows.append(entry)
          inv_path.write_text(json.dumps(inv, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gate = json.loads(gatec_path.read_text(encoding='utf-8'))
          if gate.get('unit') != 6 or gate.get('level') != 'C1':
              raise SystemExit('unexpected Gate C artifact identity')
          target = None
          for item in gate['decisions']:
              if item.get('passage_id') == pid:
                  target = item
                  break
          if target is None:
              raise SystemExit('Gate C artifact missing target passage')
          findings = target.get('findings', [])
          if len(findings) != 1 or findings[0].get('finding_id') != 'ar-c1-u06-p03-gC-01':
              raise SystemExit('Gate C finding drift')
          target['learner_facing_sha256'] = new_hash
          target['decision'] = 'PASS_AFTER_REPAIR'
          findings[0]['status'] = 'REPAIRED'
          findings[0]['rationale'] = 'Q1 asks for a one-sentence statement of the central issue. The keyed causal explanation was replaced with a direct declarative summary contrasting legitimate bounded discretion with an unpublished/arbitrary criterion; the passage and prompt were unchanged.'
          gate['canonical_sha256'] = level['canonical_sha256']
          gate['guard'] = 'Fresh Gate C review examined all 6 C1 Unit 6 records and all 60 linked question/answer pairs. The sole finding, ar-c1-u06-p03 q1 answer-form mismatch, was repaired with exactly one learner-facing answer edit; the passage and prompt were preserved. Gate B was rebuilt/rebound to the exact-current learner-facing hash, followed by a Gate B language recheck PASS. All six records now pass Gate C (p03 PASS_AFTER_REPAIR). This remains internal review evidence only: quality_promotion=false and release_claim=false.'
          gatec_path.write_text(json.dumps(gate, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Refresh routed state manifest and validate
        shell: bash
        run: |
          set -euo pipefail
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py

      - name: Commit bounded repair and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-arabic-gate-c-c1-unit06-repair.yml
          git add \
            reading/arabic/c1/passages.jsonl \
            reading/audit/post_generation_gate0_2026-08-30.json \
            reading/audit/arabic_fresh_deterministic_revalidation_2026-08-30.json \
            reading/audit/arabic_metalinguistic_cefr_candidate_inventory_2026-08-30.json \
            reading/audit/arabic_b1_c2_metalinguistic_cefr_triage_2026-08-30.json \
            reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json \
            reading/audit/arabic_gate_b_packets_2026-08-30 \
            reading/audit/arabic_gate_b_decisions_2026-08-30/c1_u06.json \
            reading/audit/arabic_gate_c_decisions_2026-09-05/c1_u06.json \
            reading/RELEASE_STATUS.json \
            reading/STATE_MANIFEST.json
          test -n "$(git status --porcelain)"
          git commit -m 'Repair Arabic C1 Unit 6 Gate C answer and rebind evidence'
          git push origin HEAD:main
