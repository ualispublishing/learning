name: Audit Arabic phrase naturalness v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_arabic_phrase_naturalness_v2.py'
      - '.github/workflows/audit-arabic-phrase-naturalness-v2.yml'
      - 'audit/run_arabic_phrase_naturalness_v2.request'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run front-based naturalness audit
        run: python scripts/audit_arabic_phrase_naturalness_v2.py
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/arabic_phrase_naturalness_v2_summary.json audit/arabic_phrase_naturalness_v2_queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit residual Arabic phrase naturalness [skip ci]'
          for n in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*3))
          done
          exit 1
