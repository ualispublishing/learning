name: TEMP Arabic B1 U01 P01 MSA repair
on:
  push:
    branches: [repair/arabic-b1-u01-p01-msa-2026-08-20]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/arabic-b1-u01-p01-msa-2026-08-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded q7 MSA repair
        run: python reading/tools/repair_arabic_b1_u01_p01_msa.py
      - name: Commit repair and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/b1/passages.jsonl reading/audit/arabic_b1_u01_p01_msa_repair_2026-08-20.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair Arabic B1 U01 P01 malformed MSA [skip ci]'
          git push origin HEAD:repair/arabic-b1-u01-p01-msa-2026-08-20
