name: LANG-WB sign-off draft generator self-test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/language-workbook-signoff-draft-selftest.yml'
      - 'scripts/prepare_lang_wb_native_signoff_draft.py'
      - 'scripts/validate_lang_wb_native_signoff.py'
      - 'scripts/workbook_final_human_promotion_gate.py'
      - 'audit/language-workbooks/v1.0/FINAL_NATIVE_SIGNOFF_TEMPLATE.json'
      - 'completed/languages/workbooks/v1.0/RELEASE_MANIFEST.json'
      - 'completed/languages/workbooks/v1.0/arabic/00_arabic_complete_master.pdf'
      - 'completed/languages/workbooks/v1.0/french/00_french_complete_master.pdf'
      - 'completed/languages/workbooks/v1.0/urdu/00_urdu_complete_master.pdf'

permissions:
  contents: read

jobs:
  signoff-draft-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate current-candidate drafts
        run: |
          for lang in arabic french urdu; do
            python scripts/prepare_lang_wb_native_signoff_draft.py "$lang"
          done

      - name: Confirm deterministic bindings and deliberately incomplete human fields
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import workbook_final_human_promotion_gate as g

          manifest = g.load_json(g.MANIFEST_PATH)
          manifest_blob = g.git_blob_sha(g.MANIFEST_PATH)
          for lang in g.LANGUAGES:
              p = g.AUDIT / 'native-review-ledgers' / f'{lang}_native_signoff_draft.json'
              data = json.load(open(p, encoding='utf-8'))
              master_rel = f'completed/languages/workbooks/v1.0/{lang}/{g.MASTER_NAMES[lang]}'
              assert data['language'] == lang
              assert data['review_outcome'] == ''
              assert data['review_completed_utc'] == ''
              assert not any(data['scope_attestation'].values())
              assert not any(str(v).strip() for v in data['reviewer'].values())
              assert data['candidate_binding']['master_workbook_path'] == master_rel
              assert data['candidate_binding']['master_workbook_git_blob_sha'] == g.git_blob_sha(g.ROOT / master_rel)
              assert data['candidate_binding']['sentence_decision_sha256'] == manifest['sentence_curation']['languages'][lang]['decision_sha256']
              assert data['candidate_binding']['release_manifest_git_blob_sha'] == manifest_blob
          PY

      - name: Confirm untouched drafts cannot pass human sign-off validation
        shell: bash
        run: |
          for lang in arabic french urdu; do
            draft="audit/language-workbooks/v1.0/native-review-ledgers/${lang}_native_signoff_draft.json"
            set +e
            output=$(python scripts/validate_lang_wb_native_signoff.py "$draft")
            code=$?
            set -e
            if [ "$code" -ne 1 ]; then
              echo "$lang draft exit=$code; expected 1"
              echo "$output"
              exit 1
            fi
            echo "$output" | grep -q 'reviewer_qualification'
            echo "$output" | grep -q 'review_outcome'
          done

      - name: Confirm generated drafts are not tracked certification records
        shell: bash
        run: |
          if git ls-files 'audit/language-workbooks/v1.0/native-review-ledgers/*_native_signoff_draft.json' | grep -q .; then
            echo 'Generated sign-off draft unexpectedly became a tracked repository file.'
            exit 1
          fi
          if git ls-files 'audit/language-workbooks/v1.0/native-signoffs/*.json' | grep -v '/README.md$' | grep -q .; then
            echo 'Unexpected human sign-off JSON exists in repository baseline.'
            exit 1
          fi
