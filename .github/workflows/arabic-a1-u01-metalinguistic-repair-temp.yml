name: TEMP Arabic A1 Unit 01 postrepair audit
on:
  push:
    branches: [repair/arabic-a1-u01-metalinguistic-2026-08-20]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/arabic-a1-u01-metalinguistic-2026-08-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic Unit 01 postrepair audit
        run: python reading/tools/audit_arabic_a1_u01_postrepair.py
      - name: Commit postrepair evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/arabic_a1_u01_metalinguistic_postrepair_2026-08-20.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit Arabic A1 Unit 01 postrepair state [skip ci]'
          git push origin HEAD:repair/arabic-a1-u01-metalinguistic-2026-08-20
