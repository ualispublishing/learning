name: Repair final Arabic stale r2063 reviews
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_final_arabic_stale_r2063_reviews.py'
      - '.github/workflows/repair-final-arabic-stale-r2063-reviews.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/repair_final_arabic_stale_r2063_reviews.py
      - name: Commit stale-review cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/b1/passages.jsonl reading/arabic/c2/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove stale Arabic lexical review metadata [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
