name: Arabic B1-C2 semantic remainder repairs

on:
  push:
    branches: [audit/arabic-b1-c2-final-2026-08-23]
    paths:
      - 'reading/tools/apply_arabic_b1_c2_semantic_remainder_repairs.py'
      - '.github/workflows/arabic-b1-c2-semantic-remainder-repairs.yml'

permissions:
  contents: write

concurrency:
  group: arabic-b1-c2-semantic-remainder-repairs
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/arabic-b1-c2-final-2026-08-23
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded semantic repairs
        run: python reading/tools/apply_arabic_b1_c2_semantic_remainder_repairs.py
      - name: Commit repaired corpus and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/arabic/b1/passages.jsonl reading/arabic/b2/passages.jsonl reading/arabic/c1/passages.jsonl reading/arabic/c2/passages.jsonl reading/audit/arabic_b1_c2_semantic_remainder_repairs_2026-08-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair Arabic B1-C2 semantic remainder [skip ci]"
          git fetch origin audit/arabic-b1-c2-final-2026-08-23
          git rebase origin/audit/arabic-b1-c2-final-2026-08-23
          git push origin HEAD:audit/arabic-b1-c2-final-2026-08-23
