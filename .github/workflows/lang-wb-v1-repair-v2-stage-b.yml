name: LANG-WB v1 repair v2 stage B dry-run

on:
  push:
    branches:
      - lang-wb-v1-repair-v2-20260904
    paths:
      - '.github/lang-wb-v2/stage-b-trigger.txt'

permissions:
  contents: read

concurrency:
  group: lang-wb-v1-repair-v2-stage-b
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: lang-wb-v1-repair-v2-20260904
          fetch-depth: 0

      - name: Run locked linguistic repair dry-run
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_language_workbook_linguistic_repairs.py > /tmp/lang-wb-dry-run.json
          cat /tmp/lang-wb-dry-run.json

      - name: Validate exact dry-run gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          result=json.loads(Path('/tmp/lang-wb-dry-run.json').read_text(encoding='utf-8'))
          baseline=json.loads(Path('audit/language-workbooks/v1.0/vocab_incremental_repair_baselines.json').read_text(encoding='utf-8'))

          if result.get('gate') != 'PASS_DRY_RUN':
              raise SystemExit(f"expected PASS_DRY_RUN, got {result.get('gate')!r}")
          expected_coverage={
              'sentence_rows':3000,
              'vocab_rows':3000,
              'total_rows':6000,
              'unresolved_holds':0,
          }
          if result.get('coverage') != expected_coverage:
              raise SystemExit(f"coverage mismatch: {result.get('coverage')!r}")

          for lang in ('arabic','french','urdu'):
              sentence=result['sources']['sentence'][lang]
              if sentence.get('applied'):
                  raise SystemExit(f"sentence/{lang}: unexpected new repair(s): {sentence['applied']}")
              if sentence.get('target_unique') != 1000 or sentence.get('english_unique') != 1000:
                  raise SystemExit(f"sentence/{lang}: uniqueness gate failed")

              vocab=result['sources']['vocab'][lang]
              expected=set(baseline['vocab'][lang]['allowed_new_repair_ranks'])
              actual=set(vocab.get('applied', []))
              if actual != expected:
                  raise SystemExit(f"vocab/{lang}: expected applied {sorted(expected)}, got {sorted(actual)}")
              if vocab.get('source_state') != 'incremental_baseline':
                  raise SystemExit(f"vocab/{lang}: expected incremental_baseline, got {vocab.get('source_state')!r}")
              if vocab.get('blocking_duplicate_groups') != 0:
                  raise SystemExit(f"vocab/{lang}: blocking duplicate group detected")

          if result['sources']['vocab']['arabic'].get('distinct_normalized_fronts') != 999:
              raise SystemExit('vocab/arabic: expected 999 distinct normalized fronts')
          if len(result['sources']['vocab']['arabic'].get('intentional_homographs', [])) != 1:
              raise SystemExit('vocab/arabic: expected one intentional homograph group')
          for lang in ('french','urdu'):
              if result['sources']['vocab'][lang].get('distinct_normalized_fronts') != 1000:
                  raise SystemExit(f'vocab/{lang}: expected 1000 distinct normalized fronts')
              if result['sources']['vocab'][lang].get('intentional_homographs'):
                  raise SystemExit(f'vocab/{lang}: unexpected intentional homograph group')

          print('PASS_EXACT_STAGE_B_DRY_RUN')
          PY

      - name: Prove dry-run made no repository changes
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo 'PASS_CLEAN_DRY_RUN_TREE'
