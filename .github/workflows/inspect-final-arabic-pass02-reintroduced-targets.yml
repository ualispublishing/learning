name: Inspect final Arabic pass 02 reintroduced targets
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/inspect_final_arabic_pass02_reintroduced_targets.py'
      - '.github/workflows/inspect-final-arabic-pass02-reintroduced-targets.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/inspect_final_arabic_pass02_reintroduced_targets.py
      - name: Commit comparison artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_pass02_reintroduced_target_comparison.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Compare Pass 02 reintroduced lexical targets [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
