name: Audit Arabic metalinguistic CEFR candidates

on:
  push:
    paths:
      - '.github/workflows/audit-arabic-metalinguistic-cefr-candidates.yml'
      - 'reading/tools/audit_arabic_metalinguistic_cefr_candidates.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate current state
        run: python reading/tools/validate_continuation_state.py
      - name: Build fresh candidate inventory
        run: python reading/tools/audit_arabic_metalinguistic_cefr_candidates.py
      - name: Commit audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/arabic_metalinguistic_cefr_candidate_inventory_2026-08-30.json
          git diff --cached --quiet && exit 0
          git commit -m 'Audit Arabic metalinguistic CEFR candidates'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
