# Serialized guarded French C1 Unit06 writer.
name: Complete French C1 Unit 06
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/complete_french_c1_unit06.py'
      - 'reading/tools/complete_french_c1_unit06_retry.py'
      - 'reading/tools/select_french_c1_unit06_targets.py'
      - 'reading/tools/generate_french_c1_unit06.py'
      - 'reading/tools/generate_french_c1_unit06_retry.py'
      - 'reading/tools/audit_french_c1_unit_generation.py'
      - 'reading/tools/lock_french_c1_unit_frontier.py'
      - 'reading/tools/resolve_french_c1_unit_plan.py'
      - 'reading/tools/probe_french_c1_unit_targets.py'
      - 'reading/tools/sync_french_c1_unit_frontier.py'
      - '.github/workflows/complete-french-c1-unit06.yml'
concurrency:
  group: french-c1-canonical-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet jsonschema
      - name: Run serialized C1 Unit06 pipeline
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python reading/tools/complete_french_c1_unit06_retry.py 2>&1 | tee /tmp/french_c1_u06_pipeline.log
      - name: Preserve failure log
        if: steps.run.outcome != 'success'
        run: |
          mkdir -p reading/audit
          cp /tmp/french_c1_u06_pipeline.log reading/audit/french_c1_unit06_workflow_failure.txt || true
      - name: Commit validated progress
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/c1/passages.jsonl reading/audit reading/STATUS.json reading/TASKS.md reading/AGENT_HANDOFF.md
          git diff --cached --quiet && exit 0
          git commit -m 'Complete guarded French C1 Unit 06 pipeline [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
      - name: Fail if Unit06 did not seal
        if: steps.run.outcome != 'success'
        run: exit 1
