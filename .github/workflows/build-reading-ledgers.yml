name: Build reading lexical ledgers

on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/build_ledgers.py'
      - 'reading/tools/build_arabic_phrase_ledger.py'
      - 'arabic_phrase_bank.csv'
      - '.github/workflows/build-reading-ledgers.yml'
      - 'reading/run_ledger_build.request'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build derived read-only-input ledgers
        run: |
          python reading/tools/build_ledgers.py
          python reading/tools/build_arabic_phrase_ledger.py
      - name: Commit derived lexicons and ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/lexicons reading/ledgers/build_summary.json reading/ledgers/*_lexical_exposure.jsonl reading/ledgers/arabic_phrase_exposure.jsonl reading/ledgers/arabic_phrase_exposure_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build reading lexical ledgers [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
