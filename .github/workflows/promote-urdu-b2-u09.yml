name: Promote Urdu B2 Unit 9
# registration retrigger: 2026-08-26

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/promote-urdu-b2-u09.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Validate, append Unit 9, and advance frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 reading/tools/promote_urdu_b2_u09.py

      - name: Refresh and validate live state bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 reading/tools/refresh_state_manifest.py
          python3 reading/tools/validate_continuation_state.py

      - name: Commit canonical promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reading/urdu/b2/passages.jsonl \
            reading/audit/urdu_b2_u09_generation_candidate \
            reading/audit/urdu_b2_u09_generation_validation_2026-08-26.json \
            reading/audit/urdu_b2_u09_promotion_2026-08-26.json \
            reading/audit/urdu_b2_u09_lexical_sense_check_2026-08-26.json \
            reading/STATUS.json \
            reading/CONTINUATION.json \
            reading/planning/ACTIVE_GENERATION_PLAN.json \
            reading/TASKS.md \
            reading/AGENT_HANDOFF_V2.md \
            reading/STATE_MANIFEST.json
          if git diff --cached --quiet; then
            echo "No promotion changes to commit"
            exit 0
          fi
          git commit -m "Add Urdu B2 Unit 9 and advance to Unit 10"
          git push origin HEAD:main
