name: Lock French B2 Unit 09 Frontier
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/lock_french_b2_unit09_frontier.py'
      - '.github/workflows/lock-french-b2-unit09-frontier.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate Unit 09 frontier
        id: lock
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python reading/tools/lock_french_b2_unit09_frontier.py 2>&1 | tee /tmp/french_b2_u09_lock.log
      - name: Persist lock failure diagnostic
        if: steps.lock.outcome != 'success'
        run: |
          mkdir -p reading/audit
          cp /tmp/french_b2_u09_lock.log reading/audit/french_b2_unit09_lock_failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_b2_unit09_lock_failure.txt
          git commit -m 'Record French B2 Unit 09 lock failure [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
      - name: Stop after failed lock
        if: steps.lock.outcome != 'success'
        run: exit 1
      - name: Commit Unit 09 frontier lock
        if: steps.lock.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_b2_unit09_frontier_lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Lock French B2 Unit 09 frontier [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
