name: Repair final Arabic pass 01 schema contract
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_final_arabic_pass01_schema_contract.py'
      - '.github/workflows/repair-final-arabic-pass01-schema-contract.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/repair_final_arabic_pass01_schema_contract.py
      - name: Commit schema repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/schema/passage.schema.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Align reading schema with advanced curriculum strategies [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
