name: Build final Arabic Pass 11 C2 snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - reading/arabic/c2/passages.jsonl
      - reading/tools/build_final_arabic_pass11_c2_snapshot.py
      - .github/workflows/build-final-arabic-pass11-c2-snapshot.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/build_final_arabic_pass11_c2_snapshot.py
      - name: Commit compact review snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/final_arabic_pass11_c2_snapshot.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build C2 naturalness review snapshot [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
