name: LANG-WB reviewer packages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/language-workbook-reviewer-package.yml'
      - 'scripts/build_lang_wb_native_review_ledgers.py'
      - 'scripts/prepare_lang_wb_native_signoff_draft.py'
      - 'audit/language-workbooks/v1.0/REVIEWER_ONBOARDING.md'
      - 'audit/language-workbooks/v1.0/FINAL_NATIVE_REVIEW_PACKET.md'
      - 'audit/language-workbooks/v1.0/CORRECTNESS_STANDARD.md'
      - 'audit/language-workbooks/v1.0/FINAL_NATIVE_SIGNOFF_TEMPLATE.json'
      - 'audit/language-workbooks/v1.0/native-signoffs/README.md'
      - 'completed/languages/workbooks/v1.0/RELEASE_MANIFEST.json'
      - 'completed/languages/workbooks/v1.0/**/*.pdf'
      - 'completed/languages/workbooks/v1.0/**/*.csv'

permissions:
  contents: read

jobs:
  build-reviewer-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [arabic, french, urdu]
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate current-candidate review materials
        run: |
          set -euo pipefail
          python scripts/build_lang_wb_native_review_ledgers.py
          python scripts/prepare_lang_wb_native_signoff_draft.py "${{ matrix.language }}" \
            --output "$RUNNER_TEMP/${{ matrix.language }}_native_signoff_draft.json"

      - name: Assemble reviewer package
        shell: bash
        run: |
          set -euo pipefail
          lang='${{ matrix.language }}'
          package="$RUNNER_TEMP/lang-wb-v1.0-${lang}-reviewer-package"
          mkdir -p "$package"

          master="completed/languages/workbooks/v1.0/${lang}/00_${lang}_complete_master.pdf"
          vocab="completed/languages/workbooks/v1.0/${lang}/${lang}_vocabulary_1000.csv"
          sentences="completed/languages/workbooks/v1.0/${lang}/${lang}_sentence_bank_1000.csv"

          cp "$master" "$package/"
          cp "$vocab" "$package/"
          cp "$sentences" "$package/"
          cp "audit/language-workbooks/v1.0/native-review-ledgers/${lang}_native_review_ledger.csv" "$package/"
          cp audit/language-workbooks/v1.0/native-review-ledgers/CANDIDATE_BINDINGS.json "$package/"
          cp "$RUNNER_TEMP/${lang}_native_signoff_draft.json" "$package/"
          cp audit/language-workbooks/v1.0/REVIEWER_ONBOARDING.md "$package/"
          cp audit/language-workbooks/v1.0/FINAL_NATIVE_REVIEW_PACKET.md "$package/"
          cp audit/language-workbooks/v1.0/CORRECTNESS_STANDARD.md "$package/"
          cp audit/language-workbooks/v1.0/FINAL_NATIVE_SIGNOFF_TEMPLATE.json "$package/"
          cp audit/language-workbooks/v1.0/native-signoffs/README.md "$package/NATIVE_SIGNOFFS_README.md"
          cp completed/languages/workbooks/v1.0/RELEASE_MANIFEST.json "$package/"

          issue=''
          case "$lang" in
            arabic) issue='114' ;;
            french) issue='115' ;;
            urdu) issue='116' ;;
          esac

          cat > "$package/START_HERE.md" <<EOF
          # LANG-WB v1.0 — ${lang^} reviewer package

          This package was generated from repository commit \`${GITHUB_SHA}\` for independent full-content human linguistic review.

          Operational tracker: https://github.com/ualispublishing/learning/issues/${issue}
          Parent release tracker: https://github.com/ualispublishing/learning/issues/106

          ## Required review

          1. Read \`REVIEWER_ONBOARDING.md\`, \`FINAL_NATIVE_REVIEW_PACKET.md\`, and \`CORRECTNESS_STANDARD.md\`.
          2. Review every row in \`${lang}_native_review_ledger.csv\`; record PASS, FAIL, or HOLD yourself.
          3. Review the complete rendered \`00_${lang}_complete_master.pdf\`, including Foundations, pronunciation, headings, instructions, and other learner-facing material not represented by worksheet rows.
          4. Use \`${lang}_native_signoff_draft.json\` only after the full review. It is deliberately incomplete and does not certify anything by itself.
          5. Submit the completed result as a new immutable \`${lang}_*.json\` record under \`audit/language-workbooks/v1.0/native-signoffs/\` in the repository.

          The included \`CANDIDATE_BINDINGS.json\` and \`RELEASE_MANIFEST.json\` bind this package to the candidate. If learner-facing candidate content changes, generate a fresh package before signing off.

          Automation does not make the linguistic judgment. A genuine PASS requires a qualified human reviewer to complete the stated full-content scope.
          EOF

          (
            cd "$package"
            sha256sum -- * > CHECKSUMS.sha256
          )

          test -s "$package/00_${lang}_complete_master.pdf"
          test "$(python - "$package/${lang}_native_review_ledger.csv" <<'PY'
          import csv, sys
          with open(sys.argv[1], encoding='utf-8-sig', newline='') as f:
              print(sum(1 for _ in csv.DictReader(f)))
          PY
          )" = '2000'

          python - "$package/${lang}_native_signoff_draft.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['review_outcome'] == ''
          assert data['review_completed_utc'] == ''
          assert all(value is False for value in data['scope_attestation'].values())
          PY

      - name: Upload reviewer package
        uses: actions/upload-artifact@v4
        with:
          name: lang-wb-v1.0-${{ matrix.language }}-reviewer-package-${{ github.sha }}
          path: ${{ runner.temp }}/lang-wb-v1.0-${{ matrix.language }}-reviewer-package
          if-no-files-found: error
          retention-days: 30
