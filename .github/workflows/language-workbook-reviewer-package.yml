name: LANG-WB reviewer packages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/language-workbook-reviewer-package.yml'
      - 'scripts/build_lang_wb_reviewer_bundle.py'
      - 'scripts/build_lang_wb_native_review_ledgers.py'
      - 'scripts/prepare_lang_wb_native_signoff_draft.py'
      - 'scripts/validate_lang_wb_native_signoff.py'
      - 'audit/language-workbooks/v1.0/REVIEWER_ONBOARDING.md'
      - 'audit/language-workbooks/v1.0/FINAL_NATIVE_REVIEW_PACKET.md'
      - 'audit/language-workbooks/v1.0/CORRECTNESS_STANDARD.md'
      - 'audit/language-workbooks/v1.0/FINAL_NATIVE_SIGNOFF_TEMPLATE.json'
      - 'audit/language-workbooks/v1.0/native-review-ledgers/README.md'
      - 'audit/language-workbooks/v1.0/native-signoffs/README.md'
      - '.github/PULL_REQUEST_TEMPLATE/lang-wb-native-signoff.md'
      - 'completed/languages/workbooks/v1.0/RELEASE_MANIFEST.json'
      - 'completed/languages/workbooks/v1.0/**/*.pdf'
      - 'completed/languages/workbooks/v1.0/**/*.csv'

permissions:
  contents: read

jobs:
  build-reviewer-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [arabic, french, urdu]
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build self-contained reviewer bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lang-wb-reviewer-packages"
          python scripts/build_lang_wb_reviewer_bundle.py \
            "${{ matrix.language }}" \
            --repository-commit-sha "${{ github.sha }}" \
            --output-root "$out"

          lang='${{ matrix.language }}'
          dir="$out/${lang}_lang_wb_v1.0_reviewer_bundle"
          zip="$out/${lang}_lang_wb_v1.0_reviewer_bundle.zip"

          test -s "$dir/MASTER_WORKBOOK.pdf"
          test -s "$dir/${lang}_vocabulary_1000.csv"
          test -s "$dir/${lang}_sentence_bank_1000.csv"
          test -f "$dir/${lang}_REVIEW_LEDGER.csv"
          test -f "$dir/${lang}_SIGNOFF_DRAFT.json"
          test -f "$dir/CANDIDATE_BINDING.json"
          test -f "$dir/RELEASE_MANIFEST.json"
          test -f "$dir/NATIVE_REVIEW_LEDGER_README.md"
          test -f "$dir/BUNDLE_MANIFEST.json"
          test -f "$dir/CHECKSUMS.sha256"
          test -s "$zip"

          rows=$(($(wc -l < "$dir/${lang}_REVIEW_LEDGER.csv") - 1))
          if [ "$rows" -ne 2000 ]; then
            echo "$lang reviewer ledger has $rows rows; expected 2000"
            exit 1
          fi

          python - "$dir/CANDIDATE_BINDING.json" "${{ github.sha }}" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["repository_commit_sha"] == expected, payload["repository_commit_sha"]
          PY

          (
            cd "$dir"
            sha256sum -c CHECKSUMS.sha256
          )

          set +e
          python scripts/validate_lang_wb_native_signoff.py "$dir/${lang}_SIGNOFF_DRAFT.json" >/tmp/${lang}-bundle-signoff-validation.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            cat /tmp/${lang}-bundle-signoff-validation.log
            echo "$lang untouched bundle sign-off draft exit=$code; expected 1"
            exit 1
          fi

      - name: Verify source-archive mode fails closed and accepts exact commit
        shell: bash
        run: |
          set -euo pipefail
          lang='${{ matrix.language }}'
          archive_root="$RUNNER_TEMP/lang-wb-archive-like-${lang}"
          missing_out="$RUNNER_TEMP/archive-missing-commit-${lang}"
          exact_out="$RUNNER_TEMP/archive-with-commit-${lang}"
          log="/tmp/lang-wb-archive-no-commit-${lang}.log"
          mkdir -p "$archive_root"
          tar --exclude=.git -cf - . | tar -C "$archive_root" -xf -

          set +e
          (
            cd "$archive_root"
            python scripts/build_lang_wb_reviewer_bundle.py "$lang" \
              --output-root "$missing_out" \
              --no-zip
          ) >"$log" 2>&1
          missing_code=$?
          set -e
          if [ "$missing_code" -ne 1 ]; then
            cat "$log"
            echo "$lang archive-like build without explicit commit exit=$missing_code; expected 1"
            exit 1
          fi

          (
            cd "$archive_root"
            python scripts/build_lang_wb_reviewer_bundle.py "$lang" \
              --repository-commit-sha "${{ github.sha }}" \
              --output-root "$exact_out" \
              --no-zip
          )

          python - "$exact_out/${lang}_lang_wb_v1.0_reviewer_bundle/CANDIDATE_BINDING.json" "${{ github.sha }}" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["repository_commit_sha"] == expected, payload["repository_commit_sha"]
          assert payload["review_ledger_rows"] == 2000, payload["review_ledger_rows"]
          PY

      - name: Upload reviewer bundle ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lang-wb-v1.0-${{ matrix.language }}-reviewer-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/lang-wb-reviewer-packages/${{ matrix.language }}_lang_wb_v1.0_reviewer_bundle.zip
          if-no-files-found: error
          retention-days: 30
