name: TEMP Urdu A1 explanation hygiene repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/urdu-a1-explanation-hygiene-repair-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-urdu-a1-explanation-hygiene-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'audit/urdu-a1-final-deterministic-2026-08-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/urdu-a1-final-deterministic-2026-08-22
      - name: Apply exact learner-facing explanation repairs and refresh deterministic audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,datetime

          corpus=Path('reading/urdu/a1/passages.jsonl')
          before='e4c996dbd9fc9808eed0a29c66aa5d7114543b5bb7ccc34d5bcd1de6b9d5cf8c'
          got=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if got!=before: raise SystemExit(f'FAIL CLOSED corpus drift {got}')
          rows=[json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]
          byid={r['id']:r for r in rows}
          repairs=[
            ('ur-a1-u01-p04','a6','یہ سوال «اگر» کے استعمال کو عملی شرط کے طور پر جانچتا ہے، نحوی اصطلاح نہیں مانگتا۔','دروازہ کھلا ہونا اندر جانے کی شرط ہے۔'),
            ('ur-a1-u01-p06','a8','یہ سوال «اگر» کے معنی کو عبارت کے نتیجے کے ساتھ جوڑتا ہے۔','موسم اچھا ہو تو عائشہ اتوار کو پارک جاتی ہے۔'),
            ('ur-a1-u02-p03','a8','«کیا» سے بنا یہ سوال ہاں یا نہیں کے جواب کے لیے استعمال ہوا ہے۔','یہاں مناسب مختصر جواب «ہاں، کر سکتی ہوں» ہے۔'),
          ]
          evidence=[]
          for pid,aid,old,new in repairs:
            r=byid[pid]
            a=next((x for x in r['answer_key'] if x['id']==aid),None)
            if a is None or a.get('explanation')!=old:
              raise SystemExit(f'FAIL CLOSED exact explanation mismatch {pid} {aid}: {None if a is None else a.get("explanation")!r}')
            qid=a['question_id']; q=next(q for q in r['questions'] if q['id']==qid)
            a['explanation']=new
            evidence.append({'passage_id':pid,'question_id':qid,'answer_id':aid,'prompt':q['prompt'],'answer':a['answer'],'before_explanation':old,'after_explanation':new})

          corpus.write_text('\n'.join(json.dumps(r,ensure_ascii=False,separators=(',',':')) for r in rows)+'\n',encoding='utf-8')
          after=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if after==before: raise SystemExit('FAIL CLOSED repair produced no corpus change')

          # Full cheap deterministic revalidation for the fields affected by answer-explanation edits plus core structural guards.
          if len(rows)!=60: raise SystemExit('FAIL 60 passages')
          if [r['sequence'] for r in rows]!=list(range(1,61)): raise SystemExit('FAIL sequence')
          if sum(len(r.get('questions',[])) for r in rows)!=600 or sum(len(r.get('answer_key',[])) for r in rows)!=600: raise SystemExit('FAIL 600Q/600A')
          for r in rows:
            if len(r['questions'])!=10 or len(r['answer_key'])!=10: raise SystemExit(f'FAIL 10Q/10A {r["id"]}')
            ans={a['id']:a for a in r['answer_key']}
            qids={q['id'] for q in r['questions']}
            if len(qids)!=10 or len(ans)!=10: raise SystemExit(f'FAIL duplicate IDs {r["id"]}')
            for q in r['questions']:
              if q.get('answer_id') not in ans or ans[q['answer_id']].get('question_id')!=q['id']:
                raise SystemExit(f'FAIL Q/A link {r["id"]} {q["id"]}')
          patterns=[re.compile(r'یہ\s+سوال|سوال\s+.*جانچ'),re.compile(r'نحو|نحوی|گرامر|صرفی|لسانی\s+اصطلاح|اصطلاح'),re.compile(r'جانچتا\s+ہے|جانچتی\s+ہے|آزماتا\s+ہے|ٹیسٹ'),re.compile(r'\b(?:question|answer|target|audit|review|grammar|pedagog|schema|generated|generation)\b',re.I)]
          hygiene=[]; roman=[]
          for r in rows:
            fields=[('title',r.get('title','')),('text',r.get('text',''))]
            fields += [(f'question:{q["id"]}',q.get('prompt','')) for q in r['questions']]
            fields += [(f'answer:{a["id"]}',a.get('answer','')) for a in r['answer_key']]
            fields += [(f'explanation:{a["id"]}',a.get('explanation','')) for a in r['answer_key']]
            for field,text in fields:
              text=str(text or '')
              if field.startswith('explanation:') and any(p.search(text) for p in patterns): hygiene.append((r['id'],field,text))
              if re.search(r'[A-Za-z]',text): roman.append((r['id'],field,text))
          if hygiene: raise SystemExit(f'FAIL residual internal-review leakage {hygiene[:10]}')
          if roman: raise SystemExit(f'FAIL learner-facing Roman script {roman[:10]}')

          rep={
            'schema_version':1,'date':'2026-08-23','language':'ur','level':'A1',
            'repair_kind':'learner_facing_answer_explanation_hygiene',
            'before_sha256':before,'after_sha256':after,'repair_count':len(evidence),'repairs':evidence,
            'preservation':{
              'passage_prose_unchanged':True,'titles_unchanged':True,'question_prompts_types_targets_unchanged':True,
              'answer_texts_unchanged':True,'lexical_target_declarations_unchanged':True,'review_schedules_unchanged':True
            },
            'verification':{'passages':60,'questions':600,'answers':600,'qa_linkage_valid':True,'learner_explanation_internal_review_leakage_zero':True,'learner_facing_roman_script_zero':True},
            'status':'PASS_BOUNDED_EXPLANATION_HYGIENE_REPAIR_NEEDS_INDEPENDENT_REVIEW',
            'release_effect':'NONE_AUTOMATIC: independent Urdu semantic/native/educator review remains pending.'
          }
          Path('reading/audit/urdu_a1_learner_explanation_hygiene_repair_2026-08-23.json').write_text(json.dumps(rep,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          final={
            'audit':'urdu_a1_final_deterministic_audit',
            'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'status':'PASS_DETERMINISTIC_POST_EXPLANATION_HYGIENE_NEEDS_INDEPENDENT_REVIEW',
            'scope':'Fresh deterministic audit after bounded learner-facing answer-explanation hygiene repair; no native-speaker, independent-model, educator, or release approval.',
            'source':{'path':'reading/urdu/a1/passages.jsonl','actual_sha256':after,'hash_bound':True,'prior_sha256':before,'repair_evidence':'reading/audit/urdu_a1_learner_explanation_hygiene_repair_2026-08-23.json'},
            'counts':{'passages':60,'questions':600,'answers':600,'units':10,'formal_task_types':0,'learner_facing_roman_script_findings':0,'learner_explanation_internal_review_leakage_findings':0,'violations':0},
            'checks':{'passage_count_exact_60':True,'sequences_contiguous_1_60':True,'ten_questions_answers_and_linkage':True,'learner_facing_roman_script_zero':True,'learner_explanation_internal_review_leakage_zero':True},
            'violations':[],
            'review_frontier':{'internal_units01_02_semantic_qa_pedagogy':'COMPLETE_INTERNAL_WITH_EXPLANATION_HYGIENE_REPAIR','metalinguistic_class_corpus_wide':'ADJUDICATED_INTERNAL','units03_10_full_semantic_naturalness_answer_pedagogy':'PENDING_INTERNAL','native_urdu_naturalness_orthography':'PENDING','independent_model_family':'PENDING','educator_cefr':'PENDING','blind_postrepair':'PENDING'},
            'release_effect':'NONE_AUTOMATIC: Urdu A1 remains non-release-ready.'
          }
          Path('reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json').write_text(json.dumps(final,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'after_sha256':after,'repair_count':len(evidence),'status':final['status']},ensure_ascii=False))
          PY
      - name: Commit repair evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/audit/urdu_a1_learner_explanation_hygiene_repair_2026-08-23.json reading/audit/urdu_a1_final_deterministic_audit_2026-08-22.json
          git rm -f .github/workflows/urdu-a1-explanation-hygiene-repair-temp.yml
          git commit -m 'Repair Urdu A1 learner explanation hygiene [skip ci]'
          git push origin HEAD:audit/urdu-a1-final-deterministic-2026-08-22
