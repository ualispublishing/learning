name: Repair Arabic A2 metalinguistic items v2

on:
  push:
    paths:
      - '.github/workflows/repair-arabic-a2-metalinguistic-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory-current:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed or repair PROJECT_TRACKS manifest bookkeeping only
        shell: bash
        run: |
          set +e
          output="$(python reading/tools/validate_continuation_state.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            python - "$output" <<'PY'
          import sys
          output=sys.argv[1]
          errors=[line[2:] for line in output.splitlines() if line.startswith('- ')]
          allowed=(
            'STATE_MANIFEST blob drift: PROJECT_TRACKS.json:',
            'STATE_MANIFEST byte-size drift: PROJECT_TRACKS.json:',
            'STATE_MANIFEST state_file_bytes mismatch',
            'STATE_MANIFEST aggregate_sha256 mismatch',
          )
          unexpected=[e for e in errors if not any(e.startswith(p) for p in allowed)]
          if not errors or unexpected or not any(e.startswith('STATE_MANIFEST blob drift: PROJECT_TRACKS.json:') for e in errors):
              raise SystemExit(f'Unexpected state drift; refusing audit: {unexpected or errors}')
          print('Only PROJECT_TRACKS manifest bookkeeping drift detected; bounded refresh allowed.')
          PY
            python reading/tools/refresh_state_manifest.py
            python reading/tools/validate_continuation_state.py
          fi

      - name: Refresh current triage artifacts
        run: |
          python reading/tools/audit_arabic_metalinguistic_cefr_candidates.py
          python reading/tools/adjudicate_arabic_b1_c2_metalinguistic_cefr.py
          python reading/tools/extract_arabic_b1_c2_manual_review_queue.py
          python reading/tools/extract_arabic_c2_manual_review_item.py

      - name: Commit read-only audit evidence and any bounded manifest refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/arabic_metalinguistic_cefr_candidate_inventory_2026-08-30.json \
                  reading/audit/arabic_b1_c2_metalinguistic_cefr_triage_2026-08-30.json \
                  reading/audit/arabic_b1_c2_metalinguistic_manual_queue_2026-08-30.json \
                  reading/audit/arabic_c2_metalinguistic_manual_item_2026-08-30.json
          if ! git diff --quiet -- reading/STATE_MANIFEST.json; then git add reading/STATE_MANIFEST.json; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Record lone Arabic C2 metalinguistic review item'
          git fetch origin main
          git rebase origin/main
          python reading/tools/validate_continuation_state.py
          git push origin HEAD:main

  manual-a2-reproduction:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce current structural gates only
        run: |
          python reading/tools/validate_continuation_state.py
          python reading/tools/run_post_generation_gate0.py
          python reading/tools/run_arabic_fresh_deterministic_revalidation.py
