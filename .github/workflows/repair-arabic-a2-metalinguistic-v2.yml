name: Repair Arabic A2 metalinguistic items v2

on:
  push:
    paths:
      - '.github/workflows/repair-arabic-a2-metalinguistic-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arabic-gate-b-naturalness-start:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed or repair PROJECT_TRACKS manifest bookkeeping only
        shell: bash
        run: |
          set +e
          output="$(python reading/tools/validate_continuation_state.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            python - "$output" <<'PY'
          import sys
          errors=[line[2:] for line in sys.argv[1].splitlines() if line.startswith('- ')]
          allowed=(
            'STATE_MANIFEST blob drift: PROJECT_TRACKS.json:',
            'STATE_MANIFEST byte-size drift: PROJECT_TRACKS.json:',
            'STATE_MANIFEST state_file_bytes mismatch',
            'STATE_MANIFEST aggregate_sha256 mismatch',
          )
          unexpected=[e for e in errors if not any(e.startswith(p) for p in allowed)]
          if not errors or unexpected or not any(e.startswith('STATE_MANIFEST blob drift: PROJECT_TRACKS.json:') for e in errors):
              raise SystemExit(f'Unexpected routed-state drift; refusing Gate B start: {unexpected or errors}')
          print('Only PROJECT_TRACKS manifest bookkeeping drift detected; bounded refresh allowed.')
          PY
            python reading/tools/refresh_state_manifest.py
            python reading/tools/validate_continuation_state.py
          fi

      - name: Remove stale closed metalinguistic blocker
        run: python reading/tools/close_stale_arabic_metalinguistic_blocker.py

      - name: Build exact-current Arabic Gate B review inventory and packets
        run: python reading/tools/build_arabic_gate_b_naturalness_review.py

      - name: Mark Gate B internal review in progress without quality promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rp=Path('reading/RELEASE_STATUS.json')
          ap=Path('reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json')
          d=json.loads(rp.read_text(encoding='utf-8')); a=json.loads(ap.read_text(encoding='utf-8')); ar=d['languages']['arabic']
          if ar['release_state']!='REOPEN_REQUIRED' or ar['educator_release_ready'] is not False:
              raise SystemExit('Arabic release state changed unexpectedly')
          if a['status']!='IN_PROGRESS' or a['records']!=360 or a['questions']!=3600 or a['answers']!=3600 or a['release_claim'] is not False:
              raise SystemExit('Gate B packet inventory contract failed')
          ar['naturalness_review_progress']={
            'status':'FRESH_GATE_B_INTERNAL_REVIEW_IN_PROGRESS',
            'records_in_scope':360,
            'questions_in_scope':3600,
            'answers_in_scope':3600,
            'fresh_records_reviewed':0,
            'fresh_records_with_findings':0,
            'fresh_findings':0,
            'current_inventory':'reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json',
            'review_order':['A1','A2','B1','B2','C1','C2'],
            'guard':'Historical naturalness notes are context only; fresh review must bind every decision to current learner-facing hashes.'
          }
          evidence=ar.get('latest_release_evidence',[])
          if isinstance(evidence,str): evidence=[evidence]
          artifact='reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json'
          if artifact not in evidence: evidence.append(artifact)
          ar['latest_release_evidence']=evidence
          d['updated']='2026-08-30'
          rp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Refresh manifest last and validate
        run: |
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py

      - name: Commit Gate B start evidence safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/RELEASE_STATUS.json reading/STATE_MANIFEST.json \
            reading/audit/arabic_gate_b_naturalness_inventory_2026-08-30.json \
            reading/audit/arabic_gate_b_packets_2026-08-30/a1.jsonl \
            reading/audit/arabic_gate_b_packets_2026-08-30/a2.jsonl \
            reading/audit/arabic_gate_b_packets_2026-08-30/b1.jsonl \
            reading/audit/arabic_gate_b_packets_2026-08-30/b2.jsonl \
            reading/audit/arabic_gate_b_packets_2026-08-30/c1.jsonl \
            reading/audit/arabic_gate_b_packets_2026-08-30/c2.jsonl
          git commit -m 'Start fresh Arabic Gate B naturalness review'
          git fetch origin main
          git rebase origin/main
          set +e
          output="$(python reading/tools/validate_continuation_state.py 2>&1)"; rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            python - "$output" <<'PY'
          import sys
          errors=[line[2:] for line in sys.argv[1].splitlines() if line.startswith('- ')]
          allowed=('STATE_MANIFEST blob drift: PROJECT_TRACKS.json:','STATE_MANIFEST byte-size drift: PROJECT_TRACKS.json:','STATE_MANIFEST state_file_bytes mismatch','STATE_MANIFEST aggregate_sha256 mismatch')
          unexpected=[e for e in errors if not any(e.startswith(p) for p in allowed)]
          if not errors or unexpected or not any(e.startswith('STATE_MANIFEST blob drift: PROJECT_TRACKS.json:') for e in errors):
              raise SystemExit(f'Post-rebase state drift is not bounded PROJECT_TRACKS-only drift: {unexpected or errors}')
          PY
            python reading/tools/refresh_state_manifest.py
            git add reading/STATE_MANIFEST.json
            git commit --amend --no-edit
          fi
          python reading/tools/validate_continuation_state.py
          git push origin HEAD:main

  manual-structural-reproduction:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python reading/tools/validate_continuation_state.py
          python reading/tools/run_post_generation_gate0.py
          python reading/tools/run_arabic_fresh_deterministic_revalidation.py
