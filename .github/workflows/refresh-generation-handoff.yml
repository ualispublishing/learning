name: Refresh generation handoff
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-generation-handoff.yml'
      - 'reading/tools/update_generation_status.py'
      - 'reading/tools/extract_active_generation_plan.py'
permissions:
  contents: write
concurrency:
  group: generation-handoff-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Derive canonical generation status
        run: python reading/tools/update_generation_status.py
      - name: Derive active roadmap from refreshed status
        run: python reading/tools/extract_active_generation_plan.py
      - name: Commit synchronized handoff artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/STATUS.json reading/planning/ACTIVE_GENERATION_PLAN.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh reading generation handoff [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
# Refresh marker: C1 generation complete.
