name: French A1-A2 metalinguistic inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'reading/audit/french_a1_a2_metalinguistic_trigger.txt'

permissions:
  contents: write

jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Build candidate inventory
        run: python reading/tools/audit_french_lowlevel_metalinguistic.py
      - name: Commit inventory to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reading/audit/french_a1_a2_metalinguistic_inventory_2026-08-19.json
          git diff --cached --quiet && exit 0
          git commit -m 'Inventory French A1-A2 metalinguistic candidates'
          git push origin HEAD:${{ github.head_ref }}
