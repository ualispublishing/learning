name: Deploy SecurityX study site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'subjects/securityx/cas-005/study-site/**'
      - '.github/workflows/deploy-securityx-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: subjects/securityx/cas-005/study-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
