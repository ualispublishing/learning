name: Extract Arabic common-word source

on:
  push:
    paths:
      - '.github/workflows/extract-arabic-common-list.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official embedded PDF URL
        run: |
          curl --http1.1 -k -L --fail --retry 5 --retry-all-errors \
            'https://revistaseug.ugr.es/index.php/meaharabe/article/view/23634/25105' \
            -o /tmp/view.html
          echo '=== EMBEDDED URL CANDIDATES ==='
          python - <<'PY'
          import html, re
          t=open('/tmp/view.html',encoding='utf-8',errors='ignore').read()
          print(t)
          print('\n=== URLS ===')
          for u in re.findall(r'(?:href|src|data)=["\']([^"\']+)', t, re.I):
              print(html.unescape(u))
          PY
