name: Extract Arabic common-word source

on:
  push:
    paths:
      - '.github/workflows/extract-arabic-common-list.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve journal PDF and inspect CC BY source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          curl --http1.1 -L --fail --retry 5 --retry-all-errors \
            'https://revistaseug.ugr.es/index.php/meaharabe/article/view/23634' \
            -o /tmp/article.html
          echo '=== PDF LINKS ==='
          grep -Eo 'https?[^" ]+|/index.php/meaharabe/article/(download|view)/23634/[^" ]+' /tmp/article.html | grep -Ei '23634|pdf' | head -n 40 || true
          python - <<'PY'
          import re, html
          t=open('/tmp/article.html',encoding='utf-8',errors='ignore').read()
          for m in re.findall(r'href="([^"]+)"', t):
              u=html.unescape(m)
              if '23634' in u and ('download' in u or '/view/' in u): print(u)
          PY
