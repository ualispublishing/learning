name: Extract Arabic common-word source

on:
  push:
    paths:
      - '.github/workflows/extract-arabic-common-list.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect CC BY 4.0 article list
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          # The UGR journal currently presents an incomplete CA chain to this runner;
          # use the exact official journal PDF endpoint discovered from its article metadata.
          curl --http1.1 -k -L --fail --retry 5 --retry-all-errors \
            'https://revistaseug.ugr.es/index.php/meaharabe/article/view/23634/25105' \
            -o /tmp/al_said_2023.pdf
          pdfinfo /tmp/al_said_2023.pdf | head -n 25
          pdftotext -layout /tmp/al_said_2023.pdf /tmp/al_said_2023.txt
          echo '=== TEXT LINE COUNT ==='
          wc -l /tmp/al_said_2023.txt
          echo '=== LAST 2200 LINES (LIST SECTION) ==='
          tail -n 2200 /tmp/al_said_2023.txt
