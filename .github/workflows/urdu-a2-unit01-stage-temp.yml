name: TEMP Urdu A2 Unit 01 staging

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/urdu-a2-unit01-stage-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-urdu-a2-unit01-stage
  cancel-in-progress: false

jobs:
  stage:
    if: github.event.pull_request.head.ref == 'plan/urdu-a2-unit01-2026-08-23'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/urdu-a2-unit01-2026-08-23
      - name: Generate and validate staged Unit 01
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import json,hashlib,re,unicodedata

          A1=Path('reading/urdu/a1/passages.jsonl')
          LEX=Path('reading/lexicons/urdu.jsonl')
          FRONT=Path('reading/audit/urdu_a2_unit01_target_frontier_2026-08-23.json')
          a1_sha=hashlib.sha256(A1.read_bytes()).hexdigest()
          frontier=json.loads(FRONT.read_text(encoding='utf-8'))
          if frontier['a1_frontier']['sha256']!=a1_sha: raise SystemExit('FAIL CLOSED A1 frontier drift')
          a1=[json.loads(x) for x in A1.read_text(encoding='utf-8').splitlines() if x.strip()]
          lex={x['id']:x for x in (json.loads(line) for line in LEX.read_text(encoding='utf-8').splitlines() if line.strip())}
          used_ids={t['id'] for r in a1 for k in ('new_lexical_targets','review_lexical_targets') for t in r.get(k,[]) if t.get('id')}
          a1_by_form={t['form']:t for r in a1 for t in r.get('new_lexical_targets',[]) if t.get('form')}

          selected=[
            ('ur-rank-0506','خدمت'),('ur-rank-0596','دفتر'),('ur-rank-0560','رابطہ'),('ur-rank-0572','محکمہ'),
            ('ur-rank-0656','تفصیلات'),('ur-rank-0738','مرکز'),('ur-rank-0687','اسپتال'),('ur-rank-0575','مریض'),
            ('ur-rank-0901','اطلاع'),('ur-rank-0754','راستہ')
          ]
          for tid,form in selected:
            x=lex.get(tid)
            if not x or x.get('form')!=form or x.get('planning_band')!='A2_core_candidate' or tid in used_ids:
              raise SystemExit(f'FAIL CLOSED invalid selected target {tid} {form}')

          def toks(s):
            out=[];cur=[]
            for ch in str(s or ''):
              cat=unicodedata.category(ch)
              if cat.startswith('L') or cat.startswith('M'): cur.append(ch)
              else:
                if cur: out.append(''.join(cur));cur=[]
            if cur: out.append(''.join(cur))
            return out
          def count(text,form):
            tt=toks(text); ft=toks(form); n=len(ft)
            return sum(1 for i in range(len(tt)-n+1) if tt[i:i+n]==ft) if n else 0
          def target_obj(tid,text):
            x=lex[tid]; form=x['form']; c=count(text,form)
            if c<1: raise SystemExit(f'FAIL target invisible {tid} {form}')
            return {
              'id':tid,'form':form,'lemma':form,'source_rank':x['rank'],'source_lexicon':x['source_file'],
              'intended_sense':x.get('meaning_en_source'),'part_of_speech':x.get('part_of_speech_source'),
              'register':'contemporary standard','variety':'contemporary standard Urdu','first_introduced':True,
              'beyond_base':False,'context_strategy':['scenario_resolution'],'exposures_in_text':c
            }
          def review_obj(form,stage,text):
            t=a1_by_form.get(form)
            if not t: raise SystemExit(f'FAIL missing A1 review form {form}')
            if count(text,form)<1: raise SystemExit(f'FAIL invisible A1 review {form}')
            return {'id':t['id'],'form':form,'representation':'running_text','review_stage':stage,'expected_exposure_number':None}
          def qa(prompts,answers,types,targets):
            return ([{'id':f'q{i+1}','answer_id':f'a{i+1}','prompt':prompts[i],'type':types[i],**({'target_ids':targets[i]} if targets[i] else {})} for i in range(10)],
                    [{'id':f'a{i+1}','question_id':f'q{i+1}','answer':answers[i],'explanation':''} for i in range(10)])

          specs=[]
          def add(title,text,ptype,genre,newids,bridge,topics,prompts,answers,types,qtargets,grammar,discourse):
            specs.append(dict(title=title,text=text,ptype=ptype,genre=genre,newids=newids,bridge=bridge,topics=topics,prompts=prompts,answers=answers,types=types,qtargets=qtargets,grammar=grammar,discourse=discourse))

          add('محلے کا نیا دفتر',
