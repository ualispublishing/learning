name: Apply language row approvals

on:
  push:
    branches: [main]
    paths:
      - 'curation/language-workbooks/v1.0/approvals/**'
      - 'scripts/apply_sentence_row_approvals_v1.py'
      - '.github/workflows/apply-language-row-approvals.yml'

permissions:
  contents: write

jobs:
  apply-row-approvals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile and commit audited row approvals
        shell: bash
        run: |
          set -euo pipefail
          # Re-read main on every attempt so approval commits racing with other agents are not lost.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Reconciliation attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            python scripts/apply_sentence_row_approvals_v1.py
            git add curation/language-workbooks/v1.0/*_sentence_row_decisions.json
            git add curation/language-workbooks/v1.0/sentence_row_decision_summary.json

            if git diff --cached --quiet; then
              echo 'No row-decision changes to commit.'
              exit 0
            fi

            git commit -m 'Apply audited sentence row approvals'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo 'Push raced with another main update; recomputing from latest main.'
          done

          echo 'Failed to publish reconciled row approvals after 3 attempts.' >&2
          exit 1
