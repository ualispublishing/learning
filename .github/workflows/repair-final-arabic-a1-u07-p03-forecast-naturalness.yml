name: Repair final Arabic A1 U07 P03 forecast naturalness
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/repair_final_arabic_a1_u07_p03_forecast_naturalness.py'
      - '.github/workflows/repair-final-arabic-a1-u07-p03-forecast-naturalness.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/repair_final_arabic_a1_u07_p03_forecast_naturalness.py
      - name: Commit naturalness repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a1/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair A1 forecast naturalness [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
