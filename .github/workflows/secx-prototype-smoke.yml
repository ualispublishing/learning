name: SecX Prototype Smoke

on:
  push:
    branches:
      - secx-web-prototype-20260901
    paths:
      - 'subjects/cissp/2024-outline/secx-prototype/**'
      - 'subjects/cissp/2024-outline/study-site/**'
      - '.github/workflows/secx-prototype-smoke.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'subjects/cissp/2024-outline/secx-prototype/**'
      - 'subjects/cissp/2024-outline/study-site/**'
      - '.github/workflows/secx-prototype-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secx-prototype-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4

      - name: Report exact head and browser
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)

      - name: CISSP deterministic release audit
        shell: bash
        run: python subjects/cissp/2024-outline/study-site/audit.py

      - name: SecX deterministic graph, learner-state, provenance, coverage, and relationship audits
        shell: bash
        run: |
          python -m py_compile \
            subjects/cissp/2024-outline/secx-prototype/audit.py \
            subjects/cissp/2024-outline/secx-prototype/due-audit.py \
            subjects/cissp/2024-outline/secx-prototype/study-audit.py \
            subjects/cissp/2024-outline/secx-prototype/source-audit.py \
            subjects/cissp/2024-outline/secx-prototype/coverage-audit.py \
            subjects/cissp/2024-outline/secx-prototype/relationship-audit.py
          node --check subjects/cissp/2024-outline/secx-prototype/learner-registry.js
          node --check subjects/cissp/2024-outline/secx-prototype/next-layer.js
          node --check subjects/cissp/2024-outline/secx-prototype/learner-state.js
          node --check subjects/cissp/2024-outline/secx-prototype/due-review.js
          node --check subjects/cissp/2024-outline/secx-prototype/study-lens.js
          node --check subjects/cissp/2024-outline/secx-prototype/source-lens.js
          node --check subjects/cissp/2024-outline/secx-prototype/coverage-lens.js
          bash -n subjects/cissp/2024-outline/secx-prototype/browser-smoke.sh
          bash -n subjects/cissp/2024-outline/secx-prototype/source-browser-smoke.sh
          bash -n subjects/cissp/2024-outline/secx-prototype/coverage-browser-smoke.sh
          python subjects/cissp/2024-outline/secx-prototype/audit.py
          python subjects/cissp/2024-outline/secx-prototype/due-audit.py
          python subjects/cissp/2024-outline/secx-prototype/study-audit.py
          python subjects/cissp/2024-outline/secx-prototype/source-audit.py
          python subjects/cissp/2024-outline/secx-prototype/coverage-audit.py
          python subjects/cissp/2024-outline/secx-prototype/relationship-audit.py

      - name: Preserve production CISSP browser smoke
        shell: bash
        working-directory: subjects/cissp/2024-outline/study-site
        run: bash browser-smoke.sh 8766

      - name: SecX expanded browser smoke
        shell: bash
        working-directory: subjects/cissp/2024-outline/secx-prototype
        run: bash browser-smoke.sh 8776

      - name: SecX source provenance browser smoke
        shell: bash
        working-directory: subjects/cissp/2024-outline/secx-prototype
        run: bash source-browser-smoke.sh 8786

      - name: SecX explicit coverage browser smoke
        shell: bash
        working-directory: subjects/cissp/2024-outline/secx-prototype
        run: bash coverage-browser-smoke.sh 8796
