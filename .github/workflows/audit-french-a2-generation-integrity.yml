name: Audit French A2 Generation Integrity
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/audit_french_a2_generation_integrity.py'
      - '.github/workflows/audit-french-a2-generation-integrity.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --quiet jsonschema
      - name: Run A2 generation integrity audit
        run: python reading/tools/audit_french_a2_generation_integrity.py
      - name: Verify PASS artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reading/audit/french_a2_generation_integrity.json')
          a=json.loads(p.read_text(encoding='utf-8'))
          assert a['status']=='PASS'
          assert a['passages']==60 and a['questions']==600 and a['answers']==600
          assert a['new_targets']==100 and a['unique_new_target_ids']==100 and a['unique_new_target_forms']==100
          assert a['a1_cross_level_target_id_collisions']==0 and a['a1_cross_level_target_form_collisions']==0
          assert not a['failures']
          assert all(v['passages']==6 and v['new_targets']==10 and v['checkpoint_zero_new'] for v in a['units'].values())
          print({'status':'PASS','artifact':str(p)})
          PY
      - name: Commit A2 integrity artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_a2_generation_integrity.json
          if git diff --cached --quiet; then
            echo 'No audit changes to commit'
            exit 0
          fi
          git commit -m 'Audit French A2 generation integrity [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
