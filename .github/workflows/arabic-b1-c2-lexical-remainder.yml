name: Arabic B1-C2 lexical remainder summary

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'reading/tools/summarize_arabic_b1_c2_lexical_remainder.py'
      - '.github/workflows/arabic-b1-c2-lexical-remainder.yml'

permissions:
  contents: write

jobs:
  summarize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/summarize_arabic_b1_c2_lexical_remainder.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/audit/arabic_b1_c2_lexical_remainder_summary_2026-08-23.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Summarize Arabic B1-C2 lexical remainder [skip ci]"
          git fetch origin audit/arabic-b1-c2-final-2026-08-23
          git rebase origin/audit/arabic-b1-c2-final-2026-08-23
          git push origin HEAD:audit/arabic-b1-c2-final-2026-08-23
