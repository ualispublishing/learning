name: Publish inspected language workbooks v1 artifact

on:
  push:
    branches:
      - release/language-workbooks-v1-final
    paths:
      - '.github/workflows/publish-language-workbooks-v1-artifact.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/language-workbooks-v1-final

      - name: Download inspected authoritative artifact
        uses: actions/download-artifact@v4
        with:
          name: language-workbooks-v1.0-quality
          path: /tmp/verified
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ualispublishing/learning
          run-id: 32793395397

      - name: Revalidate exact artifact before publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/verified')
          gate = json.loads((root / 'audit/language-workbooks/v1.0/release_gate_v3.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'completed/languages/workbooks/v1.0/RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          expected = 'abe0a42afc92073505c8ef6f847ca3d7fe5657e86ea58a7d53c5454dde0f1035'
          pdfs = list((root / 'completed/languages/workbooks/v1.0').glob('*/*.pdf'))

          assert gate.get('gate') == 'PASS', gate
          assert gate.get('pdf_count') == 42, gate
          assert gate.get('pronunciation_gate') == 'PASS', gate
          assert gate.get('pronunciation_guide_sha256') == expected, gate
          assert manifest.get('status') == 'production_candidate', manifest
          pron = manifest.get('pronunciation_foundations', {})
          assert pron.get('status') == 'PASS', pron
          assert pron.get('guide_sha256') == expected, pron
          assert pron.get('references_rendered') is True, pron
          assert len(pdfs) == 42, len(pdfs)
          print('Authoritative artifact revalidated: 42 PDFs; release and pronunciation gates PASS.')
          PY

      - name: Publish inspected bytes
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete /tmp/verified/completed/languages/workbooks/v1.0/ completed/languages/workbooks/v1.0/
          rsync -a /tmp/verified/audit/language-workbooks/v1.0/ audit/language-workbooks/v1.0/
          cp /tmp/verified/arabic_top1000.csv ./arabic_top1000.csv
          cp /tmp/verified/french_top1000.csv ./french_top1000.csv
          cp /tmp/verified/urdu_top1000.csv ./urdu_top1000.csv

          # Recreate the tracked live attestation from the exact repaired decks.
          python scripts/attest_live_csvs.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf scripts/__pycache__
          git add completed/languages/workbooks/v1.0 audit/language-workbooks/v1.0 audit/live_csv_attestation.json \
            arabic_top1000.csv french_top1000.csv urdu_top1000.csv
          git commit -m 'release: publish inspected language workbooks v1.0 candidate'
          git push origin HEAD:release/language-workbooks-v1-final
