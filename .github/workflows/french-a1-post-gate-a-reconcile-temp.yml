name: TEMP French A1 post Gate A reconcile

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/french-a1-post-gate-a-reconcile-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-french-a1-post-gate-a-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'repair/french-a1-review-integrity-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
          fetch-depth: 0
      - name: Sync current main and verify A1 content identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('reading/french/a1/passages.jsonl')
          want='fe9f321ada5740baf264c009ce0b5eb845777927f37f99f03e7459c5ae72b64c'
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          if got!=want: raise SystemExit(f'FAIL CLOSED before main sync: {got} != {want}')
          PY
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('reading/french/a1/passages.jsonl')
          want='fe9f321ada5740baf264c009ce0b5eb845777927f37f99f03e7459c5ae72b64c'
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          if got!=want: raise SystemExit(f'FAIL CLOSED after main sync: {got} != {want}')
          PY
      - name: Reconcile durable status and checkpoint evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, subprocess

          corpus=Path('reading/french/a1/passages.jsonl')
          want='fe9f321ada5740baf264c009ce0b5eb845777927f37f99f03e7459c5ae72b64c'
          got=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if got!=want: raise SystemExit(f'FAIL CLOSED corpus drift {got} != {want}')
          blob=subprocess.check_output(['git','hash-object',str(corpus)],text=True).strip()
          if blob!='300d5f024d27ca095187793a4bb9520508dcb690': raise SystemExit(f'FAIL CLOSED blob drift {blob}')
          gatep=Path('reading/audit/french_a1_formal_gate_a_2026-08-22.json')
          gate=json.loads(gatep.read_text(encoding='utf-8'))
          if gate.get('status')!='PASS_DETERMINISTIC_FORMAL_GATE_A_NEEDS_LATER_RELEASE_GATES' or gate.get('bound_sha256')!=want or gate.get('blocker_count')!=0:
              raise SystemExit('FAIL CLOSED: formal Gate A evidence is not current PASS')

          sp=Path('reading/STATUS.json')
          s=json.loads(sp.read_text(encoding='utf-8'))
          fr=s['french']; a1=fr['a1_completion']
          fr['state']='REOPEN_REQUIRED'
          fr['formal_final_approval']=False
          a1['state']='STRUCTURAL_PASS_FORMAL_GATE_A_NEEDS_LATER_RELEASE_GATES'
          a1['canonical_blob']=blob
          a1['canonical_sha256']=want
          a1['generation_integrity']='PASS_CURRENT_CORPUS'
          a1['generation_integrity_artifact']='reading/audit/french_a1_generation_integrity.json'
          a1['formal_protocol_gate_a_status']='PASS'
          a1['formal_protocol_gate_a_artifact']='reading/audit/french_a1_formal_gate_a_2026-08-22.json'
          a1['formal_protocol_gate_a_blockers']=0
          a1['independent_review_status']='PENDING'
          a1['legacy_release_evidence_scan_status']='HISTORICAL_FAIL_REVIEW_EVIDENCE_INCOMPLETE_NOT_CURRENT_HASH'
          a1['legacy_release_evidence_scan_artifact']='reading/audit/french_current_deterministic_gate_a_2026-08-22.json'
          a1['legacy_release_evidence_scan_open_findings_at_old_hash']=2160
          a1.pop('highest_assurance_gate_a_status',None)
          a1.pop('highest_assurance_gate_a_artifact',None)
          s['phase']='French A1 formal protocol Gate A passes deterministic integrity on the current corpus; French remains REOPEN_REQUIRED while mandatory internal completeness and independent machine/model/native/educator/blind release gates remain pending. Urdu continues under its separate generation/final-review evidence.'
          sp.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          cp=Path('reading/audit/french_a1_gate_a_revalidation_checkpoint_2026-08-22.json')
          c=json.loads(cp.read_text(encoding='utf-8'))
          c['bound_sha256']=want
          c['bound_git_blob']=blob
          c['status']='FORMAL_PROTOCOL_GATE_A_PASS_LATER_RELEASE_GATES_PENDING'
          c['current_durable_evidence']['current_a1_generation_integrity']='reading/audit/french_a1_generation_integrity.json'
          c['current_durable_evidence']['final_bounded_repairs']='reading/audit/french_a1_units06_10_final_bounded_repairs_2026-08-22.json'
          c['current_durable_evidence']['units05_10_internal_review']='reading/audit/french_a1_units05_10_internal_semantic_qa_review_2026-08-22.json'
          c['current_durable_evidence']['formal_protocol_gate_a']='reading/audit/french_a1_formal_gate_a_2026-08-22.json'
          c['freshness_findings']['current_a1_generation_integrity_matches_current_corpus']=True
          c['freshness_findings']['formal_protocol_gate_a_matches_current_corpus']=True
          c['freshness_findings']['formal_protocol_gate_a_status']='PASS'
          c['freshness_findings']['legacy_release_evidence_scan_hash_matches_current_corpus']=False
          c['freshness_findings']['prior_final_approval_may_be_relied_on_for_current_corpus']=False
          c['freshness_findings'].pop('highest_assurance_release_gate_a_matches_current_corpus',None)
          c['freshness_findings'].pop('highest_assurance_release_gate_a_status',None)
          c['completed_current_corpus_deterministic_revalidation']=[
            'French A1 strict generation/source/sense/exposure integrity: PASS on the current 60-passage corpus.',
            'All confirmed internal-review bounded repairs through Units 01-10 were applied and revalidated fail-closed.',
            'Formal protocol Gate A under EDUCATOR_RELEASE_VERIFICATION_PROTOCOL.md §3: PASS with 0 blockers on 60 passages / 600 questions / 600 answers and 182 review-target checks.',
            'The prior draft Gate A punctuation failure was a validator false positive caused by multiple-choice labels A)/B)/C); the corrected validator passed without a corpus change for that issue.'
          ]
          c['remaining_release_work']=[
            'Complete and reconcile fresh internal linguistic/Q&A coverage for 100% of learner-facing A1 fields under the highest-assurance profile; internal model review is not independent approval.',
            'Run required independent French machine/tool scans across supported learner-facing text (target stack: LanguageTool, Antidote, DeepL Write) and adjudicate every finding.',
            'Run required independent model-family audit across 100% of A1 learner-facing records; missing independent families remain release blockers.',
            'Obtain native-professional French review of 100% of learner-facing fields and resolve all findings.',
            'Obtain educator/curriculum review of all passages and all question/answer sets, including CEFR A1 alignment.',
            'After repairs, freeze the corpus and complete the blind post-repair human review, rerun affected gates, and only then issue hash-bound release evidence.'
          ]
          c['limitations']='Formal protocol Gate A now passes deterministic integrity on the current A1 hash. This is not independent machine, model-family, native-professional, educator, or blind-review approval. The older 2160-item release-evidence scan was bound to an earlier A1 hash and represented draft/pending evidence fields rather than 2160 distinct prose defects; it is retained only as historical evidence.'
          c['release_effect']='French remains REOPEN_REQUIRED. Formal Gate A PASS advances A1 to STRUCTURAL_PASS only; no educator/public release claim is permitted until all mandatory later gates pass against the same then-current hashes.'
          c['current_formal_protocol_gate_a_open_findings']=0
          c['historical_release_evidence_scan_open_findings']=2160
          c.pop('current_highest_assurance_gate_a_open_findings',None)
          cp.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          frontier={
            'schema_version':1,
            'date':'2026-08-22',
            'language':'fr',
            'level':'A1',
            'evidence_kind':'post_formal_gate_a_release_frontier',
            'bound_sha256':want,
            'bound_git_blob':blob,
            'formal_gate_a':{'status':'PASS','artifact':'reading/audit/french_a1_formal_gate_a_2026-08-22.json','blockers':0},
            'generation_integrity':{'status':'PASS','artifact':'reading/audit/french_a1_generation_integrity.json'},
            'internal_review_evidence':[
              'reading/audit/french_a1_unit01_internal_semantic_qa_review_2026-08-22.json',
              'reading/audit/french_a1_unit01_wording_postrepair_2026-08-22.json',
              'reading/audit/french_a1_unit02_semantic_qa_postrepair_2026-08-22.json',
              'reading/audit/french_a1_unit03_internal_semantic_qa_review_2026-08-22.json',
              'reading/audit/french_a1_unit04_internal_semantic_qa_review_2026-08-22.json',
              'reading/audit/french_a1_unit04_bounded_repair_2026-08-22.json',
              'reading/audit/french_a1_units05_10_internal_semantic_qa_review_2026-08-22.json',
              'reading/audit/french_a1_units06_10_final_bounded_repairs_2026-08-22.json'
            ],
            'release_state':'REOPEN_REQUIRED',
            'next_mandatory_frontier':'complete/reconcile 100% internal learner-facing Gate B/C/D evidence, then independent Gate E+ reviews',
            'independent_gates':{'machine_tools':'PENDING','model_family':'PENDING','native_professional':'PENDING','educator_cefr':'PENDING','blind_postrepair':'PENDING'},
            'historical_note':'The older 2160-item release-evidence scan is bound to an earlier A1 hash and primarily records draft/pending/zero evidence fields. It is not the formal protocol §3 Gate A and is not evidence of 2160 distinct content defects.',
            'release_effect':'NONE_AUTOMATIC: no educator/public release approval.'
          }
          Path('reading/audit/french_a1_post_gate_a_release_frontier_2026-08-22.json').write_text(json.dumps(frontier,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':'RECONCILED','bound_sha256':want,'bound_git_blob':blob,'formal_gate_a':'PASS','release_state':'REOPEN_REQUIRED'},ensure_ascii=False))
          PY
      - name: Commit reconciliation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git add reading/STATUS.json \
                  reading/audit/french_a1_gate_a_revalidation_checkpoint_2026-08-22.json \
                  reading/audit/french_a1_post_gate_a_release_frontier_2026-08-22.json
          git rm -f .github/workflows/french-a1-post-gate-a-reconcile-temp.yml
          git commit -m 'Reconcile French A1 formal Gate A frontier [skip ci]'
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
