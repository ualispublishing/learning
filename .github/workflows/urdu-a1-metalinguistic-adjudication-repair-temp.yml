name: TEMP Urdu A1 metalinguistic adjudication repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/urdu-a1-metalinguistic-adjudication-repair-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-urdu-a1-metalinguistic-adjudication-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'audit/urdu-a1-final-deterministic-2026-08-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/urdu-a1-final-deterministic-2026-08-22
      - name: Adjudicate inventory and apply bounded repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import copy, hashlib, json, re

          corpus=Path('reading/urdu/a1/passages.jsonl')
          expected='9519a085ba046e71cafcc55a0a98f4d5517f2ec86d138f664727cac2d753d892'
          got=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if got!=expected: raise SystemExit(f'FAIL CLOSED corpus drift {got}')
          inventory_path=Path('reading/audit/urdu_a1_metalinguistic_candidates_2026-08-22.json')
          inventory=json.loads(inventory_path.read_text(encoding='utf-8'))
          if inventory.get('bound_sha256')!=expected or inventory.get('candidate_count')!=7:
              raise SystemExit('FAIL CLOSED candidate inventory mismatch')

          rows=[json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]
          by_id={r['id']:r for r in rows}
          preserved={r['id']:{
            'text':copy.deepcopy(r['text']),'title':copy.deepcopy(r['title']),
            'new_lexical_targets':copy.deepcopy(r.get('new_lexical_targets',[])),
            'review_lexical_targets':copy.deepcopy(r.get('review_lexical_targets',[])),
            'word_count':r.get('word_count'),'sentence_count':r.get('sentence_count')
          } for r in rows}

          false_positives=[
            {
              'passage_id':'ur-a1-u01-p04','question_id':'q3',
              'classification':'KEEP_OPERATIONAL_MEANING_CONTRAST',
              'rationale':'The item asks what اگر expresses in the sentence and offers concrete meaning choices; “شرط” appears as the learner-facing meaning, not as a request to name a grammatical category.'
            },
            {
              'passage_id':'ur-a1-u01-p04','question_id':'q6',
              'classification':'KEEP_OPERATIONAL_CONDITION_COMPREHENSION',
              'rationale':'This item was already repaired to ask for the real condition for entering. The word شرط is part of the scenario meaning, not grammatical metalanguage.'
            },
            {
              'passage_id':'ur-a1-u02-p01','question_id':'q8',
              'classification':'KEEP_OPERATIONAL_NEGATION_CONTRAST',
              'rationale':'The prompt asks the learner to select which sentence means that nothing should remain; نفی occurs only in the explanatory rationale.'
            },
            {
              'passage_id':'ur-a1-u02-p05','question_id':'q8',
              'classification':'KEEP_OPERATIONAL_CONDITION_COMPREHENSION',
              'rationale':'The prompt asks when Aisha will join next week and is answered from the passage. شرط occurs only in the explanation.'
            }
          ]

          repairs=[
            {
              'passage_id':'ur-a1-u03-p01','question_id':'q7',
              'before':{'prompt':'«کیونکہ» کس قسم کا تعلق بناتا ہے؟','type':'grammar_function','answer':'سبب یا وجہ جوڑنے والا حرفِ ربط۔'},
              'after':{'prompt':'کون سا جملہ وجہ بتاتا ہے: «میں سیب لیتا ہوں کیونکہ مجھے سیب پسند ہے» یا «میں سیب لیتا ہوں اور میز صاف ہے»؟','type':'contrast','answer':'«میں سیب لیتا ہوں کیونکہ مجھے سیب پسند ہے»۔','explanation':'«کیونکہ» یہاں سیب لینے کی وجہ بتاتا ہے۔'},
              'reason':'Replace the only remaining explicit grammar_function item with an operational reason-meaning contrast while preserving the کیونکہ target.'
            },
            {
              'passage_id':'ur-a1-u03-p06','question_id':'q6',
              'before':{'prompt':'«اپنا کام» میں «اپنا» کیا تعلق دکھاتا ہے؟','type':'vocabulary_in_context','answer':'اپنے ہی کام یا اپنی ذمہ داری سے متعلق۔'},
              'after':{'prompt':'«عائشہ اپنا کام خود کرنے کی کوشش کرتی ہے» میں کام کس کا ہے؟','type':'reference_resolution','answer':'عائشہ کا اپنا کام۔','explanation':'«اپنا» یہاں عائشہ کے اپنے کام کی طرف اشارہ کرتا ہے۔'},
              'reason':'Replace an abstract relation-label question with concrete reference resolution appropriate to A1.'
            },
            {
              'passage_id':'ur-a1-u04-p04','question_id':'q3',
              'before':{'prompt':'«میرا نام حارث ہے» میں «میرا» کیا تعلق دکھاتا ہے؟','type':'vocabulary_in_context','answer':'اپنی ملکیت یا اپنے بارے میں۔'},
              'after':{'prompt':'«میرا نام حارث ہے» میں نام کس کا ہے؟','type':'reference_resolution','answer':'حارث کا۔','explanation':'«میرا» بولنے والے حارث کے اپنے نام کی طرف اشارہ کرتا ہے۔'},
              'reason':'Replace abstract possession-relation wording with a concrete referent question.'
            }
          ]

          invkeys={(x['passage_id'],x['question_id']) for x in inventory['candidates']}
          expected_keys={(x['passage_id'],x['question_id']) for x in false_positives+repairs}
          if invkeys!=expected_keys:
              raise SystemExit(f'FAIL CLOSED inventory candidate set changed inv={sorted(invkeys)} expected={sorted(expected_keys)}')

          for spec in repairs:
              r=by_id[spec['passage_id']]
              q=next(q for q in r['questions'] if q['id']==spec['question_id'])
              a=next(a for a in r['answer_key'] if a['id']==q['answer_id'])
              b=spec['before']; n=spec['after']
              if q.get('prompt')!=b['prompt'] or q.get('type')!=b['type'] or a.get('answer')!=b['answer']:
                  raise SystemExit(f"FAIL CLOSED before-state mismatch {spec['passage_id']} {spec['question_id']}")
              q['prompt']=n['prompt']; q['type']=n['type']; a['answer']=n['answer']; a['explanation']=n['explanation']

          # Preserve all prose and target schedules.
          for r in rows:
              p=preserved[r['id']]
              for key in ('text','title','new_lexical_targets','review_lexical_targets','word_count','sentence_count'):
                  if r.get(key)!=p[key]: raise SystemExit(f"FAIL CLOSED preserved field changed {r['id']} {key}")

          # Q/A and local-target integrity.
          for r in rows:
              if len(r.get('questions',[]))!=10 or len(r.get('answer_key',[]))!=10:
                  raise SystemExit(f"FAIL CLOSED cardinality {r['id']}")
              amap={a['id']:a for a in r['answer_key']}
              local={x['id'] for x in r.get('new_lexical_targets',[])+r.get('review_lexical_targets',[])}
              prompts=[]
              for q in r['questions']:
                  prompts.append(q['prompt'])
                  if q.get('answer_id') not in amap or amap[q['answer_id']].get('question_id')!=q['id']:
                      raise SystemExit(f"FAIL CLOSED linkage {r['id']} {q['id']}")
                  for tid in q.get('target_ids',[]):
                      if tid not in local: raise SystemExit(f"FAIL CLOSED target locality {r['id']} {q['id']} {tid}")
              if len(prompts)!=len(set(prompts)): raise SystemExit(f"FAIL CLOSED duplicate prompt {r['id']}")

          # The explicit low-level formal type must now be absent corpus-wide.
          residual_types=[]
          for r in rows:
              for q in r['questions']:
                  if q.get('type') in {'grammar_category','grammar_function'}:
                      residual_types.append([r['id'],q['id'],q.get('type'),q.get('prompt')])
          if residual_types:
              raise SystemExit(f'FAIL CLOSED residual formal task types {residual_types}')

          out=''.join(json.dumps(r,ensure_ascii=False)+'\n' for r in rows)
          corpus.write_text(out,encoding='utf-8')
          after=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if after==expected: raise SystemExit('FAIL CLOSED expected corpus hash change')

          evidence={
            'schema_version':1,'date':'2026-08-22','language':'ur','level':'A1',
            'review_kind':'metalinguistic_candidate_semantic_adjudication_and_bounded_repair',
            'before_sha256':expected,'after_sha256':after,
            'source_inventory':'reading/audit/urdu_a1_metalinguistic_candidates_2026-08-22.json',
            'inventory_candidates':7,'confirmed_repairs':len(repairs),'adjudicated_false_positives':len(false_positives),
            'false_positives':false_positives,'repairs':repairs,
            'verification':{
              'passage_prose_unchanged':True,'target_declarations_and_review_schedules_unchanged':True,
              'qa_linkage_valid':True,'local_question_target_ids_only':True,'duplicate_prompts_zero':True,
              'grammar_category_and_grammar_function_types_zero_corpus_wide':True
            },
            'status':'PASS_INTERNAL_METALINGUISTIC_CLASS_ADJUDICATED_NEEDS_FRESH_DETERMINISTIC_AND_INDEPENDENT_REVIEW',
            'independent_review':{'native_urdu':'PENDING','independent_model_family':'PENDING','educator_cefr':'PENDING','blind_postrepair':'PENDING'},
            'release_effect':'NONE_AUTOMATIC: internal adjudication does not constitute native/educator release approval.'
          }
          Path('reading/audit/urdu_a1_metalinguistic_adjudication_2026-08-22.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'before_sha256':expected,'after_sha256':after,'confirmed_repairs':len(repairs),'false_positives':len(false_positives),'status':evidence['status']},ensure_ascii=False))
          PY
      - name: Commit repair evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/audit/urdu_a1_metalinguistic_adjudication_2026-08-22.json
          git rm -f .github/workflows/urdu-a1-metalinguistic-adjudication-repair-temp.yml
          git commit -m 'Adjudicate and repair Urdu A1 metalinguistic tasks [skip ci]'
          git push origin HEAD:audit/urdu-a1-final-deterministic-2026-08-22
