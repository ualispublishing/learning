name: TEMP Urdu A1 Unit 10 target selection
on:
  push:
    branches: [plan/urdu-a1-unit10-2026-08-21]
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/urdu-a1-unit10-2026-08-21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/select_urdu_a1_unit10_targets.py
      - name: Commit selection evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/urdu_a1_unit10_target_selection_2026-08-21.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Select Urdu A1 Unit 10 targets [skip ci]'
          git push origin HEAD:plan/urdu-a1-unit10-2026-08-21
