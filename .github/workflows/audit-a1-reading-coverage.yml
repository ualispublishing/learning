name: Audit A1 reading lexical coverage

on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/audit_a1_coverage.py'
      - 'reading/requirements-audit.txt'
      - '.github/workflows/audit-a1-reading-coverage.yml'
      - 'reading/run_a1_coverage_audit.request'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install reading-audit dependencies
        run: python -m pip install -r reading/requirements-audit.txt
      - name: Measure A1 lexical-control coverage
        run: python reading/tools/audit_a1_coverage.py
      - name: Commit coverage audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/a1_unit01_coverage_audit.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit A1 reading lexical coverage [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
