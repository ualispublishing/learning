name: Promote Urdu A2 Unit 9

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/promote-urdu-a2-u09.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and append Unit 9
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root=Path('.')
          corpus=root/'reading/urdu/a2/passages.jsonl'
          stage=root/'reading/audit/urdu_a2_u09_generation_candidate'
          rows=[json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]
          expected_ids=[f'ur-a2-u09-p{i:02d}' for i in range(1,7)]
          expected_seq=list(range(49,55))
          expected_targets=['ur-rank-0895','ur-rank-0896','ur-rank-0779','ur-rank-0962','ur-rank-0785','ur-rank-0823','ur-rank-0829','ur-rank-0904']

          if len(rows)!=48 or [r['sequence'] for r in rows] != list(range(1,49)):
              raise SystemExit(f'Fail closed: expected canonical sequences 1..48, found {len(rows)} records')
          old_ids=[r['id'] for r in rows]
          if len(old_ids)!=len(set(old_ids)):
              raise SystemExit('Fail closed: duplicate canonical IDs')
          taught={t['id'] for r in rows for t in r.get('new_lexical_targets',[])}
          if taught.intersection(expected_targets):
              raise SystemExit('Fail closed: Unit 9 target collision with prior deliberate teaching')

          candidates=[]
          learner=[]
          for i,seq in enumerate(expected_seq,1):
              p=stage/f'ur-a2-u09-p{i:02d}.json'
              r=json.loads(p.read_text(encoding='utf-8'))
              if r['id']=='ur-a2-u09-p04':
                  next(a for a in r['answer_key'] if a['id']=='a6')['answer']='شاعری کی دو مصرعوں پر مشتمل ایک اکائی۔'
              r['domains']=['public' if d in {'community','social'} else d for d in r['domains']]
              r['word_count']=len(r['text'].split())
              r['sentence_count']=r['text'].count('۔')
              for t in r.get('new_lexical_targets',[]):
                  t['exposures_in_text']=r['text'].count(t['form'])
              candidates.append(r)
              p.write_text(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
              learner += [r['title'],r['text']]+[q['prompt'] for q in r['questions']]+[a['answer'] for a in r['answer_key']]

          if [r['id'] for r in candidates]!=expected_ids or [r['sequence'] for r in candidates]!=expected_seq:
              raise SystemExit('Fail closed: Unit 9 ID/sequence mismatch')
          if [r['passage_type'] for r in candidates] != ['instructional','reinforcement','interleaved','transfer','integration','fluency']:
              raise SystemExit('Fail closed: role cycle mismatch')
          if [len(r['new_lexical_targets']) for r in candidates] != [2,2,2,2,0,0]:
              raise SystemExit('Fail closed: target distribution mismatch')
          if [t['id'] for r in candidates[:4] for t in r['new_lexical_targets']] != expected_targets:
              raise SystemExit('Fail closed: target ID set/order mismatch')
          if not {'cultural note','personal narrative','comparison'}.issubset({r['genre'] for r in candidates}):
              raise SystemExit('Fail closed: required genres missing')
          if any(len(r['questions'])!=10 or len(r['answer_key'])!=10 for r in candidates):
              raise SystemExit('Fail closed: 10x10 assessment contract')
          for r in candidates:
              amap={a['id']:a for a in r['answer_key']}
              if any(q['answer_id'] not in amap or amap[q['answer_id']]['question_id']!=q['id'] for q in r['questions']):
                  raise SystemExit(f'Fail closed: broken QA links in {r["id"]}')
              if any(t['exposures_in_text']<1 for t in r['new_lexical_targets']):
                  raise SystemExit(f'Fail closed: target absent from text in {r["id"]}')
              if r['word_count']<120 or r['word_count']>260 or r['sentence_count']<7 or r['sentence_count']>15:
                  raise SystemExit(f'Fail closed: length metadata outside A2 generation bounds in {r["id"]}')
              if any(d not in {'personal','public','educational','professional'} for d in r['domains']):
                  raise SystemExit(f'Fail closed: invalid domain in {r["id"]}')
          p6=candidates[-1]
          if p6['new_lexical_targets'] or not p6['speed_training']['timed'] or p6['speed_training']['new_word_policy']!='none':
              raise SystemExit('Fail closed: P6 fluency policy')
          learner_text='\n'.join(learner)
          if re.search(r'[A-Za-z\u0900-\u097F]',learner_text):
              raise SystemExit('Fail closed: non-Urdu script leakage in learner-facing fields')

          before=corpus.read_bytes()
          prefix=before.decode('utf-8')
          if prefix and not prefix.endswith('\n'): prefix+='\n'
          corpus.write_text(prefix+''.join(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n' for r in candidates),encoding='utf-8')
          after=corpus.read_bytes()
          if not after.startswith(before): raise SystemExit('Fail closed: prior canonical bytes changed')
          final=[json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]
          if len(final)!=54 or [r['sequence'] for r in final]!=list(range(1,55)) or [r['id'] for r in final[-6:]]!=expected_ids:
              raise SystemExit('Post-write canonical validation failed')

          (stage/'manifest.json').write_text(json.dumps({'schema_version':1,'project_id':'LANG-A1C2','language':'ur','cefr':'A2','unit':9,'date':'2026-08-24','status':'CANONICALIZED','sequence_range':[49,54],'record_count':6,'release_promotion':False},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'reading/audit/urdu_a2_u09_generation_validation_2026-08-24.json').write_text(json.dumps({'schema_version':1,'project_id':'LANG-A1C2','language':'ur','cefr':'A2','unit':9,'date':'2026-08-24','canonicalized':True,'release_promotion':False,'checks':{'record_count':'PASS','sequence_49_through_54':'PASS','role_cycle':'PASS','question_answer_10x10':'PASS','bidirectional_links':'PASS','new_target_distribution':'PASS','new_target_freshness':'PASS','new_target_text_exposure':'PASS','required_genres':'PASS','p6_fluency_policy':'PASS','learner_script_scan':'PASS','domain_enum':'PASS','preexisting_canonical_bytes_preserved':'PASS'}},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'reading/audit/urdu_a2_u09_promotion_2026-08-24.json').write_text(json.dumps({'schema_version':1,'project_id':'LANG-A1C2','language':'ur','cefr':'A2','unit':9,'date':'2026-08-24','status':'CANONICAL_PROMOTION_PASS','release_promotion':False,'before_record_count':48,'after_record_count':54,'appended_sequences':expected_seq,'appended_ids':expected_ids,'preexisting_bytes_preserved_exactly':True,'canonical_sha256_after':hashlib.sha256(after).hexdigest()},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          status_path=root/'reading/STATUS.json'; s=json.loads(status_path.read_text(encoding='utf-8'))
          s['updated']='2026-08-24'; s['current']['canonical_passages']=834; s['current']['remaining_generation_passages']=246; s['current']['active_language']='urdu'; s['current']['active_level']='A2'
          s['languages']['urdu']['generation_state']='A2_IN_PROGRESS'; s['languages']['urdu']['canonical_passages']=114; s['languages']['urdu']['remaining_generation_passages']=246; s['languages']['urdu']['next_generation_level']='A2'
          status_path.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          cont_path=root/'reading/CONTINUATION.json'; c=json.loads(cont_path.read_text(encoding='utf-8'))
          c['updated']='2026-08-24'; c['production']['canonical_passages']=834; c['production']['urdu']['canonical_passages']=114
          c['active_frontier']['production']={'language':'urdu','level':'A2','action':'Continue generation-first production from Urdu A2 Unit 10 / sequence 55 using the canonical roadmap and ten-question contract. Do not reopen Urdu A1 generation unless fresh evidence identifies a concrete defect.'}
          c['exact_next_actions']=['Validate the routed state bundle and continuation/status snapshot against live canonical JSONL.','Use reading/planning/ACTIVE_GENERATION_PLAN.json to start the next guarded Urdu A2 Unit 10 batch at sequence 55.','Maintain Arabic/French release remediation and Urdu A1 educator verification as separate verification lanes without blocking generation-first production unless a concrete defect requires it.']
          cont_path.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          matrix=json.loads((root/'reading/planning/topic_genre_matrix.json').read_text(encoding='utf-8')); u10=next(x for x in matrix['levels']['A2'] if x['unit']==10)
          plan_path=root/'reading/planning/ACTIVE_GENERATION_PLAN.json'; plan=json.loads(plan_path.read_text(encoding='utf-8'))
          plan['active_unit']=10; plan['start_sequence']=55; plan['existing_active_level_passages']=54; plan['active_unit_roadmap']={'unit':10,'theme':u10['theme'],'genres':u10['genres']}
          plan_path.write_text(json.dumps(plan,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          tasks_path=root/'reading/TASKS.md'; t=tasks_path.read_text(encoding='utf-8')
          t,n1=re.subn(r'Canonical production frontier: \*\*Urdu A2, Unit \d+, sequence \d+\*\*\.', 'Canonical production frontier: **Urdu A2, Unit 10, sequence 55**.',t,count=1)
          t,n2=re.subn(r'- Urdu: \d+/360 generated; A1 complete, A2 in progress\.', '- Urdu: 114/360 generated; A1 complete, A2 in progress.',t,count=1)
          t,n3=re.subn(r'- Project: \d+/1080 generated\.', '- Project: 834/1080 generated.',t,count=1)
          if (n1,n2,n3)!=(1,1,1): raise SystemExit('Fail closed: TASKS state text mismatch')
          tasks_path.write_text(t,encoding='utf-8')

          hand=root/'reading/AGENT_HANDOFF_V2.md'; h=hand.read_text(encoding='utf-8')
          replacements=[(r'- Canonical generated total: \*\*\d+\*\*\.', '- Canonical generated total: **834**.'),(r'- Urdu: \*\*\d+/360\*\*; A1 generation complete and A2 generation in progress\.', '- Urdu: **114/360**; A1 generation complete and A2 generation in progress.'),(r'- Urdu A2 canonical path: `reading/urdu/a2/passages\.jsonl`; Units 1-\d+ currently contain sequences 1-\d+\.', '- Urdu A2 canonical path: `reading/urdu/a2/passages.jsonl`; Units 1-9 currently contain sequences 1-54.'),(r'Continue \*\*Urdu A2\*\*, starting from Unit \d+ / sequence \d+, under:', 'Continue **Urdu A2**, starting from Unit 10 / sequence 55, under:'),(r'Unit 9 uses the roadmap theme \*\*culture, celebrations, and customs\*\* with `cultural note`, `personal narrative`, and `comparison` genres\.', 'Unit 10 uses the roadmap theme **A2 cumulative checkpoint** with `multi-paragraph story`, `mixed functional texts`, and `checkpoint` genres.'),(r'Run `python reading/tools/validate_continuation_state\.py`; if it passes, resume guarded generation at \*\*Urdu A2 Unit \d+ / sequence \d+\*\* using the Unit \d+ roadmap theme `[^`]+`\.', 'Run `python reading/tools/validate_continuation_state.py`; if it passes, resume guarded generation at **Urdu A2 Unit 10 / sequence 55** using the Unit 10 roadmap theme `A2 cumulative checkpoint`.')]
          for pat,rep in replacements:
              h,n=re.subn(pat,rep,h,count=1)
              if n!=1: raise SystemExit(f'Fail closed: AGENT_HANDOFF state text mismatch for {pat}')
          hand.write_text(h,encoding='utf-8')
          PY

      - name: Refresh and validate state
        run: |
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py

      - name: Commit promoted corpus and state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          Path('reading/audit/urdu_a2_u09_state_reconcile_2026-08-24.json').write_text(json.dumps({'schema_version':1,'project_id':'LANG-A1C2','date':'2026-08-24','status':'PASS','canonical_urdu_a2_passages':54,'project_canonical_passages':834,'urdu_canonical_passages':114,'next_frontier':{'language':'urdu','level':'A2','unit':10,'sequence':55},'checks':{'canonical_sequences_1_54':'PASS','unit9_tail':'PASS','state_manifest_refresh':'PASS','validate_continuation_state':'PASS'},'release_promotion':False},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a2/passages.jsonl reading/audit/urdu_a2_u09_generation_candidate reading/audit/urdu_a2_u09_generation_validation_2026-08-24.json reading/audit/urdu_a2_u09_promotion_2026-08-24.json reading/audit/urdu_a2_u09_state_reconcile_2026-08-24.json reading/STATUS.json reading/CONTINUATION.json reading/planning/ACTIVE_GENERATION_PLAN.json reading/TASKS.md reading/AGENT_HANDOFF_V2.md reading/STATE_MANIFEST.json
          git commit -m 'Promote Urdu A2 Unit 9 and advance to Unit 10'
          git push

