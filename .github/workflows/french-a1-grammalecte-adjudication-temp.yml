name: TEMP French A1 Grammalecte adjudication

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/french-a1-grammalecte-adjudication-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-french-a1-grammalecte-adjudication
  cancel-in-progress: false

jobs:
  adjudicate:
    if: github.event.pull_request.head.ref == 'repair/french-a1-review-integrity-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/french-a1-review-integrity-2026-08-20
      - name: Adjudicate residual linguistic findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,unicodedata

          corpus=Path('reading/french/a1/passages.jsonl')
          expected='7dbdb48ffc6efd00106490ca9b10ad25643bf7e89967e8fbd2977a04641d6ea3'
          got=hashlib.sha256(corpus.read_bytes()).hexdigest()
          if got!=expected: raise SystemExit(f'FAIL CLOSED corpus drift {got}')
          triage_path=Path('reading/audit/french_a1_grammalecte_triage_2026-08-22.json')
          triage=json.loads(triage_path.read_text(encoding='utf-8'))
          expected_counts={
            'TYPOGRAPHY_NBSP_POLICY_ONLY':1992,
            'LIKELY_INTENTIONAL_GRAMMAR_DISTRACTOR_NEEDS_CONFIRMATION':38,
            'CONTEXT_REVIEW_REQUIRED':7,
            'MECHANICAL_FALSE_POSITIVE_LEVEL_LABEL':3,
          }
          if triage.get('bound_sha256')!=expected or triage.get('raw_finding_count')!=2040 or triage.get('classification_counts')!=expected_counts:
              raise SystemExit('FAIL CLOSED triage evidence mismatch')

          rows={r['id']:r for r in [json.loads(x) for x in corpus.read_text(encoding='utf-8').splitlines() if x.strip()]}
          def norm(s):
              s=unicodedata.normalize('NFKC',str(s)).lower().replace('’',"'")
              return ' '.join(re.findall(r"[\wÀ-ÿ']+",s,flags=re.UNICODE))
          def q_and_a(item):
              row=rows[item['passage_id']]
              q=next(q for q in row['questions'] if q['id']==item['item_id'])
              a=next(a for a in row['answer_key'] if a['id']==q['answer_id'])
              return q,a

          distractors=[x for x in triage['items'] if x['classification']=='LIKELY_INTENTIONAL_GRAMMAR_DISTRACTOR_NEEDS_CONFIRMATION']
          verified=[]
          for x in distractors:
              q,a=q_and_a(x)
              if q.get('type')!='grammar_choice': raise SystemExit(f"FAIL CLOSED non-grammar_choice {x['passage_id']} {x['item_id']}")
              if q.get('prompt')!=x.get('source_text'): raise SystemExit(f"FAIL CLOSED prompt drift {x['passage_id']} {x['item_id']}")
              m=re.search(r'«\s*(.*?)\s*»\s+ou\s+«\s*(.*?)\s*»',q['prompt'])
              if not m: raise SystemExit(f"FAIL CLOSED alternatives unparseable {x['passage_id']} {x['item_id']}")
              first,second=m.group(1),m.group(2)
              start=x.get('start'); delim=q['prompt'].find(' ou ')
              if not isinstance(start,int) or delim<0 or start<=delim+3:
                  raise SystemExit(f"FAIL CLOSED finding not in second alternative {x['passage_id']} {x['item_id']}")
              na,n1,n2=norm(a['answer']),norm(first),norm(second)
              if not (na==n1 or n1 in na or na in n1):
                  raise SystemExit(f"FAIL CLOSED answer does not support first alternative {x['passage_id']} {x['item_id']} answer={a['answer']!r} first={first!r}")
              if na==n2:
                  raise SystemExit(f"FAIL CLOSED answer equals detector-marked second alternative {x['passage_id']} {x['item_id']}")
              verified.append({
                'finding_index':x['finding_index'],'passage_id':x['passage_id'],'item_id':x['item_id'],
                'matched_text':x.get('matched_text'),'correct_first_alternative':first,'intentional_wrong_second_alternative':second,
                'linked_answer':a['answer'],'classification':'CONFIRMED_INTENTIONAL_GRAMMAR_DISTRACTOR_FALSE_POSITIVE'
              })
          if len(verified)!=38: raise SystemExit(f'FAIL CLOSED expected 38 distractor findings, got {len(verified)}')

          context=[x for x in triage['items'] if x['classification']=='CONTEXT_REVIEW_REQUIRED']
          decisions={
            151:('FALSE_POSITIVE_VALID_CLOZE_ANSWER_FRAGMENT','The answer “pouvons.” is the exact completion for q5 “nous _____ entrer”; a standalone answer fragment legitimately has its subject supplied by the question.'),
            515:('FALSE_POSITIVE_ALTERNATIVE_CONJUNCTION','The flagged “ou” is the conjunction introducing alternatives in the question prompt (“mais” ou “pour”), not the locative/interrogative où.'),
            604:('FALSE_POSITIVE_VALID_INTRANSITIVE_PAST_PARTICIPLE','“Ils ont bien travaillé ensemble” is grammatical: travailler is intransitive here and the past participle with avoir does not agree with the subject.'),
            1462:('STYLE_ONLY_ACCEPTABLE_EXPRESSION','“une petite collation” is grammatical and idiomatic; Grammalecte’s pleonasm signal is a style preference, not a linguistic error.'),
            1521:('FALSE_POSITIVE_RELATIVE_CE_QUE_INDICATIVE','In “faire attention à ce qu’elle ressent physiquement”, ce que means “what [she feels]” as a relative construction; the indicative ressent is appropriate rather than a required subjunctive complement.'),
            2007:('FALSE_POSITIVE_LANGUAGE_NAME_LOWERCASE','“un français simple” refers to the French language/register, not a demonym; lowercase français is correct.'),
            2036:('FALSE_POSITIVE_LANGUAGE_NAME_LOWERCASE','The answer uses français for the French language/register, not a demonym; lowercase français is correct.'),
          }
          if {x['finding_index'] for x in context}!=set(decisions):
              raise SystemExit(f"FAIL CLOSED contextual finding set changed: {[x['finding_index'] for x in context]}")
          adjudicated=[]
          for x in context:
              cls,reason=decisions[x['finding_index']]
              adjudicated.append({
                'finding_index':x['finding_index'],'passage_id':x['passage_id'],'field':x['field'],'item_id':x.get('item_id'),
                'matched_text':x.get('matched_text'),'source_text':x.get('source_text'),'detector_message':x.get('message'),
                'classification':cls,'rationale':reason,'corpus_change_required':False
              })

          payload={
            'schema_version':1,'date':'2026-08-22','language':'fr','level':'A1',
            'audit':'grammalecte_contextual_adjudication','bound_sha256':expected,
            'source_triage':'reading/audit/french_a1_grammalecte_triage_2026-08-22.json',
            'raw_findings':2040,
            'typography_nbsp_policy_findings':1992,
            'mechanical_level_label_false_positives':3,
            'intentional_grammar_distractor_findings_verified':38,
            'contextual_findings_adjudicated':7,
            'linguistic_corpus_changes_required':0,
            'status':'PASS_GRAMMALECTE_LINGUISTIC_ADJUDICATION_NO_CORPUS_CHANGE_TYPOGRAPHY_POLICY_PENDING',
            'verified_grammar_distractors':verified,
            'contextual_adjudications':adjudicated,
            'typography_policy_note':'The 1,992 NBSP signals remain explicitly separated as a French typography/serialization policy question. They are not counted as grammar, lexical, semantic, or pedagogical defects and are not silently dismissed.',
            'release_effect':'NONE_AUTOMATIC: this clears the current Grammalecte linguistic findings only. Other required machine/tool, model-family, native-professional, educator/CEFR, and blind post-repair gates remain pending.'
          }
          Path('reading/audit/french_a1_grammalecte_adjudication_2026-08-22.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:payload[k] for k in ('status','typography_nbsp_policy_findings','intentional_grammar_distractor_findings_verified','contextual_findings_adjudicated','linguistic_corpus_changes_required')},ensure_ascii=False))
          PY
      - name: Commit adjudication evidence and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/audit/french_a1_grammalecte_adjudication_2026-08-22.json
          git rm -f .github/workflows/french-a1-grammalecte-adjudication-temp.yml
          git commit -m 'Adjudicate French A1 Grammalecte findings [skip ci]'
          git push origin HEAD:repair/french-a1-review-integrity-2026-08-20
