name: Generate French A2 Unit 07
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_french_a2_unit07.py'
      - 'reading/tools/generate_french_a2_unit07_retry.py'
      - '.github/workflows/generate-french-a2-unit07.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --quiet jsonschema
      - name: Append and validate Unit 07
        run: python reading/tools/generate_french_a2_unit07_retry.py
      - name: Independent Unit 07 checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('reading/french/a2/passages.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==42
          assert [r['sequence'] for r in rows]==list(range(1,43))
          assert len({r['id'] for r in rows})==42
          u7=rows[36:]
          assert [r['id'] for r in u7]==[f'fr-a2-u07-p{i:02d}' for i in range(1,7)]
          assert all(r['language']=='fr' and r['cefr']=='A2' and r['unit']==7 for r in u7)
          assert all(140<=r['word_count']<=220 for r in u7)
          assert sum(len(r['new_lexical_targets']) for r in u7[:5])==10
          assert len({t['id'] for r in u7[:5] for t in r['new_lexical_targets']})==10
          assert u7[-1]['new_lexical_targets']==[]
          assert sum(len(r['questions']) for r in u7)==60
          assert sum(len(r['answer_key']) for r in u7)==60
          expected={'tenter','tranquille','déjeuner','partager','vue','avancer','marché','poste','intérêt','mur'}
          actual={t['form'] for r in u7[:5] for t in r['new_lexical_targets']}
          assert actual==expected, (actual, expected)
          for r in u7:
              local={str(t['id']) for f in ('new_lexical_targets','review_lexical_targets') for t in r.get(f,[]) if isinstance(t,dict) and t.get('id')}
              amap={a['question_id']:a['id'] for a in r['answer_key']}
              assert len(amap)==10
              for q in r['questions']:
                  assert amap[q['id']]==q['answer_id']
                  assert all(tid in local for tid in q.get('target_ids',[]))
          print({'status':'PASS','french_a2_passages':42,'unit07_questions':60,'unit07_answers':60,'unit07_new_targets':10})
          PY
      - name: Commit canonical French A2 Unit 07
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/french/a2/passages.jsonl
          if git diff --cached --quiet; then
            echo 'No canonical changes to commit'
            exit 0
          fi
          git commit -m 'Generate French A2 Unit 07 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
