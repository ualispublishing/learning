name: Generate Arabic C2 Unit 03 v3
on:
  workflow_dispatch:
  push:
    paths:
      - 'reading/tools/generate_arabic_c2_unit03.py'
      - 'reading/tools/generate_arabic_c2_unit03_v2.py'
      - 'reading/tools/generate_arabic_c2_unit03_v3.py'
      - '.github/workflows/generate-arabic-c2-unit03-v3.yml'
permissions:
  contents: write
concurrency:
  group: arabic-c2-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python reading/tools/generate_arabic_c2_unit03_v3.py
      - name: Commit generated C2 passages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/c2/passages.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate repaired Arabic C2 Unit 03 v3 [skip ci]'
          git fetch origin main
          git rebase --autostash origin/main
          git push origin HEAD:main
