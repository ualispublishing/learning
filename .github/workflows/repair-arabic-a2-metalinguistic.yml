name: Repair Arabic A2 metalinguistic items

on:
  push:
    paths:
      - '.github/workflows/repair-arabic-a2-metalinguistic.yml'
      - 'reading/tools/repair_arabic_a2_metalinguistic.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bounded-a2-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight current routed state
        run: python reading/tools/validate_continuation_state.py

      - name: Fetch exact historical A2 reference branches
        shell: bash
        run: |
          set -euo pipefail
          for u in 01 02 03 04 05 06 07 08; do
            ref="repair/arabic-a2-u${u}-metalinguistic-2026-08-21"
            git fetch origin "+refs/heads/${ref}:refs/remotes/origin/${ref}"
          done
          for u in 09 10; do
            ref="repair/arabic-a2-u${u}-metalinguistic-2026-08-22"
            git fetch origin "+refs/heads/${ref}:refs/remotes/origin/${ref}"
          done

      - name: Apply guarded A2 83-item remediation
        run: python reading/tools/repair_arabic_a2_metalinguistic.py

      - name: Regenerate exact-corpus Gate 0
        run: python reading/tools/run_post_generation_gate0.py

      - name: Rerun fresh Arabic deterministic release gate
        run: python reading/tools/run_arabic_fresh_deterministic_revalidation.py

      - name: Reconcile A2 closure evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          repair_path = Path('reading/audit/arabic_a2_metalinguistic_repair_2026-08-30.json')
          gate_path = Path('reading/audit/arabic_fresh_deterministic_revalidation_2026-08-30.json')
          release_path = Path('reading/RELEASE_STATUS.json')
          tasks_path = Path('reading/VERIFICATION_TASKS.md')

          repair = json.loads(repair_path.read_text(encoding='utf-8'))
          gate = json.loads(gate_path.read_text(encoding='utf-8'))

          if repair['repairs_applied'] != 83:
              raise SystemExit(f"Expected 83 A2 repairs, got {repair['repairs_applied']}")
          if repair['formal_question_types_after_full_a2'] != 0:
              raise SystemExit('Formal question types remain in A2')
          if repair['explicit_formal_prompt_pattern_findings_after'] != 0:
              raise SystemExit('Explicit formal prompt patterns remain in A2')
          if repair['a2_questions_checked'] != 600 or repair['a2_answers_checked'] != 600:
              raise SystemExit('A2 full Q/A scan count mismatch')
          if not repair['untargeted_records_byte_identical']:
              raise SystemExit('Untargeted A2 records changed')
          if gate['structural_errors']:
              raise SystemExit(f"Arabic structural errors after A2 repair: {gate['structural_errors']}")
          if gate['finding_classes'].get('unicode_not_nfc', 0) != 0:
              raise SystemExit('Unicode NFC findings reappeared')
          if gate['open_findings'] != 2496:
              raise SystemExit(f"Unexpected deterministic evidence count after A2 repair: {gate['open_findings']}")

          release = json.loads(release_path.read_text(encoding='utf-8'))
          ar = release['languages']['arabic']
          ar['release_state'] = 'REOPEN_REQUIRED'
          ar['educator_release_ready'] = False
          ar['latest_deterministic_gate'] = {
              'status': gate['status'],
              'records': gate['records'],
              'questions': gate['questions'],
              'answers': gate['answers'],
              'open_findings': gate['open_findings'],
              'finding_classes': gate['finding_classes'],
              'artifact': 'reading/audit/arabic_fresh_deterministic_revalidation_2026-08-30.json',
              'date': gate['date'],
          }
          evidence = ar.get('latest_release_evidence', [])
          if isinstance(evidence, str):
              evidence = [evidence]
          artifact = 'reading/audit/arabic_a2_metalinguistic_repair_2026-08-30.json'
          if artifact not in evidence:
              evidence.append(artifact)
          ar['latest_release_evidence'] = evidence
          ar['metalinguistic_review_progress'] = {
              'status': 'A1_A2_HISTORICAL_LOWLEVEL_CLASS_CLOSED_CONTINUING',
              'a1_questions_checked': 600,
              'a1_formal_label_questions_repaired_total': 63,
              'a1_formal_question_types_remaining': 0,
              'a2_questions_checked': 600,
              'a2_historical_candidates_repaired_total': 83,
              'a2_formal_question_types_remaining': 0,
              'a2_explicit_formal_prompt_patterns_remaining': 0,
              'combined_a1_a2_repairs': 146,
              'remaining_scope': 'Fresh A1 explicit prompt-pattern/CEFR review and B1-C2 CEFR/metalinguistic review as applicable; naturalness, semantic educator, independent native/model-family, and blind review remain separate.',
              'latest_artifact': artifact,
          }
          blockers = [b for b in release.get('global_release_blockers', []) if not b.startswith('Arabic ')]
          blockers.insert(0, 'Arabic fresh deterministic release revalidation remains FAIL with 2496 open release-evidence findings; NFC defects and the historically identified A1-A2 low-level metalinguistic classes are closed (146 repairs total), but broader CEFR, naturalness, semantic, and independent review remain open.')
          release['global_release_blockers'] = blockers
          release['updated'] = '2026-08-30'
          release_path.write_text(json.dumps(release, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          text = tasks_path.read_text(encoding='utf-8')
          parent = '- [ ] corpus-wide low-level metalinguistic/CEFR question audit and repair;\n'
          child = '- [x] Arabic A2 historical low-level batch: re-adjudicated all 83 candidates; 600 questions / 600 answers scanned, with 0 formal question types and 0 configured explicit formal-prompt patterns remaining;\n'
          if child not in text:
              text = text.replace(parent, parent + child, 1)
          evidence_line = 'A2 metalinguistic repair evidence: `reading/audit/arabic_a2_metalinguistic_repair_2026-08-30.json` — 83 current-corpus repairs across all 10 A2 units; 0 formal question types and 0 configured explicit formal-prompt findings across 600 A2 questions; untargeted records byte-identical.\n\n'
          anchor = 'Open verification work:\n\n'
          if evidence_line not in text:
              pos = text.find(anchor, text.find('## Arabic'))
              if pos < 0:
                  raise SystemExit('Arabic verification-work anchor not found')
              pos += len(anchor)
              text = text[:pos] + evidence_line + text[pos:]
          tasks_path.write_text(text, encoding='utf-8')
          PY

      - name: Refresh state manifest and validate final bounded state
        run: |
          python reading/tools/refresh_state_manifest.py
          python reading/tools/validate_continuation_state.py

      - name: Commit A2 repair and refreshed evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/arabic/a2/passages.jsonl \
                  reading/audit/arabic_a2_metalinguistic_repair_2026-08-30.json \
                  reading/audit/post_generation_gate0_2026-08-30.json \
                  reading/audit/arabic_fresh_deterministic_revalidation_2026-08-30.json \
                  reading/RELEASE_STATUS.json \
                  reading/VERIFICATION_TASKS.md \
                  reading/STATE_MANIFEST.json
          git diff --cached --quiet && { echo 'No bounded A2 changes required.'; exit 0; }
          git commit -m 'Remediate Arabic A2 metalinguistic questions'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
