name: CISSP Study Site Audit

on:
  push:
    branches: [main, cissp-v1.27-release-20260830]
    paths:
      - 'subjects/cissp/2024-outline/study-site/**'
      - 'scripts/finish_cissp_v127_release.py'
      - '.github/workflows/cissp-v1.27-finish.yml'
      - '.github/workflows/cissp-study-site-audit.yml'
  pull_request:
    paths:
      - 'subjects/cissp/2024-outline/study-site/**'
      - '.github/workflows/cissp-study-site-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded v1.27 release finisher
        if: github.ref == 'refs/heads/cissp-v1.27-release-20260830'
        run: python scripts/finish_cissp_v127_release.py

      - name: Run deterministic knowledge audit
        id: knowledge
        continue-on-error: true
        working-directory: subjects/cissp/2024-outline/study-site
        run: python audit.py

      - name: Run question originality and duplicate gate
        id: quality
        if: always()
        continue-on-error: true
        working-directory: subjects/cissp/2024-outline/study-site
        run: python question-bank/quality_gate.py

      - name: Run logical batch composition gate
        id: mix
        if: always()
        continue-on-error: true
        working-directory: subjects/cissp/2024-outline/study-site
        run: python question-bank/logical_batch_mix_gate.py

      - name: Generate question-bank coverage and next-batch plans
        id: planning
        if: always()
        continue-on-error: true
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          python question-bank/coverage_report.py --released-only >/tmp/cissp-released-coverage.json
          python question-bank/coverage_report.py --human
          python question-bank/batch_planner.py --human

      - name: Check JavaScript syntax
        id: syntax
        if: always()
        continue-on-error: true
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          node --check data-meta.js
          for f in data-d{1..8}.js data-ai.js data-precision.js coverage-detail.js data-question-calibration.js legacy-rationales.js keyboard-shortcuts.js bootstrap.js app.js enhancements.js state-ui-bridge.js product-polish.js; do node --check "$f"; done

      - name: Verify legacy option-rationale coverage
        id: rationales
        if: always()
        continue-on-error: true
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};
          vm.runInNewContext(fs.readFileSync('legacy-rationales.js','utf8'),ctx);
          const r=ctx.window.CISSP_LEGACY_RATIONALES||{};
          const ids=Object.keys(r).sort();
          if(ids.length!==56) throw new Error(`Expected 56 legacy rationale sets, got ${ids.length}`);
          for(let i=1;i<=56;i++){
            const id=`Q-${String(i).padStart(3,'0')}`,v=r[id];
            if(!Array.isArray(v)||v.length!==4||v.some(x=>typeof x!=='string'||!x.trim())) throw new Error(`${id} requires four non-empty rationales`);
          }
          console.log('PASS legacy_rationales=56 option_rationales=224');
          NODE

      - name: Verify static site serves all critical assets
        id: static
        if: always()
        continue-on-error: true
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          python -m http.server 8765 >/tmp/cissp-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          for f in index.html 404.html browser-smoke.html styles.css mobile-fix.css enhancements.css product-polish.css workflow-clarity.css data-meta.js data-d1.js data-d8.js data-ai.js data-precision.js coverage-detail.js data-question-calibration.js legacy-rationales.js keyboard-shortcuts.js bootstrap.js app.js enhancements.js state-ui-bridge.js product-polish.js browser-smoke.sh question-bank/RELEASED_BATCHES.json question-bank/coverage_report.py question-bank/batch_planner.py question-bank/logical_batch_mix_gate.py; do
            curl --fail --silent --show-error "http://127.0.0.1:8765/$f" >/dev/null
          done
          python - <<'PY'
          import json, pathlib, urllib.request
          root = pathlib.Path('.')
          manifest = json.loads((root/'question-bank/RELEASED_BATCHES.json').read_text())
          rels = [rel for batch in manifest.get('released_batches', []) for rel in batch.get('files', [])]
          for rel in rels:
              with urllib.request.urlopen('http://127.0.0.1:8765/' + rel) as response:
                  if response.status != 200:
                      raise SystemExit(f'asset failed: {rel} status={response.status}')
          print(f'PASS released_batch_assets={len(rels)}')
          PY

      - name: Execute interactive browser smoke test
        id: browser
        if: always()
        continue-on-error: true
        working-directory: subjects/cissp/2024-outline/study-site
        run: bash browser-smoke.sh 8766

      - name: Enforce aggregate CISSP gate
        if: always()
        env:
          KNOWLEDGE: ${{ steps.knowledge.outcome }}
          QUALITY: ${{ steps.quality.outcome }}
          MIX: ${{ steps.mix.outcome }}
          PLANNING: ${{ steps.planning.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          RATIONALES: ${{ steps.rationales.outcome }}
          STATIC: ${{ steps.static.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          failed=0
          for gate in KNOWLEDGE QUALITY MIX PLANNING SYNTAX RATIONALES STATIC BROWSER; do
            value="${!gate}"
            echo "$gate=$value"
            if [ "$value" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "FAIL one or more CISSP validation gates failed; see the individual step logs above."
            exit 1
          fi
          echo "PASS all CISSP validation gates, including logical batch mix and browser smoke."

      - name: Commit exact validated v1.27 release candidate
        if: success() && github.ref == 'refs/heads/cissp-v1.27-release-20260830'
        run: |
          rm -f scripts/finish_cissp_v127_release.py
          rm -f .github/workflows/cissp-v1.27-finish.yml
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/cissp-study-site-audit.yml > .github/workflows/cissp-study-site-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Build CISSP Atlas v1.27 release candidate'
          git push origin HEAD:cissp-v1.27-release-20260830
