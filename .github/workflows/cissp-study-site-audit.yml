name: CISSP Study Site Audit

on:
  push:
    branches: [cissp-v1.28-release-20260831]
    paths:
      - 'scripts/promote_cissp_v128.py'
      - '.github/workflows/cissp-study-site-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-v128:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Generate and commit clean v1.28 release candidate
        run: |
          set -euo pipefail
          python scripts/promote_cissp_v128.py
          rm scripts/promote_cissp_v128.py
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/cissp-study-site-audit.yml > .github/workflows/cissp-study-site-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare CISSP Atlas v1.28 release candidate'
          git push origin HEAD:cissp-v1.28-release-20260831
