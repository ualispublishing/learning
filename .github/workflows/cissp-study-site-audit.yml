name: CISSP Study Site Audit

on:
  push:
    branches: [main]
    paths:
      - 'subjects/cissp/2024-outline/study-site/**'
      - '.github/workflows/cissp-study-site-audit.yml'
  pull_request:
    paths:
      - 'subjects/cissp/2024-outline/study-site/**'
      - '.github/workflows/cissp-study-site-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic knowledge audit
        working-directory: subjects/cissp/2024-outline/study-site
        run: python audit.py
      - name: Run question originality and duplicate gate
        working-directory: subjects/cissp/2024-outline/study-site
        run: python question-bank/quality_gate.py
      - name: Check JavaScript syntax
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          node --check data-meta.js
          for f in data-d{1..8}.js data-ai.js data-precision.js coverage-detail.js app.js enhancements.js; do node --check "$f"; done
      - name: Verify static site serves all critical assets
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          python -m http.server 8765 >/tmp/cissp-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          for f in index.html styles.css mobile-fix.css enhancements.css data-meta.js data-d1.js data-d8.js data-ai.js data-precision.js coverage-detail.js app.js enhancements.js; do
            curl --fail --silent --show-error "http://127.0.0.1:8765/$f" >/dev/null
          done
