name: CISSP Study Site Audit

on:
  push:
    branches: [cissp-v1.28-evidence-closure-20260901]
    paths:
      - 'scripts/close_cissp_v128.py'
      - '.github/workflows/cissp-study-site-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-v128:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Close v1.28 evidence and restore normal workflow
        run: |
          set -euo pipefail
          python scripts/close_cissp_v128.py
          rm scripts/close_cissp_v128.py
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/cissp-study-site-audit.yml > .github/workflows/cissp-study-site-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close CISSP Atlas v1.28 release evidence'
          git push origin HEAD:cissp-v1.28-evidence-closure-20260901
