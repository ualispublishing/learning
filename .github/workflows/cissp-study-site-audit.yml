name: CISSP Study Site Audit

on:
  push:
    branches: [main]
    paths:
      - 'subjects/cissp/2024-outline/study-site/**'
      - '.github/workflows/cissp-study-site-audit.yml'
  pull_request:
    paths:
      - 'subjects/cissp/2024-outline/study-site/**'
      - '.github/workflows/cissp-study-site-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic knowledge audit
        working-directory: subjects/cissp/2024-outline/study-site
        run: python audit.py
      - name: Run question originality and duplicate gate
        working-directory: subjects/cissp/2024-outline/study-site
        run: python question-bank/quality_gate.py
      - name: Generate question-bank coverage plan
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          python question-bank/coverage_report.py --released-only >/tmp/cissp-released-coverage.json
          python question-bank/coverage_report.py --human
      - name: Check JavaScript syntax
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          node --check data-meta.js
          for f in data-d{1..8}.js data-ai.js data-precision.js coverage-detail.js data-question-calibration.js legacy-rationales.js bootstrap.js app.js enhancements.js state-ui-bridge.js; do node --check "$f"; done
      - name: Verify legacy option-rationale coverage
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};
          vm.runInNewContext(fs.readFileSync('legacy-rationales.js','utf8'),ctx);
          const r=ctx.window.CISSP_LEGACY_RATIONALES||{};
          const ids=Object.keys(r).sort();
          if(ids.length!==56) throw new Error(`Expected 56 legacy rationale sets, got ${ids.length}`);
          for(let i=1;i<=56;i++){
            const id=`Q-${String(i).padStart(3,'0')}`,v=r[id];
            if(!Array.isArray(v)||v.length!==4||v.some(x=>typeof x!=='string'||!x.trim())) throw new Error(`${id} requires four non-empty rationales`);
          }
          console.log('PASS legacy_rationales=56 option_rationales=224');
          NODE
      - name: Verify static site serves all critical assets
        working-directory: subjects/cissp/2024-outline/study-site
        run: |
          python -m http.server 8765 >/tmp/cissp-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          for f in index.html styles.css mobile-fix.css enhancements.css data-meta.js data-d1.js data-d8.js data-ai.js data-precision.js coverage-detail.js data-question-calibration.js legacy-rationales.js bootstrap.js app.js enhancements.js state-ui-bridge.js question-bank/RELEASED_BATCHES.json question-bank/candidates/batch-001-a.jsonl question-bank/candidates/batch-001-b.jsonl question-bank/candidates/batch-001-c.jsonl question-bank/candidates/batch-001-d.jsonl question-bank/candidates/batch-002.jsonl question-bank/candidates/batch-003.jsonl; do
            curl --fail --silent --show-error "http://127.0.0.1:8765/$f" >/dev/null
          done
