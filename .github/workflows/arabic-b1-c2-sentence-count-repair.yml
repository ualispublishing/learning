name: Arabic B1-C2 sentence count repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'reading/tools/repair_arabic_b1_c2_sentence_counts.py'
      - '.github/workflows/arabic-b1-c2-sentence-count-repair.yml'

permissions:
  contents: write

concurrency:
  group: arabic-b1-c2-sentence-count-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair sentence-count metadata
        run: python reading/tools/repair_arabic_b1_c2_sentence_counts.py
      - name: Commit repairs and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading/arabic/b1/passages.jsonl reading/arabic/b2/passages.jsonl reading/arabic/c1/passages.jsonl reading/arabic/c2/passages.jsonl reading/audit/arabic_b1_c2_sentence_count_repair_2026-08-23.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair Arabic B1-C2 sentence metadata [skip ci]"
          git fetch origin audit/arabic-b1-c2-final-2026-08-23
          git rebase origin/audit/arabic-b1-c2-final-2026-08-23
          git push origin HEAD:audit/arabic-b1-c2-final-2026-08-23
