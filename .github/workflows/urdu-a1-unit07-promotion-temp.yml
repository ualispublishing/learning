name: TEMP Urdu A1 Unit 07 guarded promotion
on:
  push:
    branches: [promote/urdu-a1-unit07-2026-08-20]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/urdu-a1-unit07-2026-08-20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python reading/tools/promote_urdu_a1_unit07.py
      - name: Commit promotion and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reading/urdu/a1/passages.jsonl reading/audit/urdu_a1_unit07_promotion_2026-08-20.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Promote Urdu A1 Unit 07 [skip ci]'
          git push origin HEAD:promote/urdu-a1-unit07-2026-08-20
