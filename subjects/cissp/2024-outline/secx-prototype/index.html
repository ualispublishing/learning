<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecX · Knowledge Web Prototype</title>
<style>
:root{color-scheme:dark;--bg:#07101d;--panel:#0d1b2c;--line:#31506e;--text:#ecf6ff;--muted:#9ab0c3;--accent:#8ed8ff;--focus:#fff3a8;--shadow:0 18px 60px #0007}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 42%,#102945 0,#081523 36%,var(--bg) 70%);font:15px/1.45 ui-sans-serif,system-ui,-apple-system;color:var(--text);overflow:hidden}.shell{height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top,.bottom{padding:12px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;background:#07101dcc;border-color:#17314a}.top{border-bottom:1px solid #17314a}.bottom{border-top:1px solid #17314a;color:var(--muted);font-size:12px}.brand{font-weight:800;letter-spacing:.12em}.brand span{color:var(--accent)}.legend{display:flex;gap:14px;color:var(--muted);font-size:12px}.legend kbd{background:#14283c;border:1px solid #36536e;border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--text)}main{position:relative;min-height:0}.web{position:absolute;inset:0}.edge{position:absolute;height:1px;background:linear-gradient(90deg,transparent,#31506e 20%,#31506e 80%,transparent);transform-origin:left center;opacity:.65;pointer-events:none}.node{position:absolute;translate:-50% -50%;width:148px;min-height:74px;border:1px solid #35526d;border-radius:18px;background:linear-gradient(180deg,#10263aee,#0b1a2aee);box-shadow:0 8px 24px #0005;padding:11px 12px;cursor:pointer;transition:.16s ease;outline:none}.node.objective{width:132px;min-height:64px;padding:9px 10px}.node:hover{border-color:#5e86a8}.node:focus-visible,.node.active{border-color:var(--focus);box-shadow:0 0 0 3px #fff3a822,0 14px 42px #0008;transform:scale(1.06);z-index:4}.node.root{width:190px;min-height:110px;border-radius:999px;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#17476b,#0d2033 67%)}.node .type{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--accent)}.node h2{font-size:14px;line-height:1.15;margin:3px 0 4px}.node.objective h2{font-size:12px}.node.root h2{font-size:30px;letter-spacing:.08em;margin:0}.node p{font-size:11px;line-height:1.3;color:var(--muted);margin:0}.node.objective p{display:none}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.badge{font-size:9px;padding:2px 5px;border-radius:999px;background:#18324a;color:#bfe8ff}.detail{position:absolute;right:18px;top:18px;bottom:18px;width:min(430px,38vw);border:1px solid #35526d;border-radius:20px;background:#081522f2;box-shadow:var(--shadow);padding:20px;overflow:auto;transform:translateX(calc(100% + 36px));transition:.22s ease;z-index:8}.detail.open{transform:none}.detail .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.detail h1{font-size:24px;line-height:1.1;margin:6px 0 8px}.detail .summary{color:#c4d6e5}.section{margin-top:18px;padding-top:14px;border-top:1px solid #203a51}.section h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#9edfff;margin:0 0 7px}.section p,.section li{color:#c1d1df}.section ul{padding-left:18px}.depth{display:flex;gap:5px;margin-top:12px}.dot{height:5px;flex:1;border-radius:9px;background:#24415a}.dot.on{background:var(--focus)}.toast{position:absolute;left:50%;bottom:24px;translate:-50% 0;background:#0a1827e8;border:1px solid #35526d;border-radius:999px;padding:8px 13px;color:var(--muted);font-size:11px;z-index:10}.sr{position:absolute;left:-9999px}@media(max-width:800px){.legend{display:none}.detail{width:calc(100% - 24px);right:12px;top:12px;bottom:12px}.node{width:116px;min-height:62px;padding:8px}.node.objective{width:104px;min-height:54px}.node p,.badges{display:none}.node.root{width:146px}.node.root h2{font-size:24px}}@media(prefers-reduced-motion:reduce){.node,.detail{transition:none}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><span>SECX</span> · knowledge web</div><div class="legend"><span><kbd>← ↑ ↓ →</kbd> move</span><span><kbd>Space</kbd> depth</span><span><kbd>Enter</kbd> descend</span><span><kbd>Esc</kbd> ascend/close</span><span><kbd>/</kbd> search later</span></div></header>
<main><div id="web" class="web" role="group" aria-label="SecX knowledge web"></div><aside id="detail" class="detail" aria-live="polite" aria-hidden="true"></aside><p id="status" class="sr" aria-live="polite"></p><div id="toast" class="toast">Arrow keys follow the web · Space reveals depth</div></main>
<footer class="bottom"><span id="scope">Prototype: loading released Atlas objective data…</span><span id="crumb">SecX</span></footer>
</div>
<script src="../study-site/data-meta.js"></script>
<script src="../study-site/data-d1.js"></script>
<script src="../study-site/data-d2.js"></script>
<script src="../study-site/data-d3.js"></script>
<script src="../study-site/data-d4.js"></script>
<script src="../study-site/data-d5.js"></script>
<script src="../study-site/data-d6.js"></script>
<script src="../study-site/data-d7.js"></script>
<script src="../study-site/data-d8.js"></script>
<script>
const fallbackDomains=[
 {num:1,name:'Security and Risk Management',weight:16},{num:2,name:'Asset Security',weight:10},{num:3,name:'Security Architecture and Engineering',weight:13},{num:4,name:'Communication and Network Security',weight:13},{num:5,name:'Identity and Access Management',weight:13},{num:6,name:'Security Assessment and Testing',weight:12},{num:7,name:'Security Operations',weight:13},{num:8,name:'Software Development Security',weight:10}
];
const atlasMeta=window.CISSP_META?.meta||{};
const atlasSources=window.CISSP_META?.sources||{};
const chunks=Array.isArray(window.CISSP_CHUNKS)?window.CISSP_CHUNKS:[];
const releasedObjectives=chunks.flatMap(c=>Array.isArray(c.objectives)?c.objectives:[]);
const objectiveCounts=releasedObjectives.reduce((m,o)=>(m[o.domain_num]=(m[o.domain_num]||0)+1,m),{});
const domains=(window.CISSP_META?.domains||fallbackDomains).map((d,i)=>({id:'d'+d.num,num:d.num,title:d.name,weight:d.weight,short:`${d.weight}% exam weight · ${objectiveCounts[d.num]||0} objectives`,angle:-90+i*45,objective:`${d.num}.x`}));
const objectivesByDomain=releasedObjectives.reduce((m,o)=>((m[o.domain_num]??=[]).push(o),m),{});
const sourceTitle=id=>atlasSources[id]?.title||id;
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const root={id:'root',title:'SecX',kind:'root',x:.5,y:.5,summary:`Atlas ${atlasMeta.version||'prototype'} · ${releasedObjectives.length||62} current objectives`};
let nodes=[root],links=[],active='root',depth=0,level='domains',parent=null;
document.getElementById('scope').textContent=releasedObjectives.length?`Atlas ${atlasMeta.version||''} released objective map · ${releasedObjectives.length} objectives`:'Prototype fallback · Atlas objective data unavailable';
function domainLayout(returnTo='root',focus=false){nodes=[root];links=[];const rx=.34,ry=.32;domains.forEach(d=>{const r=d.angle*Math.PI/180;const n={...d,kind:'domain',x:.5+Math.cos(r)*rx,y:.5+Math.sin(r)*ry,summary:d.short,labels:['CISSP domain',d.objective,`${d.weight}% weight`]};nodes.push(n);links.push(['root',d.id])});level='domains';parent=null;active=nodes.some(n=>n.id===returnTo)?returnTo:'root';depth=0;render(focus)}
function objectivePosition(i,count){if(count<=9){const a=(-90+i*(360/count))*Math.PI/180;return{x:.5+Math.cos(a)*.35,y:.5+Math.sin(a)*.32}}const ring=i%2,slot=Math.floor(i/2),ringCount=ring?Math.floor(count/2):Math.ceil(count/2),offset=ring?180/ringCount:0,a=(-90+offset+slot*(360/ringCount))*Math.PI/180,rx=ring?.23:.39,ry=ring?.21:.35;return{x:.5+Math.cos(a)*rx,y:.5+Math.sin(a)*ry}}
function childLayout(domainId,focus=false){const d=domains.find(x=>x.id===domainId);const records=objectivesByDomain[d?.num]||[];nodes=[{...d,kind:'domain-root',x:.5,y:.5,labels:['domain',d.objective,`${records.length} objectives`]}];links=[];if(records.length){records.forEach((o,i)=>{const pos=objectivePosition(i,records.length);nodes.push({id:o.id,title:`${o.id} · ${o.label}`,summary:o.summary,kind:'objective',x:pos.x,y:pos.y,labels:[o.id,d.title,'released Atlas'],details:{rule:o.direct||o.summary,why:'This stable objective node is loaded directly from the verified Atlas domain dataset so the knowledge web and the released study content share the same scope anchor.',traps:[o.trap||'Keep the objective tied to its stated business and security context.'],sources:(o.source_ids||[]).map(sourceTitle),practice:`Use objective ${o.id} as the stable link into related Atlas retrieval cards, scenarios, subtopic checks, and future concept relationships.`}});links.push([domainId,o.id])})}else{const pos=objectivePosition(0,1);nodes.push({id:domainId+'-unavailable',title:'Objective data unavailable',summary:'The released Atlas domain data did not load for this branch.',kind:'objective',x:pos.x,y:pos.y,labels:['load check'],details:{rule:'Do not substitute invented objective content when the released dataset is unavailable.',why:'The prototype should fail visibly rather than silently drifting from the verified Atlas scope.',traps:['Do not backfill with guessed objective IDs.'],sources:['Released Atlas domain data'],practice:'Verify the sibling study-site data files are reachable.'}});links.push([domainId,domainId+'-unavailable'])}level='children';parent=domainId;active=domainId;depth=0;render(focus)}
function render(focus=false){const web=document.getElementById('web');web.innerHTML='';const box=web.getBoundingClientRect();const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));links.forEach(([a,b])=>{const A=byId[a],B=byId[b];if(!A||!B)return;const x1=A.x*box.width,y1=A.y*box.height,x2=B.x*box.width,y2=B.y*box.height,dx=x2-x1,dy=y2-y1;const e=document.createElement('div');e.className='edge';e.style.left=x1+'px';e.style.top=y1+'px';e.style.width=Math.hypot(dx,dy)+'px';e.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';web.appendChild(e)});nodes.forEach(n=>{const el=document.createElement('button');el.className='node '+(n.kind==='root'?'root ':'')+(n.kind==='objective'?'objective ':'')+(n.id===active?'active':'');el.style.left=(n.x*100)+'%';el.style.top=(n.y*100)+'%';el.dataset.id=n.id;if(n.id===active)el.setAttribute('aria-current','true');el.setAttribute('aria-label',`${n.kind.replace('-',' ')}: ${n.title}. ${n.summary||''}`);el.innerHTML=`<div class="type">${esc(n.kind.replace('-',' '))}</div><h2>${esc(n.title)}</h2>${n.summary?`<p>${esc(n.summary)}</p>`:''}${n.labels?`<div class="badges">${n.labels.slice(0,3).map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div>`:''}`;el.onclick=()=>{active=n.id;depth=1;render(true);showDetail()};web.appendChild(el)});document.getElementById('crumb').textContent=level==='domains'?'SecX':`SecX › ${domains.find(d=>d.id===parent)?.title||''}`;showDetail(false);announceActive();if(focus)requestAnimationFrame(focusActive)}
function focusActive(){const el=[...document.querySelectorAll('.node')].find(x=>x.dataset.id===active);el?.focus({preventScroll:true})}
function announceActive(){const n=current();if(!n)return;document.getElementById('status').textContent=`Selected ${n.kind.replace('-',' ')}: ${n.title}. ${n.summary||''}`}
function neighbors(id){const ids=new Set;links.forEach(([a,b])=>{if(a===id)ids.add(b);if(b===id)ids.add(a)});return [...ids].map(x=>nodes.find(n=>n.id===x)).filter(Boolean)}
function move(dx,dy){const cur=nodes.find(n=>n.id===active);if(!cur)return;let cand=neighbors(active);if(!cand.length)cand=nodes.filter(n=>n.id!==active);const scored=cand.map(n=>{const vx=n.x-cur.x,vy=n.y-cur.y;const len=Math.hypot(vx,vy)||1;const proj=(vx*dx+vy*dy)/len;const perp=Math.abs(vx*dy-vy*dx)/len;return {n,score:proj*3-perp-.15*len}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);if(scored.length){active=scored[0].n.id;depth=0;render(true)}}
function current(){return nodes.find(n=>n.id===active)}
function showDetail(force=true){const d=document.getElementById('detail'),n=current();if(!n)return;if(depth===0&&!force){d.classList.remove('open');d.setAttribute('aria-hidden','true');return}const info=n.details||{rule:n.summary||'Root of the SecX knowledge graph.',why:n.kind==='domain'?`This branch contains ${objectiveCounts[n.num]||0} released Atlas objectives and carries ${n.weight||0}% of the current CISSP exam outline weight.`:'The compact node gives orientation. Deeper layers carry teaching content without losing position in the web.',traps:['Navigation should preserve context.','Every learner-facing claim should expose its scope and provenance.'],sources:n.kind==='domain'?['ISC2 CISSP Certification Exam Outline','CISSP Atlas released data']:['CISSP Atlas taxonomy'],practice:'Use arrow keys to choose a direction. Press Enter to descend when a node has children.'};d.innerHTML=`<div class="eyebrow">${esc(n.kind)} · depth ${Math.max(depth,1)}/4</div><h1>${esc(n.title)}</h1><p class="summary">${esc(n.summary||'')}</p><div class="depth">${[1,2,3,4].map(i=>`<span class="dot ${i<=Math.max(depth,1)?'on':''}"></span>`).join('')}</div>${depth>=1?`<div class="section"><h3>Rule / meaning</h3><p>${esc(info.rule)}</p></div>`:''}${depth>=2?`<div class="section"><h3>Why it matters</h3><p>${esc(info.why)}</p><h3>Labels</h3><div class="badges">${(n.labels||['root','knowledge graph']).map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div></div>`:''}${depth>=3?`<div class="section"><h3>Traps / distinctions</h3><ul>${info.traps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${depth>=4?`<div class="section"><h3>Sources & relationships</h3><ul>${info.sources.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Application</h3><p>${esc(info.practice)}</p></div>`:''}`;d.classList.add('open');d.setAttribute('aria-hidden','false')}
function descend(){const n=current();if(level==='domains'&&n?.kind==='domain')childLayout(n.id,true);else if(level==='children'&&n?.kind==='objective'){depth=Math.max(depth,2);showDetail()}}
function ascend(){if(depth>0){depth=0;const d=document.getElementById('detail');d.classList.remove('open');d.setAttribute('aria-hidden','true');focusActive()}else if(level==='children'){const returnTo=parent;domainLayout(returnTo,true)}}
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter','Escape'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);if(e.key==='ArrowUp')move(0,-1);if(e.key==='ArrowDown')move(0,1);if(e.key===' '){depth=depth%4+1;showDetail()}if(e.key==='Enter')descend();if(e.key==='Escape')ascend()});addEventListener('resize',()=>render(document.activeElement?.classList?.contains('node')));domainLayout();
</script>
</body></html>
