<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SecX Continue Routing Smoke</title></head>
<body>
<pre id="result" data-smoke="running">RUNNING</pre>
<script>
localStorage.removeItem('cissp_atlas_progress_v1');
localStorage.removeItem('cissp_secx_graph_state_v1');
</script>
<iframe id="app" src="next.html?continue-smoke=desktop" style="width:1280px;height:900px;border:0"></iframe>
<iframe id="mobile" src="next.html?continue-smoke=mobile" style="width:390px;height:844px;border:0"></iframe>
<script>
(()=>{'use strict';
const result=document.querySelector('#result'),frame=document.querySelector('#app'),mobile=document.querySelector('#mobile');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitFor(fn,label,timeout=30000){const end=Date.now()+timeout;while(Date.now()<end){try{const v=fn();if(v)return v}catch{}await sleep(50)}throw new Error(`Timed out waiting for ${label}`)}
function assert(ok,label){if(!ok)throw new Error(`Assertion failed: ${label}`)}
function inner(wrapper){const outer=wrapper.contentDocument,proto=outer?.querySelector('#prototype');return{d:proto?.contentDocument,w:proto?.contentWindow}}
async function ready(wrapper,label){return waitFor(()=>{const x=inner(wrapper),cards=x.w?.SECX_RELEASED_CARDS;return x.d&&x.w&&x.w.SECX_LEARNER&&Array.isArray(cards)&&cards.length===x.w.CISSP_META?.meta?.card_count&&x.d.querySelector('#continueStudyBtn')&&x.d.querySelector('#studyQueueBtn')&&x.d.querySelector('#dueReviewBtn')?x:null},`${label} Continue learner runtime`)}
function node(d,id){return [...d.querySelectorAll('.node')].find(x=>x.dataset.id===id)}
function graphTarget(w){return [...w.document.querySelectorAll('.node.active')].find(el=>el.isConnected)||w.document.body||w.document.documentElement}
function key(w,key,code=key){graphTarget(w).dispatchEvent(new w.KeyboardEvent('keydown',{key,code,bubbles:true,cancelable:true}))}
function routedFocus(d,id){const target=node(d,id);return target?.classList.contains('active')&&d.activeElement===target}
async function ascendCardToRoot(d,w,label){
  key(w,'Escape','Escape');
  await waitFor(()=>routedFocus(d,'study:queue')&&d.querySelector('#crumb')?.textContent==='SecX › Study queue',`${label} Escape focuses Study Queue root`);
  key(w,'Escape','Escape');
  await waitFor(()=>routedFocus(d,'root')&&d.querySelector('#crumb')?.textContent==='SecX',`${label} second Escape focuses SecX root`);
}
async function ascendQueueToRoot(d,w,label){
  key(w,'Escape','Escape');
  await waitFor(()=>routedFocus(d,'root')&&d.querySelector('#crumb')?.textContent==='SecX',`${label} Escape focuses SecX root`);
}
function isoOffset(days){const d=new Date();d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function writeCards(w,cards){w.localStorage.setItem('cissp_atlas_progress_v1',JSON.stringify({cards}));w.dispatchEvent(new w.StorageEvent('storage',{key:'cissp_atlas_progress_v1'}))}
function activateButton(d,button,label){button.focus();assert(d.activeElement===button,`${label} button receives focus before activation`);button.click()}
function activateContinue(d,button,label){activateButton(d,button,`${label} Continue`)}
async function run(){
  const {d,w}=await ready(frame,'desktop'),cards=w.SECX_RELEASED_CARDS,continueButton=d.querySelector('#continueStudyBtn'),learner=w.SECX_LEARNER;
  assert(Object.isFrozen(learner),'learner API object is frozen');
  assert(learner.progressKey==='cissp_atlas_progress_v1','learner API exposes the shared Atlas progress key');
  assert(['cardState','cardStatus','isDue','isMature','todayISO'].every(k=>typeof learner[k]==='function'),'learner API exposes read-only status methods');
  assert(!('gradeCard' in learner)&&!('saveAtlas' in learner)&&!('saveGraph' in learner)&&!('setItem' in learner),'learner API exposes no grading or persistence mutator');
  const d1Fresh=cards.filter(c=>c.domain_num===1).sort((a,b)=>String(a.objective).localeCompare(String(b.objective))||String(a.id).localeCompare(String(b.id)))[0];
  assert(d1Fresh,'fresh D1 card exists');
  assert(learner.cardState(d1Fresh.id)===null&&learner.cardStatus(d1Fresh.id)==='new','fresh card state comes from shared learner API');
  await waitFor(()=>continueButton.textContent==='Continue · New D1','fresh state prioritizes new card in lowest-score D1');
  activateContinue(d,continueButton,'fresh');
  await waitFor(()=>node(d,'study:list:new')&&routedFocus(d,d1Fresh.id)&&d.querySelector('#crumb')?.textContent==='SecX › Study queue › New cards','Continue routes fresh state and focuses selected weakest-domain new card');
  await ascendCardToRoot(d,w,'fresh');

  const learningCard=cards.find(c=>c.domain_num===2&&c.id!==d1Fresh.id)||cards.find(c=>c.id!==d1Fresh.id);assert(learningCard,'learning fixture card exists');
  const learningState={[learningCard.id]:{stage:1,due:isoOffset(3),reviews:1,last_grade:2,last_review:isoOffset(0)}};
  writeCards(w,learningState);
  const learningSnapshot=await waitFor(()=>learner.cardState(learningCard.id)?.stage===1?learner.cardState(learningCard.id):null,'learner API resynchronizes same-window Atlas write');
  assert(Object.isFrozen(learningSnapshot),'learner API returns frozen card-state snapshots');
  assert(learner.cardStatus(learningCard.id)==='learning'&&!learner.isDue(learningCard.id),'shared learner API classifies future-due stage-one card as learning');
  await waitFor(()=>continueButton.textContent==='Continue · Learning','learning state overrides new-card fallback');
  activateContinue(d,continueButton,'learning');
  await waitFor(()=>node(d,'study:list:learning')&&routedFocus(d,learningCard.id)&&d.querySelector('#crumb')?.textContent==='SecX › Study queue › Learning cards','Continue routes and focuses selected learning card');
  await ascendCardToRoot(d,w,'learning');

  const dueCard=cards.find(c=>c.domain_num===3&&c.id!==learningCard.id)||cards.find(c=>c.id!==learningCard.id);assert(dueCard,'due fixture card exists');
  const dueAndLearning={...learningState,[dueCard.id]:{stage:0,due:isoOffset(0),reviews:1,last_grade:0,last_review:isoOffset(0)}};
  writeCards(w,dueAndLearning);
  await waitFor(()=>learner.isDue(dueCard.id)&&learner.cardStatus(dueCard.id)==='due','shared learner API classifies due fixture');
  await waitFor(()=>continueButton.textContent==='Continue · Due','due state overrides simultaneous learning work');
  activateContinue(d,continueButton,'due');
  await waitFor(()=>node(d,'study:list:due')&&routedFocus(d,dueCard.id)&&d.querySelector('#crumb')?.textContent==='SecX › Study queue › Due reviews','Continue routes due-first and focuses selected due card');
  await ascendCardToRoot(d,w,'due');

  const mature={};for(const c of cards)mature[c.id]={stage:4,due:isoOffset(30),reviews:4,last_grade:3,last_review:isoOffset(0)};
  writeCards(w,mature);
  await waitFor(()=>learner.isMature(cards[0].id)&&learner.cardStatus(cards[0].id)==='mature','shared learner API classifies mature caught-up state');
  await waitFor(()=>continueButton.textContent==='Continue · Study','caught-up state does not manufacture extra due/learning/new work');
  activateContinue(d,continueButton,'caught-up');
  await waitFor(()=>routedFocus(d,'study:queue')&&d.querySelector('#crumb')?.textContent==='SecX › Study queue','caught-up Continue falls back to and focuses Study Queue root');
  await ascendQueueToRoot(d,w,'caught-up');

  const dueButton=d.querySelector('#dueReviewBtn');
  activateButton(d,dueButton,'desktop Due Reviews');
  await waitFor(()=>routedFocus(d,'due:reviews')&&d.querySelector('#crumb')?.textContent==='SecX › Due reviews','visible desktop Due Reviews button focuses Due Reviews root');
  await ascendQueueToRoot(d,w,'desktop Due Reviews');

  frame.style.display='none';
  mobile.style.position='fixed';mobile.style.left='0';mobile.style.top='0';mobile.style.zIndex='9999';mobile.style.background='#000';
  await sleep(120);
  assert(mobile.getBoundingClientRect().top>=-2,'mobile focus fixture is visible before activation');
  const mobileApp=await ready(mobile,'mobile'),md=mobileApp.d,mobileContinue=md.querySelector('#continueStudyBtn');
  await waitFor(()=>mobileContinue?.textContent==='Continue · Study','mobile Continue reflects shared caught-up Atlas state');
  activateContinue(md,mobileContinue,'mobile caught-up');
  await waitFor(()=>routedFocus(md,'study:queue')&&md.querySelector('#crumb')?.textContent==='SecX › Study queue','visible mobile Continue focuses caught-up Study Queue root');
  await ascendQueueToRoot(md,mobileApp.w,'mobile caught-up');
  const mobileDue=md.querySelector('#dueReviewBtn');
  activateButton(md,mobileDue,'mobile Due Reviews');
  await waitFor(()=>routedFocus(md,'due:reviews')&&md.querySelector('#crumb')?.textContent==='SecX › Due reviews','visible mobile Due Reviews button focuses Due Reviews root');
  await ascendQueueToRoot(md,mobileApp.w,'mobile Due Reviews');
  assert(md.documentElement.scrollWidth<=md.documentElement.clientWidth+2,'mobile Continue/Due controls have no horizontal overflow');

  result.dataset.smoke='pass';
  result.textContent=`PASS SecX Continue routing smoke: learner-api=frozen-read-only+same-window-resync focus-transfer+escape-ascent=desktop+visible-mobile due-focus=desktop+visible-mobile fresh=New-D1 learning=${learningCard.id} due=${dueCard.id} caught-up=Study-Queue state=Atlas-only`;
}
run().catch(err=>{result.dataset.smoke='fail';result.textContent=`FAIL ${err.stack||err}`;console.error(err)});
})();
</script>
</body>
</html>
