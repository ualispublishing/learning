<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SecX Coverage Lens Browser Smoke</title></head>
<body>
<pre id="result" data-smoke="running">RUNNING</pre>
<iframe id="app" src="next.html?coverage-smoke=desktop" style="width:1280px;height:900px;border:0"></iframe>
<iframe id="mobile" src="next.html?coverage-smoke=mobile" style="width:390px;height:844px;border:0"></iframe>
<script>
(()=>{'use strict';
const result=document.querySelector('#result'),frame=document.querySelector('#app'),mobile=document.querySelector('#mobile');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitFor(fn,label,timeout=30000){const end=Date.now()+timeout;while(Date.now()<end){try{const v=fn();if(v)return v}catch{}await sleep(50)}throw new Error(`Timed out waiting for ${label}`)}
function assert(ok,label){if(!ok)throw new Error(`Assertion failed: ${label}`)}
function graphTarget(win){const currentId=win.current?.()?.id;const currentNode=currentId?[...win.document.querySelectorAll('.node')].find(el=>el.isConnected&&el.dataset.id===currentId):null;return currentNode||win.document.body||win.document.documentElement}
function key(win,key,code=key){const graphKey=['Enter','Escape',' ','Home'].includes(key);const target=graphKey?graphTarget(win):(win.document.body||win.document.documentElement);target.dispatchEvent(new win.KeyboardEvent('keydown',{key,code,bubbles:true,cancelable:true}))}
function inner(wrapper){const outer=wrapper.contentDocument,proto=outer?.querySelector('#prototype');return{d:proto?.contentDocument,w:proto?.contentWindow}}
async function ready(wrapper,label){return waitFor(()=>{const x=inner(wrapper),snap=x.w?.SECX_COVERAGE_SNAPSHOT,bank=x.w?.SECX_RELEASED_BANK_STATE,meta=x.w?.CISSP_META?.meta||{};return x.d&&x.w&&x.d.querySelector('#coverageLensBtn')&&x.d.querySelector('#searchPaletteBtn')&&bank?.ready&&bank.count===meta.question_count&&Array.isArray(x.w.SECX_RELEASED_QUESTIONS)&&x.w.SECX_RELEASED_QUESTIONS.length===meta.question_count&&snap?.bankReady&&snap.standardQuestions===meta.question_count&&Number.isInteger(snap.totals?.practice_exposure_gaps)&&Array.from({length:8},(_,i)=>node(x.d,`d${i+1}`)).every(Boolean)?x:null},`${label} fully-loaded shared-bank coverage runtime`)}
function node(d,id){return [...d.querySelectorAll('.node')].find(x=>x.dataset.id===id)}
function routedFocus(d,id){const target=node(d,id);return target?.classList.contains('active')&&d.activeElement===target}
function clickId(d,id){const el=node(d,id);assert(el,`node ${id} exists`);el.click();return el}
function activateButton(d,button,label){button.focus();assert(d.activeElement===button,`${label} button receives focus before activation`);button.click()}
function activateFrameButton(wrapper,d,w,button,label){wrapper.focus();assert(document.activeElement===wrapper,`${label} iframe receives outer-document focus`);w.focus();button.focus();assert(d.activeElement===button,`${label} button receives inner-document focus before activation`);button.click()}
async function enter(d,w,label='node'){await waitFor(()=>{const id=w.current?.()?.id;return id&&node(d,id)?.classList.contains('active')},`${label} current active node`);key(w,'Enter','Enter');await sleep(80)}
async function selectThenEnter(d,w,id,label){clickId(d,id);await waitFor(()=>node(d,id)?.classList.contains('active')&&w.current?.()?.id===id,`${label} selected`);await enter(d,w,label)}
async function selectThenDescend(d,w,id,label){clickId(d,id);await waitFor(()=>node(d,id)?.classList.contains('active')&&w.current?.()?.id===id,`${label} selected`);w.descend();await sleep(80)}
async function closeDetailThenAscend(d,w,closedLabel,ascendedLabel,predicate){key(w,'Escape','Escape');await waitFor(()=>!d.querySelector('#detail')?.classList.contains('open'),closedLabel);key(w,'Escape','Escape');await waitFor(predicate,ascendedLabel)}
async function run(){
  const {d,w}=await ready(frame,'desktop'),meta=w.CISSP_META?.meta||{},snap=w.SECX_COVERAGE_SNAPSHOT;
  assert(snap.totals.objectives===meta.objective_count,'coverage snapshot objective count matches Atlas');
  assert(snap.totals.subtopics===meta.subtopic_checks,'coverage snapshot subtopic count matches Atlas');
  assert(snap.totals.review_cards===meta.card_count,'coverage snapshot review-card count matches Atlas');
  assert(snap.totals.scenarios===meta.question_count,'coverage snapshot scenario count matches shared released bank');
  assert(w.SECX_RELEASED_BANK_STATE.count===snap.totals.scenarios,'coverage and main graph use one released scenario count');
  const gapCount=snap.totals.subtopics-snap.totals.subtopics_with_exact_scenario_tag;
  assert(snap.totals.practice_exposure_gaps===gapCount,'coverage gap total equals subtopics minus exact-tagged subtopics');
  assert(Array.isArray(snap.gaps)&&snap.gaps.length===gapCount,'coverage snapshot exposes every exact-tag gap record');
  const coverageButton=d.querySelector('#coverageLensBtn');
  assert(coverageButton?.textContent.includes(`· ${meta.question_count}`),'coverage button shows released scenario count');

  activateButton(d,coverageButton,'desktop Coverage');
  await waitFor(()=>routedFocus(d,'coverage:root')&&d.querySelectorAll('.node.coverage-domain').length===8&&d.querySelector('#crumb')?.textContent==='SecX › Coverage','visible Coverage control opens and focuses eight-domain coverage map');
  assert(node(d,'coverage:root')?.textContent.includes(`${gapCount} exact-tag gaps`),'coverage center advertises deterministic exact-tag gap count');
  await selectThenEnter(d,w,'coverage:root','Coverage center');
  await waitFor(()=>routedFocus(d,'coverage:gaps')&&d.querySelectorAll('.node.coverage-gap').length>0&&d.querySelector('#crumb')?.textContent==='SecX › Coverage › Practice exposure gaps','Coverage center Enter opens and focuses paged exact-tag gap view');
  assert(node(d,'coverage:gaps')?.textContent.includes(`${gapCount} enriched subtopics`),'gap center reports deterministic gap count');
  const firstGap=d.querySelector('.node.coverage-gap');assert(firstGap,'at least one exact-tag gap renders');
  const firstGapId=firstGap.dataset.id,firstGapRecord=snap.gaps.find(x=>`coverage:gap:${x.objective}:${x.index}`===firstGapId);assert(firstGapRecord,'rendered gap id maps to released coverage record');
  assert(node(d,'coverage:gap:next'),'coverage gap page 1 exposes next pager');
  await selectThenEnter(d,w,'coverage:gap:next','coverage gaps next page');
  await waitFor(()=>routedFocus(d,'coverage:gaps')&&node(d,'coverage:gap:prev')&&!node(d,firstGapId),'Coverage next pager focuses page-2 center and replaces page-1 gaps');
  await selectThenEnter(d,w,'coverage:gap:prev','coverage gaps previous page');
  await waitFor(()=>routedFocus(d,'coverage:gaps')&&node(d,'coverage:gap:next')&&node(d,firstGapId),'Coverage previous pager focuses page-1 center and restores first gap');
  await selectThenEnter(d,w,firstGapId,'first practice exposure gap');
  await waitFor(()=>d.querySelector('#detail.open')?.textContent.includes(`objective ${firstGapRecord.objective}`)&&d.querySelector('#detail')?.textContent.includes('no manifest-released standard scenario carries this exact subtopic tag'),'gap depth-two detail explains exact released-tag absence');
  key(w,' ','Space');
  await waitFor(()=>d.querySelector('#detail')?.textContent.includes('not evidence that the subtopic is missing from the curriculum')&&d.querySelector('#detail')?.textContent.includes('not learner weakness'),'gap depth-three detail preserves curriculum and learner-state boundaries');
  await closeDetailThenAscend(d,w,'gap detail closes before gap-view ascent','gap detail and gap view Escape return focus to Coverage root',()=>routedFocus(d,'coverage:root')&&d.querySelectorAll('.node.coverage-domain').length===8&&d.querySelector('#crumb')?.textContent==='SecX › Coverage');

  const d1=snap.domains.find(x=>x.domain_num===1);assert(d1,'D1 coverage snapshot exists');
  const d1node=node(d,'coverage:d1');assert(d1node,'D1 coverage node exists');
  assert(d1node.textContent.includes(`${d1.objectives} objectives`),'D1 objective count rendered from explicit snapshot');
  assert(d1node.textContent.includes(`${d1.subtopics} subtopics`),'D1 subtopic count rendered from explicit snapshot');
  assert(d1node.textContent.includes(`${d1.scenarios} scenarios`),'D1 scenario count rendered from shared released bank');
  assert(d1node.textContent.includes(`${d1.practice_exposure_gaps} exact-tag gaps`),'D1 exact-tag gap count rendered from explicit snapshot');

  await selectThenEnter(d,w,'coverage:d1','D1 coverage domain');
  const o11=snap.objectives.find(x=>x.objective==='1.1');assert(o11,'1.1 coverage snapshot exists');
  await waitFor(()=>routedFocus(d,'coverage:domain:1')&&node(d,'coverage:objective:1.1')&&d.querySelector('#crumb')?.textContent==='SecX › Coverage › D1','D1 coverage opens and focuses objective list');
  const o11node=node(d,'coverage:objective:1.1');
  assert(o11node.textContent.includes(`${o11.subtopics} subtopics`),'1.1 subtopic count rendered');
  assert(o11node.textContent.includes(`${o11.scenarios} scenarios`),'1.1 released scenario count rendered');
  assert(o11node.textContent.includes(`${o11.subtopics_with_exact_scenario_tag}/${o11.subtopics} subtopics tagged`),'1.1 exact-tag exposure rendered');
  assert(o11node.textContent.includes(`${o11.practice_exposure_gaps} exact-tag gaps`),'1.1 exact-tag gap count rendered');
  await selectThenEnter(d,w,'coverage:objective:1.1','coverage objective 1.1');
  await waitFor(()=>d.querySelector('#detail.open')?.textContent.includes(`Explicit Atlas mappings: ${o11.subtopics} enriched subtopics`),'1.1 depth-two detail reports explicit mappings');
  assert(d.querySelector('#detail')?.textContent.includes(`${o11.subtopics_with_exact_scenario_tag}/${o11.subtopics} subtopics have at least one exact released scenario tag`),'coverage detail reports exact-tag fraction');
  key(w,' ','Space');
  await waitFor(()=>d.querySelector('#detail')?.textContent.includes('Practice exposure counts do not measure learner mastery'),'coverage depth-three detail preserves mastery boundary');
  await closeDetailThenAscend(d,w,'objective detail closes before domain ascent','Escape returns domain coverage focus to D1 on coverage root',()=>routedFocus(d,'coverage:d1')&&d.querySelector('#crumb')?.textContent==='SecX › Coverage');
  key(w,'Escape','Escape');
  await waitFor(()=>routedFocus(d,'root')&&Array.from({length:8},(_,i)=>node(d,`d${i+1}`)).every(Boolean)&&d.querySelector('#crumb')?.textContent==='SecX','Escape returns Coverage focus to SecX root');

  key(w,'c','KeyC');
  await waitFor(()=>routedFocus(d,'coverage:root')&&d.querySelector('#crumb')?.textContent==='SecX › Coverage','C shortcut opens and focuses Coverage after full runtime load');
  key(w,'Escape','Escape');
  await waitFor(()=>routedFocus(d,'root')&&d.querySelector('#crumb')?.textContent==='SecX','Escape returns focus from shortcut-opened Coverage to root');

  frame.remove();
  assert(!frame.isConnected,'desktop iframe is removed before mobile focus phase');
  await sleep(0);
  const mobileApp=await ready(mobile,'mobile'),md=mobileApp.d,mw=mobileApp.w;
  const mobileCoverageButton=md.querySelector('#coverageLensBtn');assert(mobileCoverageButton,'mobile coverage control present');
  activateFrameButton(mobile,md,mw,mobileCoverageButton,'mobile Coverage');
  await waitFor(()=>routedFocus(md,'coverage:root')&&md.querySelectorAll('.node.coverage-domain').length===8,'mobile visible Coverage control opens and focuses eight-domain map');
  await selectThenDescend(md,mw,'coverage:root','mobile Coverage center');
  await waitFor(()=>routedFocus(md,'coverage:gaps')&&md.querySelectorAll('.node.coverage-gap').length>0,'mobile Coverage center opens and focuses exact-tag gaps');
  assert(md.documentElement.scrollWidth<=md.documentElement.clientWidth+2,'mobile coverage gap lens has no horizontal overflow');
  result.dataset.smoke='pass';
  result.textContent=`PASS SecX coverage lens browser smoke: shared-bank=${meta.question_count} objectives=${meta.objective_count} subtopics=${meta.subtopic_checks} exact-tag-gaps=${gapCount} pager=next+prev+focused-center gap-detail D1 objective-1.1 focus=visible-button+shortcut+escape-ascent+viewport-isolated-frame-handoff+mobile depth-gates`;
}
run().catch(err=>{result.dataset.smoke='fail';result.textContent=`FAIL ${err.stack||err}`;console.error(err)});
})();
</script>
</body>
</html>
