<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CISSP Atlas · Redirecting</title>
  <style>
    :root{color-scheme:dark;background:#07111f;color:#e8eef7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box}
    main{max-width:560px;text-align:center}
    a{color:#8fc8ff}
  </style>
</head>
<body>
  <main>
    <h1>Opening CISSP Atlas…</h1>
    <p>If you are not redirected, <a id="homeLink" href="/learning/">open the study site</a>.</p>
  </main>
  <script>
    (()=>{
      const onGitHubPages=location.hostname.endsWith('.github.io');
      const first=location.pathname.split('/').filter(Boolean)[0];
      const base=onGitHubPages&&first?`/${first}/`:'/';
      document.querySelector('#homeLink').href=base;
      if(location.pathname!==base)location.replace(base);
    })();
  </script>
</body>
</html>
