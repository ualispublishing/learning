<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CISSP Atlas Browser Smoke</title></head>
<body>
<pre id="result" data-smoke="running">RUNNING</pre>
<iframe id="app" src="index.html?browser-smoke=desktop" style="width:1280px;height:900px;border:0"></iframe>
<iframe id="mobile" src="index.html?browser-smoke=mobile" style="width:390px;height:844px;border:0"></iframe>
<script>
(()=>{'use strict';
const result=document.querySelector('#result'),frame=document.querySelector('#app'),mobile=document.querySelector('#mobile');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitFor(fn,label,timeout=8000){
  const end=Date.now()+timeout;
  while(Date.now()<end){try{const v=fn();if(v)return v}catch{}await sleep(50)}
  throw new Error(`Timed out waiting for ${label}`);
}
function assert(ok,label){if(!ok)throw new Error(`Assertion failed: ${label}`)}
function visible(el){return !!el&&!el.classList.contains('hidden')}
function key(win,key,code=key){win.dispatchEvent(new win.KeyboardEvent('keydown',{key,code,bubbles:true,cancelable:true}))}
async function run(){
  await waitFor(()=>frame.contentDocument?.documentElement?.dataset?.cisspReady==='true','desktop app readiness');
  const d=frame.contentDocument,w=frame.contentWindow;
  assert(d.documentElement.dataset.cisspCore==='ready','core ready');
  assert(d.documentElement.dataset.cisspBank==='ready','released bank ready');
  assert(d.documentElement.dataset.learnShortcuts==='4','keyboard shortcut controller v4 loaded');
  assert(d.querySelector('script[src="keyboard-shortcuts.js?v=4"]'),'keyboard shortcut cache version v4');
  assert(d.querySelector('.shortcut-help')?.textContent.includes('Reveal / hide'),'keyboard help describes reveal toggle');
  assert(d.querySelector('.shortcut-help')?.textContent.includes('Cards hidden'),'keyboard help describes hidden-card arrows');
  assert(d.querySelector('footer span:last-child')?.textContent.includes('v1.25'),'footer shows current production release');
  assert(!d.querySelector('#startupIssue'),'no startup issue');
  assert(d.querySelector('#continueBtn')?.textContent.includes('diagnostic'),'first-run diagnostic CTA');
  assert(d.querySelector('link[data-workflow-clarity]'),'workflow clarity loaded');
  assert(d.querySelector('#readinessCard .ready-copy b')?.textContent==='Mastery','readiness polish applied');

  d.querySelector('#nav [data-view="learn"]').click();
  await waitFor(()=>visible(d.querySelector('#learn'))&&d.querySelector('#revealBtn'),'Review view');
  const firstPosition=d.querySelector('#cardPosition')?.textContent;
  key(w,'ArrowRight','ArrowRight');
  await waitFor(()=>d.querySelector('#revealBtn')&&d.querySelector('#cardPosition')?.textContent!==firstPosition,'hidden-card keyboard next');
  key(w,'ArrowLeft','ArrowLeft');
  await waitFor(()=>d.querySelector('#revealBtn')&&d.querySelector('#cardPosition')?.textContent===firstPosition,'hidden-card keyboard previous');
  key(w,' ','Space');
  await waitFor(()=>d.querySelector('.layer-content')&&d.querySelectorAll('.rating [data-grade]').length===4,'keyboard reveal and ratings');
  assert(d.querySelectorAll('.layer-tabs button').length===8,'eight learning layers');
  assert(d.querySelector('.layer-tabs button.active')?.dataset.layer==='0','first layer active after reveal');
  key(w,' ','Space');
  await waitFor(()=>d.querySelector('#revealBtn')&&!d.querySelector('.layer-content'),'keyboard unreveal returns retrieval gate');
  assert(d.querySelector('#cardPosition')?.textContent===firstPosition,'unreveal preserves current card');
  key(w,' ','Space');
  await waitFor(()=>d.querySelector('.layer-tabs button.active')?.dataset.layer==='0','keyboard re-reveal');
  key(w,'ArrowRight','ArrowRight');
  await waitFor(()=>d.querySelector('.layer-tabs button.active')?.dataset.layer==='1','keyboard next layer');
  key(w,'3','Digit3');
  await waitFor(()=>d.querySelector('#revealBtn'),'keyboard rating advances to next card');

  d.querySelector('#nav [data-view="practice"]').click();
  await waitFor(()=>visible(d.querySelector('#practice'))&&d.querySelector('#startQuiz'),'Practice view');
  const count=d.querySelector('#quizCount'),difficulty=d.querySelector('#quizDifficulty'),allAvailable=count?.querySelector('option[value="999999"]');
  assert(allAvailable?.textContent.trim()==='All available','semantic all-available practice control');
  count.value='999999';
  difficulty.value='';
  d.querySelector('#startQuiz').click();
  await waitFor(()=>d.querySelector('[data-conf="medium"]')&&d.querySelectorAll('[data-cal-opt]').length===4,'calibrated practice question');
  const expectedStandard=Number(w.CISSP_META?.meta?.question_count||0);
  assert(expectedStandard>0,'metadata exposes standard-question count');
  assert(d.querySelector('.quiz-top')?.textContent.includes(`1 / ${expectedStandard}`),'All available uses complete released standard bank');
  d.querySelector('[data-conf="medium"]').click();
  const firstOption=d.querySelector('[data-cal-opt="0"]');
  assert(firstOption&&!firstOption.disabled,'answer options unlock after confidence');
  firstOption.click();
  await waitFor(()=>d.querySelectorAll('.rationale-item').length===4,'four option rationales');
  assert(d.querySelector('#calNext'),'practice next control');

  d.querySelector('#nav [data-view="progress"]').click();
  await waitFor(()=>visible(d.querySelector('#progress'))&&d.querySelectorAll('#progressStats .stat-card').length>=4,'Progress view');
  assert(d.querySelector('#weakList')?.children.length>0,'weak-area recommendations');

  d.querySelector('#nav [data-view="sources"]').click();
  await waitFor(()=>visible(d.querySelector('#sources'))&&d.querySelectorAll('#sourceList .source-card').length>0,'Sources view');

  d.querySelector('.mobile-nav [data-view="today"]').click();
  await waitFor(()=>visible(d.querySelector('#today')),'mobile navigation handler');
  assert(d.querySelector('.mobile-nav [data-view="today"]').classList.contains('active'),'mobile nav active state');

  d.querySelector('#continueBtn').click();
  await waitFor(()=>visible(d.querySelector('#practice'))&&d.querySelectorAll('[data-diag-opt]').length===4,'baseline diagnostic launch');
  assert(d.querySelector('.diagnostic-card .quiz-top')?.textContent.includes('1/16'),'diagnostic starts at 1 of 16');

  await waitFor(()=>mobile.contentDocument?.documentElement?.dataset?.cisspReady==='true','mobile app readiness');
  const md=mobile.contentDocument,mw=mobile.contentWindow;
  assert(mw.getComputedStyle(md.querySelector('.sidebar')).display==='none','mobile sidebar hidden');
  assert(mw.getComputedStyle(md.querySelector('.mobile-nav')).display!=='none','mobile bottom nav visible');
  assert(mw.getComputedStyle(md.querySelector('.top-actions .small')).display==='none','mobile export action compacted');
  assert(md.documentElement.scrollWidth<=md.documentElement.clientWidth+2,'mobile Today has no horizontal overflow');
  md.querySelector('.mobile-nav [data-view="practice"]').click();
  await waitFor(()=>visible(md.querySelector('#practice')),'mobile Practice view');
  const cols=mw.getComputedStyle(md.querySelector('#practiceSetup')).gridTemplateColumns.trim().split(/\s+/).filter(Boolean);
  assert(cols.length===1,'390px practice setup is one column');
  assert(md.documentElement.scrollWidth<=md.documentElement.clientWidth+2,'mobile Practice has no horizontal overflow');

  result.dataset.smoke='pass';
  result.textContent='PASS interactive browser smoke: startup keyboard-toggle-nav keyboard-guidance release-footer full-bank-practice progress sources navigation diagnostic mobile-390';
}
run().catch(err=>{result.dataset.smoke='fail';result.textContent=`FAIL ${err.stack||err}`;console.error(err)});
})();
</script>
</body>
</html>
