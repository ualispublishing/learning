name: Clean public metadata

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/clean_public_metadata.py'
      - '.github/workflows/clean-public-metadata.yml'
      - 'audit/run_clean_public_metadata.request'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Clean stale labels and machine POS codes
        run: python scripts/clean_public_metadata.py
      - name: Re-run public-readiness triage
        run: python scripts/audit_public_readiness.py
      - name: Commit cleaned live decks and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arabic_top1000.csv arabic_top3000.csv french_top1000.csv french_top3000.csv urdu_top1000.csv urdu_top3000.csv audit/public_readiness_audit.json audit/public_readiness_review_queue.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Clean live deck publication metadata [skip ci]'
          for n in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*3))
          done
          exit 1
