name: Diagnose independent OPUS Urdu corpora

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/diagnose_opus_urdu_corpora.py'
      - '.github/workflows/diagnose-opus-urdu.yml'
      - 'audit/run_opus_urdu_diagnostic.request'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Probe Urdu-English OPUS inventory
        run: python scripts/diagnose_opus_urdu_corpora.py
      - name: Commit diagnostic evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/opus_urdu_independent_corpora.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Probe independent OPUS Urdu corpora [skip ci]'
          for n in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*3))
          done
          exit 1
