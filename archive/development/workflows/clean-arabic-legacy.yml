name: Clean Arabic legacy deck

on:
  push:
    paths:
      - 'scripts/clean_arabic_legacy_deck.py'
      - '.github/workflows/clean-arabic-legacy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve source and split phrase material
        run: python scripts/clean_arabic_legacy_deck.py
      - name: Commit cleaned legacy artifacts
        run: |
          if [ -z "$(git status --porcelain -- archive/wordlists/arabic_top1000_uploaded_2026-08-11.csv arabic_phrase_bank.csv audit/arabic_legacy_single_words_cleaned.csv)" ]; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/wordlists/arabic_top1000_uploaded_2026-08-11.csv arabic_phrase_bank.csv audit/arabic_legacy_single_words_cleaned.csv
          git commit -m 'Preserve Arabic source and split phrase bank [skip ci]'
          git push
