name: Split semantic review queues

on:
  push:
    paths:
      - '.github/workflows/split-review-queues.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write compact review chunks
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          for lang in ('french','urdu'):
              p=Path(f'audit/{lang}_core1000_semantic_review_queue.csv')
              with p.open(encoding='utf-8', newline='') as f:
                  rows=list(csv.DictReader(f))
              compact=[{'rank':int(r['rank']),'front':r['front'],'meaning':r['meaning']} for r in rows]
              for i in range(0,len(compact),30):
                  n=i//30+1
                  Path(f'audit/{lang}_review_compact_{n}.json').write_text(json.dumps(compact[i:i+30],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit compact queues
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/*_review_compact_*.json
          git commit -m 'Add compact semantic review queues [skip ci]'
          git push
