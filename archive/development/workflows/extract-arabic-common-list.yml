name: Extract Arabic common-word source

on:
  push:
    paths:
      - 'scripts/extract_al_said_pymupdf.py'
      - '.github/workflows/extract-arabic-common-list.yml'
  workflow_dispatch:

concurrency:
  group: extract-arabic-common-list-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF text extractor
        run: python -m pip install --quiet pymupdf

      - name: Download official CC BY 4.0 article PDF
        run: |
          curl --http1.1 -k -L --fail --retry 5 --retry-all-errors \
            'https://revistaseug.ugr.es/index.php/meaharabe/article/download/23634/25105/99973' \
            -o /tmp/al_said_2023.pdf

      - name: Extract ranks 1 through 1000
        run: python scripts/extract_al_said_pymupdf.py --pdf /tmp/al_said_2023.pdf

      - name: Commit extracted source evidence
        run: |
          if [ -z "$(git status --porcelain -- audit/al_said_2023_msa1000.csv audit/al_said_2023_msa1000_debug.txt)" ]; then
            echo 'No extraction changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/al_said_2023_msa1000.csv audit/al_said_2023_msa1000_debug.txt
          git commit -m 'Extract Al-Said 2023 MSA 1000 source [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
